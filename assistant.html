<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>SIM Assistant</title>
<link rel="icon" type="image/png" href="assistant-icon-192.png">
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1f2330;--line:#2a2f3f;--text:#e8eaf0;--sub:#8b92a8;--accent:#4cc9f0;--accent2:#0ea5e9;--ok:#34c38f;--warn:#7dd3fc;--danger:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#031a2b;font-weight:700}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:11px 16px;outline:none;width:100%}
input:focus{border-color:var(--accent)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;font-weight:700;flex:1}.bar h1 span{color:var(--accent)}
.back{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:20px}
.iconbtn{width:38px;height:38px;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center}
.iconbtn.off{opacity:.45}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:none;padding:12px 0;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;position:relative}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button i{font-style:normal;font-size:11px;font-weight:700;background:var(--panel2);color:var(--sub);border-radius:99px;padding:1px 6px;margin-left:4px}
.tabs button.on i{background:#10304a;color:var(--accent)}
.pane{display:none;flex:1;min-height:0;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
#pChat.on{display:flex;flex-direction:column;padding-bottom:84px}
#chat{flex:1;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:#10304a;border:1px solid #1d5a85;border-bottom-right-radius:5px;align-self:flex-end}
.msg.sys{align-self:center;background:none;color:var(--sub);font-size:12.5px;text-align:center;max-width:94%}
.msg .sub{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.msg .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.msg .btns button,.msg .btns a.btn{padding:7px 13px;border-radius:99px;font-size:13.5px}
.pin{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em;background:url(pin-icon.svg) center/contain no-repeat}   /* 모든 위치 아이콘은 pin-icon.svg로 통일 (버튼 라벨은 맨 앞 📍를 이 아이콘으로 바꿔 그림) */
a.btn{display:inline-block;font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);text-decoration:none}
a.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#031a2b;font-weight:700}
.kv{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:13.5px;line-height:1.7}
.kv div{display:flex;gap:10px}.kv b{flex:none;width:58px;color:var(--sub);font-weight:600;font-size:12.5px}
.kv span{flex:1;word-break:break-all}
.who{display:flex;align-items:center;gap:10px;margin-top:2px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.who b{font-size:15.5px}.who small{display:block;color:var(--sub);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:99px;font-size:13px;padding:6px 12px;color:var(--sub)}
.composer{display:flex;align-items:center;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.composer{padding-left:10px;padding-right:10px}
.inwrap{position:relative;flex:1;min-width:0}
.inwrap input{padding-right:54px}
.inwrap .send{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;font-size:15px;background:var(--accent2);border-color:var(--accent2);color:#031a2b}
.msg.me{white-space:pre-wrap;word-break:break-word}
.send{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;flex:none}
.mic{position:fixed;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.55);width:64px;height:64px;border-radius:50%;padding:0;flex:none;background:var(--accent);border-color:var(--accent);color:#031a2b;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mic svg{width:100%;height:100%;display:block}
.mic.on{animation:micwave 1.6s ease-out infinite}
@keyframes micwave{0%{box-shadow:0 0 0 0 rgba(76,201,240,.7),0 0 0 0 rgba(76,201,240,.45)}70%{box-shadow:0 0 0 22px rgba(76,201,240,0),0 0 0 40px rgba(76,201,240,0)}100%{box-shadow:0 0 0 0 rgba(76,201,240,0),0 0 0 0 rgba(76,201,240,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;box-shadow:0 0 0 6px rgba(76,201,240,.5)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,93,.55)}70%{box-shadow:0 0 0 16px rgba(255,93,93,0)}100%{box-shadow:0 0 0 0 rgba(255,93,93,0)}}
.listen{display:none;text-align:center;font-size:13px;color:var(--accent);padding:4px 12px 0}
.listen.on{display:block}
.listen em{color:var(--text);font-style:normal}
.note{font-size:12.5px;color:var(--sub);line-height:1.6}
.banner{background:#0f2a3f;border:1px solid #1d5a85;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.card .tx{flex:1;min-width:0}
.card .tx b{display:block;font-size:15px;word-break:break-word}
.card .tx small{display:block;color:var(--sub);font-size:12.5px;margin-top:3px;line-height:1.5}
.card .x{flex:none;padding:4px 9px;border-radius:8px;color:var(--sub)}
.card.off{opacity:.55}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--sub);margin-left:6px;vertical-align:1px}
.pill.on{background:#10304a;color:var(--accent)}
.empty{padding:50px 10px;text-align:center;color:var(--sub);line-height:1.7;font-size:14px}
.sw{position:relative;width:46px;height:26px;flex:none;margin-top:2px}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:99px;transition:.15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--sub);transition:.15s}
.sw input:checked+i{background:var(--accent2);border-color:var(--accent2)}
.sw input:checked+i::after{left:23px;background:#fff}
.row{display:flex;gap:8px;margin-bottom:12px}.row>*{flex:1}
#ring{position:fixed;inset:0;z-index:100;background:rgba(7,10,16,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#ring.on{display:flex}
#ring .big{font-size:64px;animation:shake .6s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#ring h2{font-size:26px}#ring p{color:var(--sub);font-size:15px;line-height:1.6}
#ring .btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
#ring .btns button{padding:14px 22px;font-size:16px;border-radius:14px}
#live{position:fixed;inset:0;z-index:95;background:#070a10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#live.on{display:flex;overflow-y:auto}
@media (max-height:560px){#live.on{justify-content:flex-start;padding:10px 16px;gap:6px}#liveWave{width:auto!important;max-height:96px}#live h2{font-size:18px}#live .btns{margin-top:0}#live p{min-height:0;font-size:13px}}
#live .big{font-size:72px}#live.talk .big{animation:pulse2 1s infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#live h2{font-size:22px}#live p{color:var(--sub);font-size:15px;line-height:1.6;max-width:92%;min-height:22px}
#liveMe{color:var(--text)}#liveBot{color:var(--accent)}
#liveActs{display:flex;flex-direction:column;gap:8px;align-items:center}
#live .btns{display:flex;gap:10px;margin-top:6px}#live .btns button{padding:12px 14px;font-size:15px;border-radius:14px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2f40;border:1px solid var(--line);padding:9px 15px;border-radius:12px;font-size:13.5px;z-index:50;display:none;max-width:90%;text-align:center}
</style>
<script src="ui-guard.js" defer></script>
</head>
<body>
<div class="bar">
  <a class="back" href="index.html" title="SIM Tools">‹</a>
  <h1>SIM <span>Assistant</span></h1>
  <button class="iconbtn" id="btnTts" title="음성 답변 켜기/끄기">🔊</button>
</div>
<div class="tabs" id="tabs">
  <button data-t="chat" class="on">대화</button>
  <button data-t="memo">메모<i id="cMemo">0</i></button>
  <button data-t="event">일정<i id="cEvent">0</i></button>
  <button data-t="alarm">알람<i id="cAlarm">0</i></button>
</div>

<div class="pane on" id="pChat"><div id="chat"></div></div>
<div class="pane" id="pMemo"></div>
<div class="pane" id="pEvent"></div>
<div class="pane" id="pAlarm"></div>

<div id="chatBar">
  <div class="chips" id="chips"></div>
  <div class="listen" id="listen"><em id="interim">듣고 있어요…</em></div>
  <div class="composer">
    <div class="inwrap"><input id="txt" type="text" placeholder="말하거나 입력하세요 · 문자를 붙여넣으면 일정 등록" autocomplete="off" enterkeyhint="send">
    <button class="send" id="btnSend" title="보내기">➤</button></div>
    <button class="mic" id="btnMic" title="대화 (실시간 음성 대화)">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#4cc9f0"/><g stroke="#031a2b" stroke-width="7" stroke-linecap="round"><path d="M42 44v32"/><path d="M60 32v56"/><path d="M78 52v16"/></g></svg>
    </button>
  </div>
</div>

<div id="ring">
  <div class="big">⏰</div>
  <h2 id="ringTitle">알람</h2>
  <p id="ringSub"></p>
  <div class="btns"><button id="ringSnooze">5분 뒤 다시</button><button class="primary" id="ringStop">끄기</button></div>
</div>
<div id="live">
  <canvas id="liveWave" width="640" height="300" style="width:min(320px,86vw);height:auto;aspect-ratio:640/300"></canvas>
  <div class="big" id="liveIco" style="display:none">🎙</div>
  <h2 id="liveState">연결 중…</h2>
  <p id="liveMe"></p>
  <p id="liveBot"></p>
  <div id="liveActs"></div>
  <div class="btns"><button id="liveCut">✋ 말 끊기</button><button id="liveMute">🎤 음소거</button><button class="danger" id="liveEnd">대화 종료</button></div>
  <div class="row" style="align-items:center;max-width:340px;width:100%;margin:4px 0 0"><span class="note" style="flex:none;width:auto">🔊 볼륨</span><input id="liveVol" type="range" min="1" max="4" step="0.5" style="padding:0;border:none;background:none"></div>
  <button id="liveSpk" style="font-size:13px;padding:7px 12px"></button>
  <div id="liveMic" class="note" style="max-width:92%"></div>
  <div style="width:min(300px,80vw);height:6px;border-radius:99px;background:#1f2330;overflow:hidden"><div id="liveLvl" style="height:100%;width:0;background:#4cc9f0"></div></div>
  <select id="liveDev" style="display:none;max-width:92%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:13px"></select>
  <div class="note" style="margin-top:6px">이어폰을 쓰면 인식이 가장 정확해요</div>
</div>
<div id="toast"></div>

<script>
/* ───────── 한국어 음성 명령 해석(NLU) — 서버 없이 브라우저에서 동작 ───────── */
const NLU = (() => {
  const DW = { '공': 0, '영': 0, '일': 1, '이': 2, '삼': 3, '사': 4, '오': 5, '육': 6, '륙': 6, '칠': 7, '팔': 8, '구': 9 };
  const KNUM = { '한': 1, '하나': 1, '두': 2, '둘': 2, '세': 3, '셋': 3, '네': 4, '넷': 4, '다섯': 5, '여섯': 6, '일곱': 7, '여덟': 8, '아홉': 9, '열': 10, '열한': 11, '열두': 12 };
  const WD = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };
  const TITLES = '대표이사|대표|부사장|사장|전무|상무|이사|본부장|실장|부장|차장|과장|팀장|대리|주임|사원|소장|센터장|지점장|원장|교수|박사|변호사|선생';
  const STOP = new Set(['연락처', '저장', '추가', '등록', '전화번호', '전화', '번호', '회사', '에', '는', '은', '이', '가', '좀', '그리고', '새로운', '새', '신규', '사람', '분', '이름', '이름은', '핸드폰', '휴대폰', '휴대전화', '핸드폰번호', '직급', '직책', '이메일', '메일', '주소', '찾아', '찾아줘', '알려', '알려줘', '해줘', '해', '해주세요', '걸어', '걸어줘', '연결', '연결해줘', '검색', '보여', '보여줘', '불러', '불러줘', '뭐야', '뭐지', '뭐', '어떻게', '되지', '되나요', '이야', '입니다', '에요', '이에요', '번', '해줄래', '할래', '주세요', '줘', '를', '을', '의', '도', '로', '으로', '한테', '에게', '께', '랑', '와', '과', '그', '저', '내', '제', '우리', '있는', '있어', '있으면', '다시', '한번', '혹시', '하고', '고', '라고', '이라고', '라는', '이라는', '어디', '몇', '번이야']);

  /* 음성 → 텍스트 보정: "공일공 일이삼사" → 숫자, "골뱅이" → @ */
  function normalize(t) {
    let s = String(t || '').replace(/\s+/g, ' ').trim();
    s = s.replace(/공\s*일\s*공/g, '010');
    s = s.replace(/(?:공|영)[\s-]*[일이삼사오육륙칠팔구공영](?:[\s-]*[일이삼사오육륙칠팔구공영]){6,}/g, m => m.replace(/[\s-]/g, '').split('').map(c => DW[c]).join(''));
    s = s.replace(/(\d)[\s-]*[일이삼사오육륙칠팔구공영](?:[\s-]*[일이삼사오육륙칠팔구공영]){3,}/g, m => m.replace(/[\s-]/g, '').replace(/[일이삼사오육륙칠팔구공영]/g, c => DW[c]));
    s = s.replace(/\s*골뱅이\s*/g, '@').replace(/\s*닷\s*(컴|넷|케이알|코\s*케이알)/g, (m, x) => ({ '컴': '.com', '넷': '.net', '케이알': '.kr' })[x.replace(/\s/g, '')] || '.co.kr');
    return s;
  }

  const PH_RE = /(?:\+?82[\s-]?)?0\d{1,2}[\s-]?\d{3,4}[\s-]?\d{4}|1[568]\d{2}[\s-]?\d{4}/g;
  const EM_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
  const digits = s => String(s || '').replace(/\D/g, '');
  function fmtPhone(raw) {
    let d = digits(raw); if (d.startsWith('82') && d.length >= 11) d = '0' + d.slice(2);
    if (/^1[568]\d{6}$/.test(d)) return d.slice(0, 4) + '-' + d.slice(4);
    if (d.startsWith('02')) return d.length === 9 ? `02-${d.slice(2, 5)}-${d.slice(5)}` : `02-${d.slice(2, 6)}-${d.slice(6)}`;
    if (d.length === 11) return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
    if (d.length === 10) return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
    return d;
  }

  /* ───────── 날짜·시간 해석 ───────── */
  function kn(s) { s = String(s).trim(); return /^\d+$/.test(s) ? +s : (KNUM[s] != null ? KNUM[s] : null); }
  function parseWhen(text, now) {
    now = now || new Date();
    let s = String(text), out = { hasDate: false, hasTime: false, ambiguous: false, dur: null, y: null, mo: null, d: null, h: null, mi: 0, allDay: false, repeat: null, rest: '' };
    const cut = re => { const m = s.match(re); if (m) s = s.replace(m[0], ' '); return m; };
    let m;
    // 반복
    if (cut(/매일|every\s*day/i)) out.repeat = 'daily';
    else if (cut(/평일마다|평일에?|주중/)) out.repeat = 'weekdays';
    else if (cut(/주말마다|주말에?/)) out.repeat = 'weekend';
    else if ((m = cut(/매주\s*([일월화수목금토])요일?/))) out.repeat = 'weekly' + WD[m[1]];
    // N시간 N분 뒤 / 후
    if ((m = cut(/(\d+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|열한|열두)\s*시간\s*(반)?\s*(?:(\d+)\s*분)?\s*(?:뒤|후)에?/))) {
      const h = kn(m[1]); out.dur = (h * 60 + (m[2] ? 30 : 0) + (m[3] ? +m[3] : 0)) * 60000;
    } else if ((m = cut(/(\d+)\s*분\s*(?:뒤|후)에?/))) out.dur = +m[1] * 60000;
    else if ((m = cut(/(\d+)\s*초\s*(?:뒤|후)에?/))) out.dur = +m[1] * 1000;
    else if (cut(/삼십\s*분\s*(?:뒤|후)에?/)) out.dur = 30 * 60000;
    else if (cut(/십\s*분\s*(?:뒤|후)에?/)) out.dur = 10 * 60000;
    if (out.dur != null) { out.hasDate = out.hasTime = true; out.rest = s.replace(/\s+/g, ' ').trim(); return out; }

    // 날짜
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  if (p.ask === 'kbcontent') { const s0 = text.replace(/(이?라고|을|를)?\s*(기억|기록|적어)\S*\s*$/, '').trim(); pending = null; return s0.length >= 2 ? memHandle(kbParse(s0)) : bot('내용을 알아듣지 못했어요. 다시 말씀해 주세요.'); }
  if (p.ask === 'navdest') {
    const d = NLU.extract('navigate', cleanAns(n) + ' 가자', new Date()).dest || cleanAns(n);
    pending = null; return navFlow({ dest: d });
  }
  if (p.ask === 'findname') {
    const c = cleanAns(n), nm = NLU.extractName(c, []) || (c.length <= 12 && !/\d/.test(c) ? c : '');
    if (!nm) return bot('이름을 알아듣지 못했어요. 다시 말씀해 주세요.', { tok: p.tok });
    pending = null; const sl = Object.assign({}, p.sl, { name: nm }); return findFlow(p.intent, sl);
  }
  // 빠진 정보 채우기
  if (fill(p, text)) { p.tries = 0; return step(); }
  p.tries++;
  if (p.tries >= 3) return cancelP('몇 번 시도했지만 알아듣지 못했어요. 처음부터 다시 말씀해 주세요.');
  bot('잘 알아듣지 못했어요. ' + askText(p, p.ask), { tok: p.tok, btns: p.ask === 'ampm' ? [{ label: '오전', fn: () => handleText('오전') }, { label: '오후', fn: () => handleText('오후') }] : undefined });
}

/* ───────── 입력창·시작 ───────── */
function sendTyped() { const v = $('txt').value.trim(); if (!v) return; $('txt').value = ''; lastVoice = false; unlockAudio(); handleText(v); }
$('btnSend').onclick = sendTyped;
$('txt').addEventListener('paste', () => setTimeout(() => { if (looksLikeMessage($('txt').value)) sendTyped(); }, 30));
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendTyped(); } });
/* 받아쓰기 자동 전송: 차량 등 마이크 권한 팝업이 안 뜨는 환경에서 키보드 🎤 받아쓰기를 쓰기 위한 옵션 */
let autoSend = ls.get('SIMAS_AUTOSEND', '0') === '1', autoT = 0;
(() => {
  const b = document.createElement('button'); b.id = 'chipAuto';
  const paint = () => { b.textContent = autoSend ? '🎤 받아쓰기 자동전송 ON' : '🎤 받아쓰기 자동전송'; b.style.color = autoSend ? 'var(--accent,#4cc9f0)' : ''; b.style.borderColor = autoSend ? 'var(--accent,#4cc9f0)' : ''; };
  b.onclick = () => { autoSend = !autoSend; ls.set('SIMAS_AUTOSEND', autoSend ? '1' : '0'); paint(); if (autoSend) { $('txt').focus(); toast('키보드의 🎤로 말하면 말이 끝난 뒤 자동으로 전송돼요', 3600); } };
  paint(); $('chips').appendChild(b);
  $('txt').addEventListener('input', () => { clearTimeout(autoT); if (autoSend && $('txt').value.trim()) autoT = setTimeout(sendTyped, 1600); });
})();
(() => { const b = document.createElement('button'); b.textContent = '📩 문자로 일정 등록'; b.onclick = () => { $('txt').focus(); toast('받은 문자를 입력창에 붙여넣으면 일정으로 등록해요', 3600); }; $('chips').appendChild(b); })();
['기억한 거 보여줘', '11월 말 유증 전망은?', '메모해줘', '연락처 저장해줘', '전화번호 찾아줘', '전화 걸어줘', '길안내 해줘', '일정 추가해줘', '알람 맞춰줘', '오늘 일정 알려줘'].forEach(t => {
  const b = document.createElement('button'); b.textContent = t; b.onclick = () => { lastVoice = false; unlockAudio(); handleText(t); }; $('chips').appendChild(b);
});

  setTtsBtn();
  try { adb = await idbOpen('simassistant', ['memos', 'events', 'alarms']); for (const k of ['memos', 'events', 'alarms']) MEM[k] = await idbAll(adb, k); }
  catch (e) { adb = null; memOnly = true; }
  await loadContacts(); renderAll(); setInterval(tick, 1000); tick(); wakeOn();
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (!SR) sys('이 브라우저는 음성 인식을 지원하지 않아요. 키보드의 🎤(받아쓰기)를 쓰거나 Chrome·Safari에서 열어 주세요.');
  else if (ios && standalone) sys('iPhone 홈 화면 앱에서는 음성 인식이 막힐 수 있어요. 안 되면 키보드의 🎤(받아쓰기)를 쓰거나 Safari에서 열어 주세요.');
  if (memOnly) sys('이 브라우저는 저장소를 쓸 수 없어 임시로만 동작해요. 닫으면 사라져요.');
  contacts.length || sys('연락처가 아직 없어요. "홍길동 저장해줘"라고 말씀하시면 SIM Phone과 같은 연락처에 저장돼요.');
})();
