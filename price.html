<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#f43f5e; --accent2:#fb7185; --ok:#3ecf8e; --warn:#ffb86b; --bad:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header a.back{color:var(--text);text-decoration:none;font-size:26px;line-height:1;padding:0 6px 3px 0}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
header h1 span{color:var(--accent)}
.spacer{flex:1}
button,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;touch-action:manipulation}
button:active{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--accent);border-color:transparent;color:#fff;font-weight:700}
button.sm{padding:7px 11px;font-size:13.5px}
input[type=text],input[type=number],input[type=tel],input:not([type]){width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus{border-color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom));display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:14px;font-weight:700;color:var(--sub);margin-bottom:10px;letter-spacing:-.2px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.row input{flex:1}
.wrap{flex-wrap:wrap}

/* 스캐너 */
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;display:none}
.cam.on{display:block}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:2px solid var(--accent2);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--accent);animation:scanl 1.6s ease-in-out infinite alternate}
@keyframes scanl{from{top:15%}to{top:85%}}
.cam .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}


/* 공통 부품 */
.msg{padding:10px 12px;border-radius:12px;background:var(--panel2);font-size:14px;margin-top:10px}
.msg.err{background:#ff6b6b1f;color:#ffb3b3}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hide{display:none!important}

.price-in{position:relative;flex:1}
.price-in input{padding-right:34px;font-size:20px;font-weight:700;text-align:right}
.price-in::after{content:"원";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub)}
/* 검색창 + 4가지 입력 방법 */
.search{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px}
.search input{border:0;background:transparent;padding:10px 0;font-size:16px;flex:1;min-width:0}
.search input:focus{border:0}
.search button{border-radius:12px;padding:10px 16px;font-size:18px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;font-size:12.5px;color:var(--sub)}
.tools button i{font-style:normal;font-size:24px;line-height:1}
.tools button.pri{color:#fff}
.tools button i img{width:40px;height:40px;margin:-8px 0;display:block;filter:invert(1);mix-blend-mode:screen;opacity:.9}

/* 선반 */
.tag{background:#ffe14d;color:#1a1a1a;border-radius:6px 6px 14px 14px;padding:10px 14px 12px;margin-bottom:14px;box-shadow:0 3px 0 #b39b1f}
.tag small{display:block;font-size:12px;font-weight:700;letter-spacing:.3px;opacity:.75}
.tag .price-in input{background:transparent;border:0;border-bottom:2px dashed #1a1a1a55;border-radius:0;color:#1a1a1a;font-size:28px;padding:2px 28px 2px 0}
.tag .price-in input::placeholder{color:#1a1a1a55}
.tag .price-in::after{color:#1a1a1a;right:0;font-weight:700}
#pname{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:2px 2px 10px;line-height:1.35}
#pname small{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 5px;vertical-align:2px}
.verdict{border-radius:14px;padding:12px 14px;margin-bottom:6px;font-size:14px}
.verdict b{display:block;font-size:19px;letter-spacing:-.4px}
.verdict.good{background:#3ecf8e1f;border:1px solid #3ecf8e55}
.verdict.bad{background:#ff6b6b1c;border:1px solid #ff6b6b55}
.verdict.even{background:var(--panel);border:1px solid var(--line)}
.rowb{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 12px 0;position:relative}
.rowb::after{content:"";grid-column:1/-1;height:12px;margin:0 -12px;border-radius:4px;background:linear-gradient(#a8784d,#6a4429);box-shadow:0 8px 12px -6px #000a}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;background:#fffaf2;color:#1b1b1f;border-radius:14px 14px 0 0;padding:12px 12px 10px;text-decoration:none;min-height:132px;box-shadow:inset 0 -10px 14px -12px #0003}
.tile .shop{align-self:flex-start;font-size:12px;font-weight:800;color:#fff;border-radius:99px;padding:2px 9px}
.tile .nm{font-size:12.5px;line-height:1.35;color:#555;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.tile .pc{font-size:21px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tile .df{font-size:12.5px;font-weight:700}
.tile .df.neg{color:#0a9d63}.tile .df.pos{color:#e0443e}
.tile.best{box-shadow:0 0 0 3px #3ecf8e,inset 0 -10px 14px -12px #0003}
.tile .rb{position:absolute;top:-1px;right:10px;background:#3ecf8e;color:#06331f;font-size:11.5px;font-weight:800;padding:3px 8px 5px;border-radius:0 0 8px 8px}
.tile.none{background:transparent;border:2px dashed #ffffff30;color:var(--sub);justify-content:center;align-items:center;text-align:center;box-shadow:none}
.tile.none .shop{background:#555!important}
.gbtn{display:block;text-align:center;text-decoration:none;margin-top:18px;padding:13px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700}
.fine{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}

/* 차량 디스플레이처럼 가로로 길고 세로가 짧은 화면: 좌우 배치 */
@media (orientation:landscape) and (max-height:560px){
  main{max-width:none;grid-template-columns:1fr 1fr;align-items:start}
  #cShelf{grid-column:2;grid-row:1 / span 2}
}
#busy{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(15,15,20,.72);backdrop-filter:blur(2px)}
#busy.on{display:flex}
#busy .stage{position:relative;width:180px;height:150px}
#busy svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#busy .mag{transform-origin:90px 60px;animation:magOrbit 2.4s ease-in-out infinite}
@keyframes magOrbit{0%{transform:translate(-38px,0) rotate(-10deg)}25%{transform:translate(0,-26px) rotate(8deg)}50%{transform:translate(38px,4px) rotate(-6deg)}75%{transform:translate(4px,22px) rotate(10deg)}100%{transform:translate(-38px,0) rotate(-10deg)}}
#busy .cart{animation:cartBob 1.2s ease-in-out infinite;transform-origin:90px 100px}
@keyframes cartBob{50%{transform:translateY(3px)}}
#busy p{color:#fff;margin:14px 0 0;font-size:15px;font-weight:600}
#busy small{color:#cbd5e1;margin-top:6px;font-variant-numeric:tabular-nums}
#busy .pbar{width:220px;height:8px;border-radius:99px;background:#ffffff26;margin-top:14px;overflow:hidden}
#busy .pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#fb7185,#f43f5e);transition:width .4s ease-out}
</style>

<header>

</header>
<div id="busy" aria-live="polite"><div class="stage"><svg viewBox="0 0 180 150" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="cart" stroke="#fff" stroke-width="7"><path d="M28 62h18l14 44h66l12-32H52"/><circle cx="68" cy="124" r="8" fill="#fff"/><circle cx="118" cy="124" r="8" fill="#fff"/></g>
<g class="mag"><circle cx="90" cy="44" r="22" stroke="#fda4af" stroke-width="7" fill="rgba(255,255,255,.18)"/><path d="M106 60l20 20" stroke="#f43f5e" stroke-width="9"/></g></svg></div>
<p id="busyMsg">구글에서 검색하는 중…</p><div class="pbar"><i id="pfill"></i></div><small id="busyT">0초</small></div>
<main>
  <section id="cSearch">
    <div class="cam" id="cam" style="margin-bottom:10px"><video id="vid" playsinline muted></video><div class="frame"></div><div class="hint">바코드를 네모 안에 맞춰 주세요</div></div>
    <div class="search">
      <input id="inName" type="text" placeholder="상품명 또는 바코드 번호" autocomplete="off" enterkeyhint="search">

    <div class="tools">
      <button class="pri" id="btnCam"><i><img src="price-ic-scan.png" alt=""></i><span>바코드 스캔</span></button>

      <button id="btnId"><i>🛍️</i><span>상품 사진</span></button>
      <button id="btnTag"><i>🏷️</i><span>가격표</span></button>
    </div>
    <input type="file" id="filePhoto" accept="image/*" class="hide">
    <div class="msg hide" id="scanMsg"></div>
  </section>

  <section class="hide" id="cShelf">
    <div id="pname"></div>
    <div class="tag"><small>마트 가격</small><div class="price-in"><input id="inPrice" type="tel" inputmode="numeric" placeholder="가격표 숫자 입력"></div></div>
    <div id="res"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
'use strict';
const SB_URL = 'https://rgamgjdnhunzzwzsbnbs.supabase.co', SB_KEY = 'sb_publishable_hnBcVEuMXFRdFRqJhOM0OQ_rp72JywU';
const FN = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/price-ai', FN_SHOP = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/price-shop', FN_LOOKUP = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/price-lookup';
const KEY = 'simprice.v1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ── 로그인 세션 (런처와 공유) ── */
const NS = window.SimSession || null;
let sb = null;
async function client() {
  if (sb) return sb;
  sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: !NS, detectSessionInUrl: false } });
  if (NS) sb.auth.onAuthStateChange((ev, s) => { if (s && ev === 'TOKEN_REFRESHED') { try { NS.put(JSON.stringify({ access_token: s.access_token, refresh_token: s.refresh_token })); } catch (e) {} } });
  return sb;
}
async function session() {
  const c = await client();
  if (NS) {
    let raw = null; try { raw = NS.get(); } catch (e) {}
    if (raw && raw !== 'NA' && raw !== 'OUT') {
      let t = null; try { t = JSON.parse(raw); } catch (e) {}
      const cur = (await c.auth.getSession()).data.session;
      if (t && t.refresh_token && (!cur || cur.refresh_token !== t.refresh_token)) { try { await c.auth.setSession({ access_token: t.access_token, refresh_token: t.refresh_token }); } catch (e) {} }
    }
  }
  return (await c.auth.getSession()).data.session;
}
const ERR = {
  no_naver_key: '네이버 쇼핑 API 키가 서버에 아직 등록되지 않았어요. (관리자 설정 필요)',
  naver_auth: '네이버 쇼핑 API 인증에 실패했어요. 키를 확인해 주세요.',
  naver_quota: '네이버 쇼핑 API 하루 사용량을 넘었어요. 내일 다시 시도해 주세요.',
  naver: '네이버 쇼핑에서 가격을 가져오지 못했어요.',
  forbidden: '로그인이 필요하거나 AI 사용 번호가 등록되지 않았어요. 런처 ⋯ → AI 연결 설정에서 번호를 확인해 주세요.',
  limit: '오늘 AI 사용 한도를 넘었어요. 내일 다시 시도해 주세요.',
  ai: 'AI 응답을 받지 못했어요. 잠시 뒤 다시 시도해 주세요.',
  image: '사진을 읽을 수 없어요 (용량이 크거나 형식이 달라요).',
  barcode: '바코드 숫자가 올바르지 않아요.'
};
async function api(payload, ms, url) {
  const ss = await session(); if (!ss) throw new Error(ERR.forbidden);
  for (let k = 0; k < 3; k++) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms || 45000);
    try {
      const r = await fetch(url || FN, { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ss.access_token }, body: JSON.stringify(Object.assign({ phone: (localStorage.getItem('SIMAS_AI_PHONE') || '') }, payload)) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) return j;
      if (r.status === 429 && j.error === 'rate') { await sleep(800); continue; }
      throw new Error(ERR[j.error] || ('서버 오류 (' + r.status + ')'));
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('응답이 너무 늦어요');
      if (e instanceof TypeError) throw new Error('네트워크 연결 실패');
      throw e;
    } finally { clearTimeout(to); }
  }
  throw new Error('요청이 너무 잦아요. 잠시 뒤 다시 해 주세요.');
}

/* ── 바코드 읽기 ── */
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
function validEan(c) {   // 체크숫자 검증: 잘못 읽은 번호를 걸러낸다
  if (!/^\d+$/.test(c) || ![8, 12, 13].includes(c.length)) return false;
  const d = c.split('').map(Number), chk = d.pop();
  let s = 0; for (let i = d.length - 1, w = 3; i >= 0; i--, w = 4 - w) s += d[i] * w;
  return (10 - s % 10) % 10 === chk;
}
let detector = null, zx = null, zxLoading = null, stream = null, scanning = false;
async function getDetector() {
  if (detector !== null) return detector;
  detector = false;
  try { if ('BarcodeDetector' in window) { const sup = await BarcodeDetector.getSupportedFormats(); const f = FORMATS.filter(x => sup.includes(x)); if (f.length) detector = new BarcodeDetector({ formats: f }); } } catch (e) {}
  return detector;
}
function loadZx() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (zxLoading) return zxLoading;
  return zxLoading = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload = () => res(window.ZXing); s.onerror = () => { zxLoading = null; rej(new Error('zxing')); }; document.head.appendChild(s); });
}
async function decodeSource(src, w, h) {   // src: video / img / canvas
  const det = await getDetector();
  if (det) { try { const r = await det.detect(src); for (const b of r) if (validEan(b.rawValue)) return b.rawValue; } catch (e) {} }
  let Z = null; try { Z = await loadZx(); } catch (e) {}
  if (!Z) return null;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d', { willReadFrequently: true }).drawImage(src, 0, 0, w, h);
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  try { const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))); const t = reader.decode(bmp).getText(); if (validEan(t)) return t; } catch (e) {}
  return null;
}
function setScanMsg(t, err) { const m = $('scanMsg'); if (!t) { m.classList.add('hide'); return; } m.className = 'msg' + (err ? ' err' : ''); m.innerHTML = t; }
async function startCam() {
  if (scanning) return stopCam();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setScanMsg('이 기기에서는 카메라를 쓸 수 없어요. 사진에서 읽기나 직접 입력을 이용해 주세요.', true); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } }); }
  catch (e) { setScanMsg('카메라 권한이 필요해요. 권한을 허용해 주세요.', true); return; }
  const v = $('vid'); v.srcObject = stream; await v.play().catch(() => {});
  $('cam').classList.add('on'); $('btnCam').classList.add('on'); $('btnCam').lastElementChild.textContent = '카메라 끄기'; setScanMsg('');
  scanning = true;
  let busy = false;
  const loop = async () => {
    if (!scanning) return;
    if (!busy && v.videoWidth) {
      busy = true;
      try {
        // 화면 가운데(프레임 영역)만 잘라 읽으면 더 빠르고 정확하다
        const vw = v.videoWidth, vh = v.videoHeight, cw = Math.round(vw * .8), ch = Math.round(vh * .4);
        const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
        cv.getContext('2d').drawImage(v, (vw - cw) / 2, (vh - ch) / 2, cw, ch, 0, 0, cw, ch);
        const code = await decodeSource(cv, cw, ch);
        if (code && scanning) { stopCam(); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {} onBarcode(code); return; }
      } catch (e) {}
      busy = false;
    }
    setTimeout(loop, 160);
  };
  loop();
}
function stopCam() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('vid').srcObject = null; $('cam').classList.remove('on'); $('btnCam').classList.remove('on'); $('btnCam').lastElementChild.textContent = '바코드 스캔';
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCam(); });
function loadImg(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 3000); }; im.onerror = () => rej(new Error('img')); im.src = u; }); }
async function photoBarcode(file) {
  setScanMsg('<span class="spin"></span>사진에서 바코드를 찾는 중…');
  try {
    const im = await loadImg(file);
    let w = im.naturalWidth, h = im.naturalHeight; const k = Math.min(1, 1800 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im, 0, 0, w, h);
    const code = await decodeSource(cv, w, h);
    if (code) { setScanMsg(''); onBarcode(code); } else setScanMsg('사진에서 바코드를 읽지 못했어요. 바코드가 크게 나오게 다시 찍거나 숫자를 직접 입력해 주세요.', true);
  } catch (e) { setScanMsg('사진을 열지 못했어요.', true); }
}

/* 앱 안 카메라: 미리보기 + 촬영 버튼. 카메라를 못 쓰면 갤러리 선택으로 대신한다 */
function shoot(title) {
  stopCam();
  return new Promise(resolve => {
    const gallery = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => { const f = i.files[0]; close(f || null); }; i.click(); };
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:2147480000;background:#000;display:flex;flex-direction:column';
    ov.innerHTML = '<div style="padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff;text-align:center;font-size:15px;background:#000a">' + esc(title) + '</div>' +
      '<video playsinline muted style="flex:1;min-height:0;width:100%;object-fit:contain;background:#000"></video>' +
      '<div style="display:flex;align-items:center;justify-content:space-around;padding:14px 10px calc(16px + env(safe-area-inset-bottom));background:#000a">' +
      '<button id="shG" style="min-width:76px">🖼️ 갤러리</button>' +
      '<button id="shS" style="width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid var(--accent);padding:0" aria-label="촬영"></button>' +
      '<button id="shX" style="min-width:76px">닫기</button></div>';
    document.body.appendChild(ov);
    const v = ov.querySelector('video'); let st = null, done = false;
    function close(file) { if (done) return; done = true; if (st) st.getTracks().forEach(t => t.stop()); ov.remove(); resolve(file); }
    ov.querySelector('#shX').onclick = () => close(null);
    ov.querySelector('#shG').onclick = gallery;
    ov.querySelector('#shS').onclick = () => {
      if (!v.videoWidth) return toast('카메라가 아직 준비 중이에요');
      const cv = document.createElement('canvas'); cv.width = v.videoWidth; cv.height = v.videoHeight; cv.getContext('2d').drawImage(v, 0, 0);
      cv.toBlob(b => close(b ? new File([b], 'shot.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', .9);
    };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('카메라를 쓸 수 없어요. 갤러리에서 골라 주세요'); return; }
    navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } })
      .then(s => { if (done) { s.getTracks().forEach(t => t.stop()); return; } st = s; v.srcObject = s; v.play().catch(() => {}); })
      .catch(() => { toast('카메라 권한이 필요해요. 갤러리에서 고를 수 있어요'); });
  });
}

function fileToDataUrl(file, max) {
  return loadImg(file).then(im => { let w = im.naturalWidth, h = im.naturalHeight; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im, 0, 0, w, h); return cv.toDataURL('image/jpeg', .85); });
}
/* ── 흐름: 검색 → 선반 ── */
const S = { name: '', guess: false, mart: 0, res: null };
const show = (id, on) => $(id).classList.toggle('hide', !on);
const cleanName = n => String(n || '').replace(/\s*[\(（\[][^\)）\]]*[\)）\]]/g, '').replace(/\s+/g, ' ').trim();
const hue = t => { let h = 0; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

async function onBarcode(code) {
  stopCam(); setScanMsg(''); busyStart('lookup');
  try {
    const j = await api({ barcode: code }, 40000, FN_LOOKUP), c = (j.candidates || [])[0];
    if (c) { $('inName').value = cleanName(c.name) || c.name; S.guess = !c.confirmed; return search(); }
    busyStop(); $('inName').value = ''; setScanMsg('이 바코드는 등록된 정보가 없어요. 상품명을 입력하거나 🛍️ 상품 사진을 찍어 보세요.', true);
  } catch (e) { busyStop(); setScanMsg(esc(e.message), true); }
}
/* 조회 중 진행 표시: 경과 시간 + 진행 막대(점근선으로 차오르다 완료 시 100%) + 단계 문구 */
let busyTimer = null;
function busyStart(kind) {
  const t0 = Date.now(), msgs = kind === 'lookup' ? [[0, '바코드를 확인하는 중…'], [4, '상품 정보를 찾는 중…'], [10, '조금만 더 기다려 주세요…']] : [[0, '구글에서 검색하는 중…'], [5, '쇼핑몰 가격을 찾는 중…'], [11, '쿠팡 가격을 확인하는 중…'], [18, '가격을 정리하는 중…'], [28, '조금만 더 기다려 주세요…']];
  $('pfill').style.transition = 'none'; $('pfill').style.width = '0%'; void $('pfill').offsetWidth; $('pfill').style.transition = '';
  $('busy').classList.add('on');
  const tick = () => { const t = (Date.now() - t0) / 1000; $('busyT').textContent = Math.floor(t) + '초'; $('pfill').style.width = (92 * (1 - Math.exp(-t / 9))).toFixed(1) + '%'; $('busyMsg').textContent = msgs.filter(m => t >= m[0]).pop()[1]; };
  clearInterval(busyTimer); tick(); busyTimer = setInterval(tick, 250);
}
function busyStop() { clearInterval(busyTimer); $('pfill').style.width = '100%'; setTimeout(() => $('busy').classList.remove('on'), 250); }
async function search() {
  const v = $('inName').value.trim(); if (!v) return toast('상품명이나 바코드를 입력해 주세요');
  const digits = v.replace(/\D/g, '');
  if (/^[\d\s-]+$/.test(v) && digits.length >= 8) { if (!validEan(digits)) return setScanMsg('올바른 바코드 숫자가 아니에요. 다시 확인해 주세요.', true); return onBarcode(digits); }
  S.name = cleanName(v) || v; $('inName').value = S.name; setScanMsg('');
  show('cShelf', true); S.res = null; $('res').innerHTML = ''; renderName();
  busyStart(); $('btnGo').disabled = true;
  try { S.res = await api({ q: S.name, coupang: true }, 55000, FN_SHOP); }
  catch (e) { S.res = { items: [], err: e.message }; }
  busyStop(); $('btnGo').disabled = false;
  renderShelf(); $('cShelf').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function renderName() { $('pname').innerHTML = esc(S.name) + (S.guess ? '<small>AI 추정</small>' : ''); }
function renderShelf() {
  const j = S.res, mart = S.mart; if (!j) return;
  const items = (j.items || []).filter(x => x.priceNum > 0), best = items[0]; let h = '';
  if (best && mart > 0) {
    const d = mart - best.priceNum, p = Math.abs(d) / mart * 100;
    if (p < 1) h += '<div class="verdict even"><b>마트와 거의 같아요</b></div>';
    else if (d > 0) h += '<div class="verdict good"><b>온라인이 ' + won(d) + ' 저렴</b>' + p.toFixed(1) + '% · ' + esc(best.shop || '최저') + ' ' + won(best.priceNum) + '</div>';
    else h += '<div class="verdict bad"><b>마트가 ' + won(-d) + ' 저렴</b>' + p.toFixed(1) + '% · 온라인 최저 ' + won(best.priceNum) + '</div>';
  }
  const tiles = items.map(x => {
    const diff = mart > 0 ? x.priceNum - mart : null;
    const inner = (x === best ? '<span class="rb">최저가</span>' : '') + '<span class="shop" style="background:hsl(' + hue(x.shop) + ' 55% 42%)">' + esc(x.shop || '쇼핑몰') + '</span><div class="nm">' + esc(x.name) + (x.cond ? ' · ' + esc(x.cond) : '') + '</div><div class="pc">' + won(x.priceNum) + '</div>' + (diff != null ? '<div class="df ' + (diff < 0 ? 'neg' : 'pos') + '">' + (diff < 0 ? '▼ ' : '▲ ') + won(Math.abs(diff)) + '</div>' : '');
    return x.url ? '<a class="tile' + (x === best ? ' best' : '') + '" href="' + esc(x.url) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div class="tile' + (x === best ? ' best' : '') + '">' + inner + '</div>';
  });
  if (!items.some(x => /쿠팡/.test(x.shop))) tiles.push('<div class="tile none"><span class="shop">쿠팡</span><div>미확인</div></div>');
  if (!items.length && j.err) h += '<div class="msg err">' + esc(j.err) + '</div>';
  let rows = ''; for (let i = 0; i < tiles.length; i += 2) rows += '<div class="rowb">' + tiles[i] + (tiles[i + 1] || '<div></div>') + '</div>';
  h += rows + '<a class="gbtn" href="https://www.google.com/search?tbm=shop&q=' + encodeURIComponent(S.name) + '" target="_blank" rel="noopener">🔍 가격 찾아보러가기</a><div class="fine">검색 시점 가격 · AI가 읽은 값이라 다를 수 있어요 · 배송비 제외</div>';
  $('res').innerHTML = h;
}
$('btnGo').onclick = () => { S.guess = false; search(); };
$('inName').addEventListener('keydown', e => { if (e.key === 'Enter') { S.guess = false; search(); } });
$('inName').addEventListener('input', () => { S.guess = false; });
$('inPrice').addEventListener('input', e => { const v = e.target.value.replace(/\D/g, ''); S.mart = +v || 0; e.target.value = v ? (+v).toLocaleString('ko-KR') : ''; if (S.res) renderShelf(); });
$('btnCam').onclick = startCam;
$('btnPhoto').onclick = () => $('filePhoto').click();
$('filePhoto').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) photoBarcode(f); };

/* 상품 앞면 사진 → 이름 → 바로 검색 */
$('btnId').onclick = async () => { const f = await shoot('상품 앞면을 찍어 주세요'); if (f) handleId(f); };
async function handleId(f) {
  setScanMsg('<span class="spin"></span>상품 이름을 읽는 중…'); $('btnId').disabled = true;
  try {
    const j = await api({ action: 'identify', image: await fileToDataUrl(f, 1600) }, 50000);
    if (j.name) { setScanMsg(''); $('inName').value = cleanName(j.name) || j.name; S.guess = true; search(); }
    else setScanMsg('상품 이름을 읽지 못했어요. 글자가 크게 보이게 다시 찍거나 직접 입력해 주세요.', true);
  } catch (err) { setScanMsg(esc(err.message), true); }
  $('btnId').disabled = false;
}

/* 가격표 사진 → 마트 가격 */
$('btnTag').onclick = async () => { const f = await shoot('가격표를 찍어 주세요'); if (f) handleTag(f); };
async function handleTag(f) {
  setScanMsg('<span class="spin"></span>가격표를 읽는 중…'); $('btnTag').disabled = true;
  try {
    const j = await api({ action: 'tag', image: await fileToDataUrl(f, 1600) }, 50000);
    setScanMsg(''); show('cShelf', true);
    if (j.price) { S.mart = j.price; $('inPrice').value = j.price.toLocaleString('ko-KR'); if (S.res) renderShelf(); toast('가격표 ' + won(j.price) + (j.note ? ' · ' + j.note : '') + ' — 맞는지 확인해 주세요'); }
    else toast('가격을 읽지 못했어요. 숫자를 직접 입력해 주세요');
    if (j.name && !$('inName').value.trim()) { $('inName').value = cleanName(j.name) || j.name; S.guess = true; search(); }
    else if (!S.name) { renderName(); }
  } catch (err) { setScanMsg(esc(err.message), true); }
  $('btnTag').disabled = false;
}
</script>
</body>
