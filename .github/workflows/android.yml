name: SIM Android APKs

on:
  push:
    paths:
      - 'android/**'
      - 'pad.html'
      - '**-icon-192.png'
      - 'icon-192.png'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tools:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: launcher,  label: "SIM Tools",      page: index.html,     icon: icon-192.png,           flavor: Launcher }
          - { key: simtv,     label: "SIM TV",         page: tv.html,        icon: tv-icon-192.png,        flavor: Tool }
          - { key: note,      label: "SIM Note",       page: note.html,      icon: note-icon-192.png,      flavor: Tool }
          - { key: phone,     label: "SIM Phone",      page: phone.html,     icon: phone-icon-192.png,     flavor: Tool }
          - { key: aitel,     label: "SIM AI-Tel",     page: aitel.html,     icon: aitel-icon-192.png,     flavor: Tool }
          - { key: assistant, label: "SIM Assistant",  page: assistant.html, icon: assistant-icon-192.png, flavor: Tool }
          - { key: calendar,  label: "SIM Calendar",   page: calendar.html,  icon: calendar-icon-192.png,  flavor: Tool }
          - { key: folder,    label: "SIM Folder",     page: folder.html,    icon: folder-icon-192.png,    flavor: Tool }
          - { key: message,   label: "SIM Message",    page: message.html,   icon: message-icon-192.png,   flavor: Tool }
          - { key: kbo,       label: "SIM KBO",        page: kbo.html,       icon: kbo-icon-192.png,       flavor: Tool }
          - { key: orchestra, label: "SIM Orchestra",  page: orchestra.html, icon: orchestra-icon-192.png, flavor: Tool }
          - { key: radio,     label: "SIM Radio",      page: radio.html,     icon: radio-icon-192.png,     flavor: Tool }
          - { key: calc,      label: "SIM Calculator", page: calc.html,      icon: calc-icon-192.png,      flavor: Tool }
          - { key: map,       label: "SIM Map",        page: map.html,       icon: map-icon-192.png,       flavor: Tool }
          - { key: teams,     label: "SIM Teams",      page: teams.html,     icon: teams-icon-192.png,     flavor: Tool }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 앱 아이콘 넣기
        run: |
          mkdir -p android/shell/src/main/res/mipmap-xxxhdpi
          cp "${{ matrix.icon }}" android/shell/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: 버전 정하기 (앱 내용이 바뀐 것만 새 버전 번호, 나머지는 이전 번호 유지)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 매니페스트의 <package .../> 줄(런처가 다른 앱을 찾는 목록)은 앱이 새로 추가될 때마다 바뀌므로 해시에서 뺀다
          if [ "${{ matrix.flavor }}" = "Launcher" ]; then SKIP='src/tool/'; else SKIP='src/launcher/'; fi
          H=$( { echo "${{ matrix.key }}|${{ matrix.label }}|${{ matrix.page }}"; git ls-files android | grep -v '^android/app/' | grep -v "$SKIP" | sort | xargs -d '\n' grep -ahv '<package android:name=' ; cat "${{ matrix.icon }}"; } | sha256sum | cut -c1-16 )
          gh release download apps-latest -p versions.json -O prev.json 2>/dev/null || echo '{}' > prev.json
          PV=$(jq -r --arg k "${{ matrix.key }}" '.apps[$k].v // empty' prev.json 2>/dev/null || true)
          PH=$(jq -r --arg k "${{ matrix.key }}" '.apps[$k].h // empty' prev.json 2>/dev/null || true)
          if [ -n "$PV" ] && [ "$PH" = "$H" ]; then V=$PV; else V=${{ github.run_number }}; fi
          echo "hash=$H prev=$PV/$PH -> version=$V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          mkdir -p out
          echo "{\"key\":\"${{ matrix.key }}\",\"v\":$V,\"h\":\"$H\"}" > out/ver-${{ matrix.key }}.json
      - name: APK 빌드
        run: >
          gradle -p android :shell:assemble${{ matrix.flavor }}Debug --no-daemon --stacktrace
          -PappKey=${{ matrix.key }} "-PappLabel=${{ matrix.label }}" -PstartPage=${{ matrix.page }}
          -PverCode=${{ steps.ver.outputs.v }}
      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp "$(find android/shell/build/outputs/apk -name '*.apk' | head -n1)" out/simtools-${{ matrix.key }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.key }}
          path: |
            out/simtools-${{ matrix.key }}.apk
            out/ver-${{ matrix.key }}.json

  pad:
    name: SIM PAD (Bluetooth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 화면 파일을 앱 안에 함께 넣기 (인터넷이 없을 때 대비)
        run: |
          mkdir -p android/app/src/main/assets
          cp pad.html pad-icon-192.png ui-guard.js appmenu.js android/app/src/main/assets/
      - name: 버전 정하기 (PAD 내용이 바뀐 때만 새 버전 번호)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          H=$( { git ls-files android/app android/build.gradle android/settings.gradle android/gradle.properties | sort | xargs -d '\n' cat; cat pad.html pad-icon-192.png ui-guard.js appmenu.js; } | sha256sum | cut -c1-16 )
          gh release download apps-latest -p versions.json -O prev.json 2>/dev/null || echo '{}' > prev.json
          PV=$(jq -r '.apps.pad.v // empty' prev.json 2>/dev/null || true)
          PH=$(jq -r '.apps.pad.h // empty' prev.json 2>/dev/null || true)
          if [ -n "$PV" ] && [ "$PH" = "$H" ]; then V=$PV; else V=${{ github.run_number }}; fi
          echo "hash=$H prev=$PV/$PH -> version=$V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          mkdir -p out
          echo "{\"key\":\"pad\",\"v\":$V,\"h\":\"$H\"}" > out/ver-pad.json
      - name: APK 빌드
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace -PverCode=${{ steps.ver.outputs.v }}
      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/simtools-pad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-pad
          path: |
            out/simtools-pad.apk
            out/ver-pad.json

  publish:
    needs: [tools, pad]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks
      - name: 릴리스로 올리기 (런처가 여기서 내려받음)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          jq -s '{apps: (map({(.key): {v: .v, h: .h}}) | add)}' apks/ver-*.json > apks/versions.json   # 런처가 앱별 업데이트 여부를 비교하는 기준
          rm apks/ver-*.json
          cat apks/versions.json
          ls -la apks
          gh release delete apps-latest --yes --cleanup-tag || true
          gh release create apps-latest apks/* --title "SIM Tools 앱 모음 (Android)" --notes "SIM Tools 런처와 각 도구의 안드로이드 앱" --latest=false
          cp apks/simtools-pad.apk SIM-PAD.apk
          gh release delete simpad-latest --yes --cleanup-tag || true
          gh release create simpad-latest SIM-PAD.apk --title "SIM PAD (Android)" --notes "차량 블루투스 마우스·키보드용 SIM PAD 앱" --latest=false
