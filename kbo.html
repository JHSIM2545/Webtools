<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM KBO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SIM KBO</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#6fd64b; --accent2:#5cc43a; --ink:#0d2400; --ok:#3ecf8e; --warn:#ffb86b; --bad:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.28;background:url(kbo-bg.png) center 40%/min(120vw,760px) no-repeat}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header a.back{color:var(--text);text-decoration:none;font-size:26px;line-height:1;padding:0 6px 3px 0}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
header h1 span{color:var(--accent)}
.spacer{flex:1}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent2);border-color:var(--accent2);color:var(--ink);font-weight:700}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
input[type=text],input[type=search]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);outline:none}
input:focus{border-color:var(--accent)}
.teambtn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(111,214,75,.14);border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:4px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:calc(53px + env(safe-area-inset-top));z-index:19;overflow-x:auto}
.tabs button{flex:1;min-width:64px;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--sub);white-space:nowrap}
.tabs button.on{background:var(--accent2);color:var(--ink);font-weight:700}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.card{background:rgba(23,26,35,.86);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.hint.warn{color:var(--warn)}
.hint.bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--accent2);color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{padding:5px 11px;border-radius:99px;font-size:13px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--panel2);color:var(--sub);font-weight:600;font-size:12px;position:sticky;top:0}
td.l,th.l{text-align:left}
tr.my td{background:rgba(111,214,75,.10)}
tr:last-child td{border-bottom:0}
td.hi,th.hi{color:var(--accent);font-weight:700}
td a.pl{color:var(--text);text-decoration:none;font-weight:600;border-bottom:1px dotted var(--sub);cursor:pointer}
.stk td:nth-child(2),.stk th:nth-child(2){position:sticky;left:0;background:var(--panel);z-index:1}
.stk th:nth-child(2){background:var(--panel2);z-index:2}
.empty{padding:26px 10px;text-align:center;color:var(--sub);font-size:14px}
.item{display:block;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px;color:var(--text);text-decoration:none}
.item:hover{border-color:var(--accent)}
.item .t{font-size:14.5px;line-height:1.45}
.item .s{font-size:12px;color:var(--sub);margin-top:4px}
.vid{display:flex;gap:10px;align-items:flex-start}
.vid img{width:128px;height:72px;object-fit:cover;border-radius:8px;background:var(--panel);flex:none}
.vid .ch{width:56px;height:56px;border-radius:50%}
.pres{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px;cursor:pointer}
.pres:hover{border-color:var(--accent)}
.pres b{font-size:15px}
.pres small{color:var(--sub);display:block;font-size:12px}
.pres .no{width:34px;text-align:center;font-weight:800;color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:92vh;overflow-y:auto;padding:16px 14px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
@media(min-width:800px){.ov{align-items:center}.sheet{border-radius:20px}}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sh-h h2{font-size:17px;flex:1}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tgrid button{padding:12px 8px;font-size:15px;font-weight:700;border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:76px;background:#fff}
.tgrid button img{max-width:100%;height:52px;object-fit:contain;display:block}
.tgrid button.on{border:3px solid var(--accent);box-shadow:0 0 0 2px rgba(111,214,75,.35)}
.tgrid button:not(.on){border-color:var(--line)}
.tgrid button .nm{color:#222}
.ph{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.ph img.photo{width:104px;height:130px;object-fit:cover;border-radius:12px;background:var(--panel2);flex:none;border:1px solid var(--line)}
.ph .nm{font-size:20px;font-weight:800}
.ph .tm{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;margin-top:2px}
.ph .tm img{width:20px;height:20px;object-fit:contain}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin:10px 0}
.kv dt{color:var(--sub)}
.kv dd{word-break:keep-all}
.sec{font-size:13px;color:var(--accent);font-weight:700;margin:16px 0 6px}
.gcard{display:block;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(31,35,48,.9);margin-bottom:10px;cursor:pointer}
.gcard:hover{border-color:var(--accent)}
.gcard.my{border-color:var(--accent);box-shadow:0 0 0 1px rgba(111,214,75,.35)}
.g-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:8px;gap:8px}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.badge.live{background:rgba(255,80,80,.15);border-color:#ff5c5c;color:#ff8585}
.badge.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff5c5c;margin-right:5px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.g-main{display:flex;align-items:center;gap:6px}
.gt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;min-width:0}
.gt img{height:38px;max-width:64px;object-fit:contain}
.sc{font-size:30px;font-weight:800;min-width:30px;text-align:center}
.sc.w{color:var(--accent)}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px}
.bso{display:grid;grid-template-columns:auto auto;gap:3px 6px;font-size:11px;color:var(--sub);align-items:center}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:3px}
.dots.b i.on{background:#4dabf7}.dots.s i.on{background:#ffd43b}.dots.o i.on{background:#ff6b6b}
.g-foot{margin-top:9px;font-size:12.5px;color:var(--sub);display:flex;gap:4px 12px;flex-wrap:wrap}
.g-foot b{color:var(--text);font-weight:600}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dnav .dt{flex:1;text-align:center;font-weight:700}
.big{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);margin:10px 0}
.big .bso{font-size:13px;gap:5px 8px}.big .dots i{width:12px;height:12px}
.vs{font-size:13.5px;line-height:1.7}.vs small{color:var(--sub);display:block;font-size:11.5px}
.itbl th,.itbl td{padding:7px 7px;text-align:center}
.itbl th:first-child,.itbl td:first-child{text-align:left;position:sticky;left:0;background:var(--panel2);z-index:1}
.itbl td.cur,.itbl th.cur{background:rgba(111,214,75,.18);color:var(--accent);font-weight:700}
.itbl td.rr{font-weight:800;color:var(--text)}
.rec{font-size:11px;color:var(--sub);font-weight:400;display:block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<script src="ui-guard.js" defer></script>
<script src="appmenu.js" defer></script>
<script src="sync.js?bg=1" defer></script>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="런처로">‹</a>
  <h1>SIM <span>KBO</span></h1>
  <div class="spacer"></div>
  <button class="teambtn" id="teamBtn">응원팀 선택</button>
</header>
<nav class="tabs" id="tabs">
  <button data-t="live" class="on">실황</button>
  <button data-t="rank">순위</button>
  <button data-t="stat">지표</button>
  <button data-t="player">선수</button>
  <button data-t="news">뉴스</button>
  <button data-t="video">영상</button>
</nav>
<main id="main"></main>

<div class="ov" id="ovTeam"><div class="sheet">
  <div class="sh-h"><h2>응원팀 선택</h2><button class="sm" id="teamClose">닫기</button></div>
  <div class="tgrid" id="teamGrid"></div>
  <button style="width:100%;margin-top:10px" id="teamNone">응원팀 없이 보기</button>
  <div class="hint">선택한 팀은 이 기기에만 저장돼요. 순위 강조, 팀 뉴스·영상, 지표 팀 필터에 쓰입니다.</div>
</div></div>

<div class="ov" id="ovPlayer"><div class="sheet" id="plBody"></div></div>
<div class="ov" id="ovGame"><div class="sheet" id="gmBody"></div></div>

<script>
'use strict';
const FN = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/kbo-data';
const TEAMS = ['삼성', 'KT', 'KIA', 'LG', '두산', 'SSG', '롯데', 'NC', '한화', '키움'];
const TCODE = { '삼성': 'SS', 'KT': 'KT', 'KIA': 'HT', 'LG': 'LG', '두산': 'OB', 'SSG': 'SK', '롯데': 'LT', 'NC': 'NC', '한화': 'HH', '키움': 'WO' };   // KBO 공식 엠블럼 코드
const emblem = t => 'https://6ptotvmi5753.edge.naverncp.com/KBO_IMAGE/emblem/regular/2026/emblem_' + TCODE[t] + '.png';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const S = { tab: 'live', liveDate: '', team: lsGet('simkbo.team') || '', kind: 'hit1', sort: '', order: 'DESC', onlyMy: false, newsMode: 'my', vidMode: 'vid' };
const ERR = {
  nophone: '등록된 사용자 번호가 없어요. 런처 상단 AI 아이콘에서 전화번호를 먼저 등록해 주세요.',
  forbidden: '등록되지 않은 전화번호예요. 런처 상단 AI 아이콘에서 번호를 확인해 주세요.',
  quota: '유튜브 검색 한도를 모두 썼어요. 하루 한도는 한국시간 오후 5시경 초기화돼요.',
  nokey: '서버에 YOUTUBE_API_KEY가 등록되어 있지 않아요.',
  noplayer: '선수 정보를 찾지 못했어요.',
  net: '네트워크 연결에 실패했어요.',
  fail: 'KBO 사이트에서 데이터를 가져오지 못했어요. 잠시 뒤 다시 시도해 주세요.'
};

/* ── 서버 호출 + 기기 캐시 (실패하면 마지막으로 받은 값을 "저장된 결과"로 보여준다) ── */
const TTL = { standings: 10, players: 30, search: 30, profile: 360, news: 10, youtube: 360 };   // 분
async function api(action, p) {
  const phone = (lsGet('SIMAS_AI_PHONE') || '').replace(/\D/g, '');
  if (phone.length < 9) throw { code: 'nophone' };
  const key = 'simkbo.c.' + action + '|' + JSON.stringify(p || {});
  let hit = null; try { hit = JSON.parse(lsGet(key) || 'null'); } catch (e) {}
  if (hit && Date.now() - hit.at < (TTL[action] || 10) * 60000) return Object.assign({ _cache: 'fresh', _at: hit.at }, hit.v);
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ phone, action }, p || {})), signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: j.error || (r.status === 403 ? 'forbidden' : 'fail'), detail: j.detail };
    lsSet(key, JSON.stringify({ at: Date.now(), v: j }));
    return j;
  } catch (e) {
    if (hit) return Object.assign({ _cache: 'stale', _at: hit.at }, hit.v);
    throw e && e.code ? e : { code: e && e.name === 'AbortError' ? 'fail' : 'net' };
  } finally { clearTimeout(to); }
}
const errMsg = e => (ERR[e && e.code] || ERR.fail) + (e && e.detail ? ' [' + e.detail + ']' : '');
const stale = j => j._cache === 'stale' ? '<div class="hint warn">⚠ 서버에서 새로 받지 못해 ' + esc(fmtAt(j._at)) + '에 저장된 결과를 보여드려요.</div>' : '';
const fmtAt = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const loading = t => '<div class="empty"><span class="spin"></span>' + esc(t || '불러오는 중…') + '</div>';
const failBox = (e, retry) => '<div class="card"><div class="hint bad" style="margin:0">' + esc(errMsg(e)) + '</div>' + (retry ? '<button class="sm" style="margin-top:10px" data-act="' + retry + '">다시 시도</button>' : '') + '</div>';

/* ── 값 가공 (원본에 있는 값만 계산: 나이·연봉 단위) ── */
function ageOf(birth) {
  const m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(birth || ''); if (!m) return '';
  const n = new Date(); let a = n.getFullYear() - +m[1];
  if (n.getMonth() + 1 < +m[2] || (n.getMonth() + 1 === +m[2] && n.getDate() < +m[3])) a--;
  return '만 ' + a + '세';
}
function won(s) {   // "50000만원" → "5억원"
  const m = /([\d,]+)\s*만원/.exec(s || ''); if (!m) return s || '';
  const n = parseInt(m[1].replace(/,/g, ''), 10); if (!isFinite(n)) return s;
  const eok = Math.floor(n / 10000), rest = n % 10000;
  return (eok ? eok + '억' + (rest ? ' ' + rest.toLocaleString() + '만' : '') : rest.toLocaleString() + '만') + '원';
}
const myRow = t => S.team && t === S.team;

/* ── 응원팀 ── */
function paintTeam() { $('teamBtn').textContent = S.team ? '⚾ ' + S.team : '응원팀 선택'; }
function openTeam() {
  $('teamGrid').innerHTML = TEAMS.map(t => '<button data-team="' + esc(t) + '" aria-label="' + esc(t) + '" title="' + esc(t) + '"' + (t === S.team ? ' class="on"' : '') + '><img src="' + esc(emblem(t)) + '" alt="' + esc(t) + '" referrerpolicy="no-referrer"></button>').join('');
  $('ovTeam').classList.add('show');
}
function setTeam(t) { S.team = t; lsSet('simkbo.team', t); lsSet('simkbo.asked', '1'); paintTeam(); $('ovTeam').classList.remove('show'); render(); }
$('teamBtn').onclick = openTeam;
$('teamClose').onclick = () => { lsSet('simkbo.asked', '1'); $('ovTeam').classList.remove('show'); };
$('teamNone').onclick = () => setTeam('');
$('teamGrid').addEventListener('error', e => { const i = e.target; if (i.tagName === 'IMG') i.replaceWith(Object.assign(document.createElement('span'), { className: 'nm', textContent: i.alt })); }, true);
$('teamGrid').onclick = e => { const b = e.target.closest('[data-team]'); if (b) setTeam(b.dataset.team); };
$('ovTeam').onclick = e => { if (e.target === $('ovTeam')) $('teamClose').onclick(); };

/* ── 탭 ── */
$('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; S.tab = b.dataset.t; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); render(); window.scrollTo(0, 0); };
function render() { stopLive(); ({ live: vLive, rank: vRank, stat: vStat, player: vPlayer, news: vNews, video: vVideo })[S.tab](); }
const main = $('main');
let seq = 0;   // 늦게 도착한 응답이 다른 탭 화면을 덮지 않게
const guard = () => { const n = ++seq; return () => n === seq; };

/* ── 1. 팀 순위 ── */
async function vRank() {
  const ok = guard(); main.innerHTML = loading('팀 순위 불러오는 중…');
  try {
    const j = await api('standings'); if (!ok()) return;
    const rows = j.rows.slice().sort((a, b) => a.rank - b.rank);
    main.innerHTML = '<div class="card"><div class="row" style="margin-bottom:8px"><b>KBO 팀 순위</b><span class="hint grow" style="margin:0;text-align:right">기준일 ' + esc(j.asof || '확인 안 됨') + '</span></div>'
      + '<div class="tw"><table><thead><tr><th>순위</th><th class="l">팀</th><th>경기</th><th>승</th><th>패</th><th>무</th><th class="hi">승률</th><th>게임차</th><th>최근10</th><th>연속</th><th>홈</th><th>방문</th></tr></thead><tbody>'
      + rows.map(r => '<tr' + (myRow(r.team) ? ' class="my"' : '') + '><td>' + r.rank + '</td><td class="l"><b>' + esc(r.team) + '</b></td><td>' + r.g + '</td><td>' + r.w + '</td><td>' + r.l + '</td><td>' + r.d + '</td><td class="hi">' + r.pct.toFixed(3) + '</td><td>' + esc(r.gb) + '</td><td>' + esc(r.last10) + '</td><td>' + esc(r.streak) + '</td><td>' + esc(r.home) + '</td><td>' + esc(r.away) + '</td></tr>').join('')
      + '</tbody></table></div>'

main.addEventListener('click', e => {

  if (e.target.closest('#ordBtn')) { if (!S.sort) S.sort = S.kind === 'hit1' ? 'HRA_RT' : S.kind === 'pit1' ? 'ERA_RT' : ''; if (!S.sort) return; S.order = S.order === 'ASC' ? 'DESC' : 'ASC'; return vStat(); }

/* ── 0. 실황 (오늘의 경기 · 진행 중 경기는 10초마다 자동 갱신) ── */
const FN_LIVE = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/kbo-live';
const LIVE = { games: [], timer: null, dTimer: null, gid: '', busy: false };
async function apiLive(action, p) {
  const phone = (lsGet('SIMAS_AI_PHONE') || '').replace(/\D/g, '');
  if (phone.length < 9) throw { code: 'nophone' };
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(FN_LIVE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ phone, action }, p || {})), signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: j.error || (r.status === 403 ? 'forbidden' : 'fail'), detail: j.detail };
    return j;
  } catch (e) { throw e && e.code ? e : { code: e && e.name === 'AbortError' ? 'fail' : 'net' }; }
  finally { clearTimeout(to); }
}
function stopLive() { clearTimeout(LIVE.timer); LIVE.timer = null; }
function stopDetail() { clearTimeout(LIVE.dTimer); LIVE.dTimer = null; LIVE.gid = ''; }
const dayText = d => d ? d.slice(0, 4) + '.' + d.slice(4, 6) + '.' + d.slice(6, 8) : '';
const clock = t => { const d = new Date(t); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':'); };
const tname = t => t && t.nm ? t.nm : '';
const logo = nm => TCODE[nm] ? '<img src="' + esc(emblem(nm)) + '" alt="' + esc(nm) + '" referrerpolicy="no-referrer">' : '';
const innLabel = g => g.inning ? g.inning + '회' + (g.half === 'T' ? '초' : g.half === 'B' ? '말' : '') : '';
const nm0 = n => /^\d+$/.test(n || '') ? '#' + n : (n || '');   // KBO 원본에 이름 대신 선수번호가 들어온 경우 그대로 표시
function badge(g) {
  if (g.status === 'live') return '<span class="badge live">LIVE ' + esc(innLabel(g)) + '</span>';
  if (g.status === 'pre') return '<span class="badge">경기 전 ' + esc(g.time || '') + '</span>';
  if (g.status === 'end') return '<span class="badge">경기 종료</span>';
  if (g.status === 'cancel') return '<span class="badge">' + esc(g.cancelNm || '경기 취소') + '</span>';
  return '<span class="badge">상태 확인 필요 (코드 ' + esc(g.state) + ')</span>';
}
function diamond(b, px) {
  const on = i => b[i] ? 'var(--accent)' : 'transparent';
  const sq = (x, y, i) => '<rect x="' + (x - 6) + '" y="' + (y - 6) + '" width="12" height="12" transform="rotate(45 ' + x + ' ' + y + ')" fill="' + on(i) + '" stroke="#9aa3ba" stroke-width="1.6"/>';
  return '<svg width="' + px + '" height="' + Math.round(px * .88) + '" viewBox="0 0 60 53" aria-label="주자">' + sq(30, 9, 1) + sq(9, 28, 2) + sq(51, 28, 0) + '<path d="M30 40l7 6-3.5 5h-7L23 46z" fill="#e8eaf0"/></svg>';
}
const dots = (n, max, cls) => '<span class="dots ' + cls + '">' + Array.from({ length: max }, (_, i) => '<i class="' + (i < n ? 'on' : '') + '"></i>').join('') + '</span>';
function gameCard(g) {
  const live = g.status === 'live', my = myRow(g.away.nm) || myRow(g.home.nm);

    + (foot ? '<div class="g-foot">' + foot + '</div>' : '') + '</div>';
}
async function vLive() {
  main.innerHTML = '<div class="dnav"><button class="sm" id="dPrev">◀</button><div class="dt" id="dTxt">&nbsp;</div><button class="sm" id="dNext">▶</button><button class="sm" id="dToday">오늘</button></div><div id="lvBody">' + loading('경기 불러오는 중…') + '</div>';
  const ok = guard();
  const load = async () => {
    if (!ok() || S.tab !== 'live') return;
    let nextMs = 60000;
    try {
      const j = await apiLive('games', S.liveDate ? { date: S.liveDate } : {}); if (!ok() || S.tab !== 'live') return;
      LIVE.games = j.games; LIVE.nav = j.nav;
      $('dTxt').textContent = dayText(j.date) + (S.liveDate ? '' : ' (오늘)');
      $('dPrev').dataset.d = j.nav.before || ''; $('dNext').dataset.d = j.nav.after || '';
      $('dPrev').disabled = !j.nav.before; $('dNext').disabled = !j.nav.after;
      const gs = j.games.slice().sort((x, y) => (myRow(y.away.nm) || myRow(y.home.nm) ? 1 : 0) - (myRow(x.away.nm) || myRow(x.home.nm) ? 1 : 0) || (x.time || '').localeCompare(y.time || ''));
      const live = gs.filter(g => g.status === 'live').length;
      $('lvBody').innerHTML = gs.length
        ? '<div class="hint" style="margin:0 0 8px">' + (live ? '<b style="color:#ff8585">진행 중 ' + live + '경기</b> · 10초마다 자동 갱신' : '진행 중인 경기가 없어요') + ' · 경기를 누르면 상세 상황이 열려요</div>' + gs.map(gameCard).join('') + '<div class="hint">' + clock(j.at) + ' 기준 · 출처: ' + esc(j.src) + '</div>'
        : '<div class="card empty">이 날은 KBO 경기가 없어요.' + (j.nav.before || j.nav.after ? '<div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' + (j.nav.before ? '<button class="sm" data-jump="' + esc(j.nav.before) + '">이전 경기일 ' + esc(dayText(j.nav.before)) + '</button> ' : '') + (j.nav.after ? '<button class="sm" data-jump="' + esc(j.nav.after) + '">다음 경기일 ' + esc(dayText(j.nav.after)) + '</button>' : '') + '</div>' : '') + '</div>';
      nextMs = live ? 10000 : (j.games.some(g => g.status === 'pre') && !S.liveDate ? 30000 : 60000);
    } catch (e) { if (ok()) $('lvBody').innerHTML = failBox(e, 'live'); }
    if (ok() && S.tab === 'live') LIVE.timer = setTimeout(() => { if (document.hidden) { LIVE.timer = setTimeout(load, 3000); } else load(); }, nextMs);
  };
  load();
}
main.addEventListener('click', e => {
  const g = e.target.closest('.gcard[data-gid]'); if (g) return openGame(g.dataset.gid);
  if (e.target.closest('#dToday')) { S.liveDate = ''; return render(); }
  const d = e.target.closest('#dPrev,#dNext'); if (d && d.dataset.d) { S.liveDate = d.dataset.d; return render(); }
  const j = e.target.closest('[data-jump]'); if (j) { S.liveDate = j.dataset.jump; render(); }
});

/* ── 경기 상세 (진행 중이면 10초마다 갱신) ── */
const GMODES = [['bat0', '원정 타자'], ['bat1', '홈 타자'], ['pit0', '원정 투수'], ['pit1', '홈 투수'], ['notes', '경기 기록']];
let GM = { mode: 'bat0', d: null };
async function openGame(id) {
  const g0 = LIVE.games.find(x => x.id === id); if (!g0) return;
  stopDetail(); LIVE.gid = id; GM = { mode: 'bat0', d: null, g: g0 };
  $('ovGame').classList.add('show'); paintGame();
  const tick = async () => {
    if (LIVE.gid !== id) return;
    let again = 60000;
    try {
      const [d, l] = await Promise.all([apiLive('game', { id, le: g0.le, sr: g0.sr, season: g0.season }), apiLive('games', { date: g0.date })]);
      if (LIVE.gid !== id) return;
      GM.d = d; GM.err = null; GM.g = l.games.find(x => x.id === id) || GM.g; const i = LIVE.games.findIndex(x => x.id === id); if (i >= 0) LIVE.games[i] = GM.g;
      again = GM.g.status === 'live' ? 10000 : GM.g.status === 'pre' ? 30000 : 0;
    } catch (e) { GM.err = e; again = 15000; }
    paintGame();
    if (again && LIVE.gid === id) LIVE.dTimer = setTimeout(() => { if (document.hidden) LIVE.dTimer = setTimeout(tick, 3000); else tick(); }, again);
  };
  tick();
}
function innTable(g, d) {
  if (!d.inn || !d.inn.rows.length) return '<div class="hint">이닝별 스코어를 아직 받지 못했어요.</div>';
  const head = d.inn.head, n = head.length, used = d.inn.rows.reduce((m, r) => { let k = 0; for (let i = 2; i < n - 4; i++) if (r[i] && r[i] !== '-') k = i - 1; return Math.max(m, k); }, 0), show = Math.max(9, used);
  const cols = []; for (let i = 1; i < n; i++) { const hn = +head[i]; if (!(hn > show)) cols.push(i); }
  const cur = g.status === 'live' && g.inning ? 1 + g.inning : -1;
  const teams = [g.away.nm, g.home.nm];
  return '<div class="tw"><table class="itbl"><thead><tr><th>팀</th>' + cols.slice(1).map(i => '<th class="' + (i === cur ? 'cur' : '') + '">' + esc(head[i]) + '</th>').join('') + '</tr></thead><tbody>'
    + d.inn.rows.slice(0, 2).map((r, k) => '<tr><td><b>' + esc(teams[k]) + '</b><span class="rec">' + esc(r[1]) + '</span></td>' + cols.slice(1).map(i => '<td class="' + (i === cur ? 'cur' : '') + (['R', 'H', 'E', 'B'].includes(head[i]) ? ' rr' : '') + '">' + esc(r[i]) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function boxTable(t, kind) {
  if (!t || !t.rows.length) return '<div class="hint">이 기록은 아직 없어요.</div>';
  let head = t.head, rows = t.rows;
  if (kind === 'bat') {   // 이닝 열 중 비어 있는 뒤쪽 칸은 숨긴다
    const keep = head.map((h, i) => !(+h >= 1 && +h <= 12) || rows.some(r => r[i]) || +h <= 9);
    const m = x => x.filter((_, i) => keep[i]);
    head = m(head).map((h, i) => i === 0 ? '타순' : i === 1 ? '포지션' : h); rows = rows.map(m);
    return '<div class="tw"><table class="stk"><thead><tr>' + head.map((h, i) => '<th class="' + (i < 3 ? 'l' : '') + '">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((v, i) => '<td class="' + (i < 3 ? 'l' : '') + '">' + esc(i === 2 ? nm0(v) : v) + '</td>').join('') + '</tr>').join('') + (t.foot ? '<tr style="font-weight:700">' + ['TOTAL'].concat(new Array(Math.max(0, head.length - t.foot.length)).fill('')).concat(t.foot.slice(1)).map((v, i) => '<td class="' + (i < 3 ? 'l' : '') + '">' + esc(v) + '</td>').join('') + '</tr>' : '') + '</tbody></table></div>';
  }
  return '<div class="tw"><table class="stk"><thead><tr>' + head.map((h, i) => '<th class="' + (i < 1 ? 'l' : '') + '">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((v, i) => '<td class="' + (i < 1 ? 'l' : '') + '">' + esc(i === 0 ? nm0(v) : v) + '</td>').join('') + '</tr>').join('') + (t.foot ? '<tr style="font-weight:700">' + [t.foot[0]].concat(new Array(Math.max(0, head.length - t.foot.length)).fill('')).concat(t.foot.slice(1)).map((v, i) => '<td class="' + (i < 1 ? 'l' : '') + '">' + esc(v) + '</td>').join('') + '</tr>' : '') + '</tbody></table></div>';
}
function paintGame() {
  const g = GM.g, d = GM.d, live = g.status === 'live';
  const a = g.away.score, h = g.home.score;
  const liveBox = live ? '<div class="big">' + diamond(g.bases, 84) + '<div class="bso"><span>B</span>' + dots(g.cnt.b, 3, 'b') + '<span>S</span>' + dots(g.cnt.s, 2, 's') + '<span>O</span>' + dots(g.cnt.o, 2, 'o') + '</div><div class="vs"><small>투수</small><b>' + esc(nm0(g.cur && g.cur.pitcher) || '-') + '</b><small>타자</small><b>' + esc(nm0(g.cur && g.cur.batter) || '-') + '</b></div></div>'
    : (g.status === 'pre' ? '<div class="big" style="flex-direction:column;gap:4px"><div class="vs">선발 투수</div><div><b>' + esc(nm0(g.away.start) || '미정') + '</b> <span style="color:var(--sub)">vs</span> <b>' + esc(nm0(g.home.start) || '미정') + '</b></div></div>' : '');
  const meta = d && d.meta ? [d.meta.stadium, d.meta.crowd ? '관중 ' + d.meta.crowd : '', d.meta.start ? '개시 ' + d.meta.start : '', d.meta.end ? '종료 ' + d.meta.end : '', d.meta.use ? '경기시간 ' + d.meta.use : ''].filter(Boolean).join(' · ') : '';
  let box = '<div class="hint">기록을 불러오는 중…</div>';
  if (d) { const m = GM.mode, i = +m.slice(-1); box = m === 'notes' ? (d.notes.length ? '<dl class="kv">' + d.notes.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>' : '<div class="hint">경기 기록이 아직 없어요.</div>') : boxTable(m.startsWith('bat') ? d.bat[i] : d.pit[i], m.startsWith('bat') ? 'bat' : 'pit'); }
  $('gmBody').innerHTML = '<div class="sh-h"><h2>' + esc(g.away.nm) + ' vs ' + esc(g.home.nm) + '</h2><button class="sm" id="gmClose">닫기</button></div>'
    + '<div class="g-top"><span>' + esc(dayText(g.date)) + ' ' + esc(g.stadium || '') + '</span>' + badge(g) + '</div>'
    + '<div class="g-main"><div class="gt">' + logo(g.away.nm) + '<span>' + esc(g.away.nm) + '</span></div><div class="sc' + (g.status === 'end' && a > h ? ' w' : '') + '" style="font-size:38px">' + (a == null ? '-' : a) + '</div><div class="mid" style="min-width:20px;color:var(--sub)">:</div><div class="sc' + (g.status === 'end' && h > a ? ' w' : '') + '" style="font-size:38px">' + (h == null ? '-' : h) + '</div><div class="gt">' + logo(g.home.nm) + '<span>' + esc(g.home.nm) + '</span></div></div>'
    + liveBox
    + (g.status === 'end' && (g.win || g.lose || g.save) ? '<div class="g-foot" style="justify-content:center">' + (g.win ? '<span>승 <b>' + esc(nm0(g.win)) + '</b></span>' : '') + (g.lose ? '<span>패 <b>' + esc(nm0(g.lose)) + '</b></span>' : '') + (g.save ? '<span>세 <b>' + esc(nm0(g.save)) + '</b></span>' : '') + '</div>' : '')
    + '<div class="sec">이닝별 스코어</div>' + (d ? innTable(g, d) : '<div class="hint">불러오는 중…</div>')
    + '<div class="seg" id="gseg" style="margin-top:14px">' + GMODES.map(m => '<button data-gm="' + m[0] + '"' + (GM.mode === m[0] ? ' class="on"' : '') + '>' + esc(m[0] === 'bat0' ? g.away.nm + ' 타자' : m[0] === 'bat1' ? g.home.nm + ' 타자' : m[0] === 'pit0' ? g.away.nm + ' 투수' : m[0] === 'pit1' ? g.home.nm + ' 투수' : m[1]) + '</button>').join('') + '</div>' + box
    + (GM.err ? '<div class="hint warn">⚠ 최신 정보를 받지 못했어요. 마지막으로 받은 내용을 보여드려요. (' + esc(errMsg(GM.err)) + ')</div>' : '')
    + '<div class="hint">' + (d ? clock(d.at) + ' 기준' + (live ? ' · 10초마다 자동 갱신' : '') + ' · ' : '') + (meta ? esc(meta) + ' · ' : '') + '출처: KBO 공식 스코어보드·박스스코어 (투구 단위 중계는 제공하지 않아요)</div>';
}
$('gmBody').onclick = e => { if (e.target.closest('#gmClose')) { $('ovGame').classList.remove('show'); stopDetail(); return; } const b = e.target.closest('[data-gm]'); if (b) { GM.mode = b.dataset.gm; paintGame(); } };
$('ovGame').onclick = e => { if (e.target === $('ovGame')) { $('ovGame').classList.remove('show'); stopDetail(); } };

/* ── 시작 ── */
paintTeam(); render();
if (!lsGet('simkbo.asked') && !S.team) setTimeout(openTeam, 300);
</script>
</body>
</html>
