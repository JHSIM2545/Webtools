name: SIM Android APKs

on:
  push:
    paths:
      - 'android/**'
      - 'pad.html'
      - 'appmenu.js'   # SIM PAD 앱 안에 함께 들어가는 파일
      - 'ui-guard.js'
      - '**-icon-192.png'
      - 'icon-192.png'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  workflow_dispatch:

# 릴리스(버전표)를 읽고 쓰는 실행이 겹치지 않게 한 줄로 세운다
concurrency:
  group: android-apks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tools:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: launcher,  label: "SIM Tools",      page: index.html,     icon: icon-192.png,           flavor: Launcher }
          - { key: simtv,     label: "SIM TV",         page: tv.html,        icon: tv-icon-192.png,        flavor: Tool }
          - { key: note,      label: "SIM Note",       page: note.html,      icon: note-icon-192.png,      flavor: Tool }
          - { key: phone,     label: "SIM Phone",      page: phone.html,     icon: phone-icon-192.png,     flavor: Tool }
          - { key: aitel,     label: "SIM AI-Tel",     page: aitel.html,     icon: aitel-icon-192.png,     flavor: Tool }
          - { key: assistant, label: "SIM Assistant",  page: assistant.html, icon: assistant-icon-192.png, flavor: Tool }
          - { key: calendar,  label: "SIM Calendar",   page: calendar.html,  icon: calendar-icon-192.png,  flavor: Tool }
          - { key: folder,    label: "SIM Folder",     page: folder.html,    icon: folder-icon-192.png,    flavor: Tool }
          - { key: message,   label: "SIM Message",    page: message.html,   icon: message-icon-192.png,   flavor: Tool }
          - { key: kbo,       label: "SIM KBO",        page: kbo.html,       icon: kbo-icon-192.png,       flavor: Tool }
          - { key: orchestra, label: "SIM Orchestra",  page: orchestra.html, icon: orchestra-icon-192.png, flavor: Tool }
          - { key: radio,     label: "SIM Radio",      page: radio.html,     icon: radio-icon-192.png,     flavor: Tool }
          - { key: calc,      label: "SIM Calculator", page: calc.html,      icon: calc-icon-192.png,      flavor: Tool }
          - { key: map,       label: "SIM Map",        page: map.html,       icon: map-icon-192.png,       flavor: Tool }
          - { key: teams,     label: "SIM Teams",      page: teams.html,     icon: teams-icon-192.png,     flavor: Tool }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 앱 아이콘 넣기
        run: |
          mkdir -p android/shell/src/main/res/mipmap-xxxhdpi
          cp "${{ matrix.icon }}" android/shell/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: 이전 버전표 가져오기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/prev-release.sh
      - name: 비교용 빌드 (버전·시각을 고정해 내용만 비교)
        run: >
          gradle -p android :shell:assemble${{ matrix.flavor }}Debug --no-daemon --stacktrace
          -PappKey=${{ matrix.key }} "-PappLabel=${{ matrix.label }}" -PstartPage=${{ matrix.page }}
          -PverCode=1 -PbuildTime=0 -PverName=probe
      - name: 버전 정하기 (APK 내용이 바뀐 앱만 새 버전)
        id: ver
        run: |
          cp "$(find android/shell/build/outputs/apk -name '*.apk' | head -n1)" probe.apk
          .github/scripts/apk-version.sh "${{ matrix.key }}" probe.apk out android/shell/build.gradle
      - name: APK 빌드 (새 버전일 때만)
        if: steps.ver.outputs.build == '1'
        run: >
          gradle -p android :shell:assemble${{ matrix.flavor }}Debug --no-daemon --stacktrace
          -PappKey=${{ matrix.key }} "-PappLabel=${{ matrix.label }}" -PstartPage=${{ matrix.page }}
          -PverCode=${{ steps.ver.outputs.v }} -PbuildTime=${{ steps.ver.outputs.t }} -PverName=${{ steps.ver.outputs.n }}
      - name: 파일 이름 정리
        if: steps.ver.outputs.build == '1'
        run: cp "$(find android/shell/build/outputs/apk -name '*.apk' | head -n1)" out/simtools-${{ matrix.key }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.key }}
          path: |
            out/simtools-${{ matrix.key }}.apk
            out/ver-${{ matrix.key }}.json

  pad:
    name: SIM PAD (Bluetooth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 화면 파일을 앱 안에 함께 넣기 (인터넷이 없을 때 대비)
        run: |
          mkdir -p android/app/src/main/assets
          cp pad.html pad-icon-192.png ui-guard.js appmenu.js android/app/src/main/assets/
      - name: 이전 버전표 가져오기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/prev-release.sh
      - name: 비교용 빌드 (버전·시각을 고정해 내용만 비교)
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace -PverCode=1 -PbuildTime=0 -PverName=probe
      - name: 버전 정하기 (APK 내용이 바뀐 때만 새 버전)
        id: ver
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk probe.apk
          .github/scripts/apk-version.sh pad probe.apk out android/app/build.gradle
      - name: APK 빌드 (새 버전일 때만)
        if: steps.ver.outputs.build == '1'
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace -PverCode=${{ steps.ver.outputs.v }} -PbuildTime=${{ steps.ver.outputs.t }} -PverName=${{ steps.ver.outputs.n }}
      - name: 파일 이름 정리
        if: steps.ver.outputs.build == '1'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk out/simtools-pad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-pad
          path: |
            out/simtools-pad.apk
            out/ver-pad.json

  publish:
    needs: [tools, pad]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks
      - name: 릴리스로 올리기 (런처가 여기서 내려받음)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 릴리스를 지우지 않고 파일만 바꿔 올린다 → 중간에 버전표가 사라지는 순간이 없고, 안 바뀐 앱의 APK 는 그대로 남는다
          jq -s '{apps: (map({(.key): {v: .v, h: .h, t: .t, n: .n}}) | add)}' apks/ver-*.json > versions.json
          cat versions.json
          ls -la apks
          gh release view apps-latest >/dev/null 2>&1 || gh release create apps-latest --title "SIM Tools 앱 모음 (Android)" --notes "SIM Tools 런처와 각 도구의 안드로이드 앱" --latest=false
          if ls apks/*.apk >/dev/null 2>&1; then gh release upload apps-latest apks/*.apk --clobber; else echo "새로 올릴 APK 없음(모든 앱 내용이 그대로)"; fi
          gh release upload apps-latest versions.json --clobber   # 버전표는 APK 를 올린 뒤 마지막에
          if [ -f apks/simtools-pad.apk ]; then
            cp apks/simtools-pad.apk SIM-PAD.apk
            gh release view simpad-latest >/dev/null 2>&1 || gh release create simpad-latest --title "SIM PAD (Android)" --notes "차량 블루투스 마우스·키보드용 SIM PAD 앱" --latest=false
            gh release upload simpad-latest SIM-PAD.apk --clobber
          fi
