<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM Scan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="scan-icon-192.png">
<title>SIM Scan</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#d946ef; --accent2:#a21caf; --ink:#fff; --danger:#ff5d5d; --ok:#3ecf8e; --warn:#ffc46b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;overscroll-behavior:none}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:5}
header h1{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent);margin-left:-5px}
.appicon{width:30px;height:30px;border-radius:8px;display:block}
.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:22px;line-height:1}
.spacer{flex:1}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 13px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45}
button.pri{background:var(--accent);border-color:transparent;color:var(--ink);font-weight:700}
button.pri:active{background:var(--accent2)}
input[type=text],input[type=email],input[type=password],select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent)}
.pgchip{font-size:13px;padding:6px 12px;border-radius:99px;font-weight:700}
.pgchip b{color:var(--accent)}

#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.area{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#06070a}
.stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;background:#000;flex:none}
.stage video,.stage canvas.src{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stage .dim{fill:rgba(0,0,0,.3);fill-rule:evenodd}
.stage polygon{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.h{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;touch-action:none;display:grid;place-items:center;cursor:grab;z-index:3}
.h::after{content:'';width:24px;height:24px;border-radius:50%;border:3px solid #fff;background:rgba(217,70,239,.4);box-shadow:0 0 0 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.5);transition:transform .12s}
.h.drag::after{transform:scale(1.35)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.on{animation:fl .28s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.camstat{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;font-size:13px;font-weight:700;padding:6px 14px;border-radius:99px;background:rgba(15,17,23,.78);border:1px solid var(--line);white-space:nowrap;backdrop-filter:blur(4px)}
.camstat.ok{color:var(--ok);border-color:#1f5e44}
.camstat.warn{color:var(--warn)}
.tops{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;gap:8px}
.tops button{background:rgba(15,17,23,.78);backdrop-filter:blur(4px);padding:8px 11px;font-size:13px;border-radius:99px}
.tops button.on{background:var(--accent);border-color:transparent;color:var(--ink)}
.camerr{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:var(--bg)}
.camerr p{color:var(--sub);font-size:14px;line-height:1.6;max-width:420px}
.camerr .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.bar{flex:none;display:flex;align-items:center;justify-content:space-around;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.shutter{width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:var(--accent);padding:0;box-shadow:0 0 0 3px rgba(0,0,0,.5);transition:transform .1s}
.shutter:active{transform:scale(.9)}
.sidebtn{position:relative;width:58px;height:58px;border-radius:16px;padding:0;display:grid;place-items:center;font-size:24px;overflow:hidden;background:var(--panel2)}
.sidebtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sidebtn .badge{position:absolute;right:3px;top:3px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;z-index:1}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:#fffc;text-shadow:0 1px 3px #000;z-index:6;pointer-events:none;padding:0 70px}

/* 편집 */
.panel{flex:none;max-height:46%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border-radius:10px;padding:8px 6px;font-size:13.5px}
.tabs button.on{background:var(--accent);border-color:transparent;color:var(--ink);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips label{font-size:12.5px;color:var(--sub);min-width:46px}
.chips button{padding:6px 11px;font-size:13px;border-radius:99px}
.chips button.on{background:#3a1442;border-color:var(--accent);color:#f5c9ff;font-weight:700}
.chips input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.btnrow{display:flex;gap:8px}
.btnrow button{flex:1;padding:11px 8px;font-size:14.5px}
.loupe{position:absolute;top:8px;width:112px;height:112px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.6);z-index:8;pointer-events:none;background:#000}
.prevwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#1a1d27}
.prevwrap canvas{max-width:100%;max-height:100%;box-shadow:0 4px 20px rgba(0,0,0,.6);background:#fff}

/* 페이지 목록 */
.pgtop{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.pgtop .sub{color:var(--sub);font-size:13px}
.grid{flex:1;min-height:0;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;overscroll-behavior:contain}
.pc{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.pc.sel{border-color:var(--accent)}
.pc .th{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#e9edf4;cursor:pointer}
.pc .no{position:absolute;left:6px;top:6px;min-width:24px;height:24px;border-radius:12px;background:rgba(15,17,23,.82);font-size:12.5px;font-weight:800;display:grid;place-items:center;padding:0 7px}
.pc .ck{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;padding:0;background:rgba(15,17,23,.82);font-size:15px;display:grid;place-items:center}
.pc.sel .ck{background:var(--accent);border-color:transparent}
.pc .tl{display:flex;justify-content:space-between;padding:5px 6px;gap:3px}
.pc .tl button{flex:1;padding:6px 0;font-size:15px;border-radius:9px}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 10px;line-height:1.7;font-size:14px}

/* 시트 / 모달 */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:min(560px,100%);max-height:88dvh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sheet h2{font-size:17px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;padding:4px 10px;font-size:18px;background:transparent;border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;font-size:13px;line-height:1.3;text-align:center}
.tile i{font-style:normal;font-size:26px}
.tile small{color:var(--sub);font-size:11px}
.msg{font-size:13px;color:var(--sub);line-height:1.6}
.msg.err{color:var(--danger)}
.pbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:300;max-width:88vw;background:rgba(20,22,30,.96);color:#fff;border:1px solid #3b4258;border-radius:12px;padding:11px 16px;font-size:14px;text-align:center;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast a{color:#f5c9ff;font-weight:700;pointer-events:auto}
#busy{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:15px}
#busy.show{display:flex}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #fff3;border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 가로로 긴 화면(차량 디스플레이 등): 좌우 배치 */
@media (orientation:landscape) and (max-height:540px){
  #vCam,#vEdit{flex-direction:row}
  #vCam .bar{flex-direction:column;border-top:0;border-left:1px solid var(--line);padding:12px 14px;padding-right:calc(14px + env(safe-area-inset-right))}
  #vEdit .panel{width:min(44%,380px);max-height:none;border-top:0;border-left:1px solid var(--line)}
  .hint{display:none}
}
@media print{body{display:none}}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html" title="런처">‹</a>
  <h1><img class="appicon" src="scan-icon-192.png" alt="">SIM <span>Scan</span></h1>
  <div class="spacer"></div>
  <button class="pgchip" id="hdrLib">📚 보관함</button>
  <button class="pgchip" id="hdrPages">📑 <b id="hdrN">0</b>쪽</button>
</header>

<div id="views">

  <!-- ① 촬영 -->
  <section class="view" id="vCam">
    <div class="area" id="camArea">
      <div class="stage" id="camStage">
        <video id="video" playsinline muted autoplay></video>
        <div class="flash" id="flash"></div>
      </div>
      <div class="tops">
        <button id="btnTorch" hidden>🔦 플래시</button>
        <button id="btnQuick" >⚡ 바로 추가</button>
      </div>
      <div class="camerr" id="camErr" hidden>
        <div style="font-size:42px">📷</div>
        <p id="camErrT">카메라를 사용할 수 없어요.</p>
        <div class="row">
          <button class="pri" id="btnRetry">다시 시도</button>
          <button id="btnNativeCam">카메라 앱으로 촬영</button>
          <button id="btnGal2">사진 선택</button>
        </div>
      </div>
    </div>
    <div class="bar">
      <button class="sidebtn" id="btnGal" title="앨범에서 사진 선택">🖼</button>
      <button class="shutter" id="btnShot" aria-label="촬영"></button>
      <button class="sidebtn" id="btnPgs" title="스캔한 페이지"><img id="lastThumb" alt="" hidden><span id="lastIco">📑</span><span class="badge" id="pgBadge" hidden>0</span></button>
    </div>
  </section>

  <!-- ② 모서리 조정·보정 -->
  <section class="view" id="vEdit" hidden>
    <div class="area" id="edArea">
      <div class="stage" id="edStage">
        <canvas class="src" id="edCv"></canvas>
        <svg><path class="dim"></path><polygon></polygon></svg>
        <i class="h"></i><i class="h"></i><i class="h"></i><i class="h"></i>
        <canvas class="loupe" id="loupe" width="112" height="112" hidden></canvas>
      </div>
      <div class="prevwrap" id="prevWrap" hidden><canvas id="prevCv"></canvas></div>
    </div>
    <div class="panel">
      <div class="tabs"><button id="tabCrop" class="on">✂ 모서리 조정</button><button id="tabPrev">👁 결과 미리보기</button></div>
      <div class="chips" id="fltChips"><label>보정</label>
        <button data-f="doc">선명 컬러</button><button data-f="bw">흑백 문서</button><button data-f="gray">회색조</button><button data-f="orig">원본</button></div>
      <div class="chips"><label>얼룩 제거</label><input type="range" id="stain" min="0" max="100" step="5"><span id="stainV" class="msg" style="min-width:26px;text-align:right"></span></div>
      <div class="chips"><label>선명도</label><input type="range" id="sharp" min="0" max="100" step="5"><span id="sharpV" class="msg" style="min-width:26px;text-align:right"></span></div>
      <div class="chips" id="ratChips"><label>모양</label>
        <button data-r="auto">자동 보정</button><button data-r="a4">A4 비율</button><button data-r="orig">네 변 평균</button></div>
      <div class="chips"><button id="btnDetect">🎯 모서리 다시 찾기</button><button id="btnFull">⬜ 전체 선택</button><button id="btnRotE">↻ 회전</button></div>
      <div class="btnrow"><button id="edCancel">취소</button><button class="pri" id="edOk">✔ 적용</button></div>
    </div>
  </section>

  <!-- ④ 보관함 -->
  <section class="view" id="vLib" hidden>
    <div class="pgtop"><button id="libBack">‹ 돌아가기</button><button class="pri" id="libNew">＋ 새 스캔</button></div>
    <div class="grid" id="libGrid"></div>
  </section>

  <!-- ③ 페이지 목록·보내기 -->
  <section class="view" id="vPages" hidden>
    <div class="pgtop">
      <button id="pgBack">📷 더 스캔</button>
      <button id="pgAll">전체 선택</button>
      <span class="sub" id="pgSub"></span>
      <div class="spacer"></div>
      <button id="pgDelSel" title="선택한 페이지 삭제">🗑</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="bar"><button class="pri" id="btnExport" style="flex:1;padding:14px;font-size:16px">📤 보내기 · 저장</button></div>
  </section>
</div>

<!-- 보내기 시트 -->
<div class="modal" id="mExp">
  <div class="sheet">
    <h2>📤 보내기 · 저장 <small class="msg" id="expN"></small><button class="x" data-close="mExp">✕</button></h2>
    <div><div class="msg" style="margin-bottom:5px">파일 이름</div><input type="text" id="expName" maxlength="80" autocomplete="off"></div>
    <div class="chips" id="fmtChips"><label>형식</label><button data-fmt="pdf">📄 PDF (여러 장 하나로)</button><button data-fmt="jpg">🖼 JPG</button><button data-fmt="png">🖼 PNG</button></div>
    <div class="tiles">
      <button class="tile" id="dPrint"><i>🖨</i>프린터 출력</button>
      <button class="tile" id="dNote"><i>📝</i>노트로 보내기</button>
      <button class="tile" id="dDevice"><i>📱</i>내 파일에 저장</button>
      <button class="tile" id="dFolder"><i>🗂</i>SIM Folder에 저장</button>
      <button class="tile" id="dShare" hidden><i>↗</i>다른 앱으로 공유</button>
    </div>
    <div class="pbar" id="expBar" hidden><i></i></div>
    <div class="msg" id="expMsg"></div>
  </div>
</div>

<!-- SIM Folder 저장 시트 -->
<div class="modal" id="mFold">
  <div class="sheet">
    <h2>🗂 SIM Folder에 저장 <button class="x" data-close="mFold">✕</button></h2>
    <div id="fLogin" hidden>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input type="email" id="fEm" placeholder="이메일" autocomplete="username">
        <input type="password" id="fPw" placeholder="비밀번호" autocomplete="current-password">
        <button class="pri" id="fLoginBtn">로그인</button>
      </div>
    </div>
    <div id="fPick" hidden>
      <div class="msg" style="margin-bottom:5px">저장할 폴더</div>
      <select id="fSel"></select>
      <div class="msg" id="fWho" style="margin-top:8px"></div>
      <button class="pri" id="fSave" style="margin-top:10px;width:100%;padding:13px">여기에 저장</button>
    </div>
    <div class="pbar" id="fBar" hidden><i></i></div>
    <div class="msg" id="fMsg"></div>
  </div>
</div>

<div id="busy"><div class="spin"></div><div id="busyT">처리 중…</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>
<input type="file" id="fileAny" hidden>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lget = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

let toastT = 0;
function toast(html, ms) {
  const t = $('toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), ms || 2600);
  t.style.pointerEvents = /<a /.test(html) ? 'auto' : 'none';
}
function busy(msg) { $('busyT').textContent = msg || '처리 중…'; $('busy').classList.add('show'); }
function unbusy() { $('busy').classList.remove('show'); }
const canvasBlob = (c, type, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), type || 'image/jpeg', q == null ? 0.92 : q));
const newCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ───────── 설정 (이 기기에만 저장) ───────── */
const S = Object.assign({ filter: 'doc', sharp: 50, stain: 60, ratio: 'auto', quick: false, fmt: 'pdf' }, (() => { try { return JSON.parse(lget('simscan.v1') || '{}'); } catch (e) { return {}; } })());
const saveS = () => lset('simscan.v1', JSON.stringify(S));

/* ═════════════ 문서 모서리 자동 인식 ═════════════ */
function blur1(src, dst, W, H, r, horiz) {     // 상자 평균 1방향 (가장자리는 끝 값 반복)
  const n = 2 * r + 1;
  if (horiz) {
    for (let y = 0; y < H; y++) {
      const row = y * W; let sum = 0;
      for (let x = -r; x <= r; x++) sum += src[row + Math.min(W - 1, Math.max(0, x))];
      for (let x = 0; x < W; x++) { dst[row + x] = sum / n; sum += src[row + Math.min(W - 1, x + r + 1)] - src[row + Math.max(0, x - r)]; }
    }
  } else {
    for (let x = 0; x < W; x++) {

/* 인쇄 */
async function printPages(list, base) {

    const pdf = await buildPdf(list, base), path = await nativeWrite(base + '.pdf', 'application/pdf', pdf, 'cache');
    NF.print(path, base); return '인쇄 창을 열었어요';
  }
  const urls = list.map(p => URL.createObjectURL(p.blob));
  const fr = document.createElement('iframe'); fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(fr);
  const d = fr.contentDocument; d.open();
  d.write('<!doctype html><meta charset="utf-8"><title>' + esc(base) + '</title><style>@page port{size:A4 portrait;margin:0}@page land{size:A4 landscape;margin:0}*{margin:0;padding:0}body{background:#fff}.p{box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:6mm;page-break-after:always;break-after:page;overflow:hidden}.p.port{page:port;width:210mm;height:296.5mm}.p.land{page:land;width:297mm;height:209.5mm}.p img{max-width:100%;max-height:100%;object-fit:contain}.p:last-child{page-break-after:auto;break-after:auto}</style>' +
    list.map((p, i) => '<div class="p ' + (p.w > p.h ? 'land' : 'port') + '"><img src="' + urls[i] + '"></div>').join(''));
  d.close();
  await Promise.all([...d.images].map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve()));
  await sleep(200);
  const w = fr.contentWindow; w.focus(); w.print();
  setTimeout(() => { fr.remove(); urls.forEach(u => URL.revokeObjectURL(u)); }, 120000);
  return '인쇄 창을 열었어요';
}

/* 노트로 보내기: SIM Note 의 저장소(simmemo)에 새 노트로 직접 넣는다 */
const DW = 1240;
const imgDataUrl = (blob, long, q) => new Promise(async (res, rej) => {
  try {
    const bmp = await createImageBitmap(blob), k = Math.min(1, long / Math.max(bmp.width, bmp.height)), c = newCanvas(Math.round(bmp.width * k), Math.round(bmp.height * k));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); if (bmp.close) bmp.close(); res({ url: c.toDataURL('image/jpeg', q), w: c.width, h: c.height, c });
  } catch (e) { rej(e); }
});
function openNotesDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('simmemo', 1); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('notes')) r.result.createObjectStore('notes', { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function sendToNote(list, title) {
  const np = [];
  for (let i = 0; i < list.length; i++) {
    setExpMsg('노트 페이지 만드는 중… ' + (i + 1) + ' / ' + list.length);
    const im = await imgDataUrl(list[i].blob, 1800, 0.85), port = im.w <= im.h, w = port ? DW : Math.round(DW * im.w / im.h), h = port ? Math.round(DW * im.h / im.w) : DW;
    np.push({ w, h, bg: { type: 'image', img: im.url, fit: 'contain' }, strokes: [], texts: [], images: [] });
    if (i === 0) var first = im.c;
  }
  const tc = newCanvas(240, 340), g = tc.getContext('2d'); g.fillStyle = '#e9edf4'; g.fillRect(0, 0, 240, 340);
  const p0 = np[0], k = Math.min(236 / p0.w, 336 / p0.h), ox = (240 - p0.w * k) / 2, oy = (340 - p0.h * k) / 2; g.fillStyle = '#fff'; g.fillRect(ox, oy, p0.w * k, p0.h * k);
  const kk = Math.min(p0.w * k / first.width, p0.h * k / first.height); g.drawImage(first, (240 - first.width * kk) / 2, (340 - first.height * kk) / 2, first.width * kk, first.height * kk);
  const now = Date.now(), note = { id: 'n' + now.toString(36) + Math.random().toString(36).slice(2, 6), title, created: now, updated: now, thumb: tc.toDataURL('image/jpeg', 0.7), assets: {}, pages: np, folder: '', fav: false };
  const db = await openNotesDB();
  await new Promise((res, rej) => { const tx = db.transaction('notes', 'readwrite'); tx.objectStore('notes').put(note); tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
  db.close();
  let synced = null; try { if (window.simSync && simSync.sync) synced = await Promise.race([simSync.sync(), sleep(8000).then(() => 'timeout')]); } catch (e) {}
  return { id: note.id, synced };
}

let exporting = false;
async function runExport(kind) {
  if (exporting) return; const list = selPages(); if (!list.length) return; const base = safeName($('expName').value); exporting = true;
  document.querySelectorAll('.tile').forEach(t => { t.disabled = true; });
  try {
    if (kind === 'print') { setExpMsg('인쇄 준비 중…'); const m = await printPages(list, base); setExpMsg(m); }
    else if (kind === 'note') {
      const r = await sendToNote(list, base); $('mExp').classList.remove('show');

    } else {

}
