<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM Map">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="map-icon-192.png">
<title>SIM Map</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#ff7849; --accent2:#e5572a; --danger:#ff5d5d; --ok:#3ecf8e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
a{color:inherit}

header{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:17px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent);margin-left:-5px}
.appicon{width:28px;height:28px;border-radius:8px;display:block}
.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:20px;line-height:1;flex:none}
.spacer{flex:1}
.hbtn{padding:6px 10px;font-size:13px}

#srow{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#srow input{flex:1;min-width:0}
#srow select{width:auto;flex:none;padding:9px 6px}

#stage{flex:1;min-height:0;display:flex;flex-direction:column}
#mapwrap{position:relative;flex:1;min-height:0;background:#1a1e2a}
#map{position:absolute;inset:0}
#mapmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:#141824;z-index:4;color:var(--sub);font-size:14px;line-height:1.6}
#mapmsg.on{display:flex}
#mapmsg .in{max-width:340px;display:flex;flex-direction:column;gap:8px}
.fab{position:absolute;right:10px;z-index:3;width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#fabLoc{bottom:62px}
#fabAdd{bottom:10px;background:var(--accent);border-color:var(--accent);color:#fff;font-size:26px;font-weight:300}
#pickbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;display:none;gap:10px;align-items:center;background:var(--accent);color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.5);white-space:nowrap}
#pickbar.on{display:flex}
#pickbar button{background:rgba(0,0,0,.25);border:0;color:#fff;padding:4px 10px;border-radius:999px}

#dock{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:height .18s}
#dock.s0{height:96px}
#dock.s1{height:44%}
#dock.s2{height:78%}
#handle{height:20px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;border:0;padding:0;width:100%}
#handle i{display:block;width:44px;height:4px;border-radius:2px;background:#444b60}
#dtabs{display:flex;gap:6px;padding:0 12px 8px;flex:none}
#dtabs button{flex:1;padding:6px 8px;font-size:13px}
#dtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#dbody{flex:1;min-height:0;overflow-y:auto;padding:0 12px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;flex:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;font-size:13px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--panel2);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.n{background:var(--accent);color:#fff;font-weight:800;font-size:17px;border-radius:50%;width:34px;height:34px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;color:var(--sub);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .meta{color:var(--sub);font-size:12px;margin-top:2px}
.acts{display:flex;gap:5px;flex:none}
.acts a,.acts button{font-size:12px;padding:6px 9px;border-radius:8px;text-decoration:none;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.acts .sv{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.acts .nv{background:#03c75a;border-color:#03c75a;color:#fff}
.hint{color:var(--sub);font-size:12px;line-height:1.55;padding:6px 0}
.hint.warn{color:#ffb38f}
.empty{color:var(--sub);text-align:center;padding:26px 10px;font-size:14px;line-height:1.7}
.anchor{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:13px;line-height:1.5}
.anchor b{color:var(--accent)}
.more{width:100%;margin-top:8px}
.row.hi{background:rgba(255,120,73,.12)}
.star{color:#ffc94d;letter-spacing:1px}

/* 팝업 (ui-guard.js 가 .ov 를 모달로 잠가요) */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.ov.pop{z-index:60}
.card{width:min(100%,560px);max-height:92dvh;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.card>header{position:static;padding:12px 14px;border-radius:0;justify-content:space-between}
.card>header b{font-size:16px}
.cbody{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.cfoot{display:flex;gap:8px;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none}
.cfoot button{flex:1}
label.lb{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.fld{display:flex;flex-direction:column}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button,.btns a{font-size:13px;padding:7px 10px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:26px;padding:0 2px;color:#444b60;line-height:1}
.stars button.on{color:#ffc94d}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel2);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button.x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;padding:0;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:22px}
.ph.add{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--sub);border:1px dashed var(--line)}
.ph.add input{display:none}
.au{display:flex;gap:8px;align-items:center}
.au audio{flex:1;min-width:0;height:38px}
.au .x{flex:none;width:30px;height:30px;padding:0}
.rec{display:flex;gap:10px;align-items:center}
.rec.on button{background:var(--danger);border-color:var(--danger);color:#fff}
.rec span{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{text-align:left;padding:8px 10px;border-radius:10px;display:block;width:100%}
.cand b{display:block;font-size:14px}
.cand small{color:var(--sub);font-size:12px}
.gps{font-size:13px;color:var(--sub);line-height:1.6}
.gps b{color:var(--text)}
#dPhotos{display:flex;gap:6px;overflow-x:auto}
#dPhotos img{height:120px;border-radius:10px;flex:none;cursor:pointer}
.dline{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.lnk{font-size:13px;padding:8px 12px;border-radius:8px;text-decoration:none;border:1px solid var(--line);background:var(--panel2);display:inline-block}
.lnk.navi{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}
.lnk.kakao{background:#fee500;border-color:#fee500;color:#191919;font-weight:700}
#ovPhoto{background:rgba(0,0,0,.92);align-items:center}
#ovPhoto img{max-width:100%;max-height:100dvh;object-fit:contain}

/* 지도 위 표시 */
.rmk{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid #fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
.rmk.on{background:#fff;color:var(--accent2);border-color:var(--accent)}
.amk{background:#1b64f2;color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;border:2px solid #fff;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.me{width:16px;height:16px;border-radius:50%;background:#2f7bff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,255,.28)}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#000c;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* 가로로 길고 세로가 짧은 화면(차량 디스플레이 등): 지도 좌, 목록 우 */
@media (orientation:landscape) and (max-height:520px){
  #stage{flex-direction:row}
  #dock,#dock.s0,#dock.s1,#dock.s2{height:auto;width:44%;border-top:0;border-left:1px solid var(--line)}
  #handle{display:none}
  #dtabs{padding-top:8px}
  .card{border-radius:14px;max-height:96dvh}
  .ov{align-items:center}
  .toast{bottom:20px}
}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="런처로">‹</a>
  <h1><img class="appicon" src="map-icon-192.png" alt="">SIM <span>Map</span></h1>
  <div class="spacer"></div>
  <button class="hbtn" id="hKey" title="카카오 지도 키 설정">⚙</button>
</header>

<div id="srow">
  <input id="q" type="search" placeholder="예) 00골프장 인근 아침식사 맛집" enterkeyhint="search" autocomplete="off">
  <select id="rad" aria-label="검색 반경">
    <option value="1000">1km</option><option value="3000">3km</option><option value="5000" selected>5km</option><option value="10000">10km</option><option value="20000">20km</option>
  </select>
  <button class="primary" id="go">검색</button>
</div>

<div id="stage">
  <div id="mapwrap">
    <div id="map"></div>
    <div id="mapmsg"><div class="in" id="mapmsgIn"></div></div>
    <div id="pickbar"><span>지도를 눌러 위치를 정하세요</span><button id="pickCancel">취소</button></div>
    <button class="fab" id="fabLoc" aria-label="내 위치">⌖</button>
    <button class="fab" id="fabAdd" aria-label="장소 등록">＋</button>
  </div>
  <section id="dock" class="s1">
    <button id="handle" aria-label="목록 크기"><i></i></button>
    <div id="dtabs"><button id="tMy" class="on">내 장소</button><button id="tRes">검색 결과</button></div>
    <div id="dbody"></div>
  </section>
</div>

<!-- 장소 등록·수정 -->
<div class="ov" id="ovEdit">
  <div class="card">
    <header><b id="eTitle">장소 등록</b><button id="eClose">닫기</button></header>
    <div class="cbody">
      <div class="fld"><label class="lb">이름</label><input id="eName" placeholder="맛집·명소 이름" maxlength="60"></div>
      <div class="fld"><label class="lb">종류</label><div class="cats" id="eCats"></div></div>
      <div class="fld">
        <label class="lb">위치</label>
        <div class="gps" id="eGps">위치를 지정해 주세요.</div>
        <div class="btns" style="margin-top:6px">
          <button id="eLocate">📍 현재 위치로</button>
          <button id="ePick">🗺️ 지도에서 선택</button>
          <button id="eFind">🔍 이름으로 찾기</button>
        </div>
        <div class="cands" id="eCands" style="margin-top:6px"></div>
      </div>
      <div class="fld"><label class="lb">주소</label><input id="eAddr" placeholder="주소 (위치를 잡으면 자동 입력)"></div>
      <div class="fld"><label class="lb">별점</label><div class="stars" id="eStars"></div></div>
      <div class="fld"><label class="lb">메모</label><textarea id="eMemo" placeholder="메뉴, 분위기, 주차, 같이 간 사람 등"></textarea></div>
      <div class="fld"><label class="lb">사진</label><div class="photos" id="ePhotos"></div></div>
      <div class="fld"><label class="lb">음성 메모</label>
        <div id="eAudio" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="rec" id="eRec" style="margin-top:8px"><button id="recBtn">● 녹음 시작</button><span id="recT"></span></div>
      </div>
    </div>
    <div class="cfoot"><button class="danger" id="eDel" hidden>삭제</button><button class="primary" id="eSave">저장</button></div>
  </div>
</div>

<!-- 장소 상세 -->
<div class="ov" id="ovDetail">
  <div class="card">
    <header><b id="dName"></b><button id="dClose">닫기</button></header>
    <div class="cbody" id="dBody"></div>
    <div class="cfoot"><button id="dNear">📍 인근 찾기</button><button id="dEdit">수정</button></div>
  </div>
</div>

<!-- 기준 장소 다시 고르기 -->
<div class="ov" id="ovAnchor">
  <div class="card">
    <header><b>기준 장소 선택</b><button id="aClose">닫기</button></header>
    <div class="cbody"><div class="cands" id="aList"></div></div>
  </div>
</div>

<div class="ov pop" id="ovPhoto"><img id="bigPhoto" alt=""></div>
<div class="toast" id="toast"></div>

<script src="ui-guard.js" defer></script>
<script src="sync.js?bg=1" defer></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lget = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 2400); }
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const CATS = [{ k: '맛집', e: '🍽️' }, { k: '카페', e: '☕' }, { k: '명소', e: '🏞️' }, { k: '골프', e: '⛳' }, { k: '숙소', e: '🛏️' }, { k: '기타', e: '📍' }];
const catEmoji = k => (CATS.find(c => c.k === k) || CATS[5]).e;
const GROUP_CAT = { FD6: '맛집', CE7: '카페', AT4: '명소', AD5: '숙소', CT1: '명소' };
const guessCat = r => { const t = (r.category_name || '') + ' ' + (r.place_name || ''); if (/골프/.test(t)) return '골프'; return GROUP_CAT[r.category_group_code] || '기타'; };

/* ───────── 저장소 (IndexedDB 'simmap' — sync.js 가 계정으로 동기화) ───────── */
let db = null, memOnly = false, places = [];
const openDB = () => new Promise((res, rej) => {
  let r; try { r = indexedDB.open('simmap', 1); } catch (e) { return rej(e); }
  r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('places')) r.result.createObjectStore('places', { keyPath: 'id' }); };
  r.onsuccess = () => { r.result.onversionchange = () => r.result.close(); res(r.result); };
  r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
});
let syncT = 0;
function syncSoon() { clearTimeout(syncT); syncT = setTimeout(() => { try { if (window.simSync && simSync.sync) simSync.sync().catch(() => {}); } catch (e) {} }, 2500); }
const idbAll = () => new Promise((res, rej) => { const q = db.transaction('places', 'readonly').objectStore('places').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const idbPut = v => new Promise((res, rej) => { const q = db.transaction('places', 'readwrite').objectStore('places').put(v); q.onsuccess = () => { res(); syncSoon(); }; q.onerror = () => rej(q.error); });
const idbDel = id => new Promise((res, rej) => { const q = db.transaction('places', 'readwrite').objectStore('places').delete(id); q.onsuccess = () => { res(); syncSoon(); }; q.onerror = () => rej(q.error); });
async function loadPlaces() {
  if (memOnly) return;
  try { if (!db) db = await openDB(); places = await idbAll(); }
  catch (e) { db = null; memOnly = true; }
  refreshAll();
}
async function savePlace(p) {
  const i = places.findIndex(x => x.id === p.id); if (i >= 0) places[i] = p; else places.push(p);
  if (!memOnly) { try { await idbPut(p); } catch (e) { memOnly = true; toast('이 기기에 저장하지 못했어요 (이번 접속 동안만 유지)'); } }
}
async function removePlace(id) {
  places = places.filter(x => x.id !== id);
  if (!memOnly) { try { await idbDel(id); } catch (e) {} }
}
window.addEventListener('simsync', () => { if (!document.querySelector('.ov.on')) loadPlaces(); });

/* ───────── 공통: 거리·링크 ───────── */
const rad = x => x * Math.PI / 180;
function dist(a, b) { const R = 6371000, dLa = rad(b.lat - a.lat), dLn = rad(b.lng - a.lng), s = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(s)); }
const fmtDist = m => m == null || !isFinite(m) ? '' : m < 1000 ? Math.round(m) + 'm' : (m / 1000).toFixed(1) + 'km';
const UA = navigator.userAgent, IS_ANDROID = /Android/i.test(UA), IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), MOBILE = IS_ANDROID || IS_IOS;
const NAVER_APP = encodeURIComponent(location.origin && location.origin !== 'null' ? location.origin + location.pathname : 'simmap');
const launchHref = u => IS_ANDROID ? 'intent://' + u.slice(7) + '#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end' : u;
function naviHref(lat, lng, name) {   // 네이버 내비: 휴대폰은 앱 실행, PC는 네이버 지도 웹
  const nm = String(name || '').replace(/[,\r\n]+/g, ' ').trim();
  if (!MOBILE) return 'https://map.naver.com/p/search/' + encodeURIComponent(nm);

/* ───────── 자연어 검색: "00골프장 인근 아침식사 맛집 찾아줘" ───────── */
const CAT_HINT = [[/맛집|식당|밥|식사|점심|저녁|아침|브런치|해장|국밥|고기|횟집|분식|중식|일식|한식|양식/, 'FD6', '식당'], [/카페|커피|디저트|베이커리|빵/, 'CE7', '카페'], [/숙소|호텔|펜션|숙박|리조트|모텔/, 'AD5', '숙박'], [/명소|관광|볼거리|구경|여행/, 'AT4', '관광명소'], [/주차/, 'PK6', '주차장'], [/주유/, 'OL7', '주유소'], [/편의점/, 'CS2', '편의점'], [/약국/, 'PM9', '약국'], [/병원/, 'HP8', '병원']];
function parseQuery(raw) {
  let s = String(raw || '').trim().replace(/\s+/g, ' ');
  s = s.replace(/\s*(찾아\s*줘|찾아\s*주세요|찾아\s*봐|알려\s*줘|알려\s*주세요|검색\s*해\s*줘|검색|추천\s*해\s*줘|추천\s*해\s*주세요|추천)\s*[.!?~]*$/, '').trim();
  let m = /^(.+?)\s*(?:에서\s*)?(?:인근|근처|주변|부근|근방)\s*(?:의|에서|에\s*있는)?\s*(.*)$/.exec(s) || /^(.+?)\s+(?:에서\s*)?(?:가까운|옆|앞)\s*(.*)$/.exec(s);
  if (m && m[1] && !/^(내|여기|현재|지금)$/.test(m[1].trim())) return { anchor: m[1].trim(), kw: (m[2] || '').trim() || '맛집', mode: 'anchor' };
  m = /^(?:내\s*|여기\s*|현재\s*|지금\s*)?(?:인근|근처|주변|부근|근방|가까운)\s*(?:의|에서|에\s*있는)?\s*(.*)$/.exec(s);
  if (m) return { anchor: '', kw: (m[1] || '').trim() || '맛집', mode: 'here' };

}
function triesFor(kwText) {   // 키워드 → 단계별 검색 (결과가 적으면 단어 쪼개기 → 분류 코드)
  const words = kwText.split(' ').filter(Boolean), tries = [{ q: kwText }];
  if (words.length > 1) words.forEach(w => { if (!tries.some(t => t.q === w)) tries.push({ q: w }); });
  for (const [re, code, label] of CAT_HINT) if (re.test(kwText)) { tries.push({ code, label }); break; }
  return tries;
}
let RES = { items: [], anchor: null, cands: [], pg: null, note: '', saved: [], raw: '', mode: '', kw: '' }, resHi = -1;
async function findAnchor(text) {

  const base = myPos || (map ? { lat: map.getCenter().getLat(), lng: map.getCenter().getLng() } : DEFAULT_CENTER);
  const r = await kwSearch(text, { location: LL(base.lat, base.lng), size: 10 });
  const cands = okSt(r.st) ? r.d.map(toItem) : [];
  if (mine) { const mi = { id: 'mine:' + mine.id, name: mine.name, addr: mine.addr, lat: mine.lat, lng: mine.lng, mine: true }; return { anchor: mi, cands: [mi].concat(cands.slice(0, 5)), st: r.st }; }
  return { anchor: cands[0] || null, cands: cands.slice(0, 6), st: r.st };
}
async function nearby(anchor, kwText, radius) {
  const loc = LL(anchor.lat, anchor.lng), tries = triesFor(kwText); let best = null;
  const noteOf = (t, i) => i === 0 ? '' : t.q ? '"' + kwText + '" 결과가 적어 "' + t.q + '"(으)로 넓혀 찾았어요.' : '"' + kwText + '" 결과가 적어 "' + t.label + '" 분류 전체를 거리순으로 보여드려요.';
  for (let i = 0; i < tries.length; i++) {

    const r = t.q ? await kwSearch(t.q, opt, more) : await catSearch(t.code, opt, more);
    if (r.st === 'NOMAP') return { items: [], note: '', pg: null, st: 'NOMAP' };
    if (!okSt(r.st) || !r.d.length) continue;
    if (r.d.length >= 3) return { items: r.d.map(toItem), note: noteOf(t, i), pg: r.pg, st: r.st };   // 충분하면 여기서 멈춤
    if (!best) best = { items: r.d.map(toItem), note: noteOf(t, i), pg: r.pg, st: r.st };           // 적게 나온 첫 결과는 보관

let searching = false;
async function runSearch(raw) {

  searching = true; $('go').disabled = true;

    if (p.mode === 'anchor') {

      const words = p.kw.split(' ').filter(Boolean);
      RES.saved = places.filter(x => isFinite(x.lat) && dist(RES.anchor, x) <= radius && words.some(w => (x.name + ' ' + (x.memo || '') + ' ' + x.cat).includes(w))).sort((a, b) => dist(RES.anchor, a) - dist(RES.anchor, b));
    } else {

      const r = await kwSearch(p.kw, { location: LL(c.lat, c.lng), size: 15 }, d => { RES.items = RES.items.concat(d.map(toItem)); renderRes(); });
      RES.items = okSt(r.st) ? r.d.map(toItem) : []; RES.pg = r.pg;

  finally { searching = false; $('go').disabled = false; }
}

  } catch (e) { if (ED) renderGps(); toast(e.message, 3800); }
  finally { $('eLocate').disabled = false; }

async function nearPoi(lat, lng) {
  if (!KOK) return [];
  const opt = { location: LL(lat, lng), radius: 150, sort: SV().SortBy.DISTANCE, size: 5 };
  const rs = await Promise.all(['FD6', 'CE7', 'AT4', 'CT1', 'AD5'].map(c => catSearch(c, opt)));
  const seen = new Set(), out = [];
  rs.forEach(r => { if (okSt(r.st)) r.d.forEach(x => { if (!seen.has(x.id)) { seen.add(x.id); out.push(toItem(x)); } }); });
  return out.sort((a, b) => (a.dist || 0) - (b.dist || 0)).slice(0, 6);
}

/* 사진 */
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('img'));
      im.onload = () => {
        const M = 1280, k = Math.min(1, M / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.72));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 음성 메모 */
let MR = null, recChunks = [], recT0 = 0, recTick = 0, recKeep = true;
const blobToUrl = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); });
const fmtSec = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
async function startRec() {
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('이 기기에서는 녹음을 지원하지 않아요'); return; }
  if (ED.audio.length >= 5) { toast('음성 메모는 장소당 5개까지예요'); return; }
  let st; try { st = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { toast('마이크 권한이 필요해요. 설정에서 허용해 주세요', 3600); return; }
  const mt = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  recChunks = []; recKeep = true;
  try { MR = new MediaRecorder(st, mt ? { mimeType: mt } : undefined); } catch (e) { st.getTracks().forEach(t => t.stop()); toast('녹음을 시작하지 못했어요'); return; }
  MR.ondataavailable = ev => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
  MR.onstop = async () => {
    clearInterval(recTick); st.getTracks().forEach(t => t.stop());
    const keep = recKeep, mr = MR, dur = Math.max(1, Math.round((Date.now() - recT0) / 1000)); MR = null;
    $('eRec').classList.remove('on'); $('recBtn').textContent = '● 녹음 시작'; $('recT').textContent = '';
    if (!keep || !recChunks.length || !ED) return;
    try { const url = await blobToUrl(new Blob(recChunks, { type: mr.mimeType || mt || 'audio/webm' })); ED.audio.push({ id: uid(), url, dur, at: new Date().toISOString() }); renderMedia(); toast('음성 메모를 추가했어요 (' + fmtSec(dur) + ')'); }
    catch (e) { toast('녹음을 저장하지 못했어요'); }
  };
  MR.start(); recT0 = Date.now(); $('eRec').classList.add('on'); $('recBtn').textContent = '■ 녹음 끝내기';
  recTick = setInterval(() => { const s = Math.round((Date.now() - recT0) / 1000); $('recT').textContent = '녹음 중 ' + fmtSec(s); if (s >= 180) stopRec(); }, 250);
}
function stopRec(discard) { if (!MR) return; recKeep = !discard; try { MR.stop(); } catch (e) { MR = null; } }
$('recBtn').onclick = () => { if (MR) stopRec(); else startRec(); };
