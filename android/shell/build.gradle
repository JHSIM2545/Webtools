plugins {
    id 'com.android.application'
}

// 같은 코드로 '런처 앱'과 '도구별 앱'을 만든다. 값은 빌드할 때 -P 로 넘긴다.
//   예) gradle :shell:assembleToolDebug -PappKey=tv -PappLabel="SIM TV" -PstartPage=tv.html
def appKey    = (project.findProperty('appKey') ?: 'launcher') as String
def appLabel  = (project.findProperty('appLabel') ?: 'SIM Tools') as String
def startPage = (project.findProperty('startPage') ?: 'index.html') as String
def verCode   = (project.findProperty('verCode') ?: '1') as int

android {
    namespace 'kr.simtools.shell'
    compileSdk 34

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "kr.simtools.${appKey}"
        minSdk 28
        targetSdk 34
        versionCode verCode
        versionName '1.0'
        buildConfigField 'String', 'START_URL', "\"https://jhsim2545.github.io/Webtools/${startPage}\""
        resValue 'string', 'app_name', appLabel
        // 연락처 공유 수신은 SIM Phone 앱에서만, 폰 연락처 읽기(READ_CONTACTS)는 SIM Message·SIM Assistant 앱에서만
        manifestPlaceholders = [shareEnabled: (appKey == 'phone') ? 'true' : 'false',
                                contactsPerm: (appKey == 'message' || appKey == 'assistant') ? 'android.permission.READ_CONTACTS' : 'android.permission.ACCESS_NETWORK_STATE']
        buildConfigField 'boolean', 'CONTACTS', (appKey == 'message' || appKey == 'assistant') ? 'true' : 'false'
    }

    flavorDimensions 'role'
    productFlavors {
        launcher { dimension 'role'; buildConfigField 'boolean', 'IS_LAUNCHER', 'true' }
        tool { dimension 'role'; buildConfigField 'boolean', 'IS_LAUNCHER', 'false' }
    }

    signingConfigs {
        sim {
            storeFile file('../sim-release.jks')
            storePassword 'SimTools2026x'
            keyAlias 'sim'
            keyPassword 'SimTools2026x'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.sim }
        release { minifyEnabled false; signingConfig signingConfigs.sim }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
