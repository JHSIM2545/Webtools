<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM Tools">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SIM Tools</title>
<script>
/* 안드로이드 앱의 구글 로그인: app-login.html 로 시작한 브라우저가 여기로 돌아오면 로그인 정보를 SIM Tools 앱으로 넘기고 브라우저에는 남기지 않는다 */
(function () {
  try {
    var h = location.hash || '', t = +localStorage.getItem('simapp_oauth') || 0;
    if (window.SimLauncher || !t || Date.now() - t > 15 * 60e3 || !/access_token=/.test(h) || !/refresh_token=/.test(h)) return;
    localStorage.removeItem('simapp_oauth');
    var p = new URLSearchParams(h.slice(1));
    var url = 'intent://auth?access_token=' + encodeURIComponent(p.get('access_token')) + '&refresh_token=' + encodeURIComponent(p.get('refresh_token')) + '#Intent;scheme=kr.simtools.launcher;package=kr.simtools.launcher;end';
    window.__simHandoff = url;
    history.replaceState(null, '', location.pathname + location.search);
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#0f1117;color:#e8eaf0;font-family:sans-serif"><div><div style="font-size:42px">✅</div><h2 style="margin:10px 0 6px;font-size:18px">구글 로그인 완료</h2><p style="margin:0 0 16px;color:#8b92a8;font-size:14px;line-height:1.5">SIM Tools 앱으로 돌아가는 중이에요.<br>자동으로 열리지 않으면 아래 버튼을 눌러 주세요.</p><a href="' + url + '" style="display:inline-block;padding:11px 20px;border-radius:10px;background:#2f6fe8;color:#fff;text-decoration:none;font-weight:600">SIM Tools 앱으로 돌아가기</a></div></div>';
    });
    location.href = url;
  } catch (e) {}
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#4f8cff; --accent2:#2f6fe8; --ok:#3ecf8e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .logo{width:32px;height:32px;border-radius:9px;display:block}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
header h1 span{color:var(--accent)}
.spacer{flex:1}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
.hello{margin:6px 2px 14px}
.hello h2{font-size:20px;letter-spacing:-.3px}
.hello p{margin-top:4px;color:var(--sub);font-size:14px}
.search input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
a.card,.card.ghost{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:inherit;min-height:150px}
a.card{transition:transform .12s,border-color .12s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card:active{transform:scale(.98)}
a.card.dragging{position:relative;z-index:30;transition:none;pointer-events:none;border-color:var(--accent);box-shadow:0 16px 36px rgba(0,0,0,.6);opacity:.97}
body.dragmode,body.dragmode *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
body.moveon a.card{touch-action:none}
.reorder{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--sub)}
.reorder:empty{display:none}
.reorder button{padding:2px 10px;font-size:12px;border-radius:99px}
.card .ico{width:52px;height:52px;border-radius:14px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex:none}
.card .ico img{width:100%;height:100%;object-fit:cover;display:block}
.card .name{font-size:16px;font-weight:700}
.card .desc{font-size:13px;color:var(--sub);line-height:1.45}
.card .tag{margin-top:auto;align-self:flex-start;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid #1f5c44;color:var(--ok)}
.card.ghost{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:13px;background:transparent}
.card.ghost .plus{font-size:30px;line-height:1}
.empty{padding:40px 10px;text-align:center;color:var(--sub);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.modal .box{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.modal h2{font-size:16px;margin-bottom:12px}
.modal .body{font-size:14px;line-height:1.7}
.modal .warn{font-size:12px;color:#ffb86b;margin-top:10px;line-height:1.5}
.modal .row{display:flex;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222a3d;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr)}
  header button{padding:6px 10px;font-size:13px}
}

.ais{display:flex;gap:6px;align-items:center}
.ai{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:0;padding:0;overflow:visible;position:relative;background:#fff;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--c);transition:filter .3s,opacity .3s}
.ai.q::after{content:'!';position:absolute;right:-5px;bottom:-5px;width:15px;height:15px;border-radius:50%;background:#ff3b3b;color:#fff;font:800 11px/15px -apple-system,sans-serif;text-align:center;box-shadow:0 0 0 2px var(--panel)}
.ai img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.ai.off{box-shadow:0 0 0 2px var(--panel),0 0 0 3px #3a3f4f;filter:grayscale(1) opacity(.55)}
.ai.chk{opacity:.5;animation:aip 1s infinite alternate}
@keyframes aip{to{opacity:.9}}

.modal .box label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
.modal .box input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.modal .box input:focus{border-color:var(--accent)}
.aihead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.aihead img{width:34px;height:34px;border-radius:50%}
.aihead h2{margin:0}
.aist{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.aist span{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.aist span.ok{color:var(--ok);border-color:#1f5c44}
.aist span.warnq{color:#ffd0d0;border-color:#c0392b;background:#3a1a1a}
.aist span.warnq::before{content:'! ';font-weight:800;color:#ff5b5b}
.aist span.bad{color:#ff8a8a;border-color:#6b2b2b}
.aist span.me{box-shadow:0 0 0 1px var(--accent) inset}
.aimsg{min-height:20px;margin-top:10px;font-size:13px;line-height:1.55;color:var(--sub);word-break:break-all}
.aimsg.quota{color:#ff8a8a;background:#3a1a1a;border:1px solid #6b2b2b;border-radius:10px;padding:8px 10px}
.aimsg.ok{color:var(--ok)}.aimsg.bad{color:#ff8a8a}
.modal .row.multi{gap:6px;flex-wrap:wrap;justify-content:flex-end}
button.danger{color:#ff8a8a}
#appList{display:flex;flex-direction:column;gap:8px;max-height:62dvh;overflow-y:auto;margin-top:4px}
.arow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.arow img{width:40px;height:40px;border-radius:10px;flex:none}
.arow .t{flex:1;min-width:0}.arow .t b{display:block;font-size:14px}.arow .t>span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow button{flex:none;padding:7px 12px;font-size:13px}
.arow button.get{background:var(--accent2);border-color:var(--accent2);font-weight:700}
.card.ghost.add{cursor:pointer}
</style>
<script src="ui-guard.js" defer></script>
<script src="sync.js" defer></script>
</head>
<body>
<header>
  <img class="logo" src="icon-192.png" alt="">
  <h1>SIM <span>Tools</span></h1>
  <div class="spacer"></div>
  <div class="ais" id="ais"></div>
  <button id="btnInstall" title="앱으로 설치">앱 설치</button>
</header>

<main>
  <div class="search"><input id="q" type="search" placeholder="툴 검색"></div>
  <div class="reorder" id="reorder"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="mInstall">
  <div class="box">
    <h2>SIM Tools 앱으로 설치</h2>
    <div class="body" id="installBody"></div>
    <div class="warn" id="installWarn"></div>
    <div class="row"><button class="primary" id="installClose">확인</button></div>
  </div>
</div>
<div class="modal" id="mAi">
  <div class="box">
    <div class="aihead"><img id="aiImg" alt=""><h2 id="aiTitle">AI 연결 설정</h2></div>
    <div class="aist" id="aiSt"></div>
    <div class="aimsg" id="aiNow"></div>
    <label for="aiPhone">등록된 사용자 전화번호</label>
    <input id="aiPhone" type="tel" placeholder="010-0000-0000" autocomplete="off">
    <div class="aimsg" id="aiMsg"></div>
    <div class="warn">AI 키는 서버에만 있고 이 기기에는 저장되지 않아요. 전화번호는 SIM Message·Assistant가 같이 써요.</div>
    <div class="row multi"><button id="aiDel" class="danger">번호 삭제</button><button id="aiTest">응답 테스트</button><button id="aiSave" class="primary">저장·확인</button><button id="aiClose">닫기</button></div>
  </div>
</div>
<div class="modal" id="mApps">
  <div class="box">
    <h2>앱 추가</h2>
    <div id="appList"></div>
    <div class="warn">필요한 앱만 내려받아 설치하세요. 설치가 끝나면 런처 보드에 나타나요. 처음에는 "이 출처의 앱 설치 허용"을 한 번 켜야 해요.</div>
    <div class="row"><button id="appsClose">닫기</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  /* ─────────────────────────────────────────────
     툴 목록. 새 툴을 만들면 아래 배열에 한 줄만 추가하세요.
       name : 카드 제목
       desc : 한 줄 설명
       url  : 열릴 파일 (같은 폴더의 .html 파일명)
       icon : 이미지 파일명 (없으면 emoji 사용)
       emoji: icon이 없을 때 표시할 이모지
       tag  : 카드 하단 작은 라벨 (선택)
     ───────────────────────────────────────────── */
  const TOOLS = [
    { id: 'simtv', color: '#a78bfa', name: 'SIM TV', desc: '라이브 채널 시청', url: 'tv.html', icon: 'tv-icon-192.png', tag: '라이브' },
    { id: 'note', color: '#34c38f', name: 'SIM Note', desc: '펜·도형 필기 · PDF·Office · 스캔 · 인쇄', url: 'note.html', icon: 'note-icon-192.png', tag: '노트' },
    { id: 'phone', color: '#f59f3a', name: 'SIM Phone', desc: '연락처 관리 · 명함 스캔 · 전화/문자', url: 'phone.html', icon: 'phone-icon-192.png', tag: '연락처' },
    { id: 'aitel', color: '#8b7dff', name: 'SIM AI-Tel', desc: 'AI 전화 비서 · 예약/문의 대행 · 부재중 응대', url: 'aitel.html', icon: 'aitel-icon-192.png', tag: '전화비서' },
    { id: 'assistant', color: '#4cc9f0', name: 'SIM Assistant', desc: '음성 비서 · 메모 · 연락처 저장/검색 · 전화 · 일정 · 알람', url: 'assistant.html', icon: 'assistant-icon-192.png', tag: '음성비서' },
    { id: 'calendar', color: '#ff6b6b', name: 'SIM Calendar', desc: '월·주·일 달력 · 공휴일 · 음성비서 일정 자동 기록', url: 'calendar.html', icon: 'calendar-icon-192.png', tag: '일정' },
    { id: 'folder', color: '#c8946a', name: 'SIM Folder', desc: '내 전용 서버 폴더 · 업로드 · 내 기기로 받기', url: 'folder.html', icon: 'folder-icon-192.png', tag: '파일저장소' },
    { id: 'message', color: '#ffe600', name: 'SIM Message', desc: 'AI 문자 작성 · 인사·상품소개·일정안내 · 이미지·멜로디·음성 · 바로 보내기', url: 'message.html', icon: 'message-icon-192.png', tag: '문자' },
    { id: 'kbo', color: '#6fd64b', name: 'SIM KBO', desc: '응원팀 설정 · 팀 순위 · 지표 순위 · 선수 검색(사진·연봉) · 뉴스 · 유튜브', url: 'kbo.html', icon: 'kbo-icon-192.png', tag: '야구' },
    { id: 'orchestra', color: '#ff4fb8', name: 'SIM Orchestra', desc: '유튜브 음원 · LRC 큰 가사 · 영상/이미지 배경 · 노래방·반주', url: 'orchestra.html', icon: 'orchestra-icon-192.png', tag: '노래방' },
    { id: 'radio', color: '#4f8cff', name: 'SIM Radio', desc: 'FM 주파수 다이얼 · 실제 라디오 방송 듣기 · KBS·MBC·SBS·CBS·EBS', url: 'radio.html', icon: 'radio-icon-192.png', tag: '라디오' },
    { id: 'calc', color: '#22d3c5', name: 'SIM Calculator', desc: '상업용 12자리 계산기 · 실시간 환율 계산 · 음성으로 환율 계산', url: 'calc.html', icon: 'calc-icon-192.png', tag: '계산기' },
    { id: 'map', color: '#ff7849', name: 'SIM Map', desc: '카카오 지도 · 맛집·명소 저장 · 현재 위치 등록 · 사진·음성 메모 · 인근 검색 · 네이버 내비', url: 'map.html', icon: 'map-icon-192.png', tag: '지도' },
    { id: 'pad', color: '#bab5a0', name: 'SIM PAD', desc: '터치패드 · 마우스·키보드 대신 쓰기 · PC 원격 입력 · 단축키·미디어 키', url: 'pad.html', icon: 'pad-icon-192.png', tag: '터치패드' }
  ];

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // 이름의 'SIM'은 흰색, 나머지는 각 앱의 컨셉 컬러
  const nameHtml = t => { const m = /^SIM\s+(.+)$/.exec(t.name); return m && t.color ? 'SIM <span style="color:' + esc(t.color) + '">' + esc(m[1]) + '</span>' : esc(t.name); };
  /* ── 순서 (이 기기에만 저장). 목록에 없는 새 툴은 맨 뒤에 붙는다 ── */
  /* ── 안드로이드 런처 앱 안에서 열렸을 때: 설치된 SIM 앱만 보드에 나열, 나머지는 '앱 추가'에서 내려받아 설치 ── */
  const APP = window.SimLauncher || null;
  let INSTALLED = [];
  function readInstalled() { if (!APP) return; try { INSTALLED = JSON.parse(APP.installed()); } catch (e) { INSTALLED = []; } }
  readInstalled();
  const KEY_ORDER = 'simtools_order';
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
  const loadOrder = () => { try { const a = JSON.parse(lsGet(KEY_ORDER) || '[]'); return Array.isArray(a) ? a.map(String) : []; } catch (e) { return []; } };
  function orderedTools() {
    const rank = new Map(loadOrder().map((id, i) => [id, i]));
    return TOOLS.filter(t => rank.has(t.id)).sort((a, b) => rank.get(a.id) - rank.get(b.id)).concat(TOOLS.filter(t => !rank.has(t.id)));
  }
  const KEY_MOVE = 'simtools_move';   // 카드 이동 스위치 (기본 꺼짐, 이 기기에만 저장)
  const moveOn = () => lsGet(KEY_MOVE) === '1';
  function updateHint() { const el = $('reorder'); if (el) el.innerHTML = ''; }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    let list = orderedTools().filter(t => !q || t.name.toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q));
    if (APP) list = list.filter(t => INSTALLED.indexOf(t.id) >= 0);      // 앱 안에서는 설치된 도구만 보드에 나열
    updateHint();
    if (!list.length) { $('grid').innerHTML = APP && !q ? '<div class="card ghost add" id="addApp" style="grid-column:1/-1"><div class="plus">+</div>설치된 앱이 없어요. 눌러서 앱을 추가하세요</div>' : '<div class="empty" style="grid-column:1/-1">검색 결과가 없습니다.</div>'; return; }
    let html = list.map(t => {
      const ico = t.icon ? '<img src="' + esc(t.icon) + '" alt="" draggable="false">' : esc(t.emoji || '🧰');
      return '<a class="card" data-id="' + esc(t.id) + '" draggable="false" href="' + (APP ? '#' : esc(t.url)) + '">' +
        '<div class="ico">' + ico + '</div>' +
        '<div><div class="name">' + nameHtml(t) + '</div><div class="desc">' + esc(t.desc || '') + '</div></div>' +
        (t.tag ? '<span class="tag">' + esc(t.tag) + '</span>' : '') + '</a>';
    }).join('');
    if (!q) html += APP ? '<div class="card ghost add" id="addApp"><div class="plus">+</div>앱 추가</div>' : '<div class="card ghost"><div class="plus">+</div>새 툴이 여기에 추가됩니다</div>';
    $('grid').innerHTML = html;
  }
  $('q').addEventListener('input', render);
  render();
  if (APP) {
    $('btnInstall').style.display = 'none';
    document.addEventListener('click', e => {
      const add = e.target.closest && e.target.closest('#addApp'); if (add) { e.preventDefault(); openApps(); return; }
      const c = e.target.closest && e.target.closest('a.card'); if (c && c.dataset.id) { e.preventDefault(); APP.open(c.dataset.id); }
    });
    window.__simRefresh = () => { readInstalled(); render(); if ($('mApps').classList.contains('show')) paintApps(); };
    window.__simInstall = (id, st) => {
      const t = TOOLS.find(x => x.id === id), n = t ? t.name : id;
      toast(st === 'start' ? n + ' 내려받는 중…' : st === 'done' ? n + ' 설치 화면을 여는 중…' : st === 'perm' ? '설정에서 "이 출처 허용"을 켠 뒤 다시 눌러 주세요' : n + ' 설치에 실패했어요');
    };
    $('appsClose').onclick = () => $('mApps').classList.remove('show');
    $('mApps').addEventListener('click', e => { if (e.target === $('mApps')) $('mApps').classList.remove('show'); });
    $('appList').addEventListener('click', e => {
      const b = e.target.closest('button[data-act]'); if (!b) return;
      const id = b.dataset.id;
      if (b.dataset.act === 'get') APP.install(id); else if (b.dataset.act === 'open') APP.open(id); else if (b.dataset.act === 'del') APP.uninstall(id);
    });
  }
  function paintApps() {
    readInstalled();
    $('appList').innerHTML = TOOLS.map(t => {
      const on = INSTALLED.indexOf(t.id) >= 0;
      return '<div class="arow"><img src="' + esc(t.icon) + '" alt=""><div class="t"><b>' + nameHtml(t) + '</b><span>' + esc(t.desc || '') + '</span></div>' +
        (on ? '<button data-act="open" data-id="' + esc(t.id) + '">열기</button><button class="danger" data-act="del" data-id="' + esc(t.id) + '">제거</button>'
            : '<button class="get" data-act="get" data-id="' + esc(t.id) + '">받기</button>') + '</div>';
    }).join('');
  }
  function openApps() { paintApps(); $('mApps').classList.add('show'); }

  /* AI 연결 확인: 런처가 열릴 때 Gemini·Claude·Groq가 실제로 응답하는지 서버에서 확인해
     성공하면 컬러(활성), 실패·미등록이면 회색(비활성)으로 보여준다. 아이콘은 자체 제작한 이니셜 배지. */
  const AIS = [['gemini', 'Gemini', 'ai-gemini.png', '#4285f4'], ['claude', 'Claude', 'ai-claude.png', '#d97757'], ['groq', 'Groq', 'ai-groq.png', '#f55036']];
  const aiBox = $('ais');
  aiBox.innerHTML = AIS.map(a => '<button class="ai chk" data-k="' + a[0] + '" style="--c:' + a[3] + '" aria-label="' + a[1] + '" title="' + a[1] + ' 확인 중…"><img src="' + a[2] + '" alt=""></button>').join('');
  const aiSet = (k, st, tip) => { const b = aiBox.querySelector('[data-k="' + k + '"]'); if (!b) return; b.classList.remove('chk'); b.classList.toggle('off', st !== 'ok' && st !== 'quota'); b.classList.toggle('q', st === 'quota'); b.title = tip; b.dataset.tip = tip; };
  async function checkAI() {
    const phone = lsGet('SIMAS_AI_PHONE');
    const label = { ok: '연결됨', quota: '연결됨 · 한도 초과', fail: '연결 실패', nokey: '키 미등록' };
    if (!phone) { AIS.forEach(a => { AI_STATE[a[0]] = 'fail'; }); AIS.forEach(a => aiSet(a[0], 'fail', a[1] + ': 등록된 번호가 없어 확인하지 못했어요 (아이콘을 눌러 번호 등록)')); return; }
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch('https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/ai-status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }), signal: ctl.signal });
      clearTimeout(t);
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      AIS.forEach(a => { AI_STATE[a[0]] = j[a[0]]; aiSet(a[0], j[a[0]], a[1] + ': ' + (label[j[a[0]]] || '알 수 없음')); });
    } catch (e) { AIS.forEach(a => { AI_STATE[a[0]] = 'fail'; aiSet(a[0], 'fail', a[1] + ': 확인하지 못했어요 (네트워크 또는 번호 확인)'); }); }
  }

  /* ── AI 설정 팝업: 아이콘을 누르면 해당 AI의 연결 상태·번호 등록·테스트를 한곳에서 ── */
  const AI_STATE = {}; let curAi = 'gemini';
  const AI_URL = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/';
  const stLabel = { ok: '연결됨', quota: '한도 초과', fail: '연결 실패', nokey: '키 미등록' };
  const stHelp = { ok: '정상으로 사용할 수 있어요.', quota: '연결은 되지만 사용 한도(크레딧·요청 수)를 넘었어요. 충전하거나 한도가 풀릴 때까지 다른 AI가 대신 답하고, 모두 안 되면 기본 엔진으로 처리해요.', fail: '연결하지 못했어요. 번호나 네트워크를 확인해 주세요.', nokey: '서버에 이 AI의 키가 등록되어 있지 않아요.' };
  const maskPh = p => p.replace(/(\d{3})(\d+)(\d{4})/, '$1-****-$3');
  function aiPaint() {
    const a = AIS.find(x => x[0] === curAi) || AIS[0];
    $('aiImg').src = a[2]; $('aiTitle').textContent = a[1] + ' 연결 설정';
    aiNow();
    $('aiSt').innerHTML = AIS.map(x => '<span class="' + (AI_STATE[x[0]] === 'ok' ? 'ok' : AI_STATE[x[0]] === 'quota' ? 'warnq' : AI_STATE[x[0]] ? 'bad' : '') + (x[0] === curAi ? ' me' : '') + '">' + esc(x[1]) + ' · ' + (stLabel[AI_STATE[x[0]]] || '확인 전') + '</span>').join('');
  }
  function aiNow() {   // 설정 화면 맨 위: 선택한 AI의 현재 상태
    const a = AIS.find(x => x[0] === curAi) || AIS[0], st = AI_STATE[curAi], n = $('aiNow');
    if (!st) { n.className = 'aimsg'; n.textContent = lsGet('SIMAS_AI_PHONE') ? '현재 상태: 확인 중…' : '현재 상태: 번호 미등록'; return; }
    n.className = 'aimsg' + (st === 'quota' ? ' quota' : st === 'ok' ? ' ok' : ' bad');
    n.textContent = '현재 상태: ' + (st === 'quota' ? '⚠ 한도 초과' : stLabel[st] || st) + ' — ' + (stHelp[st] || '');
  }
  const aiNote = (t, cls) => { const m = $('aiMsg'); m.textContent = t || ''; m.className = 'aimsg' + (cls ? ' ' + cls : ''); };
  async function aiStatus(phone) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(AI_URL + 'ai-status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }), signal: ctl.signal });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(r.status === 403 ? '등록되지 않은 전화번호예요' : (j.error || r.status));
      AIS.forEach(a => { AI_STATE[a[0]] = j[a[0]]; aiSet(a[0], j[a[0]], a[1] + ': ' + (stLabel[j[a[0]]] || '알 수 없음')); });
      return j;
    } catch (e) { throw e && e.name === 'AbortError' ? new Error('응답이 늦어요') : (e instanceof TypeError ? new Error('네트워크 연결 실패') : e); }
    finally { clearTimeout(t); }
  }
  function openAiModal(k) {
    curAi = AIS.some(a => a[0] === k) ? k : 'gemini';
    const ph = lsGet('SIMAS_AI_PHONE') || '';
    $('aiPhone').value = ''; $('aiPhone').placeholder = ph ? '등록됨 ' + maskPh(ph) + ' · 바꾸려면 입력' : '010-0000-0000';
    aiPaint(); aiNote(ph ? (AI_STATE[curAi] ? curAi && ((AIS.find(x => x[0] === curAi) || [])[1] + ': ' + (stLabel[AI_STATE[curAi]] || '')) : '확인 중…') : '등록된 번호가 없어요. 번호를 입력하고 [저장·확인]을 눌러 주세요.', AI_STATE[curAi] === 'ok' ? 'ok' : (ph ? '' : 'bad'));
    $('mAi').classList.add('show');
  }
  const closeAiModal = () => $('mAi').classList.remove('show');
  $('aiClose').onclick = closeAiModal;
  $('mAi').addEventListener('click', e => { if (e.target === $('mAi')) closeAiModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAiModal(); });
  $('aiSave').onclick = async () => {
    const ph = ($('aiPhone').value || lsGet('SIMAS_AI_PHONE') || '').replace(/\D/g, ''); if (ph.length < 9) return aiNote('전화번호를 입력해 주세요', 'bad');
    aiNote('확인 중…');
    try { await aiStatus(ph); lsSet('SIMAS_AI_PHONE', ph); $('aiPhone').value = ''; $('aiPhone').placeholder = '등록됨 ' + maskPh(ph) + ' · 바꾸려면 입력'; aiPaint(); const a = AIS.find(x => x[0] === curAi); aiNote((AI_STATE[curAi] === 'ok' ? '✓ ' : '⚠ ') + '번호를 저장했어요 · ' + a[1] + ': ' + (stLabel[AI_STATE[curAi]] || ''), AI_STATE[curAi] === 'ok' ? 'ok' : 'bad'); }
    catch (e) { aiNote('✗ 실패: ' + (e.message || e), 'bad'); }
  };
  $('aiDel').onclick = () => { lsDel('SIMAS_AI_PHONE'); AIS.forEach(a => { AI_STATE[a[0]] = 'fail'; aiSet(a[0], 'fail', a[1] + ': 등록된 번호가 없어요'); }); $('aiPhone').value = ''; $('aiPhone').placeholder = '010-0000-0000'; aiPaint(); aiNote('번호를 삭제했어요', ''); };
  $('aiTest').onclick = async () => {   // 실제 음성비서 AI 경로로 한 번 물어봐서 어떤 AI가 답했는지 보여준다
    const ph = ($('aiPhone').value || lsGet('SIMAS_AI_PHONE') || '').replace(/\D/g, ''); if (ph.length < 9) return aiNote('먼저 전화번호를 등록해 주세요', 'bad');
    aiNote('AI에게 물어보는 중…'); const t0 = Date.now(), ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(AI_URL + 'assistant-ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: ph, text: '안녕하세요' }), signal: ctl.signal });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(r.status + (j.detail ? ' · ' + j.detail : j.error ? ' · ' + j.error : ''));
      aiNote('✓ 응답 OK (' + ((Date.now() - t0) / 1000).toFixed(1) + '초) · 답한 AI: ' + (j.model || '?') + ' · "' + String(j.text || '').replace(/^(CMD|SAY)\s*:\s*/i, '').slice(0, 60) + '"', 'ok');
    } catch (e) { aiNote('✗ 응답 실패: ' + (e.name === 'AbortError' ? '응답이 늦어요' : (e.message || e)), 'bad'); }
    finally { clearTimeout(to); }
  };
  aiBox.onclick = e => { const b = e.target.closest('.ai'); if (b) openAiModal(b.dataset.k); };
  checkAI().then(() => { aiPaint(); }).catch(() => {});
  { const q = new URLSearchParams(location.search).get('ai'); if (q) { openAiModal(q === '1' ? 'gemini' : q); try { history.replaceState(null, '', location.pathname); } catch (e) {} } }

  /* ── 카드 끌어서 순서 바꾸기 ──
     마우스: 6px 이상 끌면 시작. 터치: 0.4초 길게 누른 뒤 끌기(그 전에 움직이면 일반 스크롤).
     검색 중에는 일부만 보이므로 끌기를 막는다. */
  const grid = $('grid');
  document.body.classList.toggle('moveon', moveOn());
  let D = null, suppressClick = 0;
  grid.addEventListener('click', e => { if (Date.now() < suppressClick) { e.preventDefault(); e.stopPropagation(); } }, true);
  grid.addEventListener('dragstart', e => e.preventDefault());
  grid.addEventListener('contextmenu', e => { if (D || moveOn()) e.preventDefault(); });   // 길게 누를 때 뜨는 메뉴·선택을 막는다
  grid.addEventListener('pointerdown', e => {
    if (D || $('q').value.trim() || !moveOn()) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const el = e.target.closest && e.target.closest('a.card'); if (!el) return;
    D = { el, pid: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, gx: 0, gy: 0, active: false, type: e.pointerType, timer: 0, raf: 0 };
    if (e.pointerType !== 'mouse') D.timer = setTimeout(startDrag, 250);
  });
  document.addEventListener('pointermove', e => {
    if (!D || e.pointerId !== D.pid) return;
    D.x = e.clientX; D.y = e.clientY;
    if (!D.active) {
      const mv = Math.hypot(D.x - D.sx, D.y - D.sy);
      if (D.type === 'mouse') { if (mv > 6) startDrag(); }
      else if (mv > 8) startDrag();   // 이동 모드에서는 카드에서 터치 스크롤을 막아 두었으므로 조금만 끌어도 바로 시작
      return;
    }
    e.preventDefault(); moveDrag();
  });
  const endEvt = e => { if (D && e.pointerId === D.pid) finishDrag(e.type === 'pointercancel'); };
  document.addEventListener('pointerup', endEvt);
  document.addEventListener('pointercancel', endEvt);
  document.addEventListener('touchmove', e => { if (D && D.active) e.preventDefault(); }, { passive: false });
  window.addEventListener('blur', () => { if (D) finishDrag(true); });

  function startDrag() {
    if (!D || D.active) return;
    clearTimeout(D.timer);
    const r = D.el.getBoundingClientRect();
    D.active = true; D.gx = D.x - r.left; D.gy = D.y - r.top;
    try { D.el.setPointerCapture(D.pid); } catch (e) {}
    try { getSelection().removeAllRanges(); } catch (e) {}
    D.el.classList.add('dragging'); document.body.classList.add('dragmode');
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    moveDrag(); D.raf = requestAnimationFrame(autoScroll);
  }
  // 카드가 놓인 자리(레이아웃)를 기준으로 손가락 위치를 따라가게 한다
  function place() {
    const el = D.el; el.style.transform = 'none';
    const r = el.getBoundingClientRect();
    el.style.transform = 'translate(' + (D.x - D.gx - r.left) + 'px,' + (D.y - D.gy - r.top) + 'px) scale(1.04)';
  }
  function moveDrag() {
    const el = D.el; place();
    // 화면에 보이는 위치(이동 애니메이션 중일 수 있음)가 아니라 레이아웃 칸을 기준으로 어느 카드 위인지 찾는다
    const px = D.x + window.scrollX, py = D.y + window.scrollY;
    const tgt = [].slice.call(grid.querySelectorAll('a.card')).find(c => c !== el && px >= c.offsetLeft && px <= c.offsetLeft + c.offsetWidth && py >= c.offsetTop && py <= c.offsetTop + c.offsetHeight);
    if (!tgt) return;
    const cards = [].slice.call(grid.querySelectorAll('a.card'));
    const from = cards.indexOf(el), to = cards.indexOf(tgt);
    const first = cards.filter(c => c !== el).map(c => [c, c.getBoundingClientRect()]);
    grid.insertBefore(el, from < to ? tgt.nextSibling : tgt);
    place();
    first.forEach(([c, r0]) => {   // 밀려나는 카드는 부드럽게 제자리로
      const r1 = c.getBoundingClientRect(), dx = r0.left - r1.left, dy = r0.top - r1.top;
      if (!dx && !dy) return;
      c.style.transition = 'none'; c.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; c.getBoundingClientRect();
      c.style.transition = 'transform .18s'; c.style.transform = '';
      setTimeout(() => { c.style.transition = ''; }, 230);
    });
  }
  function autoScroll() {
    if (!D || !D.active) return;
    const h = window.innerHeight; let dy = 0;
    if (D.y < 120) dy = -Math.min(18, Math.ceil((120 - D.y) / 5));
    else if (D.y > h - 70) dy = Math.min(18, Math.ceil((D.y - (h - 70)) / 5));
    if (dy) { window.scrollBy(0, dy); moveDrag(); }
    D.raf = requestAnimationFrame(autoScroll);
  }
  function finishDrag(cancelled) {
    const d = D; D = null; if (!d) return;
    clearTimeout(d.timer); cancelAnimationFrame(d.raf);
    if (!d.active) return;
    d.el.classList.remove('dragging'); d.el.style.transform = ''; document.body.classList.remove('dragmode');
    try { d.el.releasePointerCapture(d.pid); } catch (e) {}
    suppressClick = Date.now() + 350;
    if (cancelled) { render(); return; }
    lsSet(KEY_ORDER, JSON.stringify([].slice.call(grid.querySelectorAll('a.card')).map(c => c.dataset.id)));
    updateHint();
  }

  window.simLauncher = {
    openAi: () => openAiModal('gemini'),
    resetOrder: () => { lsDel(KEY_ORDER); render(); toast('카드 순서를 기본으로 되돌렸어요'); },
    moveOn,
    setMove: on => { lsSet(KEY_MOVE, on ? '1' : '0'); document.body.classList.toggle('moveon', !!on); toast(on ? '카드 이동 켜짐 — 카드를 끌어서 옮겨요' : '카드 이동 꺼짐'); }
  };

  /* ── 앱 설치 (PWA) ── */
  let deferredPrompt = null;
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (standalone()) $('btnInstall').style.display = 'none';

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; $('btnInstall').style.display = 'none'; toast('SIM Tools가 설치되었습니다.'); });

  function showInstallGuide() {
    let body;
    if (isIOS) body = '<b>iPhone / iPad (Safari)</b><br>① 하단의 공유 버튼(□↑)을 누릅니다.<br>② <b>홈 화면에 추가</b>를 선택합니다.<br>③ 이름을 확인하고 <b>추가</b>를 누릅니다.<br><small style="color:var(--sub)">※ 크롬 등 다른 브라우저가 아닌 Safari에서 열어야 합니다.</small>';
    else if (isAndroid) body = '<b>Android (Chrome)</b><br>① 오른쪽 위 메뉴(⋮)를 엽니다.<br>② <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 선택합니다.';
    else body = '<b>PC (Chrome / Edge)</b><br>주소창 오른쪽의 <b>설치 아이콘(⊕)</b>을 누르거나, 메뉴(⋮) → <b>SIM Tools 설치</b>를 선택합니다.';
    $('installBody').innerHTML = body;
    $('installWarn').textContent = secure ? '' : '현재 주소(' + location.protocol + '//)에서는 설치가 지원되지 않습니다. HTTPS 주소(예: GitHub Pages)로 접속해야 설치할 수 있습니다.';
    $('mInstall').classList.add('show');
  }
  $('btnInstall').onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
    } else showInstallGuide();
  };
  const closeModal = () => $('mInstall').classList.remove('show');
  $('installClose').onclick = closeModal;
  $('mInstall').addEventListener('click', e => { if (e.target === $('mInstall')) closeModal(); });

  if ('serviceWorker' in navigator && secure) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
