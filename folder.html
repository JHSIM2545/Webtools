<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM Folder">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="folder-icon-192.png">
<title>SIM Folder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#c8946a; --accent2:#8d5a3b; --danger:#ff6b6b; --ok:#3ecf8e;
  --sel:rgba(200,148,106,.2);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:var(--text)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:5}
header h1{font-size:17px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;white-space:nowrap}
header h1 span{color:var(--accent);margin-left:-5px}
.appicon{width:30px;height:30px;border-radius:8px;display:block}
.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:20px;line-height:1;flex:none}
.back:hover{border-color:var(--accent)}
.spacer{flex:1}
.hb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--sub);flex:none}
.hb:hover,.hb:active{background:var(--panel2);color:var(--text)}
.hb.on{color:var(--accent)}
.hbt{height:36px;padding:0 12px;border-radius:8px;color:var(--accent);font-weight:600;white-space:nowrap}

/* ── 로그인 ── */
#auth{display:none;height:100dvh;flex-direction:column}
#auth .wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;max-width:420px;width:100%;margin:0 auto}
#auth h2{font-size:22px;margin-bottom:6px;letter-spacing:-.3px}
#auth h2 span{color:var(--accent)}
.fld{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:var(--panel);outline:none}
.fld:focus{border-color:var(--accent)}
.btn{width:100%;height:48px;border-radius:10px;background:var(--accent2);color:#fff;font-weight:700;font-size:16px}
.btn.s{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
#aerr{color:var(--danger);font-size:13px;min-height:18px;line-height:1.4}

/* ── 앱 틀 ── */
#app{display:none;height:100dvh;flex-direction:column}
#tool{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;scrollbar-width:none;flex:none}
#tool::-webkit-scrollbar{display:none}
.tbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;white-space:nowrap;flex:none;color:var(--text)}
.tbtn:hover{border-color:var(--accent)}
.tbtn:active{background:var(--panel2)}
.tbtn svg{font-size:17px;color:var(--accent)}
.tbtn.pri{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.tbtn.pri svg{color:#fff}
.tbtn.dis{opacity:.4}
.tbtn.dng svg{color:var(--danger)}
.tsep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}

#addr{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);flex:none}
#crow{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.ab{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);border:1px solid var(--line);background:var(--panel);flex:none}
.ab.dis{opacity:.35}
.crumb{flex:1;min-width:0;display:flex;align-items:center;white-space:nowrap;overflow-x:auto;scrollbar-width:none;font-size:13.5px;color:var(--sub)}
.crumb::-webkit-scrollbar{display:none}
.crumb span{padding:6px 4px;border-radius:6px;flex:none}
.crumb span.sep{padding:6px 0;color:var(--line)}
.crumb span[data-go]:hover{background:var(--panel2);color:var(--text)}
.crumb span.cur{color:var(--text);font-weight:600}
.crumb span.dt{outline:2px dashed var(--accent);background:var(--sel)}
.usage{font-size:12px;color:var(--sub);white-space:nowrap;flex:none}
#sr{display:none;flex-basis:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--panel);outline:none}
#sr:focus{border-color:var(--accent)}
#addr.so #sr{display:block}

#body{flex:1;min-height:0;display:flex}
#tree{display:none;width:236px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px 6px;font-size:13.5px}
.tn{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 8px;border-radius:7px;cursor:default;white-space:nowrap;user-select:none;-webkit-user-select:none}
.tn:hover{background:var(--panel2)}
.tn.cur{background:var(--sel)}
.tn.dt{outline:2px dashed var(--accent);background:var(--sel)}
.tn .tg{width:14px;text-align:center;color:var(--sub);font-size:11px;flex:none}
.tn .tl{overflow:hidden;text-overflow:ellipsis}
#tree hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#chead{display:none}
#ls{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;outline:none}
#dropmask{display:none;position:absolute;inset:0;z-index:8;pointer-events:none;background:rgba(15,17,23,.82);border:3px dashed var(--accent);border-radius:12px;margin:6px;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--accent);font-weight:700;font-size:17px}
#dropmask svg{font-size:44px}
#dropmask.on{display:flex}

.row{display:flex;align-items:center;gap:12px;padding:0 4px 0 14px;min-height:60px;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default;position:relative}
.row:active{background:var(--panel2)}
.row.sel{background:var(--sel)}
.row.dt{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--sel)}
.row.cut{opacity:.45}
.ic{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.ic svg:not(.i){width:32px;height:32px;display:block}
.nm{flex:1;min-width:0}
.n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cd,.ct,.cs{display:none}
.mb{width:44px;height:44px;font-size:21px;color:var(--sub);display:flex;align-items:center;justify-content:center;flex:none}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--sub);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.ck.on{background:var(--accent2);border-color:var(--accent)}
.ck svg{stroke-width:3}
.emp{padding:64px 24px;text-align:center;color:var(--sub);line-height:1.6;grid-column:1/-1}
.emp svg{font-size:46px;margin:0 auto 10px;color:var(--sub)}
.emp b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

#ls.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;padding:10px;align-content:start}
#ls.grid .row{flex-direction:column;min-height:0;padding:10px 6px 8px;border:1px solid transparent;border-radius:12px;text-align:center;gap:6px}
#ls.grid .row.sel{border-color:var(--accent)}
#ls.grid .ic{width:64px;height:64px}
#ls.grid .ic svg:not(.i){width:56px;height:56px}
#ls.grid .ic.th{border-radius:8px;background-size:cover;background-position:center;background-color:var(--panel2)}
#ls.grid .nm{width:100%;flex:none}
#ls.grid .n{white-space:normal;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12.5px;line-height:1.3}
#ls.grid .m,#ls.grid .cd,#ls.grid .ct,#ls.grid .cs,#ls.grid .mb{display:none}
#ls.grid .ck{position:absolute;top:6px;left:6px;background:var(--bg)}

#stat{display:none;align-items:center;justify-content:space-between;padding:5px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);flex:none;background:var(--panel)}
#pbar{display:none;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);flex:none;font-size:13.5px}
#pbar.on{display:flex}
#pbar .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pbar button{height:34px;padding:0 14px;border-radius:8px;font-weight:600}
#pbar .go{background:var(--accent2);color:#fff}
#pbar .no{color:var(--sub)}
#nav,#bar{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom);flex:none}
#bar{display:none}
#nav button,#bar button{flex:1;height:58px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#nav button svg,#bar button svg{font-size:22px}
#nav button.a{color:var(--accent)}
#bar button{color:var(--text)}
#bar button.d{color:var(--danger)}

/* ── 시트·팝업 ── */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sh{background:var(--panel);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:8px 0 calc(14px + env(safe-area-inset-bottom));max-height:82dvh;overflow:auto}
.sht{padding:10px 18px 8px;font-weight:600;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{display:flex;gap:14px;align-items:center;padding:0 18px;height:52px;font-size:16px;cursor:default}
.it:hover,.it:active{background:var(--panel2)}
.it svg{font-size:21px;color:var(--sub)}
.it.d,.it.d svg{color:var(--danger)}
.it.on svg{color:var(--accent)}
.it .ck2{margin-left:auto;color:var(--accent);font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.box h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.cur2{font-size:13px;color:var(--sub);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbr{height:12px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.pbr i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(45deg,var(--accent2) 0 10px,var(--accent) 10px 20px);background-size:28px 28px;animation:stripe .7s linear infinite;transition:width .15s}
.pbr.done i{animation:none;background:var(--ok)}
.pbr.fail i{animation:none;background:var(--danger)}
.pbr.thin{height:6px;margin-top:2px}
@keyframes stripe{to{background-position:28px 0}}
.prow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin:6px 0 12px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
.spin.stop{animation:none;border-color:var(--ok)}
@keyframes sp{to{transform:rotate(360deg)}}
.errs{max-height:120px;overflow:auto;font-size:12.5px;color:var(--danger);line-height:1.5;margin-bottom:10px;padding-left:16px}
.brow{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.brow button{height:38px;padding:0 18px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:55}
#busy.show{display:flex}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));margin:0 auto;max-width:420px;background:#2a2f3f;color:#fff;border-radius:10px;padding:12px 16px;display:none;justify-content:space-between;gap:12px;z-index:90;font-size:14px;border:1px solid var(--line)}
#toast b{color:var(--accent);cursor:pointer;white-space:nowrap}
#viewer{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:30}
#viewer .tp{display:flex;align-items:center;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top));color:#fff}
#viewer .tp span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#viewer .hb{color:#fff}
#vbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#vbox img,#vbox video{max-width:100%;max-height:100%;object-fit:contain}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border-radius:10px}
.vnav.l{left:8px}.vnav.r{right:8px}
.ctx{position:fixed;z-index:100;background:var(--panel2);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:4px;min-width:190px;font-size:13.5px}
.ctx div{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:7px;cursor:default}
.ctx div:hover{background:var(--sel)}
.ctx div svg{font-size:16px;color:var(--sub)}
.ctx div.dis{opacity:.4;pointer-events:none}
.ctx div.d,.ctx div.d svg{color:var(--danger)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* ── 넓은 화면(PC·태블릿·가로): 탐색기 배치 ── */
@media (max-width:759px){
  .pc{display:none!important}
  body.selmode #tool{display:none}
}
@media (min-width:760px){
  .mo{display:none!important}
  #tree{display:block}
  #nav{display:none}
  #stat{display:flex}
  #chead{display:flex;align-items:center;gap:10px;padding:0 14px;height:30px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);flex:none;user-select:none;-webkit-user-select:none}
  #chead.hide{display:none}
  #chead div{cursor:default;white-space:nowrap}
  #chead div:hover{color:var(--text)}
  #chead .hn{flex:1;padding-left:42px}
  .row{min-height:34px;padding:0 10px;gap:10px;border-bottom:0;border-radius:6px;margin:0 4px}
  .row .m{display:none}
  .cd,.ct,.cs{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cd,#chead .cd{width:140px}
  .ct,#chead .ct{width:170px}
  .cs,#chead .cs{width:84px;text-align:right}
  .ic{width:28px;height:28px}
  .ic svg:not(.i){width:24px;height:24px}
  .row:hover{background:var(--panel2)}
  .row.sel,.row.sel:hover{background:var(--sel)}
  #ls.grid .row{margin:0}
  #ls.grid .row:hover{background:var(--panel2)}
  #sr{display:block;flex-basis:auto;width:230px}
  #addr{flex-wrap:nowrap}
}
@media (min-width:760px) and (pointer:fine){
  .mb{display:none}
  #ov{align-items:center}
  #sh{border-radius:14px;border-bottom:1px solid var(--line);padding-bottom:10px;max-width:420px}
}
@media (max-width:759px){
  #chead{display:none}
}
@media (max-height:520px){
  header{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  .back{width:30px;height:30px}.appicon{width:26px;height:26px}.hb{width:34px;height:34px}
  #tool{padding:4px 12px}.tbtn{height:30px;font-size:13px}
  #addr{padding:3px 12px}.ab{width:28px;height:28px}#sr{height:30px}
  .row{min-height:44px}
  #nav button,#bar button{height:46px;flex-direction:row;justify-content:center;gap:6px;font-size:12px}
}
</style>
<script src="ui-guard.js" defer></script>
</head>
<body>

<div id="auth">
  <header>
    <a class="back" href="index.html" aria-label="런처로" title="SIM Tools">‹</a>
    <h1><img class="appicon" src="folder-icon-192.png" alt="">SIM <span>Folder</span></h1>
    <div class="spacer"></div>
  </header>
  <div class="wrap">
    <h2>내 폴더에 <span>로그인</span></h2>
    <input class="fld" id="em" type="email" placeholder="이메일" autocomplete="username">
    <input class="fld" id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <div id="aerr"></div>
    <button class="btn" id="login">로그인</button>
    <button class="btn s" id="signup">가입하기</button>
  </div>
</div>

<div id="app">
  <header id="hd"></header>
  <div id="tool"></div>
  <div id="addr">
    <div id="crow"></div>
    <input id="sr" type="search" placeholder="파일 저장소 검색" autocomplete="off">
  </div>
  <div id="body">
    <aside id="tree"></aside>
    <main id="main">
      <div id="chead"></div>
      <div id="ls" tabindex="0"></div>
      <div id="dropmask"></div>
    </main>
  </div>
  <div id="stat"><span id="statL"></span><span id="statR"></span></div>
  <div id="pbar" class="mo"></div>
  <nav id="nav"></nav>
  <div id="bar"></div>
</div>

<div id="ov"><div id="sh"></div>
  <input type="file" id="fi" multiple hidden>
  <input type="file" id="gi" accept="image/*,video/*" multiple hidden>
  <input type="file" id="ci" accept="image/*" capture="environment" hidden>
  <input type="file" id="di" webkitdirectory multiple hidden>
</div>

<div class="modal" id="upm">
  <div class="box">
    <h2><span class="spin" id="upSp"></span><span id="upT">업로드 중</span></h2>
    <div class="cur2" id="upN"></div>
    <div class="pbr" id="upB1"><i id="upF"></i></div>
    <div class="prow"><span id="upC"></span><span id="upP"></span></div>
    <div class="pbr thin" id="upB2"><i id="upF2"></i></div>
    <div class="prow"><span id="upS"></span><span id="upV"></span></div>
    <ul class="errs" id="upE" style="display:none"></ul>
    <div class="brow"><button id="upX">취소</button></div>
  </div>
</div>
<div id="busy"><div class="box">
  <h2><span class="spin"></span><span id="bsT">처리 중</span></h2>
  <div class="pbr"><i id="bsF" style="width:100%"></i></div>
  <div class="prow"><span id="bsC"></span><span></span></div>
</div></div>
<div id="toast"></div>
<div id="viewer">
  <div class="tp">
    <button class="hb" id="vclose" aria-label="닫기"></button>
    <span id="vname"></span>
    <button class="hb" id="vdl" aria-label="내 기기로 받기"></button>
  </div>
  <div id="vbox"></div>
</div>

<script>
const SUPABASE_URL='https://rgamgjdnhunzzwzsbnbs.supabase.co';
const SUPABASE_KEY='sb_publishable_hnBcVEuMXFRdFRqJhOM0OQ_rp72JywU';
const BUCKET='sim-folder';
const MAX_BYTES=50*1048576;
const TRASH_DAYS=30;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lget=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lset=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const ldel=k=>{try{localStorage.removeItem(k);}catch(e){}};

const ic=(n,c)=>'<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(P[n]||'')+'</svg>';

function folderSvg(px){return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 32 32" style="flex:none"><path d="M2 7a2 2 0 0 1 2-2h7.2a2 2 0 0 1 1.5.7L15 8h13a2 2 0 0 1 2 2v1H2z" fill="#a8744a"/><path d="M2 11h28v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#d9a877"/><path d="M2 11h28v1.6H2z" fill="#ecc9a3"/></svg>';}
function extOf(n){const m=/\.([^.\\/]+)$/.exec(String(n||''));return m?m[1].toLowerCase():'';}
function fileSvg(it,px){
  const ext=extOf(it.name),o='<svg width="'+px+'" height="'+px+'" viewBox="0 0 32 32" style="flex:none">';
  const page='<path d="M7 2h11l8 8v19a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="#f4f5f7" stroke="#8d97a3"/><path d="M18 2v7a1 1 0 0 0 1 1h7z" fill="#cfd6de" stroke="#8d97a3" stroke-linejoin="round"/>';
  const lines='<path d="M19 14h5M19 17.5h5M19 21h5M10 25h14" stroke="#b9c1ca" stroke-width="1.5"/>';
  const badge=(c,t,fs)=>'<rect x="1.5" y="12" width="17" height="14" rx="2" fill="'+c+'"/><text x="10" y="'+(t.length>1?22.5:23)+'" font-size="'+(fs||10)+'" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">'+t+'</text>';
  let b;
  if(/^(docx?|rtf)$/.test(ext))b=lines+badge('#185ABD','W');
  else if(/^xlsx?m?$/.test(ext))b=lines+badge('#107C41','X');
  else if(ext==='csv')b=lines+badge('#107C41','CSV',6.5);
  else if(/^pptx?$/.test(ext))b=lines+badge('#C43E1C','P');
  else if(ext==='pdf')b='<path d="M10 25h14" stroke="#b9c1ca" stroke-width="1.5"/>'+badge('#E2231A','PDF',6.5);
  else if(/^hwpx?$/.test(ext))b=lines+badge('#1F6FD0','한',9);
  else if(/^(txt|log|md)$/.test(ext))b='<path d="M10 14h14M10 17.5h14M10 21h14M10 24.5h9" stroke="#8d97a3" stroke-width="1.5"/>';
  else if(/^(png|jpe?g|gif|bmp|webp|svg|ico|tiff?|heic|heif)$/.test(ext))b='<rect x="9" y="13" width="15" height="13" fill="#bfe3ff"/><path d="M9 26l5-6 3 3 3-4 4 7z" fill="#2e8b57"/><circle cx="20.5" cy="16.8" r="1.7" fill="#ffd54a"/>';
  else if(/^(zip|rar|7z|tar|gz|alz|egg)$/.test(ext))b='<rect x="12" y="10" width="8" height="19" fill="#f2c94c"/><path d="M16 11v17" stroke="#8a6d00" stroke-width="2" stroke-dasharray="1.6 1.6"/>';
  else if(/^(mp3|wav|m4a|flac|aac|ogg)$/.test(ext))b='<path d="M13 24V13l9-2v11" fill="none" stroke="#7c3aed" stroke-width="2"/><circle cx="11.5" cy="24" r="2.5" fill="#7c3aed"/><circle cx="20.5" cy="22" r="2.5" fill="#7c3aed"/>';
  else if(/^(mp4|avi|mov|mkv|wmv|webm|3gp)$/.test(ext))b='<rect x="8.5" y="13" width="15" height="12" rx="2" fill="#6d28d9"/><path d="M14.5 16l5 3-5 3z" fill="#fff"/>';
  else b='<path d="M10 14h14M10 17.5h14M10 21h14M10 24.5h9" stroke="#c4ccd4" stroke-width="1.5"/>';
  return o+page+b+'</svg>';
}
function iconOf(it,px){return it.kind==='folder'?folderSvg(px):fileSvg(it,px);}
function typeName(it){
  if(it.kind==='folder')return '파일 폴더';
  const e=extOf(it.name),map={doc:'Word 문서',docx:'Word 문서',xls:'Excel 워크시트',xlsx:'Excel 워크시트',csv:'CSV 파일',ppt:'PowerPoint',pptx:'PowerPoint',pdf:'PDF 문서',txt:'텍스트 문서',hwp:'한글 문서',hwpx:'한글 문서',zip:'압축(ZIP) 폴더',jpg:'JPG 이미지',jpeg:'JPG 이미지',png:'PNG 이미지',gif:'GIF 이미지',mp4:'MP4 동영상',mp3:'MP3 오디오'};
  return map[e]||(e?e.toUpperCase()+' 파일':'파일');
}
function ftype(it){
  if(it.kind==='folder')return 'folder';
  const m=it.mime||'',e=extOf(it.name);
  if(m.startsWith('image/')||/^(png|jpe?g|gif|webp|bmp)$/.test(e))return 'image';
  if(m.startsWith('video/')||/^(mp4|webm|mov|3gp)$/.test(e))return 'video';
  if(m==='application/pdf'||e==='pdf')return 'pdf';
  return 'etc';
}

let sb,user,items=[],idx=new Map();

let sortKey=lget('simfolder.sk')||'name',sortAsc=lget('simfolder.sa')!=='0';

const children=pid=>items.filter(i=>(i.parent_id||null)===(pid||null));
function descendants(id){const out=[],st=[id];while(st.length){const p=st.pop();for(const c of children(p)){out.push(c);st.push(c.id);}}return out;}
function isLive(it){let c=it,g=0;while(c&&g++<60){if(c.deleted_at)return false;c=c.parent_id?idx.get(c.parent_id):null;}return true;}
function pathOf(id){const out=[];let c=idx.get(id),g=0;while(c&&g++<60){out.unshift(c);c=c.parent_id?idx.get(c.parent_id):null;}return out;}
const byName=(a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true});
function fmtSize(n){if(n<1024)return n+'B';if(n<1048576)return Math.max(1,Math.round(n/1024))+'KB';if(n<1073741824)return (n/1048576).toFixed(1)+'MB';return (n/1073741824).toFixed(2)+'GB';}
function fmtDate(s,full){
  const d=new Date(s);if(isNaN(d))return '';
  const p=n=>String(n).padStart(2,'0'),n=new Date(),hm=p(d.getHours())+':'+p(d.getMinutes());
  if(full)return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+hm;
  if(d.toDateString()===n.toDateString())return '오늘 '+hm;
  if(d.toDateString()===new Date(n-864e5).toDateString())return '어제';
  return (d.getMonth()+1)+'월 '+d.getDate()+'일';
}
const wide=()=>window.matchMedia('(min-width:760px)').matches;
const finePtr=()=>window.matchMedia('(pointer:fine)').matches;

let tt;
function toast(msg,label,fn){
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<b id="tact">'+esc(label)+'</b>':'');
  t.style.display='flex';
  if(label)$('#tact').onclick=()=>{t.style.display='none';fn();};
  clearTimeout(tt);tt=setTimeout(()=>{t.style.display='none';},label?5000:2600);
}
function sheet(title,html){$('#sh').innerHTML=(title?'<div class="sht">'+esc(title)+'</div>':'')+html;$('#ov').style.display='flex';}
function closeSheet(){$('#ov').style.display='none';}
const sheetOpen=()=>$('#ov').style.display==='flex';
const modalOpen=()=>sheetOpen()||$('#upm').classList.contains('show')||$('#busy').classList.contains('show')||$('#viewer').style.display==='flex';

function uniqueName(name,pid,except){
  const names=new Set(items.filter(i=>!i.deleted_at&&(i.parent_id||null)===(pid||null)&&i.id!==except).map(i=>i.name));
  if(!names.has(name))return name;
  const dot=name.lastIndexOf('.'),base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';
  let n=1;while(names.has(base+' ('+n+')'+ext))n++;
  return base+' ('+n+')'+ext;
}
function sortList(l){
  const dir=sortAsc?1:-1;
  return l.slice().sort((a,b)=>{
    if(a.kind!==b.kind)return a.kind==='folder'?-1:1;
    let r;
    if(sortKey==='date')r=new Date(a.created_at)-new Date(b.created_at);
    else if(sortKey==='size')r=a.size-b.size;
    else if(sortKey==='type')r=typeName(a).localeCompare(typeName(b),'ko');
    else r=byName(a,b);
    return (r||byName(a,b))*dir;
  });
}
function visible(){
  let l;
  if(tab==='trash')l=items.filter(i=>i.deleted_at&&(!i.parent_id||!(idx.get(i.parent_id)||{}).deleted_at));
  else if(tab==='recent')return items.filter(i=>i.kind==='file'&&isLive(i)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,30);
  else if(tab==='star')l=items.filter(i=>i.starred&&isLive(i));
  else if(q)l=items.filter(i=>isLive(i)&&i.name.toLowerCase().includes(q.toLowerCase()));
  else l=items.filter(i=>!i.deleted_at&&(i.parent_id||null)===cwd);
  return sortList(l);
}
const flat=()=>tab!=='files'||!!q;

function crumbHtml(){
  if(tab==='recent')return '<span class="cur">최근 올린 파일</span>';
  if(tab==='star')return '<span class="cur">즐겨찾기</span>';
  if(tab==='trash')return '<span class="cur">휴지통 ('+TRASH_DAYS+'일 뒤 자동 삭제)</span>';
  if(q)return '<span class="cur">검색 결과</span>';
  const path=pathOf(cwd);
  let h='<span data-go="" data-drop=""'+(path.length?'':' class="cur"')+'>파일저장소</span>';
  path.forEach((it,k)=>{h+='<span class="sep">\\</span><span data-go="'+it.id+'" data-drop="'+it.id+'"'+(k===path.length-1?' class="cur"':'')+'>'+esc(it.name)+'</span>';});

function renderAddr(){

function renderTree(){
  const el=$('#tree');if(!wide())return;
  const kids=(pid,d)=>children(pid).filter(c=>c.kind==='folder'&&!c.deleted_at).sort(byName).map(c=>{
    const has=children(c.id).some(x=>x.kind==='folder'&&!x.deleted_at),open=treeOpen.has(c.id);
    return '<div class="tn'+(tab==='files'&&!q&&cwd===c.id?' cur':'')+'" style="padding-left:'+(6+d*14)+'px" data-go="'+c.id+'" data-drop="'+c.id+'"><span class="tg" data-tg="'+c.id+'">'+(has?(open?'▾':'▸'):'')+'</span>'+folderSvg(16)+'<span class="tl">'+esc(c.name)+'</span></div>'+(open?kids(c.id,d+1):'');
  }).join('');
  const tabRow=(k,name,icon)=>'<div class="tn'+(tab===k?' cur':'')+'" data-tab="'+k+'"><span class="tg"></span>'+ic(icon)+'<span class="tl">'+name+'</span></div>';
  el.innerHTML='<div class="tn'+(tab==='files'&&!q&&cwd===null?' cur':'')+'" data-go="" data-drop=""><span class="tg"></span>'+folderSvg(16)+'<span class="tl"><b>파일저장소</b></span></div>'+kids(null,1)
    +'<hr>'+tabRow('recent','최근','clock')+tabRow('star','즐겨찾기','star')+tabRow('trash','휴지통','trash');

function metaOf(it){
  const where=flat()&&tab!=='trash'?(pathOf(it.id).slice(0,-1).map(p=>p.name).join(' › ')||'내 파일'):'';
  let m;
  if(tab==='trash')m='삭제 '+fmtDate(it.deleted_at)+(it.kind==='file'?' · '+fmtSize(it.size):'');
  else if(it.kind==='folder')m='항목 '+children(it.id).filter(c=>!c.deleted_at).length+'개';
  else m=fmtDate(it.created_at)+' · '+fmtSize(it.size);
  return where?m+' · '+where:m;
}

const thumbCache=new Map();let thumbTok=0;
async function loadThumbs(){

async function upd(ids,patch){
  const {error}=await sb.from('folder_items').update(Object.assign({},patch,{updated_at:new Date().toISOString()})).in('id',ids);
  if(error){toast('저장하지 못했습니다. 다시 시도하세요.');return false;}
  ids.forEach(id=>Object.assign(idx.get(id),patch));
  return true;
}
function exitSel(){selMode=false;sel.clear();anchor=null;}
async function trashItems(ids){
  if(await upd(ids,{deleted_at:new Date().toISOString()})){
    ids.forEach(id=>{if(clip)clip.ids=clip.ids.filter(x=>x!==id);});if(clip&&!clip.ids.length)clip=null;
    exitSel();render();toast(ids.length+'개를 휴지통으로 옮겼습니다','실행 취소',()=>restore(ids));
  }
}
async function restore(ids){
  for(const id of ids){
    const it=idx.get(id);if(!it)continue;
    const p=it.parent_id?idx.get(it.parent_id):null,ok=!it.parent_id||(p&&!p.deleted_at);
    await upd([id],ok?{deleted_at:null}:{deleted_at:null,parent_id:null});
  }
  exitSel();render();toast('복원했습니다');
}
async function permDelete(ids,silent){
  const all=new Set(ids),paths=[];
  ids.forEach(id=>descendants(id).forEach(d=>all.add(d.id)));
  all.forEach(id=>{const it=idx.get(id);if(it&&it.kind==='file'&&it.storage_path)paths.push(it.storage_path);});
  for(let k=0;k<paths.length;k+=100)await sb.storage.from(BUCKET).remove(paths.slice(k,k+100));
  const {error}=await sb.from('folder_items').delete().in('id',ids);
  if(error){if(!silent)toast('삭제하지 못했습니다. 다시 시도하세요.');return;}
  items=items.filter(i=>!all.has(i.id));idx=new Map(items.map(i=>[i.id,i]));
  if(clip){clip.ids=clip.ids.filter(x=>!all.has(x));if(!clip.ids.length)clip=null;}
  if(!silent){exitSel();render();toast('영구 삭제했습니다');}
}

let moveIds=[];
async function moveItems(ids,parent){
  parent=parent||null;
  const bad=new Set(),todo=[];
  for(const id of ids){
    const it=idx.get(id);if(!it)continue;
    if(id===parent||(parent&&descendants(id).some(d=>d.id===parent))){bad.add(id);continue;}
    if((it.parent_id||null)===parent)continue;
    todo.push(it);
  }
  if(bad.size&&!todo.length){toast('폴더를 자기 자신이나 그 안으로 옮길 수 없습니다');return;}
  let n=0;
  for(const it of todo){if(await upd([it.id],{parent_id:parent,name:uniqueName(it.name,parent,it.id)}))n++;}
  exitSel();sel=new Set(todo.map(i=>i.id));render();
  toast(n?n+'개를 이동했습니다':'이미 같은 위치입니다');
}
async function copyItems(ids,parent){
  parent=parent||null;
  if(ids.some(id=>id===parent||(parent&&descendants(id).some(d=>d.id===parent)))){toast('폴더를 자기 자신 안으로 복사할 수 없습니다');return;}
  const roots=ids.map(i=>idx.get(i)).filter(Boolean);
  const total=roots.reduce((s,r)=>s+1+descendants(r.id).filter(d=>!d.deleted_at).length,0);let done=0;
  showBusy('복사 중',0,'0 / '+total);
  const made=[];
  const copyNode=async(it,par,top)=>{
    if(it.kind==='folder'){
      const {data,error}=await sb.from('folder_items').insert({parent_id:par,kind:'folder',name:uniqueName(it.name,par)}).select().single();
      if(error)throw error;items.push(data);idx.set(data.id,data);if(top)made.push(data.id);
      showBusy('복사 중',++done/total,done+' / '+total);
      for(const c of children(it.id).filter(c=>!c.deleted_at&&c.id!==data.id))await copyNode(c,data.id,false);
    }else{
      const np=user.id+'/'+crypto.randomUUID();
      const cp=await sb.storage.from(BUCKET).copy(it.storage_path,np);if(cp.error)throw cp.error;
      const {data,error}=await sb.from('folder_items').insert({parent_id:par,kind:'file',name:uniqueName(it.name,par),size:it.size,mime:it.mime,storage_path:np}).select().single();
      if(error){await sb.storage.from(BUCKET).remove([np]);throw error;}
      items.push(data);idx.set(data.id,data);if(top)made.push(data.id);
      showBusy('복사 중',++done/total,done+' / '+total);
    }
  };
  try{for(const r of roots)await copyNode(r,parent,true);sel=new Set(made);toast(roots.length+'개를 복사했습니다');}
  catch(e){toast('복사 중 오류가 발생했습니다. 일부만 복사됐을 수 있어요.');}
  hideBusy();render();
}
async function paste(target){
  if(!clip||!clip.ids.length){toast('붙여넣을 항목이 없습니다');return;}
  if(target===undefined&&(tab!=='files'||q)){toast('폴더를 연 상태에서 붙여넣을 수 있습니다');return;}
  const parent=target!==undefined?target:cwd,c=clip;
  if(c.cut){clip=null;await moveItems(c.ids,parent);}else await copyItems(c.ids,parent);

}

let upBusy=false,upCancel=false,upXhr=null;
function setPbr(el,p){el.style.width=Math.max(0,Math.min(100,p*100))+'%';}
function xhrUpload(path,file,onProg){
  return new Promise(async(res,rej)=>{
    let tok;
    try{const {data}=await sb.auth.getSession();tok=data.session.access_token;}catch(e){rej(new Error('세션이 만료됐습니다. 다시 로그인하세요.'));return;}
    const x=new XMLHttpRequest();upXhr=x;
    x.open('POST',SUPABASE_URL+'/storage/v1/object/'+BUCKET+'/'+path);
    x.setRequestHeader('Authorization','Bearer '+tok);
    x.setRequestHeader('apikey',SUPABASE_KEY);
    x.setRequestHeader('x-upsert','false');
    x.upload.onprogress=e=>{if(e.lengthComputable)onProg(e.loaded,e.total||1);};
    x.onload=()=>{upXhr=null;if(x.status>=200&&x.status<300)res();else{let m='';try{m=JSON.parse(x.responseText).message||'';}catch(e){}rej(new Error(m||('오류 '+x.status)));}};
    x.onerror=()=>{upXhr=null;rej(new Error('네트워크 오류'));};
    x.onabort=()=>{upXhr=null;rej(new Error('취소됨'));};
    const fd=new FormData();fd.append('cacheControl','3600');fd.append('',file);
    x.send(fd);
  });
}
async function uploadList(list,baseParent,dirs){
  if(upBusy){toast('업로드가 진행 중입니다');return;}
  dirs=dirs||[];
  if(!list.length&&!dirs.length)return;
  upBusy=true;upCancel=false;
  const total=list.reduce((s,x)=>s+x.file.size,0),errors=[],t0=Date.now();
  let done=0,okN=0;
  $('#upT').textContent='업로드 중';$('#upSp').className='spin';$('#upB1').className='pbr';$('#upB2').className='pbr thin';
  $('#upE').style.display='none';$('#upE').innerHTML='';$('#upX').textContent='취소';
  $('#upN').textContent='준비 중…';setPbr($('#upF'),0);setPbr($('#upF2'),0);
  $('#upC').textContent='0 / '+list.length+'개';$('#upP').textContent='0%';$('#upS').textContent='0B / '+fmtSize(total);$('#upV').textContent='';
  $('#upm').classList.add('show');
  const cache={};
  const ensure=async path=>{
    let parent=baseParent||null;
    for(const seg of path){
      const key=(parent||'')+'/'+seg;
      if(cache[key]){parent=cache[key];continue;}
      let ex=items.find(i=>i.kind==='folder'&&!i.deleted_at&&(i.parent_id||null)===parent&&i.name===seg);
      if(!ex){
        const {data,error}=await sb.from('folder_items').insert({parent_id:parent,kind:'folder',name:seg}).select().single();
        if(error)throw error;items.push(data);idx.set(data.id,data);ex=data;
      }
      cache[key]=ex.id;parent=ex.id;
    }
    return parent;
  };
  const tick=(loaded)=>{
    const cur=done+loaded,el=(Date.now()-t0)/1000;
    setPbr($('#upF2'),total?cur/total:1);
    $('#upS').textContent=fmtSize(Math.min(cur,total))+' / '+fmtSize(total);
    $('#upV').textContent=el>1&&cur>0?fmtSize(cur/el)+'/초':'';
  };
  try{
    for(const d of dirs)await ensure(d);
    for(let i=0;i<list.length&&!upCancel;i++){
      const file=list[i].file,path=list[i].path||[];
      $('#upN').textContent=file.name;setPbr($('#upF'),0);$('#upP').textContent='0%';
      $('#upC').textContent=(i+1)+' / '+list.length+'개';
      if(file.size>MAX_BYTES){errors.push(file.name+': 50MB를 넘어 올릴 수 없습니다');done+=file.size;tick(0);continue;}
      let parent;
      try{parent=await ensure(path);}catch(e){errors.push(file.name+': 폴더를 만들지 못했습니다');done+=file.size;tick(0);continue;}
      const spath=user.id+'/'+crypto.randomUUID();
      try{
        await xhrUpload(spath,file,(l,t)=>{const p=l/t;setPbr($('#upF'),p);$('#upP').textContent=Math.round(p*100)+'%';tick(l);});
      }catch(e){
        if(upCancel)break;
        errors.push(file.name+': '+(e.message||'업로드 실패'));done+=file.size;tick(0);continue;
      }
      setPbr($('#upF'),1);$('#upP').textContent='100%';done+=file.size;tick(0);
      const ins=await sb.from('folder_items').insert({parent_id:parent,kind:'file',name:uniqueName(file.name,parent),size:file.size,mime:file.type||null,storage_path:spath}).select().single();
      if(ins.error){await sb.storage.from(BUCKET).remove([spath]);errors.push(file.name+': 저장하지 못했습니다');continue;}
      items.push(ins.data);idx.set(ins.data.id,ins.data);okN++;
    }
  }catch(e){errors.push(String(e.message||e));}
  upBusy=false;upXhr=null;
  $('#upSp').className='spin stop';
  if(upCancel){$('#upT').textContent='업로드를 취소했습니다 ('+okN+'개 완료)';$('#upB1').className='pbr fail';}
  else if(errors.length){$('#upT').textContent=okN+'개 완료, '+errors.length+'개 실패';$('#upB1').className='pbr fail';}
  else{$('#upT').textContent='업로드 완료 ('+okN+'개)';$('#upB1').className='pbr done';$('#upB2').className='pbr thin done';setPbr($('#upF'),1);setPbr($('#upF2'),1);}
  if(errors.length){$('#upE').innerHTML=errors.map(e=>'<li>'+esc(e)+'</li>').join('');$('#upE').style.display='block';}
  $('#upX').textContent='닫기';
  render();
  if(!errors.length&&!upCancel)setTimeout(()=>{if(!upBusy)$('#upm').classList.remove('show');},900);
}
$('#upX').onclick=()=>{
  if(upBusy){upCancel=true;if(upXhr)try{upXhr.abort();}catch(e){}}
  else $('#upm').classList.remove('show');
};

async function walkEntry(entry,path,out){
  if(entry.isFile){await new Promise(r=>entry.file(f=>{out.files.push({file:f,path});r();},()=>r()));return;}
  const np=path.concat(entry.name);out.dirs.push(np);
  const rd=entry.createReader();
  for(;;){
    const arr=await new Promise(r=>rd.readEntries(r,()=>r([])));
    if(!arr.length)break;
    for(const en of arr)await walkEntry(en,np,out);
  }
}
async function dropUpload(dt,parent){
  const ens=[],plain=Array.from(dt.files||[]).map(f=>({file:f,path:[]}));
  if(dt.items&&dt.items.length&&dt.items[0].webkitGetAsEntry){
    for(const it of dt.items){if(it.kind==='file'){const en=it.webkitGetAsEntry();if(en)ens.push(en);}}
  }
  if(!ens.length){uploadList(plain,parent,[]);return;}
  const out={files:[],dirs:[]};
  showBusy('폴더 구조를 읽는 중',0,'');
  try{for(const en of ens)await walkEntry(en,[],out);}catch(e){}
  hideBusy();
  uploadList(out.files,parent,out.dirs);
}

  if(error)throw error;return data.signedUrl;
}
function saveUrl(url,name){const a=document.createElement('a');a.href=url;if(name)a.download=name;document.body.appendChild(a);a.click();a.remove();}
async function download(ids){
  const roots=ids.map(i=>idx.get(i)).filter(Boolean);
  if(!roots.length){toast('받을 항목을 선택하세요');return;}
  try{
    if(roots.length===1&&roots[0].kind==='file'){saveUrl(await signed(roots[0].storage_path,60,roots[0].name));return;}
    const files=[];
    const gather=(it,prefix)=>{if(it.kind==='file')files.push([it,prefix]);else{files.push([null,prefix+it.name+'/']);children(it.id).filter(c=>!c.deleted_at).forEach(c=>gather(c,prefix+it.name+'/'));}};
    roots.forEach(r=>gather(r,''));
    const zip=new JSZip();let n=0;const tot=files.filter(f=>f[0]).length;
    showBusy('ZIP으로 묶는 중',0,'0 / '+tot);
    for(const [it,prefix] of files){
      if(!it){zip.folder(prefix);continue;}
      const b=await (await fetch(await signed(it.storage_path,120))).blob();
      zip.file(prefix+it.name,b);n++;showBusy('ZIP으로 묶는 중',n/tot,n+' / '+tot);
    }
    const blob=await zip.generateAsync({type:'blob'});
    hideBusy();
    const u=URL.createObjectURL(blob);
    saveUrl(u,(roots.length===1?roots[0].name:'SIM_Folder_'+new Date().toISOString().slice(0,10))+'.zip');
    setTimeout(()=>URL.revokeObjectURL(u),60000);
    toast('받기 완료');
  }catch(e){hideBusy();toast('받지 못했습니다. 다시 시도하세요.');}
}
async function shareItems(ids){
  const fs=ids.map(i=>idx.get(i)).filter(i=>i&&i.kind==='file');
  if(!fs.length){toast('파일을 선택하세요');return;}
  try{
    showBusy('공유 준비 중',0,'');
    const files=[];
    for(const f of fs){const b=await (await fetch(await signed(f.storage_path,120))).blob();files.push(new File([b],f.name,{type:f.mime||b.type}));}
    hideBusy();
    if(navigator.canShare&&navigator.canShare({files}))await navigator.share({files});
    else toast('이 브라우저는 파일 공유를 지원하지 않습니다');
  }catch(e){hideBusy();if(e&&e.name!=='AbortError')toast('공유하지 못했습니다.');}
}
let vlist=[],vi=0;
async function showMedia(){
  const it=vlist[vi];if(!it)return;
  $('#vname').textContent=it.name+(vlist.length>1?'  ('+(vi+1)+'/'+vlist.length+')':'');

function closeViewer(){$('#viewer').style.display='none';$('#vbox').innerHTML='';}
async function preview(it){

  if(t==='image'||t==='video'){

function targets(id){return id?(sel.has(id)&&sel.size>1?[...sel]:[id]):[...sel];}
function act(k,id){
  const ids=targets(id),need=()=>{if(!ids.length){toast('항목을 먼저 선택하세요');return false;}return true;};
  switch(k){
    case 'mkdir':newFolder();break;
    case 'upload':uploadSheet();break;
    case 'cut':case 'copy':if(!need())return;clip={ids,cut:k==='cut'};exitSel();render();toast(ids.length+'개 '+(k==='cut'?'잘라냄':'복사함')+' — 붙여넣을 폴더를 여세요');break;
    case 'paste':paste();break;
    case 'rename':if(!need())return;if(ids.length!==1){toast('이름은 항목 하나씩 바꿀 수 있습니다');return;}renameItem(ids[0]);break;
    case 'down':if(!need())return;download(ids);break;
    case 'share':if(!need())return;shareItems(ids);break;
    case 'trash':if(!need())return;trashItems(ids);break;
    case 'move':if(!need())return;moveSheet(ids);break;
    case 'star':{if(!need())return;const on=!ids.every(i=>idx.get(i).starred);upd(ids,{starred:on}).then(ok=>{if(ok){exitSel();render();}});break;}
    case 'restore':if(!need())return;restore(ids);break;
    case 'perm':if(!need())return;confirmSheet(ids.length+'개 항목을 영구 삭제할까요? 되돌릴 수 없습니다.','영구 삭제',()=>permDelete(ids));break;
    case 'empty':{const top=items.filter(i=>i.deleted_at&&(!i.parent_id||!(idx.get(i.parent_id)||{}).deleted_at)).map(i=>i.id);if(!top.length){toast('휴지통이 비어 있습니다');return;}confirmSheet('휴지통을 비울까요? 되돌릴 수 없습니다.','휴지통 비우기',()=>permDelete(top));break;}
    case 'open':if(ids.length)openItem(ids[0]);break;
    case 'view':view=view==='grid'?'list':'grid';lset('simfolder.view',view);render();break;
    case 'refresh':load();break;
  }
}

let dragDepth=0;
const hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
function dropEl(e){return e.target.closest&&e.target.closest('[data-drop]');}
function clearDt(){document.querySelectorAll('.dt').forEach(x=>x.classList.remove('dt'));}
ls.addEventListener('dragstart',e=>{
  const r=e.target.closest('.row');if(!r||tab==='trash'){e.preventDefault();return;}
  const id=r.dataset.id;if(!sel.has(id)){sel=new Set([id]);anchor=id;paintSel();}
  dragIds=[...sel];e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','simfolder');
});
document.addEventListener('dragend',()=>{dragIds=null;clearDt();$('#dropmask').classList.remove('on');dragDepth=0;});
document.addEventListener('dragenter',e=>{
  if(!user||!hasFiles(e))return;
  dragDepth++;if(tab==='files'&&!q)$('#dropmask').classList.add('on');
});
document.addEventListener('dragleave',e=>{
  if(!hasFiles(e))return;
  dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#dropmask').classList.remove('on');
});
document.addEventListener('dragover',e=>{
  if(!dragIds&&!hasFiles(e))return;
  e.preventDefault();
  if(!user)return;
  const t=dropEl(e);clearDt();
  if(dragIds){
    const to=t?t.dataset.drop:null;
    const ok=t&&!dragIds.includes(to)&&!(to&&dragIds.some(id=>descendants(id).some(d=>d.id===to)));
    e.dataTransfer.dropEffect=ok?'move':'none';if(ok)t.classList.add('dt');
  }else{e.dataTransfer.dropEffect=tab==='files'&&!q?'copy':'none';if(t&&tab==='files'&&!q)t.classList.add('dt');}
});
document.addEventListener('drop',e=>{
  if(!dragIds&&!hasFiles(e))return;
  e.preventDefault();
  if(!user)return;
  const t=dropEl(e);clearDt();$('#dropmask').classList.remove('on');dragDepth=0;
  if(dragIds){
    const ids=dragIds;dragIds=null;
    if(t){const to=t.dataset.drop||null;if(!ids.includes(to))moveItems(ids,to);}
    return;
  }
  if(tab!=='files'||q){toast('폴더를 연 상태에서 업로드할 수 있습니다');return;}
  dropUpload(e.dataTransfer,t?(t.dataset.drop||null):cwd);
});

  if($('#viewer').style.display==='flex'){
    if(e.key==='ArrowRight'&&vlist.length>1){vi=(vi+1)%vlist.length;showMedia();}
    if(e.key==='ArrowLeft'&&vlist.length>1){vi=(vi-1+vlist.length)%vlist.length;showMedia();}
    return;
  }
  if(modalOpen()||/^(INPUT|TEXTAREA|SELECT)$/.test(tag))return;
  if(/^(BUTTON|A)$/.test(tag)&&(e.key==='Enter'||e.key===' '))return;
  const ctrl=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(ctrl&&k==='a'){e.preventDefault();visible().forEach(i=>sel.add(i.id));paintSel();}
  else if(ctrl&&k==='c'){if(sel.size){e.preventDefault();act('copy');}}
  else if(ctrl&&k==='x'){if(sel.size){e.preventDefault();act('cut');}}
  else if(ctrl&&k==='v'){e.preventDefault();paste();}
  else if(e.key==='Delete'){if(sel.size&&tab!=='trash'){e.preventDefault();act('trash');}}
  else if(e.key==='F2'){e.preventDefault();act('rename');}
  else if(e.key==='Enter'){if(sel.size===1)openItem([...sel][0]);}
  else if(e.key==='Backspace'||(e.altKey&&e.key==='ArrowUp')){e.preventDefault();goUp();}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const ids=visible().map(i=>i.id);if(!ids.length)return;e.preventDefault();
    let i=ids.indexOf(anchor);i=i<0?(e.key==='ArrowDown'?0:ids.length-1):Math.max(0,Math.min(ids.length-1,i+(e.key==='ArrowDown'?1:-1)));
    sel=new Set([ids[i]]);anchor=ids[i];paintSel();
    const row=document.querySelector('#ls .row[data-id="'+ids[i]+'"]');if(row)row.scrollIntoView({block:'nearest'});
  }
});

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&user&&!upBusy&&!modalOpen()&&!selMode&&Date.now()-lastLoad>20000)load();
});

/* ───────── 시작·로그인 ───────── */
function clearLocal(){['simfolder.view','simfolder.sk','simfolder.sa'].forEach(ldel);}
let lastLoad=0;
async function load(){
  lastLoad=Date.now();
  const {data,error}=await sb.from('folder_items').select('*').order('created_at').limit(5000);
  if(error){toast('불러오지 못했습니다. 연결을 확인하세요.');return;}
  items=data;idx=new Map(items.map(i=>[i.id,i]));
  await purgeOld();render();
}
async function showApp(){
  $('#auth').style.display='none';$('#app').style.display='flex';
  history.replaceState({c:null,n:0},'');curSeq=0;maxSeq=0;
  await load();
}
function showAuth(){$('#app').style.display='none';$('#auth').style.display='flex';}
async function doAuth(signup){
  const email=$('#em').value.trim(),password=$('#pw').value;
  $('#aerr').textContent='';
  if(!email||password.length<6){$('#aerr').textContent='이메일과 6자 이상의 비밀번호를 입력하세요.';return;}
  const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){
    const m=(r.error.message||'').toLowerCase();
    $('#aerr').textContent=m.includes('not confirmed')?'이메일 인증이 필요합니다. 받은 편지함과 스팸함에서 확인 메일의 링크를 누른 뒤 로그인하세요.':(signup?'가입하지 못했습니다. 이미 가입한 이메일인지 확인하세요.':'이메일 또는 비밀번호가 맞지 않습니다.');
    return;
  }
  if(r.data.session){user=r.data.session.user;showApp();}
  else $('#aerr').textContent='가입했습니다. 확인 메일의 링크를 누른 뒤 로그인하세요.';
}
$('#login').onclick=()=>doAuth(false);
$('#signup').onclick=()=>doAuth(true);
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth(false);});
(async function boot(){
  if(SUPABASE_URL.startsWith('YOUR')){showAuth();$('#aerr').textContent='설정이 필요합니다: 파일 상단의 SUPABASE_URL, SUPABASE_KEY를 입력하세요.';return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data}=await sb.auth.getSession();
  if(data.session){user=data.session.user;showApp();}else showAuth();
})();
</script>
