<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM Message">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SIM Message</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#ffe600; --accent2:#ffdd00; --ink:#2a2000; --ok:#3ecf8e; --warn:#ffb86b; --bad:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header a.back{color:var(--text);text-decoration:none;font-size:26px;line-height:1;padding:0 6px 3px 0}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
header h1 span{color:var(--accent)}
.spacer{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent2);border-color:var(--accent2);color:var(--ink);font-weight:700}
button.ghost{background:transparent}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
input[type=text],input[type=url],input[type=tel],input[type=search],input[type=date],input[type=time],textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.55}
main{max-width:680px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h2 .n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.card h2 small{margin-left:auto;font-weight:400;color:var(--sub);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.hint.warn{color:var(--warn)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kind{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line);text-align:center}
.kind .e{font-size:26px}
.kind b{font-size:14px}
.kind small{font-size:11px;color:var(--sub)}
.kind.on{border-color:var(--accent);background:rgba(255,230,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:99px;font-size:13px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13px}
.seg button.on{background:var(--accent2);color:var(--ink);font-weight:700}
.lbl{font-size:12px;color:var(--sub);margin:10px 0 5px}
.lbl:first-child{margin-top:0}
.rc{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.rc button{padding:0 6px;border:0;background:transparent;color:var(--sub);font-size:16px;line-height:1}
.var{padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);margin-top:8px;cursor:pointer;white-space:pre-wrap;font-size:14px;line-height:1.55}
.var.on{border-color:var(--accent);background:rgba(255,230,0,.08)}
.var .vl{display:inline-block;font-size:11px;font-weight:700;color:var(--ink);background:var(--accent);padding:1px 8px;border-radius:99px;margin-bottom:5px}
.cnt{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.prev{margin-top:10px;padding:12px;border-radius:14px;background:#0b0d13;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;line-height:1.6}
.prev .pl{font-size:11px;color:var(--accent);margin-bottom:4px;font-weight:700}
.pgimgs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.pgimgs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid var(--line);flex:none;cursor:pointer;background:var(--panel2)}
.pgimgs img:active{border-color:var(--accent)}
#cWrap{position:relative;touch-action:none;align-self:center;max-width:100%;line-height:0;margin:6px 0}
#cImg{display:block;max-width:100%;max-height:48vh;user-select:none;-webkit-user-drag:none}
#cBox{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.6);cursor:move;touch-action:none}
.thumb{position:relative;display:inline-block;margin-top:10px}
.thumb img{display:block;width:150px;height:150px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.thumb button{position:absolute;top:6px;right:6px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.65);font-size:14px}
audio{width:100%;margin-top:10px;height:40px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:260px;overflow-y:auto}
.item{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer}
.item.on{border-color:var(--accent);background:rgba(255,230,0,.08)}
.item .t{font-weight:600;font-size:14px}
.item .s{font-size:12px;color:var(--sub)}
.item .dt{font-size:12px;color:var(--accent);white-space:nowrap}
.send{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.srow{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.srow.done{border-color:#1f5c44}
.srow .nm{font-weight:600;font-size:14px}
.srow .ph{font-size:12px;color:var(--sub)}
.srow .st{font-size:12px;color:var(--ok);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modal.show{display:flex}
.modal .box{width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.modal h3{font-size:16px;margin-bottom:10px}
.modal .scroll{overflow-y:auto;flex:1;min-height:80px;margin:8px 0}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:90;color:#fff;font-size:15px;text-align:center;padding:20px}
#busy.show{display:flex}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222a3d;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.badge{display:inline-block;font-size:10px;padding:0 6px;border-radius:99px;border:1px solid var(--line);color:var(--sub);margin-left:6px;vertical-align:1px;font-weight:400}
.badge.dev{color:var(--accent);border-color:var(--accent)}
.rc{cursor:pointer}
.srow{flex-wrap:wrap}
.srow .btns{display:flex;gap:6px;flex-wrap:wrap}
.hide{display:none!important}
.empty{padding:16px 6px;text-align:center;color:var(--sub);font-size:13px}
</style>
<script src="ui-guard.js" defer></script>
<script src="sync.js?bg=1" defer></script>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="런처로">‹</a>
  <h1>SIM <span>Message</span></h1>
  <div class="spacer"></div>
  <button class="sm" id="btnSet">AI 설정</button>
</header>

<main>
  <!-- 1. 종류 -->
  <section class="card">
    <h2><span class="n">1</span>문자 종류</h2>
    <div class="kinds" id="kinds">
      <button class="kind on" data-k="greet"><span class="e">💌</span><b>인사</b></button>
      <button class="kind" data-k="product"><span class="e">📦</span><b>상품소개</b></button>
      <button class="kind" data-k="schedule"><span class="e">📅</span><b>일정안내</b></button>
    </div>
    <div class="chips" id="subs" style="margin-top:10px"></div>
  </section>

  <!-- 2. 내용 -->
  <section class="card" id="cContent">
    <h2><span class="n">2</span>내용</h2>
    <div id="pGreet">
      <div class="lbl">AI에게 덧붙일 말</div>
      <input type="text" id="extra" placeholder="예: 지난 점검 때 도와주셔서 감사 / 환절기 건강 당부" maxlength="120">
    </div>
    <div id="pProduct" class="hide">
      <div class="lbl">상품 자료</div>
      <textarea id="material" rows="6" placeholder="상품 설명, 요금표, 특징 등을 붙여넣으면 AI가 핵심만 요약해 소개 문자로 만듭니다."></textarea>
      <div class="row" style="margin-top:8px">
        <button class="sm" id="btnMatFile">텍스트 파일</button>
        <button class="sm" id="btnMatImg">사진·캡처로 읽기</button>
        <span class="hint" id="matInfo" style="margin:0"></span>
      </div>
      <div class="row nw" style="margin-top:8px">
        <input type="url" id="matUrl" placeholder="판매 페이지 링크 (https://…)" inputmode="url" style="flex:1;min-width:0">
        <button class="sm" id="btnMatUrl">링크에서 읽기</button>
      </div>
      <label class="hint" style="display:flex;gap:6px;align-items:center;margin:6px 0 0"><input type="checkbox" id="matLink" checked> 문자 끝에 판매 페이지 링크 붙이기</label>
      <div id="pgInfo" class="hide">
        <div class="lbl">상품 이미지</div>
        <div class="pgimgs" id="pgImgs"></div>
      </div>
      <div class="row" style="margin-top:8px"><button class="sm" id="btnCropPick">📷 사진을 잘라서 첨부</button></div>
      <div class="lbl">가격</div>
      <div class="chips" id="pgPrices"></div>
      <div class="row nw" style="margin-top:6px">
        <input type="text" id="price" placeholder="예: 29,900원 (비우면 가격 없음)" maxlength="30" style="flex:1;min-width:0">
      </div>
      <label class="hint" style="display:flex;gap:6px;align-items:center;margin:6px 0 0"><input type="checkbox" id="priceOn" checked> 문자에 가격 포함</label>
      <input type="file" id="fCrop" accept="image/*" class="hide">
      <input type="file" id="fMat" accept=".txt,.md,.csv,text/plain" class="hide">
      <input type="file" id="fMatImg" accept="image/*" class="hide">
    </div>
    <div id="pSchedule" class="hide">
      <div class="seg" id="schSeg"><button data-m="cal" class="on">달력에서 선택</button><button data-m="man">직접 입력</button></div>
      <div id="schCal">
        <div class="chips" id="evTabs" style="margin-top:10px"></div>
        <div class="list" id="evList"></div>
        <div class="row" style="margin-top:8px"><button class="sm" id="btnIcs">📅 기기 일정 가져오기 (.ics)</button><button class="sm ghost hide" id="btnIcsClr">가져온 일정 지우기</button></div>
        <input type="file" id="fIcs" accept=".ics,text/calendar" multiple class="hide">
      </div>
      <div id="schMan" class="hide">
        <div class="lbl">일정 제목</div><input type="text" id="mTitle" maxlength="60" placeholder="예: 단지 보안 점검 협의">
        <div class="row nw"><div class="grow"><div class="lbl">날짜</div><input type="date" id="mDate"></div><div class="grow"><div class="lbl">시간</div><input type="time" id="mTime"></div></div>
        <div class="lbl">장소 (선택)</div><input type="text" id="mLoc" maxlength="60">
        <div class="lbl">전달 사항 (선택)</div><input type="text" id="mMemo" maxlength="100">
      </div>
      <div class="hint" id="schInfo"></div>
    </div>
  </section>

  <!-- 3. 받는 사람 -->
  <section class="card">
    <h2><span class="n">3</span>받는 사람 <small id="rcCount"></small></h2>
    <div class="chips" id="rcs"></div>
    <div class="row" style="margin-top:10px">
      <button class="sm" id="btnPick">연락처 선택 (SIM·기기)</button>
    </div>
    <div class="row nw" style="margin-top:8px">
      <input type="text" id="rName" placeholder="이름" style="width:28%">
      <input type="text" id="rTitle" placeholder="직함" style="width:22%">
      <input type="tel" id="rPhone" placeholder="전화번호" class="grow">
      <button class="sm" id="btnAddR">추가</button>
    </div>
  </section>

  <!-- 4. 옵션 -->
  <section class="card">
    <h2><span class="n">4</span>문구 옵션</h2>
    <div class="lbl">어투</div>
    <div class="seg" id="sTone"><button data-v="formal" class="on">정중</button><button data-v="friendly">친근</button><button data-v="brief">간결</button></div>
    <div class="lbl">길이</div>
    <div class="seg" id="sLen"><button data-v="short">짧게(SMS)</button><button data-v="mid" class="on">보통</button><button data-v="long">길게</button></div>
    <div class="lbl">보낼 곳</div>
    <div class="seg" id="sCh"><button data-v="sms" class="on">문자</button><button data-v="kakao">카카오톡</button></div>
    <div class="lbl">서명 (마지막 줄)</div>
    <input type="text" id="sender" maxlength="60" placeholder="예: 에스원 북서울지사 ○○○ 드림">
  </section>

  <!-- 5. 문구 -->
  <section class="card">
    <h2><span class="n">5</span>문구 <small id="aiBadge"></small></h2>
    <button class="primary" id="btnGen" style="width:100%">✨ AI로 문구 만들기</button>
    <div id="vars"></div>
    <div class="lbl" style="margin-top:12px">최종 문구</div>
    <textarea id="body" rows="6" placeholder="위 버튼으로 문구를 만들거나 여기에 직접 쓰세요. 받는 사람 자리는 {수신자} 로 적습니다."></textarea>
    <div class="cnt"><span id="cntType"></span><span id="cntLen"></span></div>
    <div class="row" style="margin-top:8px"><button class="sm" id="btnUndo" disabled>↶ 되돌리기</button><button class="sm" id="btnRedo" disabled>↷ 다시</button></div>
    <div class="lbl">AI로 다듬기</div>
    <div class="chips" id="edChips"><span class="chip" data-e="short">더 짧게</span><span class="chip" data-e="long">더 길게</span><span class="chip" data-e="formal">더 정중하게</span><span class="chip" data-e="friendly">더 친근하게</span><span class="chip" data-e="emoji">이모지 넣기</span><span class="chip" data-e="noemoji">이모지 빼기</span><span class="chip" data-e="spell">맞춤법 교정</span></div>
    <div class="row nw" style="margin-top:8px"><input type="text" id="edText" class="grow" maxlength="150" placeholder="직접 요청: 예) 날짜를 맨 앞에, 부담 없는 톤으로"><button class="sm" id="btnEd">다듬기</button></div>
    <div class="prev hide" id="prevBox"><div class="pl" id="prevLbl"></div><div id="prevTxt"></div></div>
  </section>

  <!-- 6. 첨부 -->
  <section class="card">
    <h2><span class="n">6</span>이미지·소리 <small>선택</small></h2>
    <div class="lbl">이미지</div>
    <div class="row">
      <button class="sm" id="btnImgPick">사진 선택</button>
      <button class="sm" id="btnImgAi">🎨 AI 이미지 만들기</button>
      <select id="imgStyle" style="width:auto;padding:6px 10px">
        <option value="watercolor">수채화</option><option value="flat">깔끔한 일러스트</option><option value="photo">사진 느낌</option><option value="paper">페이퍼 컷</option>
      </select>
    </div>
    <input type="file" id="fImg" accept="image/*" class="hide">
    <div id="imgBox"></div>
    <div class="lbl">소리</div>
    <div class="seg" id="sAud"><button data-v="none" class="on">없음</button><button data-v="melody">멜로디</button><button data-v="tts">AI 음성</button><button data-v="both">음성+멜로디</button></div>
    <div id="audOpts" class="hide">
      <div class="row nw" style="margin-top:8px">
        <select id="melody" class="grow"></select>
        <select id="voice" class="grow">
          <option value="Kore">여성 · 차분(Kore)</option><option value="Leda">여성 · 부드러움(Leda)</option><option value="Aoede">여성 · 밝음(Aoede)</option><option value="Zephyr">여성 · 산뜻(Zephyr)</option>
          <option value="Charon">남성 · 안정(Charon)</option><option value="Orus">남성 · 단단함(Orus)</option><option value="Puck">남성 · 경쾌(Puck)</option><option value="Fenrir">남성 · 힘참(Fenrir)</option>
        </select>
      </div>
      <button class="sm" id="btnAud" style="margin-top:8px">🔊 만들어서 들어보기</button>
    </div>
    <audio id="aud" controls class="hide"></audio>
  </section>

  <!-- 7. 보내기 -->
  <section class="card">
    <h2><span class="n">7</span>보내기 <small id="sendCount"></small></h2>
    <div class="send" id="sendList"></div>
    <div class="row" style="margin-top:10px">
      <button class="sm" id="btnCopy">문구 복사</button>
      <button class="sm" id="btnKakao">카톡으로 공유</button>
    </div>
  </section>
</main>

<!-- 연락처 선택 -->
<div class="modal" id="mPick"><div class="box">
  <h3>연락처에서 선택</h3>
  <div class="seg" id="pSrc"><button data-s="sim" class="on">SIM 연락처</button><button data-s="dev">기기 연락처</button></div>
  <div id="pDev" class="hide" style="margin-top:8px">
    <div class="row"><button class="sm" id="pApi">📱 기기 연락처 불러오기</button><button class="sm" id="pVcf">연락처 파일(.vcf) 열기</button></div>
    <input type="file" id="fVcf" accept=".vcf,text/vcard,text/x-vcard,text/directory" multiple class="hide">
  </div>
  <div class="row nw" style="margin-top:8px"><input type="search" id="pq" placeholder="이름·회사·직함 검색" class="grow"><select id="pg" style="width:36%"></select></div>
  <div class="row" style="margin-top:8px"><button class="sm" id="pAll">보이는 사람 모두 선택</button><span class="hint" id="pInfo" style="margin:0"></span></div>
  <div class="scroll"><div class="list" id="pList" style="max-height:none"></div></div>
  <div class="row"><button class="grow" id="pCancel">닫기</button><button class="primary grow" id="pOk">선택 완료</button></div>
</div></div>

<!-- 받는 사람 수정 -->
<div class="modal" id="mChip"><div class="box">
  <h3>받는 사람 수정</h3>
  <div class="lbl">이름</div><input type="text" id="cName" maxlength="30">

/* ════════ 저장소 읽기 (SIM Phone 연락처, SIM Calendar·Assistant 일정) ════════
   같은 주소의 IndexedDB를 읽기만 한다. 없는 DB를 새로 만들어 다른 앱을 망가뜨리지 않도록 업그레이드 시 취소한다. */
function idbReadAll(dbName, store) {
  return new Promise(res => {
    if (!window.indexedDB) return res([]);
    let r; try { r = indexedDB.open(dbName); } catch (e) { return res([]); }
    r.onupgradeneeded = () => { try { r.transaction.abort(); } catch (e) {} };
    r.onerror = () => res([]); r.onblocked = () => res([]);
    r.onsuccess = () => {
      const db = r.result;
      try {
        if (!db.objectStoreNames.contains(store)) { db.close(); return res([]); }
        const q = db.transaction(store, 'readonly').objectStore(store).getAll();
        q.onsuccess = () => { db.close(); res(q.result || []); };
        q.onerror = () => { db.close(); res([]); };
      } catch (e) { try { db.close(); } catch (x) {} res([]); }
    };
  });
}

/* 이미지 자르기: 비율을 고르고, 영역을 끌어 옮기고, 크기 슬라이더로 줄인다 */
const CR = { w: 0, h: 0, ratio: 1, z: 1, x: 0, y: 0, bw: 0, bh: 0 };
function crLayout() {
  const im = $('cImg'), W = CR.w, H = CR.h, r = CR.ratio || W / H;
  let bw = Math.min(W, H * r), bh = bw / r; bw /= CR.z; bh /= CR.z;
  CR.bw = bw; CR.bh = bh; CR.x = Math.max(0, Math.min(W - bw, CR.x)); CR.y = Math.max(0, Math.min(H - bh, CR.y));
  const k = im.clientWidth / W, b = $('cBox');
  b.style.left = CR.x * k + 'px'; b.style.top = CR.y * k + 'px'; b.style.width = bw * k + 'px'; b.style.height = bh * k + 'px';
}
function openCrop(url) {
  const im = $('cImg');
  im.onload = () => { CR.w = im.naturalWidth; CR.h = im.naturalHeight; CR.z = 1; $('cZoom').value = 1; CR.x = CR.y = 0; $('mCrop').classList.add('show'); crLayout(); const r = CR.ratio || CR.w / CR.h; CR.x = (CR.w - CR.bw) / 2; CR.y = (CR.h - CR.bh) / 2; crLayout(); };
  im.onerror = () => toast('이미지를 열지 못했어요');
  im.src = url;
}
$('cRatio').onclick = e => { const b = e.target.closest('button'); if (!b) return; CR.ratio = +b.dataset.r; document.querySelectorAll('#cRatio button').forEach(x => x.classList.toggle('on', x === b)); const cx = CR.x + CR.bw / 2, cy = CR.y + CR.bh / 2; crLayout(); CR.x = cx - CR.bw / 2; CR.y = cy - CR.bh / 2; crLayout(); };
$('cZoom').oninput = () => { const cx = CR.x + CR.bw / 2, cy = CR.y + CR.bh / 2; CR.z = +$('cZoom').value; crLayout(); CR.x = cx - CR.bw / 2; CR.y = cy - CR.bh / 2; crLayout(); };
(() => {
  let d = null; const b = $('cBox');
  b.onpointerdown = e => { d = { px: e.clientX, py: e.clientY, x: CR.x, y: CR.y }; b.setPointerCapture(e.pointerId); e.preventDefault(); };
  b.onpointermove = e => { if (!d) return; const k = CR.w / $('cImg').clientWidth; CR.x = d.x + (e.clientX - d.px) * k; CR.y = d.y + (e.clientY - d.py) * k; crLayout(); };

})();

$('cOk').onclick = () => {

  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage($('cImg'), CR.x, CR.y, CR.bw, CR.bh, 0, 0, c.width, c.height);

const KEY_DEVEV = 'simmsg_devev';

const readDevEv = () => { try { const j = JSON.parse(ls.get(KEY_DEVEV, '')); return j && Array.isArray(j.ev) ? j : { at: '', ev: [] }; } catch (e) { return { at: '', ev: [] }; } };
const evWindow = () => { const a = new Date(); a.setHours(0, 0, 0, 0); return [a, new Date(a.getTime() + 120 * 864e5)]; };
async function loadEvents() {
  $('evList').innerHTML = '<div class="empty">일정을 불러오는 중…</div>';
  const [own, asst] = await Promise.all([idbReadAll('simcalendar', 'events'), idbReadAll('simassistant', 'events')]);
  const [a, z] = evWindow();
  const inWin = r => { const s = new Date(r.start); return !isNaN(s) && s >= a && s <= z; };
  const byTime = (x, y) => new Date(x.start) - new Date(y.start);
  const sim = [].concat(own.map(r => Object.assign({}, r, { _src: 'own' })), asst.map(r => Object.assign({}, r, { _src: 'asst' }))).filter(inWin).sort(byTime).slice(0, 60);
  const dev = readDevEv().ev.map(r => Object.assign({}, r, { _src: 'dev' })).filter(inWin).sort(byTime).slice(0, 150);
  EVENTS = sim.concat(dev);
  if (S.ev) { S.ev = EVENTS.find(r => r._src === S.ev._src && r.id === S.ev.id && r.start === S.ev.start) || null; if (!S.ev) $('schInfo').textContent = ''; }
  renderEvTabs(); renderEvents();
}
function renderEvTabs() {
  const nd = EVENTS.filter(r => r._src === 'dev').length, dv = readDevEv();
  $('evTabs').innerHTML = '<span class="chip' + (evTab === 'sim' ? ' on' : '') + '" data-t="sim">SIM 일정표</span><span class="chip' + (evTab === 'dev' ? ' on' : '') + '" data-t="dev">기기 일정' + (nd ? ' ' + nd : '') + '</span>';
  $('btnIcsClr').classList.toggle('hide', !dv.ev.length);
}
function renderEvents() {
  const L = EVENTS.filter(r => evTab === 'dev' ? r._src === 'dev' : r._src !== 'dev');
  if (!L.length) {
    $('evList').innerHTML = evTab === 'dev'
      ? '<div class="empty">가져온 기기 일정이 없어요</div>'
      : '<div class="empty">등록된 일정이 없어요</div>';

}

$('fIcs').onchange = async e => {
  const files = [].slice.call(e.target.files); e.target.value = ''; if (!files.length) return;
  const [a, z] = evWindow(); let got = [];
  for (const f of files) { try { got = got.concat(parseIcs(await f.text(), a, z)); } catch (x) { /* 읽을 수 없는 파일은 건너뜀 */ } }

  const map = new Map(readDevEv().ev.map(r => [r.id, r]));
  got.forEach(r => map.set(r.id, r));
  const list = [...map.values()].sort((x, y) => new Date(x.start) - new Date(y.start)).slice(0, 300);
  ls.set(KEY_DEVEV, JSON.stringify({ at: new Date().toISOString(), ev: list }));
  evTab = 'dev'; await loadEvents(); toast(got.length + '개 일정을 가져왔어요');

/* 연락처 선택: SIM 연락처(SIM Phone)와 기기 연락처 중에서 고른다.
   SIM 연락처는 같은 주소의 IndexedDB를 읽고, 기기 연락처는 Contact Picker(안드로이드 크롬) 또는 .vcf 파일로 가져온다. */
const HAS_PICKER = !!(navigator.contacts && navigator.contacts.select);

const aiPhone = () => digits(ls.get(KEY_PHONE, ''));
async function aiCall(payload, ms, fn) {
  const phone = aiPhone();
  if (!phone) { openSet(); throw new Error('먼저 AI 연결 번호를 등록해 주세요'); }
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms || 40000);
  try {
    const r = await fetch('https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/' + (fn || 'message-ai'), { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ phone }, payload)) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return j;
    throw new Error(r.status === 403 ? '등록되지 않은 전화번호예요' : r.status === 429 ? (j.error === 'quota' ? 'AI 사용 한도에 도달했어요' : '잠시 뒤 다시 눌러 주세요') : 'AI 응답 실패 (' + r.status + ')');
  } catch (e) { throw e && e.name === 'AbortError' ? new Error('응답이 너무 늦어요') : (e instanceof TypeError ? new Error('네트워크 연결 실패') : e); }
  finally { clearTimeout(to); }
}

/* ── 문구 수정: 직접 고치기 · AI로 다듬기 · 되돌리기 · 받는 사람별 개별 수정 ── */
const H = { stack: [], i: -1, t: 0 };
function histBtns() { $('btnUndo').disabled = H.i <= 0; $('btnRedo').disabled = H.i >= H.stack.length - 1; }
function histPush(txt) {
  if (H.stack[H.i] === txt) return histBtns();
  H.stack = H.stack.slice(0, H.i + 1); H.stack.push(txt);
  if (H.stack.length > 60) H.stack.shift();
  H.i = H.stack.length - 1; histBtns();
}
function dropOverrides() { if (Object.keys(S.over).length) { S.over = {}; toast('본문이 바뀌어 사람별 개별 수정이 초기화됐어요', 3400); } }
function setBody(txt, track) {
  if ($('body').value !== txt) dropOverrides();
  $('body').value = txt;
  if (track !== false) histPush(txt);
  updateAll();
}
function applyVariant(i) { S.pick = i; setBody(S.variants[i].text); renderVars(); }
$('body').oninput = () => { dropOverrides(); clearTimeout(H.t); H.t = setTimeout(() => histPush($('body').value), 700); updateAll(); };
function flushHist() { clearTimeout(H.t); histPush($('body').value); }
$('btnUndo').onclick = () => { flushHist(); if (H.i > 0) { H.i--; setBody(H.stack[H.i], false); histBtns(); } };
$('btnRedo').onclick = () => { flushHist(); if (H.i < H.stack.length - 1) { H.i++; setBody(H.stack[H.i], false); histBtns(); } };

function fileToDataUrl(file, max, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const dataUrlToFile = (u, name) => { const [h, b] = u.split(','), mime = /:(.*?);/.exec(h)[1], bin = atob(b), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new File([a], name, { type: mime }); };

  imgUrl = file ? URL.createObjectURL(file) : '';
  $('imgBox').innerHTML = file ? '<div class="thumb"><img src="' + imgUrl + '" alt="첨부 이미지"><button id="imgDel" aria-label="이미지 삭제">×</button></div>' : '';
  const d = $('imgDel'); if (d) d.onclick = () => { setImage(null); updateAll(); };
  updateAll();
}

/* ════════ 6. 소리: 멜로디(직접 합성) + AI 음성 ════════ */
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function noteTo(ctx, dest, freq, t, dur, wave, vol) {
  const g = ctx.createGain(); g.connect(dest);
  const add = (type, f, v, rel) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; const gg = ctx.createGain(); gg.gain.value = v; o.connect(gg); gg.connect(g); o.start(t); o.stop(t + dur * rel + 0.05); };
  if (wave === 'bell') { add('sine', freq, 1, 3.2); add('sine', freq * 2.005, 0.35, 2.2); add('sine', freq * 3.01, 0.12, 1.4); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0008, t + dur * 3.2); }
  else if (wave === 'pluck') { add('triangle', freq, 1, 2.4); add('sine', freq * 2, 0.3, 1.2); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0008, t + dur * 2.4); }
  else { add('sine', freq, 1, 2.2); add('triangle', freq, 0.25, 2.2); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0008, t + dur * 2.2); }
}
// 패턴을 maxDur초가 될 때까지 반복해 ctx에 예약한다. step = 8분음표
function scheduleMelody(ctx, preset, t0, maxDur, gain) {
  const master = ctx.createGain(); master.connect(ctx.destination);
  master.gain.setValueAtTime(gain, t0); master.gain.setValueAtTime(gain, t0 + Math.max(0, maxDur - 1.2)); master.gain.linearRampToValueAtTime(0.0001, t0 + maxDur);
  const step = 60 / preset.bpm / 2, n = preset.pat.length, bar = step * 8;
  let i = 0;
  for (let t = 0; t < maxDur - 0.2; t += step, i++) {
    const m = preset.pat[i % n];
    if (m) noteTo(ctx, master, midi(m), t0 + t, step * 1.6, preset.wave, 0.5);
    if (preset.pad && i % 8 === 0) preset.pad.forEach(pm => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = midi(pm); g.gain.setValueAtTime(0, t0 + t); g.gain.linearRampToValueAtTime(0.16, t0 + t + 0.4); g.gain.linearRampToValueAtTime(0, t0 + t + bar); o.connect(g); g.connect(master); o.start(t0 + t); o.stop(t0 + t + bar + 0.05); });
  }
}
const RATE = 24000;
async function renderMelodyWav(id, secs) {
  const p = MELODIES.find(m => m.id === id) || MELODIES[0];
  const ctx = new OfflineAudioContext(1, RATE * secs, RATE);
  scheduleMelody(ctx, p, 0, secs, 0.45);
  const buf = await ctx.startRendering();
  return new Blob([wavEncode(buf.getChannelData(0), RATE)], { type: 'audio/wav' });
}
async function mixVoiceWav(voiceBlob, id) {
  const p = MELODIES.find(m => m.id === id) || MELODIES[0];
  const dec = await new OfflineAudioContext(1, 1, RATE).decodeAudioData(await voiceBlob.arrayBuffer());
  const lead = 0.8, total = lead + dec.duration + 1.6;
  const ctx = new OfflineAudioContext(1, Math.ceil(total * RATE), RATE);
  scheduleMelody(ctx, p, 0, total, 0.16);
  const src = ctx.createBufferSource(); src.buffer = dec; const g = ctx.createGain(); g.gain.value = 1; src.connect(g); g.connect(ctx.destination); src.start(lead);
  const buf = await ctx.startRendering();
  return new Blob([wavEncode(buf.getChannelData(0), RATE)], { type: 'audio/wav' });
}
const b64ToBlob = (b64, mime) => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); };
const voiceCache = new Map();
async function ttsBlob(text) {
  const key = $('voice').value + '|' + text;
  if (voiceCache.has(key)) return voiceCache.get(key);
  const style = ({ formal: '정중하고 차분한 어투로', friendly: '밝고 다정한 어투로', brief: '담백하고 또렷한 어투로' })[S.opts.tone];
  const j = await aiCall({ action: 'tts', text: text.replace(/\s*\n+\s*/g, ' '), voice: $('voice').value, style }, 90000);
  const b = b64ToBlob(j.data, j.mime || 'audio/wav'); voiceCache.set(key, b); return b;
}
// 수신자 한 명을 위한 소리 파일을 만든다 (음성은 이름이 들어가야 하므로 사람마다 만든다)
const audCache = new Map();
async function audioFor(r) {
  const mode = S.aud; if (mode === 'none') return null;
  const mel = $('melody').value;
  const text = textFor(r);
  const key = [mode, mel, $('voice').value, mode === 'melody' ? '' : text].join('|');
  if (audCache.has(key)) return audCache.get(key);
  let blob;
  if (mode === 'melody') blob = await renderMelodyWav(mel, 14);
  else {
    let v = null;
    try { v = await ttsBlob(text); }
    catch (e) { if (mode === 'tts') throw new Error('AI 음성은 Gemini로만 만들 수 있어요. 지금은 쓸 수 없어요 (' + (e.message || e) + ')'); toast('AI 음성을 쓸 수 없어 멜로디만 넣었어요', 3600); }
    blob = !v ? await renderMelodyWav(mel, 14) : mode === 'tts' ? v : await mixVoiceWav(v, mel);
  }
  const f = new File([blob], 'SIM메시지-' + (mode === 'melody' ? '멜로디' : '음성') + '.wav', { type: 'audio/wav' });
  audCache.set(key, f); return f;
}
$('sAud').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; S.aud = b.dataset.v;
  document.querySelectorAll('#sAud button').forEach(x => x.classList.toggle('on', x === b));
  $('audOpts').classList.toggle('hide', S.aud === 'none');
  $('melody').classList.toggle('hide', S.aud === 'tts'); $('voice').classList.toggle('hide', S.aud === 'melody');
  $('aud').classList.add('hide'); updateAll();
};
let audUrl = '';
$('btnAud').onclick = async () => {
  if ((S.aud === 'tts' || S.aud === 'both') && !$('body').value.trim()) return toast('음성으로 읽을 문구를 먼저 만들어 주세요');
  busy(true, S.aud === 'melody' ? '멜로디를 만드는 중…' : 'AI 음성을 만드는 중… (5~20초)');
  try {
    const f = await audioFor(S.recips[0] || null);
    if (audUrl) URL.revokeObjectURL(audUrl); audUrl = URL.createObjectURL(f);
    const a = $('aud'); a.src = audUrl; a.classList.remove('hide'); a.play().catch(() => {});
  } catch (e) { toast('소리 만들기 실패: ' + (e.message || e), 4200); }
  busy(false);
};

/* ════════ 7. 보내기 ════════ */
const hasMedia = () => !!S.img || S.aud !== 'none';
function updateAll() {
  const body = $('body').value, r0 = S.recips[0];
  const bytes = smsBytes(textFor(r0)), type = S.opts.ch === 'kakao' ? '카카오톡' : smsType(textFor(r0), hasMedia());
  $('cntType').textContent = body.trim() ? (S.opts.ch === 'kakao' ? '카카오톡' : type + (type === 'LMS' ? ' (장문)' : type === 'MMS' ? ' (첨부)' : '')) : '';
  $('cntLen').textContent = body.trim() ? [...textFor(r0)].length + '자 · ' + bytes + '바이트' : '';
  const pb = $('prevBox'); pb.classList.toggle('hide', !body.trim());
  $('prevLbl').textContent = '미리보기 · ' + (r0 ? honorific(r0) + '에게' : '받는 사람을 고르면 이름이 들어가요');
  $('prevTxt').textContent = textFor(r0);
  $('sendCount').textContent = S.recips.length ? S.recips.length + '명' : '';
  renderSend();
}
function renderSend() {
  const L = S.recips.length ? S.recips : [null];
  const media = hasMedia();
  $('sendList').innerHTML = L.map(r => {
    const id = r ? r.id : '_none', done = S.sent[id], ov = r && S.over[r.id] != null;
    return '<div class="srow' + (done ? ' done' : '') + '"><div class="grow"><div class="nm">' + esc(r ? honorific(r) : '') + (ov ? '<span class="badge dev">개별 수정</span>' : '') + '</div><div class="ph">' + esc(r ? fmtPhone(r.phone) : '') + '</div>' + (done ? '<div class="st">✓ ' + esc(done) + '</div>' : '') + '</div><div class="btns">' +
      (media ? '' : '<button class="primary sm" data-a="sms" data-id="' + id + '">문자앱</button>') +
      '<button class="sm" data-a="share" data-id="' + id + '">' + (media ? '공유하기' : '공유') + '</button>' +
      (r ? '<button class="sm" data-a="edit" data-id="' + id + '">수정</button>' : '') +
      (r && media ? '<button class="sm" data-a="num" data-id="' + id + '">번호복사</button>' : '') + '</div></div>';
  }).join('');
}
const recipById = id => S.recips.find(r => r.id === id) || null;
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (x) {} ta.remove(); return ok;
  }
}
function markSent(id, how) { S.sent[id] = how + ' · ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); renderSend(); }
let pendingSms = null;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && pendingSms) { markSent(pendingSms, '문자앱 열림'); pendingSms = null; } });
async function shareFor(r, via) {
  const text = textFor(r);
  const files = [];
  if (S.img) files.push(S.img);
  try {
    if (S.aud !== 'none') { busy(true, S.aud === 'melody' ? '멜로디 준비 중…' : 'AI 음성을 만드는 중…'); const a = await audioFor(r); busy(false); if (a) files.push(a); }
  } catch (e) { busy(false); toast('소리 준비 실패: ' + (e.message || e), 4200); return; }
  const data = { text }; if (files.length) data.files = files;
  // 카카오톡 등 일부 앱은 이미지·파일과 함께 공유하면 글을 버리고 파일만 받는다 → 먼저 문구를 복사해 두고 붙여넣게 안내
  const pasted = files.length ? await copyText(text) : false;
  if (navigator.share && (!files.length || (navigator.canShare && navigator.canShare({ files })))) {
    try {
      await navigator.share(data); markSent(r ? r.id : '_none', via === 'kakao' ? '공유(카카오톡)' : '공유창 열림');
      if (pasted) toast('문구도 복사해 뒀어요. 앱에서 글이 빠졌다면 대화창에 붙여넣기(길게 누르기) 하세요', 6000);
      return;
    }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const ok = await copyText(text);
  toast(ok ? '이 기기는 공유창을 지원하지 않아 문구를 복사했어요. 직접 붙여넣어 보내세요' + (files.length ? ' (이미지·소리는 위 미리보기에서 저장)' : '') : '공유와 복사 모두 실패했어요', 4500);
}
$('sendList').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (!$('body').value.trim()) return toast('보낼 문구가 비어 있어요');
  const r = recipById(b.dataset.id), a = b.dataset.a;
  if (a === 'sms') {
    const url = buildSmsUrl(r ? [r.phone] : [], textFor(r), isIOS);
    pendingSms = r ? r.id : '_none'; location.href = url;
  } else if (a === 'share') await shareFor(r, S.opts.ch === 'kakao' ? 'kakao' : 'share');
  else if (a === 'edit') openEdit(b.dataset.id);
  else if (a === 'num') toast((await copyText(fmtPhone(r.phone))) ? '번호를 복사했어요: ' + fmtPhone(r.phone) : '복사 실패');
};
$('btnCopy').onclick = async () => { if (!$('body').value.trim()) return toast('복사할 문구가 없어요'); toast((await copyText(textFor(S.recips[0]))) ? '복사했어요' : '복사 실패'); };
$('btnKakao').onclick = async () => { if (!$('body').value.trim()) return toast('보낼 문구가 비어 있어요'); await shareFor(S.recips[0] || null, 'kakao'); };

/* ════════ 설정 ════════ */
function openSet() { location.href = 'index.html?ai=gemini'; }   // AI 연결 설정·테스트는 런처의 AI 아이콘 팝업에서
$('btnSet').onclick = openSet;
$('mPick').addEventListener('click', e => { if (e.target === $('mPick')) $('mPick').classList.remove('show'); });
['mChip', 'mEdit'].forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) $(id).classList.remove('show'); }));

/* ════════ 시작 ════════ */
renderRecips(); refreshBadge(); histPush(''); setKind('greet');
$('melody').value = defaultMelody(); $('melody').classList.remove('hide'); $('voice').classList.remove('hide');
$('mDate').value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
