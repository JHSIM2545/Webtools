plugins {
    id 'com.android.application'
}

// 홈봇 전용 독립 APK (SIM Tools 통합 앱과 별개: 앱 ID kr.simtools.homebot). 화면(웹)은 GitHub Pages 의 homebot.html 을 불러온다.
def verCode = (project.findProperty('verCode') ?: '1') as int
def verName = (project.findProperty('verName') ?: '1.0') as String

android {
    namespace 'kr.simtools.homebot'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.simtools.homebot'
        minSdk 28
        targetSdk 34
        versionCode verCode
        versionName verName
        resValue 'string', 'app_name', '홈봇'
    }

    signingConfigs {
        sim {
            storeFile file('../sim-release.jks')
            storePassword 'SimTools2026x'
            keyAlias 'sim'
            keyPassword 'SimTools2026x'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.sim }
        release { minifyEnabled false; signingConfig signingConfigs.sim }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
