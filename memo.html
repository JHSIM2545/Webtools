<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>SIM Memo</title>
<link rel="icon" type="image/png" href="memo-icon-192.png">
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#34c38f; --accent2:#1f9d6e; --danger:#ff5d5d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{border-color:var(--line)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.danger{color:var(--danger)}
button.on{background:#17352b;border-color:var(--accent);color:#fff}
a.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:20px;line-height:1;flex:none}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;font-weight:700}
.bar h1 span{color:var(--accent)}
.spacer{flex:1}

/* 목록 */
.listwrap{flex:1;overflow-y:auto;padding:14px 14px 40px}
.search input{width:100%;max-width:960px;display:block;margin:0 auto 14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.ngrid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ncard{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.ncard:hover{border-color:var(--accent)}
.ncard .th{aspect-ratio:240/340;background:#e9edf4;display:block;width:100%;object-fit:cover}
.ncard .nm{padding:8px 10px 2px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard .dt{padding:0 10px 9px;font-size:12px;color:var(--sub)}
.ncard .del{position:absolute;top:6px;right:6px;padding:3px 7px;background:#000a;border-color:#0000;font-size:13px}
.empty{padding:50px 10px;text-align:center;color:var(--sub);line-height:1.7;grid-column:1/-1}

/* 편집기 */
.ebar{gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.ebar::-webkit-scrollbar{display:none}
.ebar input.title{flex:1;min-width:90px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.ebar input.title:focus{border-color:var(--accent)}
#saveState{font-size:11px;color:var(--sub);min-width:38px;text-align:right}
@media (max-width:520px){
  .ebar{gap:4px;padding-left:8px;padding-right:8px}
  .ebar button{padding:6px 8px;font-size:13px}
  .ebar input.title{min-width:50px;padding:6px 8px;font-size:14px}
  #saveState{font-size:10px;min-width:24px}
}
#scroller{flex:1;min-height:0;overflow:auto;touch-action:none;overscroll-behavior:contain;background:#2b2f3d;padding:14px 12px 150px;-webkit-overflow-scrolling:touch}
.pg{position:relative;margin:0 auto 18px;background:#fff;box-shadow:0 2px 14px #0008;user-select:none;-webkit-user-select:none;overflow:hidden}
.pg.act{outline:2px solid #34c38f66}
.pg .bgL{position:absolute;inset:0;pointer-events:none}
.pg canvas.ink,.pg canvas.live{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pg .il,.pg .tl{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.plabel{position:absolute;right:8px;bottom:6px;display:flex;align-items:center;gap:6px;font-size:12px;color:#556;background:#fffd;padding:2px 4px 2px 10px;border-radius:99px;z-index:3}
.plabel button{padding:1px 7px;font-size:12px;background:#eef1f6;color:#556;border-color:#d5dae4}
.addpg{display:block;margin:6px auto 0;padding:12px 22px;border-style:dashed;background:transparent;color:#cdd3e2}
.mode-pen .pg,.mode-hl .pg,.mode-eraser .pg,.mode-shape .pg{cursor:crosshair}
.mode-text .pg{cursor:text}
.mode-select .tbw,.mode-text .tbw{pointer-events:auto}
.tbw{position:absolute;pointer-events:none}
.tbt{min-width:200px;max-width:1000px;width:max-content;padding:6px 10px;white-space:pre-wrap;word-break:break-word;line-height:1.4;outline:none;border:2px dashed transparent;border-radius:6px;user-select:text;-webkit-user-select:text;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.tbw:focus-within .tbt,.mode-select .tbw:hover .tbt,.mode-text .tbw:hover .tbt{border-color:#34c38f88}
.tbh{position:absolute;left:0;bottom:100%;display:none;gap:6px;transform:scale(var(--inv,1));transform-origin:0 100%;margin-bottom:2px}
.mode-select .tbw:hover .tbh,.mode-text .tbw:hover .tbh,.tbw:focus-within .tbh{display:flex}
.tbh span{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#222a3d;color:#fff;border-radius:8px;font-size:15px;cursor:pointer;touch-action:none}
/* 삽입한 그림 */
.iw{position:absolute;pointer-events:none}
.iw img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.mode-select .iw{pointer-events:auto;touch-action:none;cursor:move}
.iw.sel{outline:2px solid #34c38f}
.iw .ih{display:none;position:absolute;width:30px;height:30px;align-items:center;justify-content:center;background:#222a3d;color:#fff;border-radius:50%;font-size:15px;touch-action:none;transform-origin:center}
.iw.sel .ih{display:flex}
.iw .ird{right:0;top:0;transform:translate(50%,-50%) scale(var(--inv,1));cursor:pointer}
.iw .irs{right:0;bottom:0;transform:translate(50%,50%) scale(var(--inv,1));cursor:nwse-resize}

/* 도구바 */
.tools{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:20}
.tools.hide{display:none}
.mainrow,.subrow{display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none}
.mainrow::-webkit-scrollbar,.subrow::-webkit-scrollbar{display:none}
.subrow{display:none;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tg{display:flex;gap:4px;flex:none;align-items:center}
.tg[hidden]{display:none}
.tg button{padding:7px 9px;font-size:13px;display:flex;align-items:center;justify-content:center;min-width:40px;height:38px}
.tg button svg{display:block}
.hint{font-size:12px;color:var(--sub);white-space:nowrap}
#btnPenOnly{flex:none;padding:7px 9px;height:38px;min-width:40px;display:flex;align-items:center;justify-content:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff3;padding:0;flex:none}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
#cpick{width:30px;height:30px;border:none;background:none;padding:0;flex:none}
#size{width:96px;flex:none;accent-color:var(--accent)}
#sizeLbl{font-size:12px;color:var(--sub);min-width:22px;text-align:center;flex:none}
.sep{width:1px;height:26px;background:var(--line);flex:none}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal.show{display:flex}
.box{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.box h2{font-size:16px;margin-bottom:6px}
.box .sub{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
.box label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px}
.box select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.papers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.papers button{padding:12px 4px;font-size:13px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.insgrid{display:grid;gap:8px;margin-top:6px}
.insgrid button{text-align:left;padding:13px 14px;line-height:1.4}
.insgrid small{display:block;color:var(--sub);font-size:12px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:90;color:#fff;font-size:15px;text-align:center;padding:20px}
#busy.show{display:flex}
#busy div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 26px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#222a3d;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* 인쇄 */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  @page land{size:A4 landscape;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;display:block!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  .pp{overflow:hidden;position:relative;break-after:page;page-break-after:always;background:#fff}
  .pp.port{width:210mm;height:297mm}
  .pp.land{width:297mm;height:210mm;page:land}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .sheet{position:absolute;transform-origin:0 0;background:#fff}
  .sheet .b{position:absolute;inset:0}
  .sheet img.i{position:absolute;inset:0;width:100%;height:100%}
  .sheet img.pi{position:absolute}
  .sheet .tx{position:absolute;white-space:pre-wrap;word-break:break-word;line-height:1.4;padding:6px 10px;border:2px solid transparent;min-width:200px;max-width:1000px;width:max-content;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- 목록 -->
<section class="view on" id="viewList">
  <div class="bar">
    <a class="back" href="index.html" aria-label="SIM Tools 런처로" title="런처로">‹</a>
    <h1>SIM <span>Memo</span></h1>
    <div class="spacer"></div>
    <button id="btnPdfNew" title="PDF 파일을 새 메모로 열기">PDF 열기</button>
    <button class="primary" id="btnNew">+ 새 메모</button>
    <input type="file" id="pdfNew" accept="application/pdf,.pdf" hidden>
  </div>
  <div class="listwrap">
    <div class="search"><input id="nq" type="search" placeholder="메모 검색 (제목)"></div>
    <div class="ngrid" id="ngrid"></div>
  </div>
</section>

<!-- 편집기 -->
<section class="view" id="viewEdit">
  <div class="bar ebar">
    <button id="btnBack" title="목록으로">‹</button>
    <input class="title" id="titleIn" placeholder="제목 없음" maxlength="80">
    <span id="saveState"></span>
    <button id="btnUndo" title="되돌리기 (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="다시 실행 (Ctrl+Y)">↷</button>
    <button id="btnIns">삽입</button>
    <button id="btnPrint">인쇄</button>
    <button class="danger" id="btnDelNote" title="메모 삭제">🗑</button>
  </div>
  <div id="scroller" class="mode-pen"></div>
  <div class="tools" id="tools">
    <div class="subrow" id="subRow">
      <div class="tg" id="penTypes" hidden>
        <button data-pt="pen" class="on" title="볼펜" aria-label="볼펜"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
        <button data-pt="fountain" title="만년필" aria-label="만년필"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 3l5 9-5 9-5-9z"/><circle cx="12" cy="12" r="1.5"/><path d="M12 13.5V21"/></svg></button>
        <button data-pt="brush" title="붓펜" aria-label="붓펜"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M18 3c2 0 3 1 3 3-2 5-6 8-9 9l-3-3c1-3 4-7 9-9z"/><path d="M9 12c-3 0-5 2-5 5 0 2-1 3-1 3 4 1 8 0 9-4"/></svg></button>
        <button data-pt="pencil" title="연필" aria-label="연필"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 20l1.5-5L17 3.5 20.5 7 9 18.5z"/><path d="M14.5 6l3.5 3.5"/><path d="M4 20l3-1" stroke-width="2.5"/></svg></button>
      </div>
      <div class="tg" id="shapeTypes" hidden>
        <button data-sk="line" title="직선" aria-label="직선"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 19L19 5"/></svg></button>
        <button data-sk="arrow" title="화살표" aria-label="화살표"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 19L19 5"/><path d="M9 5h10v10"/></svg></button>
        <button data-sk="rect" class="on" title="사각형" aria-label="사각형"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg></button>
        <button data-sk="ellipse" title="원" aria-label="원"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg></button>
        <button data-sk="tri" title="삼각형" aria-label="삼각형"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 4l9 16H3z"/></svg></button>
        <span class="sep"></span>
        <button id="fillBtn" title="도형 안쪽 채우기" aria-label="채움"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 3l7 9a7 7 0 11-14 0z" fill="currentColor" fill-opacity=".35"/></svg></button>
      </div>
      <div class="tg" id="textHint" hidden><span class="hint">페이지를 탭하면 글상자가 생기고 키보드로 입력합니다 · 크기는 슬라이더 · ✥로 이동</span></div>
    </div>
    <div class="mainrow">
      <div class="tg" id="toolBtns">
        <button data-tool="select" title="선택 (그림·글상자 이동)" aria-label="선택"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
        <button data-tool="pen" class="on" title="펜" aria-label="펜"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
        <button data-tool="hl" title="형광펜" aria-label="형광펜"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 14l6-6 3 3-6 6H9z"/><path d="M9 17l-4 3h5"/><path d="M13 21h8" stroke-width="3" opacity=".5"/></svg></button>
        <button data-tool="shape" title="도형" aria-label="도형"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="11" width="10" height="10" rx="1.5"/><circle cx="15" cy="9" r="6"/></svg></button>
        <button data-tool="eraser" title="지우개" aria-label="지우개"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 17l9-10a2 2 0 013 0l4 4a2 2 0 010 3l-6 6H8z"/><path d="M8 21h12"/><path d="M8 12l6 6"/></svg></button>
        <button data-tool="text" title="텍스트 입력" aria-label="텍스트"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg></button>
      </div>
      <div class="sep"></div>
      <div class="tg" id="swatches"></div>
      <input type="color" id="cpick" value="#111111" title="색상 선택">
      <div class="sep"></div>
      <div class="tg"><input type="range" id="size" min="1" max="30" value="4"><span id="sizeLbl">4</span></div>
      <div class="sep"></div>
      <div class="tg">
        <button id="zOut" title="축소" aria-label="축소"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5M8 11h6"/></svg></button><span id="zLbl" style="font-size:12px;color:var(--sub);min-width:38px;text-align:center">100%</span><button id="zIn" title="확대" aria-label="확대"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5M11 8v6M8 11h6"/></svg></button>
      </div>
      <div class="sep"></div>
      <button id="btnPenOnly" title="켜면 한 손가락은 화면 이동만, 펜(마우스)으로만 필기합니다 (두 손가락 확대/이동은 항상 가능)" aria-label="손가락 스크롤"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ><path d="M8 12V5a1.5 1.5 0 013 0v6M11 11V3.5a1.5 1.5 0 013 0V11M14 11V5a1.5 1.5 0 013 0v8c0 5-3 8-6.5 8S6 18 5 15l-1.5-3a1.5 1.5 0 012.5-1.5L8 13"/></svg></button>
    </div>
  </div>
</section>

<!-- 삽입 -->
<div class="modal" id="mIns">
  <div class="box">
    <h2>삽입 / 불러오기</h2>
    <div class="sub" id="insSub"></div>
    <div class="insgrid">
      <button id="insImg">🖼 그림 넣기<small>현재 페이지 위에 올려 놓고, 이동·크기 조절은 "선택" 도구로 합니다.</small></button>
      <button id="insPdf">📄 PDF 불러오기<small>PDF의 모든 페이지를 이 메모에 페이지로 추가합니다. 그 위에 필기할 수 있습니다.</small></button>
      <button id="insBg">🎨 배경 설정<small>종이 종류(줄·격자·점)나 그림 파일을 배경으로 지정합니다.</small></button>
    </div>
    <input type="file" id="imgFile" accept="image/*" hidden>
    <input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden>
    <div class="row"><button id="insClose">닫기</button></div>
  </div>
</div>

<!-- 배경 설정 -->
<div class="modal" id="mBg">
  <div class="box">
    <h2>배경 설정</h2>
    <div class="sub" id="bgSub"></div>
    <label>적용 범위</label>
    <select id="bgScope"><option value="cur">현재 페이지</option><option value="all">모든 페이지</option></select>
    <label>종이 종류</label>
    <div class="papers">
      <button data-paper="blank">빈 종이</button>
      <button data-paper="lined">줄 노트</button>
      <button data-paper="grid">격자</button>
      <button data-paper="dots">점</button>
    </div>
    <label>그림 파일을 배경으로</label>
    <select id="bgFit"><option value="contain">전체가 보이게 (맞춤)</option><option value="cover">꽉 채우기 (잘릴 수 있음)</option></select>
    <div class="row" style="justify-content:flex-start;margin-top:10px"><button id="bgPick">그림 파일 선택…</button></div>
    <input type="file" id="bgFile" accept="image/*" hidden>
    <div class="row"><button id="bgClose">닫기</button></div>
  </div>
</div>

<div id="busy"><div id="busyMsg">처리 중…</div></div>
<div id="printRoot"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const DW = 1240, DH = 1754;             // 기본 페이지 논리 크기 (A4 세로)
  const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
  const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const MAX_PDF_PAGES = 100;
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let toastT;
  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
  const busy = m => { $('busyMsg').textContent = m; $('busy').classList.add('show'); };
  const unbusy = () => $('busy').classList.remove('show');

  /* ───────── 저장소 (IndexedDB) ───────── */
  let db = null, memOnly = [];
  function openDB() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('simmemo', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('notes', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  const store = m => db.transaction('notes', m).objectStore('notes');
  const dbAll = () => db ? new Promise((res, rej) => { const q = store('readonly').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }) : Promise.resolve(memOnly.slice());
  const dbPut = n => db ? new Promise((res, rej) => { const q = store('readwrite').put(n); q.onsuccess = () => res(); q.onerror = () => rej(q.error); })
                        : (memOnly = memOnly.filter(x => x.id !== n.id).concat([n]), Promise.resolve());
  const dbDel = id => db ? new Promise((res, rej) => { const q = store('readwrite').delete(id); q.onsuccess = () => res(); q.onerror = () => rej(q.error); })
                         : (memOnly = memOnly.filter(x => x.id !== id), Promise.resolve());

  /* ───────── 상태 ───────── */
  let note = null, pageEls = [], activePage = 0, io = null;
  let tool = 'pen', penType = 'pen', shapeKind = 'rect', shapeFill = false;
  let color = '#111111', zoom = 1, penOnly = false;
  const RES = 1.25;
  const sizes = { pen: 4, hl: 6, eraser: 8, text: 8, shape: 4 };
  let hist = [], hi = -1;
  let cur = null, scrollMode = null, activeTB = null, suppressClick = false;
  const live = document.createElement('canvas'); live.className = 'live';
  const liveCtx = live.getContext('2d');
  let saveTimer = null, dirty = false;

  const newPage = (type, w, h) => ({ w: w || DW, h: h || DH, bg: { type: type || 'lined', img: null, fit: 'contain' }, strokes: [], texts: [], images: [] });
  const newNote = () => ({ id: rid('n'), title: '', created: Date.now(), updated: Date.now(), thumb: '', assets: {}, pages: [newPage('lined')] });
  function normalize(n) {
    n.assets = n.assets || {};
    n.pages.forEach(p => { p.w = p.w || DW; p.h = p.h || DH; p.images = p.images || []; p.texts = p.texts || []; p.strokes = p.strokes || []; });
    return n;
  }
  const isEmptyPage = p => !p.strokes.length && !p.texts.length && !p.images.length && p.bg.type !== 'image';

  /* ───────── 목록 ───────── */
  const fmt = t => { const d = new Date(t); return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  async function renderList() {
    let all = [];
    try { all = await dbAll(); } catch (e) { toast('저장소를 읽지 못했습니다.'); }
    const q = $('nq').value.trim().toLowerCase();
    all = all.filter(n => !q || (n.title || '제목 없음').toLowerCase().includes(q)).sort((a, b) => b.updated - a.updated);
    if (!all.length) {
      $('ngrid').innerHTML = '<div class="empty">' + (q ? '검색 결과가 없습니다.' : '아직 메모가 없습니다.<br>오른쪽 위 <b>+ 새 메모</b>로 시작하거나 <b>PDF 열기</b>로 PDF에 필기하세요.') + '</div>';
      return;
    }
    $('ngrid').innerHTML = all.map(n =>
      '<div class="ncard" data-id="' + n.id + '">' +
      '<img class="th" alt="" src="' + (n.thumb || 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==') + '">' +
      '<div class="nm">' + esc(n.title || '제목 없음') + '</div><div class="dt">' + fmt(n.updated) + ' · ' + n.pages.length + '쪽</div>' +
      '<button class="del" data-del="' + n.id + '" title="삭제">🗑</button></div>').join('');
  }
  $('nq').addEventListener('input', renderList);
  $('ngrid').addEventListener('click', async e => {
    const d = e.target.closest('[data-del]');
    if (d) {
      e.stopPropagation();
      if (!confirm('이 메모를 삭제할까요? 되돌릴 수 없습니다.')) return;
      await dbDel(d.dataset.del); renderList(); return;
    }
    const c = e.target.closest('.ncard'); if (!c) return;
    const all = await dbAll(); const n = all.find(x => x.id === c.dataset.id);
    if (n) openNote(normalize(n));
  });
  $('btnNew').onclick = async () => { const n = newNote(); await dbPut(n); openNote(n); };
  $('btnPdfNew').onclick = () => $('pdfNew').click();
  $('pdfNew').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const pages = await pdfToPages(f);
      const n = newNote(); n.pages = pages; n.title = f.name.replace(/\.pdf$/i, '');
      await dbPut(n); unbusy(); openNote(n); scheduleSave();
    } catch (err) { unbusy(); toast(pdfErrMsg(err)); }
  });

  /* ───────── 배경 ───────── */
  function bgHTML(bg, w, h) {
    if (bg.type === 'image' && bg.img)
      return '<img alt="" draggable="false" src="' + bg.img + '" style="width:100%;height:100%;object-fit:' + (bg.fit === 'cover' ? 'cover' : 'contain') + ';display:block">';
    const S = 56; let g = '';
    if (bg.type === 'lined') { for (let y = 190; y < h - 60; y += S) g += '<line x1="80" y1="' + y + '" x2="' + (w - 80) + '" y2="' + y + '"/>'; }
    else if (bg.type === 'grid') { for (let x = 60; x < w; x += S) g += '<line x1="' + x + '" y1="60" x2="' + x + '" y2="' + (h - 60) + '"/>'; for (let y = 60; y < h; y += S) g += '<line x1="60" y1="' + y + '" x2="' + (w - 60) + '" y2="' + y + '"/>'; }
    else if (bg.type === 'dots') { for (let x = 90; x < w - 40; x += S) for (let y = 90; y < h - 40; y += S) g += '<circle cx="' + x + '" cy="' + y + '" r="3" stroke="none"/>'; }
    else return '';
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" width="100%" height="100%" style="display:block"><g stroke="#c5d0e2" stroke-width="2" fill="#b8c2d4">' + g + '</g></svg>';
  }

  /* ───────── 획·도형 그리기 ───────── */
  function smoothPath(ctx, pts, dx, dy) {
    ctx.beginPath(); ctx.moveTo(pts[0][0] + dx, pts[0][1] + dy);
    for (let i = 1; i < pts.length - 1; i++) { const mx = (pts[i][0] + pts[i + 1][0]) / 2 + dx, my = (pts[i][1] + pts[i + 1][1]) / 2 + dy; ctx.quadraticCurveTo(pts[i][0] + dx, pts[i][1] + dy, mx, my); }
    const l = pts[pts.length - 1]; ctx.lineTo(l[0] + dx, l[1] + dy);
  }
  function arrowHead(s) {
    const [x1, y1] = s.a, [x2, y2] = s.b, ang = Math.atan2(y2 - y1, x2 - x1), len = Math.max(18, s.size * 5), sp = 0.5;
    return [[x2 - len * Math.cos(ang - sp), y2 - len * Math.sin(ang - sp)], [x2 - len * Math.cos(ang + sp), y2 - len * Math.sin(ang + sp)]];
  }
  function shapePoly(s) {
    const [x1, y1] = s.a, [x2, y2] = s.b, l = Math.min(x1, x2), r = Math.max(x1, x2), t = Math.min(y1, y2), b = Math.max(y1, y2);
    if (s.kind === 'rect') return [[l, t], [r, t], [r, b], [l, b]];
    if (s.kind === 'tri') return [[(l + r) / 2, t], [r, b], [l, b]];
    if (s.kind === 'ellipse') { const cx = (l + r) / 2, cy = (t + b) / 2, rx = (r - l) / 2, ry = (b - t) / 2, o = []; for (let i = 0; i < 40; i++) { const a = i / 40 * 6.28319; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return o; }
    return null;
  }
  function shapeSegs(s) {
    if (s.kind === 'line') return [[s.a, s.b]];
    if (s.kind === 'arrow') { const [h1, h2] = arrowHead(s); return [[s.a, s.b], [s.b, h1], [s.b, h2]]; }
    const poly = shapePoly(s), out = [];
    for (let i = 0; i < poly.length; i++) out.push([poly[i], poly[(i + 1) % poly.length]]);
    return out;
  }
  function inPoly(x, y, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  function drawShape(ctx, s) {
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = Math.max(1, s.size);
    if (s.kind === 'line' || s.kind === 'arrow') {
      ctx.beginPath(); ctx.moveTo(s.a[0], s.a[1]); ctx.lineTo(s.b[0], s.b[1]);
      if (s.kind === 'arrow') { const [h1, h2] = arrowHead(s); ctx.moveTo(h1[0], h1[1]); ctx.lineTo(s.b[0], s.b[1]); ctx.lineTo(h2[0], h2[1]); }
      ctx.stroke();
    } else {
      ctx.beginPath();
      if (s.kind === 'ellipse') {
        const l = Math.min(s.a[0], s.b[0]), r = Math.max(s.a[0], s.b[0]), t = Math.min(s.a[1], s.b[1]), b = Math.max(s.a[1], s.b[1]);
        ctx.ellipse((l + r) / 2, (t + b) / 2, Math.max(0.5, (r - l) / 2), Math.max(0.5, (b - t) / 2), 0, 0, 6.28319);
      } else {
        const poly = shapePoly(s); ctx.moveTo(poly[0][0], poly[0][1]); for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]); ctx.closePath();
      }
      if (s.fill) { ctx.globalAlpha = 0.22; ctx.fill(); ctx.globalAlpha = 1; }
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawStroke(ctx, s) {
    if (s.tool === 'shape') return drawShape(ctx, s);
    const pts = s.pts; if (!pts || !pts.length) return;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    if (s.tool === 'hl') {
      ctx.globalAlpha = 0.35; ctx.lineWidth = s.size * 4;
      if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], s.size * 2, 0, 6.2832); ctx.fill(); }
      else { smoothPath(ctx, pts, 0, 0); ctx.stroke(); }
    } else if (s.tool === 'pencil') {
      ctx.lineWidth = Math.max(1, s.size * 0.8);
      if (pts.length === 1) { ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], ctx.lineWidth / 2, 0, 6.2832); ctx.fill(); }
      else { ctx.globalAlpha = 0.5; smoothPath(ctx, pts, 0.35, 0.2); ctx.stroke(); ctx.globalAlpha = 0.45; smoothPath(ctx, pts, -0.3, -0.25); ctx.stroke(); }
    } else {
      const n = pts.length;
      const wf = (a, b, i) => {
        const p = (a[2] + b[2]) / 2;
        if (s.tool === 'fountain') { const th = Math.atan2(b[1] - a[1], b[0] - a[0]); return s.size * (0.45 + 1.15 * Math.abs(Math.sin(th - 0.7))) * (0.7 + 0.6 * p); }
        if (s.tool === 'brush') return s.size * (0.25 + 2.6 * p) * Math.max(0.25, Math.min(1, (n - i) / 6, (i + 1) / 3));
        return s.size * (0.4 + 1.2 * p);
      };
      if (n === 1) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], wf(pts[0], pts[0], 0) / 2, 0, 6.2832); ctx.fill(); }
      else {
        let pm = [pts[0][0], pts[0][1]];
        for (let i = 1; i < n; i++) {
          const a = pts[i - 1], b = pts[i], last = i === n - 1;
          const m = last ? [b[0], b[1]] : [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          ctx.beginPath(); ctx.moveTo(pm[0], pm[1]);
          if (last) ctx.lineTo(b[0], b[1]); else ctx.quadraticCurveTo(a[0], a[1], m[0], m[1]);
          ctx.lineWidth = wf(a, b, i); ctx.stroke(); pm = m;
        }
      }
    }
    ctx.restore();
  }
  function redrawInk(ref) {
    if (!ref.vis || !ref.ctx) return;
    ref.ctx.clearRect(0, 0, ref.p.w, ref.p.h);
    ref.p.strokes.forEach(s => drawStroke(ref.ctx, s));
  }
  function renderInk(p, res) {
    const c = document.createElement('canvas'); c.width = Math.round(p.w * res); c.height = Math.round(p.h * res);
    const g = c.getContext('2d'); g.setTransform(res, 0, 0, res, 0, 0); p.strokes.forEach(s => drawStroke(g, s)); return c;
  }

  /* ───────── 페이지 요소 (보이는 페이지만 그림) ───────── */
  function makePageEl(p) {
    const el = document.createElement('div'); el.className = 'pg';
    el.innerHTML = '<div class="bgL"></div><div class="il"></div><div class="tl"></div>' +
      '<div class="plabel"><span></span><button class="pdel" title="이 페이지 삭제">×</button></div>';
    const ref = { p, el, ink: null, ctx: null, vis: false, scale: 1, bgL: el.querySelector('.bgL'), il: el.querySelector('.il'), tl: el.querySelector('.tl'), label: el.querySelector('.plabel span') };
    el._p = ref;
    rebuildTexts(ref);
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    el.addEventListener('click', onClickPage);
    el.addEventListener('contextmenu', e => { if (['pen', 'hl', 'eraser', 'shape'].includes(tool)) e.preventDefault(); });
    el.querySelector('.pdel').onclick = ev => { ev.stopPropagation(); delPage(pageEls.indexOf(el)); };
    return el;
  }
  function showPage(ref) {
    if (ref.vis) return; ref.vis = true;
    const c = document.createElement('canvas'); c.className = 'ink'; c.width = Math.round(ref.p.w * RES); c.height = Math.round(ref.p.h * RES);
    ref.ink = c; ref.ctx = c.getContext('2d'); ref.ctx.setTransform(RES, 0, 0, RES, 0, 0);
    ref.el.insertBefore(c, ref.il.nextSibling);
    ref.bgL.innerHTML = bgHTML(ref.p.bg, ref.p.w, ref.p.h);
    rebuildImages(ref); redrawInk(ref);
  }
  function hidePage(ref) {
    if (!ref.vis || (cur && cur.ref === ref)) return; ref.vis = false;
    if (ref.ink && ref.ink.parentNode) ref.ink.parentNode.removeChild(ref.ink);
    ref.ink = null; ref.ctx = null; ref.bgL.innerHTML = ''; ref.il.innerHTML = '';
  }
  function buildEditor() {
    if (io) io.disconnect();
    $('scroller').innerHTML = ''; pageEls = [];
    note.pages.forEach(p => { const el = makePageEl(p); pageEls.push(el); $('scroller').appendChild(el); });
    const add = document.createElement('button'); add.className = 'addpg'; add.textContent = '＋ 페이지 추가';
    add.onclick = addPage; $('scroller').appendChild(add);
    if (activePage >= pageEls.length) activePage = pageEls.length - 1;
    layout(); labels();
    if ('IntersectionObserver' in window) {
      io = new IntersectionObserver(es => es.forEach(en => { const r = en.target._p; if (en.isIntersecting) showPage(r); else hidePage(r); }), { root: $('scroller'), rootMargin: '1200px 0px' });
      pageEls.forEach(el => io.observe(el));
    } else pageEls.forEach(el => showPage(el._p));
  }
  function labels() {
    pageEls.forEach((el, i) => { el._p.label.textContent = (i + 1) + ' / ' + pageEls.length; el.classList.toggle('act', i === activePage && pageEls.length > 1); });
  }
  function layout() {
    const avail = Math.max(200, $('scroller').clientWidth - 24);
    pageEls.forEach(el => {
      const r = el._p, sc = Math.min(avail, 900) / r.p.w * zoom; r.scale = sc;
      el.style.width = (r.p.w * sc) + 'px'; el.style.height = (r.p.h * sc) + 'px';
      [r.il, r.tl].forEach(l => { l.style.width = r.p.w + 'px'; l.style.height = r.p.h + 'px'; l.style.transform = 'scale(' + sc + ')'; l.style.setProperty('--inv', 1 / sc); });
    });
    $('zLbl').textContent = Math.round(zoom * 100) + '%';
  }
  window.addEventListener('resize', () => { if (note) layout(); });

  function addPage() {
    const last = note.pages[note.pages.length - 1];
    const t = last && last.bg.type !== 'image' ? last.bg.type : 'blank';
    note.pages.push(newPage(t, last && last.bg.type !== 'image' ? last.w : DW, last && last.bg.type !== 'image' ? last.h : DH));
    activePage = note.pages.length - 1;
    buildEditor(); resetHistory(); scheduleSave();
    pageEls[activePage].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function delPage(i) {
    if (note.pages.length < 2) { toast('페이지는 최소 1장이 있어야 합니다.'); return; }
    if (!confirm((i + 1) + '쪽을 삭제할까요? 되돌릴 수 없습니다.')) return;
    note.pages.splice(i, 1); activePage = clamp(activePage, 0, note.pages.length - 1);
    buildEditor(); resetHistory(); scheduleSave();
  }

  /* ───────── 포인터 입력 ───────── */
  function pt(e, el, p) {
    const r = el.getBoundingClientRect(), pg = el._p.p;
    return [Math.round((e.clientX - r.left) * pg.w / r.width * 10) / 10, Math.round((e.clientY - r.top) * pg.h / r.height * 10) / 10, p == null ? 0.5 : Math.round(p * 100) / 100];
  }
  function synthP(e, q, c) {
    if (e.pointerType === 'pen' && e.pressure > 0) return e.pressure;
    const tl = c.s.tool;
    if (tl === 'fountain' || tl === 'brush') {
      const dt = e.timeStamp - c.t;
      if (dt > 0) { const inst = Math.hypot(q[0] - c.x, q[1] - c.y) / dt; c.sp = c.sp * 0.7 + inst * 0.3; }
      c.t = e.timeStamp; c.x = q[0]; c.y = q[1];
      return clamp(1 - c.sp * 0.35, 0.3, 1);
    }
    return 0.5;
  }
  function constrain(s, shift) {
    if (!shift) return;
    const dx = s.b[0] - s.a[0], dy = s.b[1] - s.a[1];
    if (s.kind === 'line' || s.kind === 'arrow') {
      const len = Math.hypot(dx, dy), ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
      s.b = [s.a[0] + len * Math.cos(ang), s.a[1] + len * Math.sin(ang)];
    } else { const m = Math.max(Math.abs(dx), Math.abs(dy)); s.b = [s.a[0] + Math.sign(dx || 1) * m, s.a[1] + Math.sign(dy || 1) * m]; }
  }
  function onDown(e) {
    suppressClick = false;
    const el = e.currentTarget, ref = el._p;
    activePage = pageEls.indexOf(el); labels();
    if (e.target.closest('.tbw') || e.target.closest('.plabel') || e.target.closest('.iw')) return;
    if (e.pointerType === 'touch' && (penOnly || tool === 'select' || tool === 'text')) {
      if (tool === 'select') deselectImages();
      scrollMode = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0 };
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    if (tool === 'select') { deselectImages(); return; }
    if (tool === 'text') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!ref.vis) showPage(ref);

    $('penTypes').hidden = t !== 'pen'; $('shapeTypes').hidden = t !== 'shape'; $('textHint').hidden = t !== 'text';
    $('subRow').style.display = (t === 'pen' || t === 'shape' || t === 'text') ? 'flex' : 'none';
    if (t !== 'select') deselectImages();
    const a = document.activeElement;
    if (a && a.classList && a.classList.contains('tbt') && ['pen', 'hl', 'eraser', 'shape'].includes(t)) a.blur();
  }
  $('toolBtns').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTool(b.dataset.tool); });
  $('penTypes').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; penType = b.dataset.pt; document.querySelectorAll('#penTypes button').forEach(x => x.classList.toggle('on', x === b)); });
  $('shapeTypes').addEventListener('click', e => {
    const b = e.target.closest('button[data-sk]'); if (!b) return;
    shapeKind = b.dataset.sk; document.querySelectorAll('#shapeTypes button[data-sk]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('fillBtn').onclick = () => { shapeFill = !shapeFill; $('fillBtn').classList.toggle('on', shapeFill); };
  $('swatches').addEventListener('pointerdown', e => e.preventDefault());
  function applyColor(c) {
    color = c; markSwatch();
    if (activeTB) { activeTB.t.color = c; activeTB.e.style.color = c; scheduleSave(); }
  }
  $('swatches').addEventListener('click', e => { const b = e.target.closest('.sw'); if (b) applyColor(b.dataset.c); });
  $('cpick').addEventListener('input', e => applyColor(e.target.value));
  $('size').addEventListener('input', e => {
    const v = +e.target.value, k = tool === 'hl' ? 'hl' : tool; if (sizes[k] != null) sizes[k] = v; $('sizeLbl').textContent = v;
    if (activeTB && tool === 'text') { activeTB.t.fs = 24 + v * 2; activeTB.e.style.fontSize = activeTB.t.fs + 'px'; scheduleSave(); }
  });
  $('zIn').onclick = () => { zoom = Math.min(4, Math.round((zoom + 0.25) * 100) / 100); layout(); };
  $('zOut').onclick = () => { zoom = Math.max(0.5, Math.round((zoom - 0.25) * 100) / 100); layout(); };
  $('btnPenOnly').onclick = () => { penOnly = !penOnly; $('btnPenOnly').classList.toggle('on', penOnly); toast(penOnly ? '손가락은 화면 이동만, 펜·마우스로 필기합니다.' : '손가락으로도 필기합니다.'); };
  markSwatch();

  /* ───────── 두 손가락 확대/축소 + 이동 ───────── */
  (() => {
    const sc = $('scroller'), tp = new Map(); let g = null, gids = new Set(), raf = 0;
    const cancelStroke = () => {
      if (cur) {
        const c = cur; cur = null;
        if (c.erase) { if (c.changed) { pushHistory(); scheduleSave(); } }
        else { liveCtx.clearRect(0, 0, c.ref.p.w, c.ref.p.h); if (live.parentNode) live.parentNode.removeChild(live); }
      }
      scrollMode = null;
    };
    const info = () => { const a = [...tp.values()]; return { mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1 }; };
    sc.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch') return;
      tp.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (tp.size === 2) {
        cancelStroke(); tp.forEach((_, id) => gids.add(id));
        const r = sc.getBoundingClientRect(), i = info();
        g = { d0: i.d, z0: zoom, cx: sc.scrollLeft + i.mx - r.left, cy: sc.scrollTop + i.my - r.top, r };
        e.stopPropagation(); e.preventDefault();
      } else if (tp.size > 2) { gids.add(e.pointerId); e.stopPropagation(); }
      else if (!e.target.closest('.pg') && !e.target.closest('button')) {
        scrollMode = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0 };   // 페이지 바깥 여백에서도 스크롤
      }
    }, true);
    sc.addEventListener('pointermove', e => {
      if (e.pointerType !== 'touch') return;
      if (tp.has(e.pointerId)) tp.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (gids.has(e.pointerId)) {
        e.stopPropagation(); e.preventDefault();
        if (g && tp.size >= 2 && !raf) raf = requestAnimationFrame(() => {
          raf = 0; if (!g || tp.size < 2) return;
          const i = info(), nz = clamp(Math.round(g.z0 * i.d / g.d0 * 100) / 100, 0.5, 4), k = nz / g.z0;
          if (nz !== zoom) { zoom = nz; layout(); }
          sc.scrollLeft = g.cx * (nz / g.z0) - (i.mx - g.r.left);
          sc.scrollTop = g.cy * (nz / g.z0) - (i.my - g.r.top);
        });
      } else if (scrollMode && e.pointerId === scrollMode.id && !e.target.closest('.pg')) {
        sc.scrollTop -= e.clientY - scrollMode.y; sc.scrollLeft -= e.clientX - scrollMode.x; scrollMode.x = e.clientX; scrollMode.y = e.clientY;
      }
    }, true);
    const up = e => {
      if (e.pointerType !== 'touch') return;
      tp.delete(e.pointerId);
      if (gids.has(e.pointerId)) { e.stopPropagation(); gids.delete(e.pointerId); if (tp.size < 2) g = null; if (!tp.size) gids.clear(); }
      else if (scrollMode && e.pointerId === scrollMode.id && !e.target.closest('.pg')) scrollMode = null;
    };
    sc.addEventListener('pointerup', up, true); sc.addEventListener('pointercancel', up, true);
    sc.addEventListener('wheel', e => {
      if (!e.ctrlKey) return; e.preventDefault();
      const r = sc.getBoundingClientRect(), z0 = zoom, cx = sc.scrollLeft + e.clientX - r.left, cy = sc.scrollTop + e.clientY - r.top;
      zoom = clamp(Math.round(z0 * Math.exp(-e.deltaY * 0.01) * 100) / 100, 0.5, 4); layout();
      sc.scrollLeft = cx * zoom / z0 - (e.clientX - r.left); sc.scrollTop = cy * zoom / z0 - (e.clientY - r.top);
    }, { passive: false });
  })();

  /* ───────── 삽입 / 배경 모달 ───────── */
  const closeIns = () => $('mIns').classList.remove('show');
  $('btnIns').onclick = () => { $('insSub').textContent = '현재 페이지: ' + (activePage + 1) + ' / ' + note.pages.length; $('mIns').classList.add('show'); };
  $('insClose').onclick = closeIns;
  $('mIns').addEventListener('click', e => { if (e.target === $('mIns')) closeIns(); });
  $('insImg').onclick = () => $('imgFile').click();
  $('insPdf').onclick = () => $('pdfFile').click();
  $('insBg').onclick = () => { closeIns(); $('bgSub').textContent = '현재 페이지: ' + (activePage + 1) + ' / ' + note.pages.length; $('mBg').classList.add('show'); };
  $('imgFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; closeIns(); if (f) insertImage(f); });
  $('pdfFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; closeIns(); if (f) insertPdf(f); });

  $('bgClose').onclick = () => $('mBg').classList.remove('show');
  $('mBg').addEventListener('click', e => { if (e.target === $('mBg')) $('mBg').classList.remove('show'); });
  function applyBG(mod) {
    const idx = $('bgScope').value === 'all' ? note.pages.map((_, i) => i) : [activePage];
    idx.forEach(i => { Object.assign(note.pages[i].bg, mod); const r = pageEls[i]._p; if (r.vis) r.bgL.innerHTML = bgHTML(note.pages[i].bg, r.p.w, r.p.h); });
    scheduleSave();
  }
  document.querySelectorAll('[data-paper]').forEach(b => b.onclick = () => { applyBG({ type: b.dataset.paper, img: null }); $('mBg').classList.remove('show'); });
  $('bgFit').addEventListener('change', () => { if (note.pages[activePage].bg.type === 'image') applyBG({ fit: $('bgFit').value }); });
  $('bgPick').onclick = () => $('bgFile').click();
  $('bgFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const r = await imageFromFile(f, 1800);
      applyBG({ type: 'image', img: r.data, fit: $('bgFit').value });
      $('mBg').classList.remove('show'); toast('배경 그림을 적용했습니다.');
    } catch (_) { toast('그림 파일을 읽을 수 없습니다.'); }
  });

  /* ───────── 인쇄 ───────── */
  async function doPrint() {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const root = $('printRoot'); root.innerHTML = '';
    busy('인쇄 준비 중…');
    try {
      for (let i = 0; i < note.pages.length; i++) {
        const p = note.pages[i], land = p.w > p.h;
        const pw = (land ? 297 : 210) * 96 / 25.4, ph = (land ? 210 : 297) * 96 / 25.4;
        const sc = Math.min(pw / p.w, ph / p.h), ox = (pw - p.w * sc) / 2, oy = (ph - p.h * sc) / 2;
        const pp = document.createElement('div'); pp.className = 'pp ' + (land ? 'land' : 'port');
        const sh = document.createElement('div'); sh.className = 'sheet';
        sh.style.cssText = 'width:' + p.w + 'px;height:' + p.h + 'px;left:' + ox + 'px;top:' + oy + 'px;transform:scale(' + sc + ')';
        sh.innerHTML = '<div class="b">' + bgHTML(p.bg, p.w, p.h) + '</div>';
        p.images.forEach(im => { const x = document.createElement('img'); x.className = 'pi'; x.alt = ''; x.src = note.assets[im.a] || ''; x.style.cssText = 'left:' + im.x + 'px;top:' + im.y + 'px;width:' + im.w + 'px;height:' + im.h + 'px'; sh.appendChild(x); });
        if (p.strokes.length) { const x = document.createElement('img'); x.className = 'i'; x.alt = ''; x.src = renderInk(p, 1.25).toDataURL('image/png'); sh.appendChild(x); }
        p.texts.forEach(t => { const d = document.createElement('div'); d.className = 'tx'; d.style.cssText = 'left:' + t.x + 'px;top:' + t.y + 'px;font-size:' + t.fs + 'px;color:' + t.color; d.textContent = t.text; sh.appendChild(d); });
        pp.appendChild(sh); root.appendChild(pp);
        if (i % 3 === 2) await new Promise(r => setTimeout(r, 0));
      }
      await Promise.all(Array.from(root.querySelectorAll('img')).map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve())));
    } finally { unbusy(); }
    const done = () => { root.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    toast('인쇄 창에서 "PDF로 저장"을 고르면 파일로도 저장됩니다.');
    setTimeout(() => window.print(), 300);
  }
  $('btnPrint').onclick = doPrint;

  /* ───────── 시작 ───────── */
  (async () => {
    try { db = await openDB(); } catch (e) { db = null; toast('이 브라우저는 저장소를 쓸 수 없어 임시로만 동작합니다.'); }
    renderList();
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  })();
})();
</script>
