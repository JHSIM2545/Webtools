<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIM Tools 설치</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1117;color:#fff;font:16px/1.6 system-ui,sans-serif;padding:24px}
.w{max-width:380px;width:100%;text-align:center}h2{margin:0 0 6px}p{color:#9aa3b5;font-size:14px;margin:6px 0}
a.b{display:block;margin:16px 0;padding:15px 22px;border-radius:14px;background:#4a8cff;color:#fff;font-weight:800;font-size:17px;text-decoration:none}
ol{text-align:left;background:#181c26;border-radius:14px;padding:14px 14px 14px 34px;color:#cfd6e4;font-size:14px;margin:0}li{margin:4px 0}b.k{color:#fff}
#st{min-height:22px;color:#7fe3a0;font-size:14px}</style></head>
<body><div class="w"><h2>SIM Tools</h2><p id="st">내려받기를 시작합니다…</p>
<a class="b" id="dl" href="https://github.com/JHSIM2545/Webtools/releases/download/suite-latest/SIM-Tools.apk" download="SIM-Tools.apk">⬇ 설치 파일 받기</a>
<ol><li>받은 뒤 알림의 <b class="k">SIM-Tools.apk</b>를 누르거나 <b class="k">열기</b>를 누르세요.</li>
<li>"출처를 알 수 없는 앱" 안내가 나오면 <b class="k">설정 → 이 출처 허용</b>을 켜고 뒤로 돌아오세요.</li>
<li><b class="k">설치</b>를 누르면 끝!</li></ol>
<p id="nb" style="display:none;color:#ffb35c">안드로이드 폰에서 열어 주세요. (아이폰·PC에서는 설치할 수 없어요)</p></div>
<script>
(function(){var a=document.getElementById('dl');
if(!/Android/i.test(navigator.userAgent)){document.getElementById('nb').style.display='block';document.getElementById('st').textContent='';return;}
setTimeout(function(){a.click();document.getElementById('st').textContent='내려받는 중… 끝나면 알림에서 열어 설치하세요';},700);})();
</script></body></html>
