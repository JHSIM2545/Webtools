<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#14110f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM Recipe">
<link rel="icon" type="image/png" sizes="192x192" href="recipe-icon-192.png">
<title>SIM Recipe</title>
<style>
:root{--bg:#14110f;--panel:#1e1a17;--panel2:#2a2420;--line:#3a322c;--text:#f3ece6;--sub:#a79a8f;--accent:#ff6b4a;--accent2:#e8512f;--ink:#2a0d05;--ok:#3ecf8e;--warn:#ffc46b;--danger:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:5}
header h1{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent);margin-left:-5px}
.appicon{width:30px;height:30px;border-radius:8px;display:block}
.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:20px;line-height:1}
.spacer{flex:1}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.2)}
button{white-space:nowrap}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:800}
button.dng{color:var(--danger)}
button:disabled{opacity:.45}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 20px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
nav#tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px;background:transparent;border-color:transparent;font-size:11.5px;color:var(--sub);font-weight:700}
nav#tabs button i{font-style:normal;font-size:21px}
nav#tabs button.on{background:#3a1c13;color:var(--accent);border-color:#5a2a1c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.rc .im{aspect-ratio:4/3;background:var(--panel2) center/cover;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.rc .im img{width:100%;height:100%;object-fit:cover;display:block}
.rc .tt{padding:9px 11px 3px;font-weight:700;font-size:14.5px;line-height:1.3}
.rc .mt{padding:0 11px 10px;font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:#3a1c13;color:var(--accent);border:1px solid #5a2a1c}
.empty{padding:50px 10px;text-align:center;color:var(--sub);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:15px}
label.l{font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip button{padding:0 2px;border:0;background:transparent;color:var(--sub)}
/* 상세 */
.hero{aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--panel2);position:relative;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sub)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.dt h2{font-size:21px;line-height:1.3}
.dt p{color:var(--sub);font-size:14px;margin-top:4px;line-height:1.5}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .pri{flex:1;min-width:140px;padding:12px;font-size:16px}
.ing{display:grid;grid-template-columns:1fr auto auto;gap:8px 10px;align-items:center}
.ing .nm{font-size:15px}
.ing .nm small{color:var(--sub);display:block;font-size:12px}
.ing input{width:84px;text-align:right;padding:7px 9px}
.easy{font-size:12px;padding:5px 9px;border-radius:99px;margin-right:6px}.easy.on{background:#3a1c13;border-color:var(--accent);color:var(--accent)}
.ing .un{color:var(--sub);font-size:14px;min-width:30px}
.unv{font-size:10.5px;color:var(--warn);border:1px solid #6b4f1c;border-radius:99px;padding:1px 6px;margin-left:5px;font-weight:700}
.stp{display:flex;gap:12px;align-items:flex-start}
.stp .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
.stp .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.stp h4{font-size:15.5px}
.stp .tx{font-size:15px;line-height:1.6}
b.q{color:var(--accent);font-weight:800}
.tm{font-size:12.5px;color:var(--warn);font-weight:700}
.pic{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--panel2);position:relative;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.ld::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.pic .rg{position:absolute;right:8px;bottom:8px;padding:5px 9px;font-size:12px;background:rgba(0,0,0,.6);border-color:transparent;border-radius:99px}
.ph{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.ph .add{width:76px;height:76px;border-style:dashed;color:var(--sub);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.ph .add.s{width:auto;height:auto;flex-direction:row;padding:5px 11px;border-radius:99px}
.tip{font-size:14px;line-height:1.55;padding-left:2px}
.cm{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-bottom:1px solid var(--line)}
.cm:last-child{border:0}
.cm .h{font-size:12px;color:var(--sub);display:flex;gap:8px;align-items:center}
.cm .h b{color:var(--text)}
.cm .h button{margin-left:auto;padding:0 6px;border:0;background:transparent;color:var(--sub);font-size:16px}
.cm .b{font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.tag{font-size:12px;color:var(--sub)}
.sw{display:flex;align-items:center;gap:8px;font-size:14px}
.sw input{width:auto}
.step-r{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step-r button{border:0;border-radius:0;padding:7px 13px;font-size:17px;background:var(--panel2)}
.step-r span{padding:0 12px;font-weight:800;font-size:14.5px;min-width:78px;text-align:center}
/* 팝업 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px}
.ov .box{width:min(520px,100%);max-height:calc(100dvh - 28px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ov .box h3{font-size:16px}
#busy{z-index:90;flex-direction:column;gap:14px;color:#fff;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#viewer{z-index:80;background:rgba(0,0,0,.92);flex-direction:column;gap:12px}
#viewer img{max-width:100%;max-height:78dvh;border-radius:10px}
/* 요리 모드 */
#cook{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
#cook .top{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
#cook .top .pg{flex:1;height:6px;background:var(--panel2);border-radius:9px;overflow:hidden}
#cook .top .pg i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
#cook .top .ct{font-size:13px;color:var(--sub);font-weight:700;min-width:46px;text-align:right}
#pages{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.page{height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto;overflow-y:auto}
.page .pic{flex:none;max-height:38%;aspect-ratio:auto;min-height:130px}
.page .big{font-size:21px;line-height:1.65;font-weight:600}
.page h2{font-size:15px;color:var(--accent)}
.page .tmr{align-self:flex-start;font-size:26px;font-weight:800;color:var(--warn);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px;font-variant-numeric:tabular-nums}
.page .tmr.run{border-color:var(--warn)}
.page .ingl{display:flex;flex-direction:column;gap:6px;font-size:18px}
.page .ingl label{display:flex;gap:10px;align-items:center}
.page .ingl input{width:20px;height:20px;accent-color:var(--accent)}
#cook .bot{flex:none;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#cook .ctl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
#cook .ctl button{padding:9px 13px;font-size:15px}
#cook .ctl button.on{background:#3a1c13;border-color:var(--accent);color:var(--accent)}
#ans{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5}
#ans .a2{margin-top:8px;display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:100;max-width:90vw;text-align:center}
@media (max-height:480px) and (min-width:640px){
  #cook .page{flex-direction:row;align-items:flex-start}
  #cook .page .pic{max-height:none;width:42%;flex:none}
}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="런처">‹</a>
  <h1><img class="appicon" src="recipe-icon-192.png" alt="">SIM <span>Recipe</span></h1>
  <div class="spacer"></div>
</header>
<main id="main"><div class="wrap" id="view"></div></main>
<nav id="tabs">
  <button data-t="mine" class="on"><i>📖</i>내 레시피</button>
  <button data-t="shared"><i>👥</i>공유 레시피</button>
  <button data-t="new"><i>✨</i>새 레시피</button>
</nav>

<div class="ov" id="busy" hidden><div class="spin"></div><div id="busyTx">처리 중…</div><button id="busyX" hidden>취소</button></div>
<div class="ov" id="viewer" hidden><img id="vimg" alt=""><div class="row"><button id="vdel" class="dng" hidden>사진 삭제</button><button id="vclose">닫기</button></div></div>
<div class="ov" id="editov" hidden>
  <div class="box">
    <h3>레시피 수정 요청</h3>
    <textarea id="editTx" rows="4" placeholder="예) 2번과 3번 순서를 바꿔줘 / 양파 대신 대파를 넣어줘 / 소금을 1작은술로 / 4인분으로 바꿔줘"></textarea>
    <div class="row"><button id="editMic">🎤 말로 입력</button><div class="spacer"></div><button id="editX">취소</button><button class="pri" id="editGo">수정하기</button></div>
  </div>
</div>
<div id="cook" hidden>
  <div class="top"><button id="cX">✕</button><div class="pg"><i id="cPg"></i></div><div class="ct" id="cCt"></div></div>
  <div id="pages"></div>
  <div class="bot">
    <div id="ans" hidden></div>
    <div class="ctl">
      <button id="cPrev">⏮</button><button id="cPause">⏸</button><button id="cNext">⏭</button>
      <button id="cMore">+1분</button><button id="cDone">다 됐어요</button>
      <button id="cEasy">간편용량</button><button id="cDev" title="기기 자체 음성만 쓰기 (인터넷 없이도 됨)">기기음성</button><button id="cAuto" class="on">자동</button><button id="cVoice" class="on">🔊</button>
    </div>
    <div class="row"><button id="cMic">🎤</button><input id="cQ" placeholder="질문하기 (예: 소금이 없는데 빼도 돼?)"><button id="cSend" class="pri">전송</button></div>
  </div>
</div>
<input type="file" id="fPhoto" accept="image/*" multiple hidden>
<input type="file" id="fSrc" accept="application/pdf,image/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ═══════ 설정 ═══════ */
const SB_URL = 'https://rgamgjdnhunzzwzsbnbs.supabase.co', SB_KEY = 'sb_publishable_hnBcVEuMXFRdFRqJhOM0OQ_rp72JywU';
const FN = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/recipe-ai';
const BUCKET = 'recipe-img', LSK = 'simrecipe.v1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Math.random().toString(36).slice(2, 9);
let pref = {}; try { pref = JSON.parse(localStorage.getItem(LSK) || '{}'); } catch (e) {}
const savePref = () => { try { localStorage.setItem(LSK, JSON.stringify(pref)); } catch (e) {} };
function toast(t, ms) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 2600); }

/* ═══════ 로그인 세션 (런처와 공유) ═══════ */
const NS = window.SimSession || null;
let sb = null;
async function client() {
  if (sb) return sb;

  if (NS) sb.auth.onAuthStateChange((ev, s) => { if (s && ev === 'TOKEN_REFRESHED') { try { NS.put(JSON.stringify({ access_token: s.access_token, refresh_token: s.refresh_token })); } catch (e) {} } });
  return sb;
}
async function session() {
  const c = await client();
  if (NS) {
    let raw = null; try { raw = NS.get(); } catch (e) {}
    if (raw && raw !== 'NA' && raw !== 'OUT') {
      let t = null; try { t = JSON.parse(raw); } catch (e) {}
      const cur = (await c.auth.getSession()).data.session;
      if (t && t.refresh_token && (!cur || cur.refresh_token !== t.refresh_token)) { try { await c.auth.setSession({ access_token: t.access_token, refresh_token: t.refresh_token }); } catch (e) {} }
    }
  }
  return (await c.auth.getSession()).data.session;
}
const S = { uid: '', name: '', tab: 'mine', mine: [], shared: [], row: null, ro: false, scale: 1, prev: null, cache: {} };
const userName = u => { const m = (u && u.user_metadata) || {}; return m.full_name || m.name || (u.email || '').split('@')[0] || '익명'; };

/* ═══════ 표시 도우미 ═══════ */
const FR = [[.25, '¼'], [1 / 3, '⅓'], [.5, '½'], [2 / 3, '⅔'], [.75, '¾']];
function fmtNum(n, speak) {
  if (n >= 100) return String(Math.round(n));
  if (n >= 10) return String(Math.round(n * 2) / 2);
  const w = Math.floor(n), f = n - w;
  if (f < .04) return String(w || 0);
  if (f > .96) return String(w + 1);
  if (speak) return f > .45 && f < .55 ? (w ? w + '과 반' : '반') : String(Math.round(n * 10) / 10);
  for (const [v, s] of FR) if (Math.abs(f - v) < .04) return (w ? w : '') + s;
  return String(Math.round(n * 10) / 10);
}
const SPK = { g: '그램', kg: '킬로그램', ml: '밀리리터', L: '리터', l: '리터' };
/* 간편용량: 모든 용량을 밥숟가락(15ml) · 종이컵(180ml) 기준으로. 무게(g)는 재료별 대략 밀도로 환산, 모르는 재료는 그대로 둔다 */
const DENS = [[/물엿|올리고당|조청|시럽/, 21], [/꿀/, 21], [/간장|액젓|맛술|미림|청주|소주|술\b|식초|육수|국물|다시|물\b|우유|두유|주스|케첩|케찹/, 15], [/식용유|올리브|참기름|들기름|기름|오일/, 13.5], [/고추장|쌈장/, 20], [/된장|춘장|굴소스|소스/, 18], [/마요네즈|마요/, 14], [/설탕/, 12], [/소금/, 14], [/후추|후춧가루/, 7], [/고춧가루|고추가루/, 6], [/밀가루|부침가루|튀김가루|전분|녹말|빵가루|가루/, 8], [/다진 ?마늘|다진마늘/, 15], [/깨/, 8], [/버터|마가린/, 14], [/쌀|찹쌀|보리/, 13], [/밥/, 12], [/요거트|요구르트|크림|치즈/, 15]];
function dens(name) { for (const [re, d] of DENS) if (re.test(name || '')) return d; return 0; }
function easyQty(ing, speak) {
  const a = ing.amount * S.scale, u = (ing.unit || '').trim(); let sp = null;   // sp = 밥숟가락 수
  if (u === '큰술') sp = a; else if (u === '작은술') sp = a / 3; else if (u === 'ml' || u === 'mL' || u === 'cc') sp = a / 15; else if (u === 'L' || u === 'l') sp = a * 1000 / 15;
  else if (u === '컵') sp = a * 12;
  else if (u === 'g' || u === 'kg') { const d = dens(ing.name); if (d) sp = (u === 'kg' ? a * 1000 : a) / d; }
  if (sp == null || !isFinite(sp) || sp <= 0) return null;
  if (sp >= 6) { const c = Math.max(.25, Math.round(sp / 12 * 4) / 4); return fmtNum(c, speak) + '종이컵'; }
  let t; if (sp < .9) t = [1 / 3, .5, 2 / 3, 1].reduce((b, x) => Math.abs(x - sp) < Math.abs(b - sp) ? x : b); else t = Math.round(sp * 2) / 2;
  return fmtNum(t, speak) + '밥숟가락';
}
function qty(ing, speak) {
  if (!ing) return '';
  if (ing.amount == null) return ing.unit || '적당량';
  if (pref.easy) { const e = easyQty(ing, speak); if (e) return e; }
  const n = fmtNum(ing.amount * S.scale, speak), u = ing.unit || '';
  return speak ? n + (SPK[u] || u) : n + u;

  if (G.voice && !G.paused) {   // 말로 '잠깐만' / '다 됐어요' 를 받는다 (듣기를 못 쓰면 바로 넘어간다)
    const it = await listenIntent(5000); if (G.token !== my) return;
    if (it === 'hold') {
      G.paused = true; paintCtl(); await say(HOLD_MSG, my); if (G.token !== my) return;
      while (G.paused) { const w = await listenIntent(9000); if (G.token !== my) return; if (w === 'done') { G.paused = false; paintCtl(); } else if (w === null) await sleep(500); else await sleep(150); }
    }
  }
  while (G.paused) { await sleep(300); if (G.token !== my) return; }
  goto(i + 1, true);
}
function setTmr(i) {
  const el = document.querySelector('[data-tmr="' + (i - 1) + '"]'), s = i >= 1 ? G.rec.steps[i - 1] : null;
  if (el && s) { const show = s.timerSec > 0; el.hidden = !show; if (show) { el.textContent = '⏱ ' + mmss(G.run ? G.left : s.timerSec); el.classList.toggle('run', G.run && G.left > 0 && !G.paused); } }
}
function paintCtl() {
  paintEasy(); $('cDev').classList.toggle('on', !!pref.devOnly);
  $('cPause').textContent = G.paused ? '▶' : '⏸'; $('cAuto').classList.toggle('on', G.auto); $('cVoice').classList.toggle('on', G.voice); $('cVoice').textContent = G.voice ? '🔊' : '🔇';
}
$('cX').onclick = () => closeCook(false);
$('cPrev').onclick = () => goto(G.i - 1, true);
$('cNext').onclick = () => goto(G.i + 1, true);
$('cPause').onclick = () => { G.paused = !G.paused; if (G.paused) cancelSpeech(); paintCtl(); setTmr(G.i); };
$('cMore').onclick = () => { G.left += 60; G.run = true; if (G.left > 0) setTmr(G.i); toast('1분 늘렸어요'); if (G.i > 0 && G.i <= G.rec.steps.length && !G.rec.steps[G.i - 1].timerSec) { const el = document.querySelector('[data-tmr="' + (G.i - 1) + '"]'); if (el) { el.hidden = false; } } };
$('cDone').onclick = () => goto(G.i + 1, true);
$('cEasy').onclick = () => toggleEasy();
$('cDev').onclick = () => { pref.devOnly = !pref.devOnly; savePref(); ttsBad = false; ttsWarned = false; paintCtl(); toast(pref.devOnly ? '기기 자체 음성만 써요 (오프라인 가능). 한국어 음성이 설치돼 있어야 해요' : '기기 음성이 안 되면 AI 음성을 써요', 3500); };
$('cAuto').onclick = () => { G.auto = !G.auto; pref.auto = G.auto; savePref(); paintCtl(); if (G.auto) runPage(G.i); };
$('cVoice').onclick = () => { G.voice = !G.voice; pref.voice = G.voice; savePref(); if (!G.voice) cancelSpeech(); paintCtl(); };

/* 음성·글 질문 */
function showAns(text, suggest) {
  const a = $('ans'); a.hidden = false; a.innerHTML = '<div>' + esc(text) + '</div>' + (suggest && !S.ro ? '<div class="a2"><button class="pri" id="aApply">레시피에 반영</button><button id="aNo">닫기</button></div>' : '');
  const y = $('aApply'); if (y) y.onclick = async () => { a.hidden = true; closeCookForEdit(); await applyEdit(suggest); };
  const n = $('aNo'); if (n) n.onclick = () => { a.hidden = true; };
}
function closeCookForEdit() { closeCook(false); }
const HOLD_MSG = '네, 천천히 하시고 다 되시면 다 됐어요라고 말씀해 주세요.';
function classify(t) {
  const n = String(t).replace(/[\s.,!?~]/g, ''); if (!n || n.length > 16) return '';
  if (/(잠깐|잠시|기다|천천히|아직|좀만|조금만|멈춰|정지|일시)/.test(n)) return 'hold';
  if (/(다됐|다했|다되|다끝|끝났|끝냈|됐어|됐습니다|했어요|했습니다|넘어|다음|^네$|^응$|^예$|^그래$|^계속)/.test(n)) return 'done';
  return '';
}
function holdNow() { G.paused = true; cancelSpeech(); paintCtl(); setTmr(G.i); speak(HOLD_MSG); }
async function handleVoice(t) {
  t = String(t || '').trim(); if (!t) return;
  { const c = classify(t); if (c === 'done') return goto(G.i + 1, true); if (c === 'hold') return holdNow(); }
  if (/^(다음|넘어|다 ?(됐|했|되었|끝)|끝났)/.test(t)) return goto(G.i + 1, true);
  if (/^(이전|앞 ?단계|뒤로|전 단계)/.test(t)) return goto(G.i - 1, true);
  if (/^(계속|재개|다시 시작)/.test(t)) { G.paused = false; paintCtl(); return; }
  if (/(다시|한번 더|한 번 더) ?(읽|말|들려)/.test(t)) return goto(G.i, false);
  if (G.askBusy) return; G.askBusy = true; const was = G.micPrev != null ? G.micPrev : G.paused; G.micPrev = null; G.paused = true; paintCtl(); showAns('🤔 ' + t + ' — 생각 중…');
  let fill = null; if (G.voice) { G.token++; const ph = '네, 잠시만요.'; ttsPrefetch(ph); fill = speak(ph); }
  try {
    const rec = JSON.parse(JSON.stringify(G.rec)); rec.steps.forEach(s => { delete s.img; });
    const r = await ai({ action: 'ask', recipe: rec, step: Math.max(0, G.i - 1), question: t + ' (소리 내어 읽을 거라 1~2문장, 결론부터 짧게, 말하듯 자연스러운 해요체로)', scale: Math.round(S.scale * 100) / 100 }, 40000);
    showAns(r.answer, r.suggest);
    if (G.voice) { G.token++; ttsPrefetch(r.answer); if (fill) await fill; await speak(r.answer); }
  } catch (e) { showAns('답을 가져오지 못했어요: ' + aiErr(e)); }
  G.askBusy = false; G.paused = was; paintCtl();
  if (!$('cook').hidden) runResume();   // 질문 때문에 끊긴 흐름을 이어서 (일시정지 상태면 풀 때까지 대기)
}
async function runResume() { const i = G.i; if (i === 0 || i > G.rec.steps.length) return runPage(i); const my = ++G.token; G.run = true; if (G.left <= 0) G.left = 8; while (G.left > 0) { await sleep(1000); if (G.token !== my) return; if (!G.paused) { G.left--; setTmr(i); } } if (!G.auto) return; await say('다 되셨나요? 그럼 다음으로 넘어갈게요.', my); if (G.token !== my) return; goto(i + 1, true); }
$('cSend').onclick = () => { const t = $('cQ').value; $('cQ').value = ''; handleVoice(t); };
$('cQ').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('cSend').click(); } };
$('cMic').onclick = () => {
  if (G.mic) { try { G.mic.abort(); } catch (e) {} G.mic = null; $('cMic').textContent = '🎤'; return; }
  cancelSpeech(); G.micPrev = G.paused; G.paused = true; paintCtl();
  const r = listenOnce(t => handleVoice(t), got => { G.mic = null; $('cMic').textContent = '🎤'; if (!got && !G.askBusy && G.micPrev != null) { G.paused = G.micPrev; G.micPrev = null; paintCtl(); } });
  if (!r) { G.paused = G.micPrev; G.micPrev = null; paintCtl(); return toast('이 기기에서는 음성 인식을 쓸 수 없어요. 글로 질문해 주세요'); }
  G.mic = r; $('cMic').textContent = '듣는 중…';
};
$('cook').addEventListener('click', e => { const im = e.target.closest('.pic img'); if (im) showPhoto(im.src); });

/* ═══════ 시작 ═══════ */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { if (S.row) { S.row = null; layers.length = 0; } setTab(b.dataset.t); });
(async function init() {
  const v = $('view'); v.innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const ss = await session();
    if (!ss) { v.innerHTML = '<div class="empty">SIM Tools 런처에서 로그인한 뒤 열어 주세요</div><a class="back" style="width:auto;padding:12px;align-self:center;font-size:15px" href="index.html">런처로 가기</a>'; return; }
    S.uid = ss.user.id; S.name = userName(ss.user); setTab('mine');
  } catch (e) { v.innerHTML = '<div class="empty">' + esc(aiErr(e)) + '</div>'; }
})();
</script>
