<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM Tools">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SIM Tools</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#4f8cff; --accent2:#2f6fe8; --ok:#3ecf8e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .logo{width:32px;height:32px;border-radius:9px;display:block}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
header h1 span{color:var(--accent)}
.spacer{flex:1}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
.hello{margin:6px 2px 14px}
.hello h2{font-size:20px;letter-spacing:-.3px}
.hello p{margin-top:4px;color:var(--sub);font-size:14px}
.search input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
a.card,.card.ghost{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:inherit;min-height:150px}
a.card{transition:transform .12s,border-color .12s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card:active{transform:scale(.98)}
a.card.dragging{position:relative;z-index:30;transition:none;pointer-events:none;border-color:var(--accent);box-shadow:0 16px 36px rgba(0,0,0,.6);opacity:.97}
body.dragmode,body.dragmode *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.reorder{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--sub)}
.reorder:empty{display:none}
.reorder button{padding:2px 10px;font-size:12px;border-radius:99px}
.card .ico{width:52px;height:52px;border-radius:14px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex:none}
.card .ico img{width:100%;height:100%;object-fit:cover;display:block}
.card .name{font-size:16px;font-weight:700}
.card .desc{font-size:13px;color:var(--sub);line-height:1.45}
.card .tag{margin-top:auto;align-self:flex-start;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid #1f5c44;color:var(--ok)}
.card.ghost{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:13px;background:transparent}
.card.ghost .plus{font-size:30px;line-height:1}
.empty{padding:40px 10px;text-align:center;color:var(--sub);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.modal .box{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.modal h2{font-size:16px;margin-bottom:12px}
.modal .body{font-size:14px;line-height:1.7}
.modal .warn{font-size:12px;color:#ffb86b;margin-top:10px;line-height:1.5}
.modal .row{display:flex;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222a3d;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr)}
  header button{padding:6px 10px;font-size:13px}
}
</style>
</head>
<body>
<header>
  <img class="logo" src="icon-192.png" alt="">
  <h1>SIM <span>Tools</span></h1>
  <div class="spacer"></div>
  <button id="btnInstall" title="앱으로 설치">앱 설치</button>
</header>

<main>
  <div class="search"><input id="q" type="search" placeholder="툴 검색"></div>
  <div class="reorder" id="reorder"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="mInstall">
  <div class="box">
    <h2>SIM Tools 앱으로 설치</h2>
    <div class="body" id="installBody"></div>
    <div class="warn" id="installWarn"></div>
    <div class="row"><button class="primary" id="installClose">확인</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  /* ─────────────────────────────────────────────
     툴 목록. 새 툴을 만들면 아래 배열에 한 줄만 추가하세요.
       name : 카드 제목
       desc : 한 줄 설명
       url  : 열릴 파일 (같은 폴더의 .html 파일명)
       icon : 이미지 파일명 (없으면 emoji 사용)
       emoji: icon이 없을 때 표시할 이모지
       tag  : 카드 하단 작은 라벨 (선택)
     ───────────────────────────────────────────── */
  const TOOLS = [
    { id: 'simtv', color: '#a78bfa', name: 'SIM TV', desc: '라이브 채널 시청', url: 'tv.html', icon: 'tv-icon-192.png', tag: '라이브' },
    { id: 'note', color: '#34c38f', name: 'SIM Note', desc: '펜·도형 필기 · PDF·Office · 스캔 · 인쇄', url: 'note.html', icon: 'note-icon-192.png', tag: '노트' },
    { id: 'phone', color: '#f59f3a', name: 'SIM Phone', desc: '연락처 관리 · 명함 스캔 · 전화/문자', url: 'phone.html', icon: 'phone-icon-192.png', tag: '연락처' },
    { id: 'aitel', color: '#8b7dff', name: 'SIM AI-Tel', desc: 'AI 전화 비서 · 예약/문의 대행 · 부재중 응대', url: 'aitel.html', icon: 'aitel-icon-192.png', tag: '전화비서' },
    { id: 'assistant', color: '#4cc9f0', name: 'SIM Assistant', desc: '음성 비서 · 메모 · 연락처 저장/검색 · 전화 · 일정 · 알람', url: 'assistant.html', icon: 'assistant-icon-192.png', tag: '음성비서' },
    { id: 'calendar', color: '#ff6b6b', name: 'SIM Calendar', desc: '월·주·일 달력 · 공휴일 · 음성비서 일정 자동 기록', url: 'calendar.html', icon: 'calendar-icon-192.png', tag: '일정' },
    { id: 'folder', color: '#c8946a', name: 'SIM Folder', desc: '내 전용 서버 폴더 · 업로드 · 내 기기로 받기', url: 'folder.html', icon: 'folder-icon-192.png', tag: '파일저장소' },
    { id: 'message', color: '#ffe600', name: 'SIM Message', desc: 'AI 문자 작성 · 인사·상품소개·일정안내 · 이미지·멜로디·음성 · 바로 보내기', url: 'message.html', icon: 'message-icon-192.png', tag: '문자' }
  ];

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // 이름의 'SIM'은 흰색, 나머지는 각 앱의 컨셉 컬러
  const nameHtml = t => { const m = /^SIM\s+(.+)$/.exec(t.name); return m && t.color ? 'SIM <span style="color:' + esc(t.color) + '">' + esc(m[1]) + '</span>' : esc(t.name); };
  /* ── 순서 (이 기기에만 저장). 목록에 없는 새 툴은 맨 뒤에 붙는다 ── */
  const KEY_ORDER = 'simtools_order';
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
  const loadOrder = () => { try { const a = JSON.parse(lsGet(KEY_ORDER) || '[]'); return Array.isArray(a) ? a.map(String) : []; } catch (e) { return []; } };
  function orderedTools() {
    const rank = new Map(loadOrder().map((id, i) => [id, i]));
    return TOOLS.filter(t => rank.has(t.id)).sort((a, b) => rank.get(a.id) - rank.get(b.id)).concat(TOOLS.filter(t => !rank.has(t.id)));
  }
  function updateHint() {
    const el = $('reorder');
    if ($('q').value.trim() || !loadOrder().length) { el.innerHTML = ''; return; }
    el.innerHTML = '<button id="orderReset">순서 초기화</button>';
    const b = $('orderReset'); if (b) b.onclick = () => { lsDel(KEY_ORDER); render(); toast('기본 순서로 되돌렸어요'); };
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = orderedTools().filter(t => !q || t.name.toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q));
    updateHint();
    if (!list.length) { $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">검색 결과가 없습니다.</div>'; return; }
    let html = list.map(t => {
      const ico = t.icon ? '<img src="' + esc(t.icon) + '" alt="" draggable="false">' : esc(t.emoji || '🧰');
      return '<a class="card" data-id="' + esc(t.id) + '" draggable="false" href="' + esc(t.url) + '">' +
        '<div class="ico">' + ico + '</div>' +
        '<div><div class="name">' + nameHtml(t) + '</div><div class="desc">' + esc(t.desc || '') + '</div></div>' +
        (t.tag ? '<span class="tag">' + esc(t.tag) + '</span>' : '') + '</a>';
    }).join('');
    if (!q) html += '<div class="card ghost"><div class="plus">+</div>새 툴이 여기에 추가됩니다</div>';
    $('grid').innerHTML = html;
  }
  $('q').addEventListener('input', render);
  render();

  /* ── 카드 끌어서 순서 바꾸기 ──
     마우스: 6px 이상 끌면 시작. 터치: 0.4초 길게 누른 뒤 끌기(그 전에 움직이면 일반 스크롤).
     검색 중에는 일부만 보이므로 끌기를 막는다. */
  const grid = $('grid');
  let D = null, suppressClick = 0;
  grid.addEventListener('click', e => { if (Date.now() < suppressClick) { e.preventDefault(); e.stopPropagation(); } }, true);
  grid.addEventListener('dragstart', e => e.preventDefault());
  grid.addEventListener('contextmenu', e => { if (D) e.preventDefault(); });
  grid.addEventListener('pointerdown', e => {
    if (D || $('q').value.trim()) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const el = e.target.closest && e.target.closest('a.card'); if (!el) return;
    D = { el, pid: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, gx: 0, gy: 0, active: false, type: e.pointerType, timer: 0, raf: 0 };
    if (e.pointerType !== 'mouse') D.timer = setTimeout(startDrag, 400);
  });
  document.addEventListener('pointermove', e => {
    if (!D || e.pointerId !== D.pid) return;
    D.x = e.clientX; D.y = e.clientY;
    if (!D.active) {
      const mv = Math.hypot(D.x - D.sx, D.y - D.sy);
      if (D.type === 'mouse') { if (mv > 6) startDrag(); }
      else if (mv > 10) { clearTimeout(D.timer); D = null; }   // 길게 누르기 전에 움직였으면 스크롤로 본다
      return;
    }
    e.preventDefault(); moveDrag();
  });
  const endEvt = e => { if (D && e.pointerId === D.pid) finishDrag(e.type === 'pointercancel'); };
  document.addEventListener('pointerup', endEvt);
  document.addEventListener('pointercancel', endEvt);
  document.addEventListener('touchmove', e => { if (D && D.active) e.preventDefault(); }, { passive: false });
  window.addEventListener('blur', () => { if (D) finishDrag(true); });

  function startDrag() {
    if (!D || D.active) return;
    clearTimeout(D.timer);
    const r = D.el.getBoundingClientRect();
    D.active = true; D.gx = D.x - r.left; D.gy = D.y - r.top;
    try { D.el.setPointerCapture(D.pid); } catch (e) {}
    try { getSelection().removeAllRanges(); } catch (e) {}
    D.el.classList.add('dragging'); document.body.classList.add('dragmode');
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    moveDrag(); D.raf = requestAnimationFrame(autoScroll);
  }
  // 카드가 놓인 자리(레이아웃)를 기준으로 손가락 위치를 따라가게 한다
  function place() {
    const el = D.el; el.style.transform = 'none';
    const r = el.getBoundingClientRect();
    el.style.transform = 'translate(' + (D.x - D.gx - r.left) + 'px,' + (D.y - D.gy - r.top) + 'px) scale(1.04)';
  }
  function moveDrag() {
    const el = D.el; place();
    // 화면에 보이는 위치(이동 애니메이션 중일 수 있음)가 아니라 레이아웃 칸을 기준으로 어느 카드 위인지 찾는다
    const px = D.x + window.scrollX, py = D.y + window.scrollY;
    const tgt = [].slice.call(grid.querySelectorAll('a.card')).find(c => c !== el && px >= c.offsetLeft && px <= c.offsetLeft + c.offsetWidth && py >= c.offsetTop && py <= c.offsetTop + c.offsetHeight);
    if (!tgt) return;
    const cards = [].slice.call(grid.querySelectorAll('a.card'));
    const from = cards.indexOf(el), to = cards.indexOf(tgt);
    const first = cards.filter(c => c !== el).map(c => [c, c.getBoundingClientRect()]);
    grid.insertBefore(el, from < to ? tgt.nextSibling : tgt);
    place();
    first.forEach(([c, r0]) => {   // 밀려나는 카드는 부드럽게 제자리로
      const r1 = c.getBoundingClientRect(), dx = r0.left - r1.left, dy = r0.top - r1.top;
      if (!dx && !dy) return;
      c.style.transition = 'none'; c.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; c.getBoundingClientRect();
      c.style.transition = 'transform .18s'; c.style.transform = '';
      setTimeout(() => { c.style.transition = ''; }, 230);
    });
  }
  function autoScroll() {
    if (!D || !D.active) return;
    const h = window.innerHeight; let dy = 0;
    if (D.y < 120) dy = -Math.min(18, Math.ceil((120 - D.y) / 5));
    else if (D.y > h - 70) dy = Math.min(18, Math.ceil((D.y - (h - 70)) / 5));
    if (dy) { window.scrollBy(0, dy); moveDrag(); }
    D.raf = requestAnimationFrame(autoScroll);
  }
  function finishDrag(cancelled) {
    const d = D; D = null; if (!d) return;
    clearTimeout(d.timer); cancelAnimationFrame(d.raf);
    if (!d.active) return;
    d.el.classList.remove('dragging'); d.el.style.transform = ''; document.body.classList.remove('dragmode');
    try { d.el.releasePointerCapture(d.pid); } catch (e) {}
    suppressClick = Date.now() + 350;
    if (cancelled) { render(); return; }
    lsSet(KEY_ORDER, JSON.stringify([].slice.call(grid.querySelectorAll('a.card')).map(c => c.dataset.id)));
    updateHint();
  }

  /* ── 앱 설치 (PWA) ── */
  let deferredPrompt = null;
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (standalone()) $('btnInstall').style.display = 'none';

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; $('btnInstall').style.display = 'none'; toast('SIM Tools가 설치되었습니다.'); });

  function showInstallGuide() {
    let body;
    if (isIOS) body = '<b>iPhone / iPad (Safari)</b><br>① 하단의 공유 버튼(□↑)을 누릅니다.<br>② <b>홈 화면에 추가</b>를 선택합니다.<br>③ 이름을 확인하고 <b>추가</b>를 누릅니다.<br><small style="color:var(--sub)">※ 크롬 등 다른 브라우저가 아닌 Safari에서 열어야 합니다.</small>';
    else if (isAndroid) body = '<b>Android (Chrome)</b><br>① 오른쪽 위 메뉴(⋮)를 엽니다.<br>② <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 선택합니다.';
    else body = '<b>PC (Chrome / Edge)</b><br>주소창 오른쪽의 <b>설치 아이콘(⊕)</b>을 누르거나, 메뉴(⋮) → <b>SIM Tools 설치</b>를 선택합니다.';
    $('installBody').innerHTML = body;
    $('installWarn').textContent = secure ? '' : '현재 주소(' + location.protocol + '//)에서는 설치가 지원되지 않습니다. HTTPS 주소(예: GitHub Pages)로 접속해야 설치할 수 있습니다.';
    $('mInstall').classList.add('show');
  }
  $('btnInstall').onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
    } else showInstallGuide();
  };
  const closeModal = () => $('mInstall').classList.remove('show');
  $('installClose').onclick = closeModal;
  $('mInstall').addEventListener('click', e => { if (e.target === $('mInstall')) closeModal(); });

  if ('serviceWorker' in navigator && secure) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
