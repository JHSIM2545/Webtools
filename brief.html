<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">

<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#14b8a6; --accent2:#14b8a6; --ink:#032420; --ok:#3ecf8e; --warn:#ffb86b; --bad:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header a.back{color:var(--text);text-decoration:none;font-size:26px;line-height:1;padding:0 6px 3px 0}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
header h1 span{color:var(--accent)}
.spacer{flex:1}
button,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent2);border-color:var(--accent2);color:var(--ink);font-weight:700}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.tabs{display:flex;gap:4px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:calc(53px + env(safe-area-inset-top));z-index:19}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--sub)}
.tabs button.on{background:var(--accent2);color:var(--ink);font-weight:700}
main{max-width:960px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:8px}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.hint.warn{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--accent2);color:var(--ink);font-weight:700}
/* 카드 뉴스 바둑판 */
.sec-h{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:15px;font-weight:700}
.sec-h small{color:var(--sub);font-weight:400;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-height:480px) and (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.nc{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;min-width:0}
.nc:active{border-color:var(--accent)}
.nc .ph{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#1f2a2e,#16202a);display:flex;align-items:center;justify-content:center;font-size:30px;color:#3d4d56}
.nc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nc .tt{padding:9px 10px 0;font-size:13.5px;font-weight:600;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.nc .mt{padding:6px 10px 9px;font-size:11.5px;color:var(--sub);margin-top:auto}
.sch{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sch:last-child{border-bottom:0}
.sch b{flex:none;width:52px;color:var(--accent);font-variant-numeric:tabular-nums}
.sch span.s{color:var(--sub);font-size:12px}
.sch i{font-style:normal;font-size:11px;color:var(--sub);margin-left:6px}
/* 일기예보 */
.wx{display:flex;align-items:center;gap:12px}
.wx .t{font-size:34px;font-weight:700;letter-spacing:-1px}
.wx .d{font-size:13px;color:var(--sub);line-height:1.45}
.wx-row{display:flex;gap:8px;margin-top:10px}
.wx-row>div{flex:1;background:var(--panel2);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;color:var(--sub)}
.wx-row b{display:block;color:var(--text);font-size:13.5px;margin-top:2px}
.wxh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.wxh h2{margin:0}
.wxr{display:flex;align-items:center;gap:6px;min-width:0;max-width:75%}
.wxhome{flex:none;font-size:13px;padding:7px 10px;border-radius:12px;color:var(--accent);white-space:nowrap}
.wxplace{font-size:21px;font-weight:800;letter-spacing:-.5px;padding:6px 12px;border-radius:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.wxplace i{font-style:normal;font-size:13px;color:var(--sub);margin-left:2px}
.wxbig{width:88px;height:88px;flex:none}
.wi.wxs{width:42px;height:42px;margin:2px auto 4px}
.wi{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 4px rgba(0,0,0,.42))}
.wi .a{transform-box:fill-box;transform-origin:center}
.wi .rays{animation:wspin 20s linear infinite}
.wi .pulse{animation:wpulse 3.4s ease-in-out infinite}
.wi .fl{animation:wfl 5s ease-in-out infinite}
.wi .fl2{animation:wfl 6.5s ease-in-out infinite reverse}
.wi .dp{animation:wdrop 1.15s linear infinite;opacity:0}
.wi .sn{animation:wsnow 2.6s linear infinite;opacity:0}
.wi .bolt{animation:wbolt 2.8s ease-in-out infinite}
.wi .fg{animation:wfog 4s ease-in-out infinite}
.wi .tw{animation:wtw 2.4s ease-in-out infinite}
@keyframes wspin{to{transform:rotate(360deg)}}
@keyframes wpulse{50%{transform:scale(1.06)}}
@keyframes wfl{50%{transform:translateX(5px)}}
@keyframes wdrop{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(20px);opacity:0}}
@keyframes wsnow{0%{transform:translate(0,-4px);opacity:0}20%{opacity:1}50%{transform:translate(3px,8px)}100%{transform:translate(-2px,20px);opacity:0}}
@keyframes wbolt{0%,55%,100%{opacity:.25}60%,70%{opacity:1}65%{opacity:.4}}
@keyframes wfog{50%{transform:translateX(6px)}}
@keyframes wtw{50%{opacity:.2}}
.plov{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.plbox{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:82vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.plh{display:flex;align-items:center;justify-content:space-between;font-size:17px;margin-bottom:10px}
#plf{display:flex;gap:8px}
#plq{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.plit{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 12px}
.plit small{display:block;color:var(--sub);font-size:12px}
.plch{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.plch button{padding:7px 12px;border-radius:99px;font-size:14px}
.wx-row>div[data-wk]{cursor:pointer}
.wx-row>div[data-wk]:active{background:var(--line)}
.dh{display:grid;grid-template-columns:38px 30px 1fr 70px 66px;align-items:center;gap:6px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.dh:last-child{border-bottom:0}
.dh .hh{font-weight:700}.dh .tp{font-weight:800;font-size:16px}.dh small{display:block;white-space:nowrap;color:var(--sub);font-size:11.5px}
.dh .ic{width:28px;height:28px}
.dh .rr{text-align:right;white-space:nowrap;color:#7cc4ff}.dh .rr.sn{color:#d6ecff}
.dsum{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.dhead{display:grid;grid-template-columns:38px 30px 1fr 70px 66px;gap:6px;color:var(--sub);font-size:11.5px;padding:0 2px 4px;border-bottom:1px solid var(--line)}
.mkt{font-size:12px;color:var(--sub);font-weight:700;margin:8px 2px 4px}.mkt:first-child{margin-top:2px}
.mkg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mk{background:var(--panel2);border-radius:10px;padding:8px 8px 7px;min-width:0}
.mkn{font-size:11.5px;color:var(--sub);white-space:nowrap}.mkv{font-size:15px;font-weight:800;margin:2px 0;white-space:nowrap;letter-spacing:-.3px}
.mkc{font-size:11px;font-weight:700;white-space:nowrap}.mkd{font-size:10px;color:var(--sub);margin-top:2px}
.mk.up .mkc,.mk.up .mkv{color:#ff5a5f}.mk.dn .mkc,.mk.dn .mkv{color:#4c9bff}.mk.fl .mkc{color:var(--sub)}
.lv{color:#2fd27f;font-weight:700}
.mkhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}.mkhd h2{margin:0}
.wlbtn{font-size:12.5px;font-weight:700;color:var(--accent);padding:5px 10px;border-radius:99px;background:var(--panel2);white-space:nowrap}
.sup{color:#ff5a5f}.sdn{color:#4c9bff}.sfl{color:var(--sub)}
.stl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}.stl:last-child{border-bottom:0}.stl:active{background:var(--panel2)}
.stn{min-width:0}.stn b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stn small{color:var(--sub);font-size:12px}
.stp{text-align:right;white-space:nowrap}.stp b{display:block;font-size:16px}.stp small{font-size:12px;font-weight:700}
.wlst{font-size:12px;color:var(--sub);margin:0 2px 4px}
.sdh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 8px}.sdh b{font-size:28px;letter-spacing:-.5px}.sdh span{font-size:14px;font-weight:700}
.sdc{background:#fff;border-radius:12px;padding:6px;text-align:center;margin:6px 0}.sdc img{max-width:100%;height:auto;display:block;margin:0 auto}
.sdg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:6px}.sdg div{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}.sdg div span{color:var(--sub);white-space:nowrap}.sdg div b{text-align:right}
.sdt{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}.sdt th{color:var(--sub);font-weight:500;text-align:right;padding:5px 2px}.sdt td{text-align:right;padding:6px 2px;border-top:1px solid var(--line)}.sdt th:first-child,.sdt td:first-child{text-align:left}
.sdh2{font-size:13px;color:var(--sub);font-weight:700;margin:12px 2px 2px}
.wlcnt{color:var(--sub);font-weight:400;font-size:13px}
.fz{cursor:pointer}
.fz:active{border-color:var(--accent)}
.fzh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.fzh h2{margin:0}
.fzsc{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--panel2);color:#ffd24a;white-space:nowrap}
.fzb{display:flex;align-items:center;gap:12px}
.fzic{width:54px;height:54px;flex:none}
.fzs{flex:1;min-width:0;font-size:14.5px;line-height:1.5;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fzgo{font-size:13px;color:var(--accent);margin-top:6px}
.fzart{display:block;width:78%;max-width:270px;margin:4px auto 10px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.fzsec{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.55}
.fzsec:last-of-type{border-bottom:0}
.fzsec b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.fzlk{display:flex;gap:6px;margin-top:8px}
.fzlk div{flex:1;background:var(--panel2);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--sub)}
.fzlk b{display:block;color:var(--text);font-size:14px;margin-top:2px}
.fzbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:2px 0 8px}
.fzbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff9f1a,#ffd24a)}
.wi .bob{animation:wbob 3.2s ease-in-out infinite}
.wi .flick{animation:wflick .5s ease-in-out infinite alternate}
.wi .stm{animation:wstm 2.6s ease-in-out infinite;opacity:0}
@keyframes wbob{50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes wflick{to{transform:scale(1.15,1.3)}}
@keyframes wstm{0%{transform:translateY(4px);opacity:0}40%{opacity:.7}100%{transform:translateY(-8px);opacity:0}}
.vbar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.vbar b{font-size:16px}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kw{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.kw .x{font-size:15px;padding:0 6px}
.kwf{display:flex;gap:8px;margin-top:6px}
.kwf input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--panel2);margin:8px 6px 0 0}
select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;color-scheme:dark}
/* 설정 */
.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-of-type{border-bottom:0}
.set .tx{flex:1;min-width:0}
.set .tx b{display:block;font-size:15px}
.set .tx small{display:block;color:var(--sub);font-size:12.5px;margin-top:1px}
.sw{position:relative;flex:none;width:46px;height:26px;border-radius:99px;border:0;padding:0;background:#3a4056}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
input[type=time]{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color-scheme:dark;font-size:18px;font-weight:700}
.x{border:0;background:transparent;color:var(--sub);font-size:20px;padding:4px 8px}
.empty{padding:26px 10px;text-align:center;color:var(--sub);font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
</style>
<script src="ui-guard.js" defer></script>
<script src="appmenu.js" defer></script>

<script>
'use strict';
const FN = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/brief-news';
const CATS = [['politics', '정치'], ['economy', '경제'], ['society', '사회'], ['culture', '문화'], ['sports', '스포츠'], ['stock', '증권']];
const CAT_ICON = { politics: '🏛️', economy: '💹', society: '👥', culture: '🎭', sports: '⚽', stock: '📈', custom: '✨' };
const NA = window.SimBrief || null;            // 안드로이드 앱(APK)에서만 있음
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ── 설정 (기기에 저장, 로그인 계정 동기화는 sync.js 가 처리) ── */
const KEY = 'simbrief.v1';

/* ── 일기예보 (기상청 동네예보, 미세먼지는 대기질 모델 추정값) ── */
const CITIES = [['서울', 37.5665, 126.978], ['인천', 37.4563, 126.7052], ['수원', 37.2636, 127.0286], ['춘천', 37.8813, 127.7298], ['강릉', 37.7519, 128.8761], ['대전', 36.3504, 127.3845], ['세종', 36.48, 127.289], ['청주', 36.6424, 127.489], ['전주', 35.8242, 127.148], ['광주', 35.1595, 126.8526], ['대구', 35.8714, 128.6014], ['포항', 36.019, 129.3435], ['울산', 35.5384, 129.3114], ['부산', 35.1796, 129.0756], ['창원', 35.2279, 128.6811], ['제주', 33.4996, 126.5312]];
function wxInfo(c) {
  if (c === 0) return ['☀️', '맑음']; if (c === 1) return ['🌤️', '대체로 맑음']; if (c === 2) return ['⛅', '구름 조금']; if (c === 3) return ['☁️', '흐림'];
  if (c === 45 || c === 48) return ['🌫️', '안개']; if (c >= 51 && c <= 57) return ['🌦️', '이슬비']; if (c >= 61 && c <= 67) return ['🌧️', '비'];
  if (c >= 71 && c <= 77) return ['❄️', '눈']; if (c >= 80 && c <= 82) return ['🌧️', '소나기']; if (c === 85 || c === 86) return ['❄️', '눈 소나기']; if (c >= 95) return ['⛈️', '뇌우'];
  return ['🌡️', '날씨'];
}
const grade = (v, lim) => v == null ? null : v <= lim[0] ? '좋음' : v <= lim[1] ? '보통' : v <= lim[2] ? '나쁨' : '매우 나쁨';
const kmBetween = (a, b, c, d) => { const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); };
function nearestCity(lat, lon) { let best = null; CITIES.forEach(c => { const d = kmBetween(lat, lon, c[1], c[2]); if (!best || d < best[1]) best = [c[0], d]; }); return best; }
async function placeName(lat, lon) {   // 좌표 → 동네 이름 (실패하면 가까운 도시)
  try { const j = await fetchJ('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=ko', 6000); const n = j.locality || j.city || j.principalSubdivision; if (n) return n; } catch (e) {}
  const c = nearestCity(lat, lon); return c[1] < 40 ? c[0] + ' 부근' : '현재 위치';
}
let LOC_ERR = '';
function getPos() {
  return new Promise(res => {
    LOC_ERR = '';
    if (NA && NA.locate) {      // 앱: 기기에서 직접 위치를 찾는다 (웹뷰 위치보다 확실)
      let done = false;
      const to = setTimeout(() => { if (!done) { done = true; LOC_ERR = 'none'; res(null); } }, 15000);
      window.__briefLoc = r => { if (done) return; done = true; clearTimeout(to); if (r && r.lat != null) res({ latitude: r.lat, longitude: r.lon }); else { LOC_ERR = (r && r.err) || 'none'; res(null); } };
      try { NA.locate(); } catch (e) { done = true; clearTimeout(to); LOC_ERR = 'none'; res(null); }
      return;
    }
    if (!navigator.geolocation) { LOC_ERR = 'none'; return res(null); }
    navigator.geolocation.getCurrentPosition(p => res(p.coords), er => { LOC_ERR = er && er.code === 1 ? 'perm' : 'none'; res(null); }, { timeout: 9000, maximumAge: 600000 });
  });
}
const locWhy = () => LOC_ERR === 'perm' ? '앱의 위치 권한이 꺼져 있어요.' : LOC_ERR === 'off' ? '기기의 위치(GPS) 기능이 꺼져 있어요.' : '위치를 찾지 못했어요. 잠시 후 다시 시도해 주세요.';
let LOC_FAIL = false;
/** '현재 위치(자동)'이면 지금 있는 곳으로 예보 위치를 맞춘다. 위치가 바뀌었으면 true */
async function refreshLocation(force) {
  const w = CFG.weather; if (w.mode !== 'auto') return false;
  const c = await getPos();
  if (!c) { LOC_FAIL = true; return false; }
  LOC_FAIL = false;
  const lat = +c.latitude.toFixed(3), lon = +c.longitude.toFixed(3);
  if (w.located && !force && kmBetween(w.lat, w.lon, lat, lon) < 3) return false;
  CFG.weather = Object.assign(w, { lat, lon, located: true, name: await placeName(lat, lon) }); save();
  return true;
}
function fetchJ(url, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal }).then(r => r.ok ? r.json() : Promise.reject(new Error('http'))).finally(() => clearTimeout(t));
}
// 기상청 동네예보(brief-weather 경유). 저장해 둔 예보를 먼저 보여주고, 새 예보가 오면 바로 갱신한다.
const WFN = 'https://gpqlximhoqdybcewdfde.supabase.co/functions/v1/brief-weather';

  if (auto && !CFG.weather.located) await refreshLocation(force);          // 처음엔 위치부터 확인 (엉뚱한 지역 예보를 먼저 보여주지 않게)

/* ── 3D 느낌의 움직이는 날씨 아이콘 (SVG) ── */

const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function idbAll(name, store) {
  return new Promise(res => {
    if (!window.indexedDB) return res([]);
    const r = indexedDB.open(name);
    r.onerror = () => res([]);
    r.onsuccess = () => {
      const db = r.result;
      try { if (!db.objectStoreNames.contains(store)) { db.close(); return res([]); }
        const q = db.transaction(store, 'readonly').objectStore(store).getAll();
        q.onsuccess = () => { db.close(); res(q.result || []); }; q.onerror = () => { db.close(); res([]); };
      } catch (e) { try { db.close(); } catch (x) {} res([]); }
    };
  });
}
function occursOn(r, day) {
  const s = new Date(r.start); if (isNaN(s)) return null;
  const e = new Date(r.end || r.start), d0 = sod(day), d1 = new Date(d0.getTime() + 864e5);
  if (!r.rep) {
    const ee = isNaN(e) || e <= s ? new Date(s.getTime() + (r.allDay ? 864e5 : 36e5)) : (r.allDay ? new Date(sod(e).getTime() + 864e5) : e);
    return s < d1 && ee > d0 ? s : null;
  }
  if (sod(s) > d0) return null;
  if (r.until != null && +d0 >= +r.until) return null;
  const ok = r.rep === 'daily' || (r.rep === 'weekly' && s.getDay() === d0.getDay()) || (r.rep === 'monthly' && s.getDate() === d0.getDate()) || (r.rep === 'yearly' && s.getMonth() === d0.getMonth() && s.getDate() === d0.getDate());
  if (!ok) return null;
  const occ = new Date(d0); occ.setHours(s.getHours(), s.getMinutes(), 0, 0);
  if ((r.ex || []).map(Number).indexOf(+occ) >= 0) return null;
  return occ;
}
async function todaySchedule() {
  const out = [], day = new Date();
  if (CFG.calSim) {
    const L = (await idbAll('simcalendar', 'events')).concat(await idbAll('simassistant', 'events'));
    for (const r of L) { const o = occursOn(r, day); if (o) out.push({ t: r.allDay ? 0 : +o, allDay: !!r.allDay, title: r.title || '(제목 없음)', loc: r.loc || '', src: '심스케줄' }); }
  }
  if (CFG.calDevice && NA) {
    try { if (NA.hasCalendar()) { const a = JSON.parse(NA.calendar(+sod(day), +sod(day) + 864e5)); a.forEach(o => out.push({ t: o.allDay ? 0 : o.start, allDay: o.allDay, title: o.title || '(제목 없음)', loc: o.loc || '', src: '기기 달력' })); } } catch (e) {}
  }
  out.sort((a, b) => (b.allDay - a.allDay) || (a.t - b.t));

}

  kind = kind || (S.tab === 'brief' ? 'alarm' : S.tab);
  if (kind === 'watch') return vWatch();
  if (kind === 'stock') WLR = null;
  const apk = !!NA;
  const nat = apk ? { notif: safe(() => NA.hasNotif()), exact: safe(() => NA.canExact()), cal: safe(() => NA.hasCalendar()) } : null;
  function safe(f) { try { return !!f(); } catch (e) { return false; } }
  const wn = !apk && 'Notification' in window ? Notification.permission : null;
  const C = {
    times: (    '<div class="card"><h2>⏰ 브리핑 시간</h2><div id="times">' + CFG.times.map((x, i) => '<div class="set" data-i="' + i + '"><input type="time" value="' + esc(x.t) + '" data-a="t">' + '<div class="tx"></div>' + sw(x.on).replace('class="sw', 'data-a="on" class="sw') + '<button class="x" data-a="del" aria-label="삭제">✕</button></div>').join('') + '</div>' +
    '<button class="sm" id="addT" style="margin-top:8px">＋ 시간 추가</button>' +
    '<div class="hint">정한 시간에 알림창으로 주요 뉴스·일정을 알려드려요. 알림을 누르면 이 앱이 열려 카드 뉴스로 들어와요.</div></div>'),
    sound: (    '<div class="card"><h2>🔔 알림음</h2><div class="set"><div class="tx"><b>알림음 켜기</b><small>끄면 무음 알림</small></div>' + sw(CFG.sound).replace('class="sw', 'data-a="snd" class="sw') + '</div>' +
    '<div class="hint" style="margin:6px 0 4px">소리를 고르면 바로 들려줘요</div>' +
    SOUNDS.filter(x => x[0] !== 'voice' || hasVoice()).map(x => '<div class="set" data-sid="' + x[0] + '" style="cursor:pointer"><div class="tx"><b>' + x[1] + '</b><small>' + x[2] + '</small></div><span style="font-size:20px;color:var(--accent)">' + (curSound() === x[0] ? '●' : '○') + '</span></div>').join('') + '<div class="hint" id="smsg"></div></div>'),
    cats: ('<div class="card"><h2>📰 브리핑 분야</h2>' + CATS.map(c => '<div class="set"><div class="tx"><b>' + CAT_ICON[c[0]] + ' ' + c[1] + '</b></div>' + sw(CFG.cats[c[0]]).replace('class="sw', 'data-a="cat" data-k="' + c[0] + '" class="sw') + '</div>').join('') + '</div>'),
    mk: ('<div class="card"><h2>📈 증시</h2><div class="set"><div class="tx"><b>메인에 증시 지수 넣기</b><small>코스피·코스닥·원/달러, 미국 3대 지수</small></div>' + sw(CFG.mkt).replace('class="sw', 'data-a="mkt" class="sw') + '</div></div>'),
    wl: wlCardHtml(),
    kw: ('<div class="card"><h2>✨ 맞춤 뉴스</h2><div class="set"><div class="tx"><b>맞춤 뉴스 보기</b><small>키워드별 최근 24시간 뉴스만 모아요</small></div>' + sw(CFG.cats.custom).replace('class="sw', 'data-a="cat" data-k="custom" class="sw') + '</div>' +
      '<div class="kws">' + (CFG.kw || []).map((k, i) => '<span class="kw">' + esc(k) + '<button class="x" data-a="kwdel" data-k="' + i + '" aria-label="삭제">✕</button></span>').join('') + '</div>' +
      ((CFG.kw || []).length < 10 ? '<form id="kwf" class="kwf"><input id="kwIn" type="text" maxlength="24" placeholder="키워드 입력 (예: 삼성전자, 부동산)" autocomplete="off" enterkeyhint="done"><button class="primary" type="submit">추가</button></form>' : '<div class="hint">키워드는 최대 10개예요.</div>') + '</div>'),
    sched: ('<div class="card"><h2>📅 브리핑 일정</h2>' + '<div class="set"><div class="tx"><b>📅 심스케줄</b><small>SIM Calendar·SIM Assistant 일정</small></div>' + sw(CFG.calSim).replace('class="sw', 'data-a="cs" class="sw') + '</div>' +
    '<div class="set"><div class="tx"><b>📱 기기 달력</b><small>' + (apk ? (nat.cal ? '폰 달력 연동됨' : '켜면 달력 읽기 권한을 요청해요') : '안드로이드 앱(APK)에서 쓸 수 있어요') + '</small></div>' + sw(CFG.calDevice && apk).replace('class="sw', 'data-a="cd" ' + (apk ? '' : 'disabled ') + 'class="sw') + '</div></div>'),
    fz: (    '<div class="card"><h2>🔮 오늘의 운세</h2><div class="set"><div class="tx"><b>브리핑에 운세 넣기</b></div>' + sw(CFG.fortune.on).replace('class="sw', 'data-a="fz" class="sw') + '</div>' +
    '<div class="set"><div class="tx"><b>생년월일</b><small>양력 기준</small></div><input type="date" id="fBirth" value="' + esc(CFG.fortune.birth) + '" max="' + new Date().toLocaleDateString('sv-SE') + '" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color-scheme:dark;font-size:15px"></div>' +
    '<div class="set"><div class="tx"><b>성별</b></div><select id="fG"><option value="M"' + (CFG.fortune.g === 'M' ? ' selected' : '') + '>남성</option><option value="F"' + (CFG.fortune.g === 'F' ? ' selected' : '') + '>여성</option></select></div>' +
    '<div class="set"><div class="tx"><b>태어난 시간</b><small>' + (CFG.fortune.time ? '' : '모름') + '</small></div><input type="time" id="fTime" value="' + esc(CFG.fortune.time) + '">' + (CFG.fortune.time ? '<button class="x" id="fTimeClr" aria-label="시간 지우기">✕</button>' : '') + '</div></div>'),
    wx: (    '<div class="card"><h2>🌤️ 일기예보</h2><div class="set"><div class="tx"><b>브리핑에 일기예보 넣기</b><small>알림과 브리핑 화면에 오늘 날씨·미세먼지 표시</small></div>' + sw(CFG.weather.on).replace('class="sw', 'data-a="wx" class="sw') + '</div>' +
    '<div class="set"><div class="tx"><b>지역</b><small>' + (CFG.weather.mode === 'auto' ? (CFG.weather.located ? '📍 ' + esc(CFG.weather.name) + ' (지금 있는 곳 자동)' : '지금 있는 곳 자동 (위치 확인 전)') : esc(CFG.weather.name)) + '</small></div><select id="wxCity"><option value="__auto"' + (CFG.weather.mode === 'auto' ? ' selected' : '') + '>📍 현재 위치 (자동)</option>' + CITIES.map(c => '<option value="' + c[0] + '"' + (CFG.weather.mode !== 'auto' && CFG.weather.name === c[0] ? ' selected' : '') + '>' + c[0] + '</option>').join('') + '</select></div>' +
    '<button class="sm" id="wxLoc" style="margin-top:6px">📍 지금 있는 곳으로 다시 맞추기</button></div>'),
    test: (    '<div class="card"><h2>🧪 알림 확인</h2>' +
    (apk ? '<div class="set"><div class="tx"><b>알림 권한</b><small>' + (nat.notif ? '허용됨' : '꺼져 있어요') + '</small></div>' + (nat.notif ? '' : '<button class="sm" id="reqN">허용</button>') + '</div>' +
      '<div class="set"><div class="tx"><b>정확한 시각 알람</b><small>' + (nat.exact ? '허용됨' : '꺼져 있으면 알림이 몇 분 늦을 수 있어요 — "알람 및 리마인더" 허용') + '</small></div>' + (nat.exact ? '' : '<button class="sm" id="reqE">설정 열기</button>') + '</div>' :
      '<div class="set"><div class="tx"><b>브라우저 알림</b><small>' + (wn === 'granted' ? '허용됨' : wn === 'denied' ? '차단됨 — 브라우저 설정에서 허용해 주세요' : wn ? '아직 허용 전' : '이 브라우저는 알림을 지원하지 않아요') + '</small></div>' + (wn === 'default' ? '<button class="sm" id="reqW">허용</button>' : '') + '</div>') +
    '<button class="primary" id="test" style="width:100%;margin-top:10px">지금 브리핑 알림 테스트</button>' +
    '<div class="hint ' + (apk ? '' : 'warn') + '">' + (apk ? '앱을 꺼 두어도 정한 시간에 알림이 와요. 폰 절전 설정이 앱을 제한하면 알림이 안 올 수 있으니 SIM Brief를 "제한 없음"으로 두세요.' : '웹 브라우저에서는 이 화면이 열려 있는 동안만 정시 알림이 와요. 앱을 꺼 둬도 알림을 받으려면 런처에서 SIM Brief 앱(APK)을 설치해 주세요.') + '</div></div>'),
  };
  const TT = { news: '📰 뉴스 설정', stock: '📈 증권 설정', fortune: '🔮 운세 설정', alarm: '🔔 알림 설정' };
  main.innerHTML = '<div class="vbar"><button class="sm" id="toBrief">‹ 뒤로</button><b>' + (TT[kind] || '') + '</b></div>' +
    (kind === 'news' ? C.cats + C.kw : kind === 'stock' ? C.mk + C.wl : kind === 'fortune' ? C.fz : C.times + C.sound + C.sched + C.wx + C.test);
  if (kind === 'alarm') setTimeout(showDiag, 50);
}
main.addEventListener('click', async e => {
  const sr = S.tab === 'alarm' && e.target.closest('[data-sid]');
  if (sr) { CFG.soundId = sr.dataset.sid; save(); vSet(); playSound(CFG.soundId); return; }
  const t = e.target.closest('button'); if (!t) return;
  if (S.tab === 'brief') { if (t.dataset.c) { S.cat = t.dataset.c; vBrief(); } return; }
  const row = t.closest('[data-i]'), a = t.dataset.a;
  if (t.id === 'addT') { CFG.times.push({ t: '18:00', on: true }); save(); vSet(); return; }
  if (a === 'del' && row) { CFG.times.splice(+row.dataset.i, 1); save(); vSet(); return; }
  if (a === 'on' && row) { const x = CFG.times[+row.dataset.i]; x.on = !x.on; save(); vSet(); return; }
  if (a === 'snd') { CFG.sound = !CFG.sound; save(); vSet(); if (CFG.sound) playSound(curSound()); return; }
  if (t.id === 'toBrief') { goView('brief'); return; }
  if (a === 'wladd') { CFG.watch = CFG.watch || []; if (CFG.watch.length >= 20) { toast('관심 종목은 최대 20개예요'); return; } if (!CFG.watch.some(c => c.c === t.dataset.c)) CFG.watch.push({ c: t.dataset.c, n: t.dataset.n, m: t.dataset.m }); save(); wlRefresh(); return; }
  if (a === 'wldel') { CFG.watch.splice(+t.dataset.k, 1); save(); wlRefresh(); return; }
  if (a === 'kwdel') { CFG.kw.splice(+t.dataset.k, 1); save(); vSet(); return; }
  if (a === 'cat') { CFG.cats[t.dataset.k] = !CFG.cats[t.dataset.k]; save(); vSet(); return; }
  if (a === 'fz') { CFG.fortune.on = !CFG.fortune.on; save(); vSet(); return; }
  if (t.id === 'fTimeClr') { CFG.fortune.time = ''; save(); vSet(); return; }
  if (a === 'wx') { CFG.weather.on = !CFG.weather.on; save(); vSet(); return; }
  if (t.id === 'wxLoc') {
    CFG.weather.mode = 'auto'; save(); toast('현재 위치를 확인하는 중…');
    const ch = await refreshLocation(true);
    toast(ch ? '📍 ' + CFG.weather.name + ' 기준으로 맞췄어요' : locWhy()); vSet(); return;
  }
  if (a === 'mkt') { CFG.mkt = !CFG.mkt; save(); vSet(); return; }
  if (a === 'cs') { CFG.calSim = !CFG.calSim; save(); vSet(); return; }
  if (a === 'cd' && !t.disabled) {
    CFG.calDevice = !CFG.calDevice; save();
    if (CFG.calDevice && NA && !NA.hasCalendar()) { NA.requestCalendar(); toast('달력 읽기를 허용해 주세요'); }
    vSet(); return;
  }
  if (t.id === 'reqN') { NA.requestNotif(); return; }
  if (t.id === 'reqE') { NA.openExact(); return; }
  if (t.id === 'reqW') { const p = await Notification.requestPermission(); vSet(); if (p === 'granted') toast('알림을 허용했어요'); return; }
  if (t.id === 'test') {
    if (NA) { save(); NA.test(); toast('알림창을 확인해 보세요'); return; }
    if (CFG.sound) playSound(curSound());
    await webNotify('테스트');
  }
});
main.addEventListener('submit', e => {
  if (e.target.id === 'wlf') {
    e.preventDefault(); const q = ($('wlIn').value || '').trim(); if (!q) return;
    WLR = 'load'; wlRefresh(); $('wlIn').value = q;
    fetchJ(SFN + '?q=' + encodeURIComponent(q), 10000).then(r => { WLR = r && r.ok ? r.items : 'fail'; }).catch(() => { WLR = 'fail'; }).then(() => { if (S.tab === 'stock') { wlRefresh(); if ($('wlIn')) $('wlIn').value = q; } });
    return;
  }
  if (e.target.id !== 'kwf') return; e.preventDefault();
  const i = $('kwIn'), v = (i.value || '').trim().replace(/[,#]/g, ' ').replace(/\s+/g, ' ').slice(0, 24);
  if (!v) return; CFG.kw = CFG.kw || [];
  if (CFG.kw.includes(v)) { toast('이미 있는 키워드예요'); return; }
  if (CFG.kw.length >= 10) { toast('키워드는 최대 10개예요'); return; }
  CFG.kw.push(v); save(); vSet();
});
main.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fBirth') { CFG.fortune.birth = t.value; save(); toast(t.value ? '저장했어요' : '지웠어요'); return; }
  if (t.id === 'fG') { CFG.fortune.g = t.value === 'F' ? 'F' : 'M'; save(); return; }
  if (t.id === 'fTime') { CFG.fortune.time = t.value; save(); vSet(); return; }
  if (t.id === 'wxCity') {
    if (t.value === '__auto') { CFG.weather.mode = 'auto'; save(); refreshLocation(true).then(() => vSet()); vSet(); return; }
    const c = CITIES.find(x => x[0] === t.value); if (c) { CFG.weather = Object.assign(CFG.weather, { mode: 'city', located: false, name: c[0], lat: c[1], lon: c[2] }); save(); vSet(); } return;
  }
  if (t.dataset.a !== 't') return;
  const row = t.closest('[data-i]'); if (!row) return;
  CFG.times[+row.dataset.i].t = t.value; save();
});

/* ── 웹 브라우저용 정시 알림 (화면이 열려 있는 동안) ── */
async function webNotify(label) {
  if (!('Notification' in window)) { toast('이 브라우저는 알림을 지원하지 않아요'); return; }
  if (Notification.permission !== 'granted') { toast('알림을 먼저 허용해 주세요'); return; }
  let body = '누르면 오늘의 브리핑을 볼 수 있어요.';
  try { const r = await loadNews('all', 2, false); const f = CATS.map(c => (r.items[c[0]] || [])[0] && '[' + c[1] + '] ' + r.items[c[0]][0].title).filter(Boolean); if (f.length) body = f.slice(0, 3).join('\n'); } catch (e) {}
  const o = { body, icon: 'brief-icon-192.png', tag: 'simbrief', silent: true };
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg && reg.showNotification) await reg.showNotification('SIM Brief · ' + label + ' 브리핑', o);
    else { const n = new Notification('SIM Brief · ' + label + ' 브리핑', o); n.onclick = () => { window.focus(); n.close(); }; }
  } catch (e) { toast('알림을 띄우지 못했어요'); }
}
if (!NA) setInterval(() => {
  const d = new Date(), cur = hm(d), day = d.toLocaleDateString('sv-SE');
  CFG.times.forEach(x => { if (x.on && x.t === cur && lsGet('simbrief.last.' + x.t) !== day) { lsSet('simbrief.last.' + x.t, day); if (CFG.sound) playSound(curSound()); webNotify(x.t); } });
}, 20000);

/* ── 설정 화면 이동·새로고침 ── */
main.addEventListener('click', e => { const r = S.tab === 'watch' && e.target.closest('[data-st]'); if (r) openStock(r.dataset.st); });
function goView(v) { S.tab = v || 'brief'; seq++; render(); window.scrollTo(0, 0); }
// 상단 ⋮ 메뉴(공통 메뉴)에 설정 항목을 넣는다
(window.simAppMenuExtra = window.simAppMenuExtra || []).push(
  { icon: '📰', label: '뉴스 설정', run: () => goView('news') },
  { icon: '📈', label: '증권 설정', run: () => goView('stock') },
  { icon: '🔮', label: '운세 설정', run: () => goView('fortune') },
  { icon: '🔔', label: '알림 설정', run: () => goView('alarm') });
$('refresh').addEventListener('click', () => { if (S.tab === 'brief') vBrief(true); else vSet(); });
function render() { seq++; S.tab === 'brief' ? vBrief() : vSet(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab !== 'brief') vSet(); });   // 권한 설정을 하고 돌아오면 상태 갱신
save();      // 앱에서는 열 때마다 알람을 다시 맞춘다
render();
</script>
</body>
</html>
