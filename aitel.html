<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>SIM AI-Tel</title>
<link rel="icon" type="image/png" href="aitel-icon-192.png">
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1f2330;--line:#2a2f3f;--text:#e8eaf0;--sub:#8b92a8;--accent:#8b7dff;--accent2:#6a5cf0;--ok:#34c38f;--warn:#f5b042;--danger:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;font-weight:700;flex:1}.bar h1 span{color:var(--accent)}
.back{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:20px}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:none;padding:12px 0;font-weight:700;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{display:none;flex:1;overflow-y:auto;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
.banner{background:#2a2312;border:1px solid #5a4a1c;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.card:active{background:var(--panel2)}
.card b{display:block;font-size:15.5px}
.card small{display:block;color:var(--sub);font-size:12.5px;margin-top:3px;line-height:1.5}
.card .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{flex:none;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--sub)}
.pill.queued,.pill.calling{background:#222a55;color:#9fb0ff}.pill.done{background:#12352a;color:var(--ok)}
.pill.failed,.pill.cancelled{background:#3a1c1c;color:var(--danger)}.pill.needs_input{background:#3d2e10;color:var(--warn)}
.sim{font-size:11px;color:var(--warn);margin-left:6px}
.empty{padding:50px 10px;text-align:center;color:var(--sub);line-height:1.7}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent2);border-color:var(--accent2);color:#fff;font-size:28px;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:18px;margin-bottom:4px}
.row2{display:flex;gap:8px;margin-top:16px}.row2>*{flex:1}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds button{padding:6px 12px;border-radius:99px;font-size:13.5px}
.kinds button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.tr{margin:10px 0 0;font-size:13.5px;line-height:1.6}
.tr p{padding:7px 10px;border-radius:12px;margin-bottom:6px;max-width:88%}
.tr .ai{background:#222a55}.tr .peer{background:var(--panel2);margin-left:auto}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;white-space:pre-wrap;margin-top:8px}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2f40;border:1px solid var(--line);padding:9px 15px;border-radius:12px;font-size:13.5px;z-index:50;display:none;max-width:90%}
</style>
<script src="ui-guard.js" defer></script>
<script src="sync.js?bg=1" defer></script>
</head>
<body>
<div class="bar"><a class="back" href="index.html" title="SIM Tools">‹</a><h1>SIM <span>AI-Tel</span></h1></div>

<div id="app" style="display:flex;flex:1;min-height:0;flex-direction:column">
  <div class="tabs"><button data-t="req" class="on">요청</button><button data-t="log">통화 기록</button><button data-t="set">설정</button></div>
  <div class="pane on" id="pReq"></div>
  <div class="pane" id="pLog"></div>
  <div class="pane" id="pSet"></div>
  <button class="fab" id="fab" title="새 요청">+</button>
</div>

<div class="sheet" id="shNew"><div class="in">
  <h2>새 통화 요청</h2>
  <label>종류</label>
  <div class="kinds" id="kinds"></div>
  <label>상대 이름 (식당·병원·단지 등)</label><input id="nName">
  <label>상대 전화번호</label><input id="nPhone" inputmode="tel" placeholder="02-000-0000">
  <label>원하는 것</label><textarea id="nGoal" placeholder="예) 내일 저녁 7시 4명 예약"></textarea>
  <label>세부 조건 (선택)</label><textarea id="nDetails" placeholder="예) 예약자 이름 심정환, 창가 자리, 유아 의자 필요"></textarea>
  <label>안 될 때 대안 (선택)</label><input id="nFall" placeholder="예) 7시 안 되면 7시 30분~8시까지 가능">
  <div class="row2"><button id="nCancel">취소</button><button id="nSave" class="primary">저장</button></div>
</div></div>

<div class="sheet" id="shDet"><div class="in" id="detBody"></div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const KIND = { reserve: '예약', change: '예약 변경', cancel: '예약 취소', inquiry: '문의·확인', other: '기타' };
const STATUS = { draft: '초안', queued: '대기열', calling: '통화 중', done: '완료', failed: '실패', needs_input: '확인 필요', cancelled: '취소됨' };
let reqs = [], calls = [], settings = null, kind = 'reserve';
const el = (t, props, ...kids) => { const e = document.createElement(t); Object.assign(e, props || {}); kids.forEach(k => e.append(k)); return e; };
function toast(m, ms = 2800) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms); }
const fmt = s => { const d = new Date(s); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const errMsg = e => (e && (e.message || e.error_description)) || String(e);

/* ───────── 기기 저장소 (IndexedDB) ─────────
   요청·통화 기록·설정은 이 기기의 브라우저 저장소에만 저장되며 서버로 보내지 않습니다.
   앱 파일을 복사해 다른 곳에 올려도 저장된 데이터는 따라가지 않고, 각자의 기기·주소에만 생깁니다. */
let dbp = null;
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('이 브라우저는 기기 저장소를 지원하지 않습니다.'));
    const r = indexedDB.open('simaitel', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('requests', { keyPath: 'id' }); d.createObjectStore('calls', { keyPath: 'id' }); d.createObjectStore('settings', { keyPath: 'key' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out; const q = fn(t.objectStore(store));
    if (q) q.onsuccess = () => { out = q.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbAll = store => tx(store, 'readonly', s => s.getAll());
const dbPut = (store, row) => tx(store, 'readwrite', s => s.put(row)).then(() => row);
const dbDel = (store, id) => tx(store, 'readwrite', s => s.delete(id));
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const nowISO = () => new Date().toISOString();
async function loadAll() {
  const [a, b, c] = await Promise.all([dbAll('requests'), dbAll('calls'), dbAll('settings')]);
  reqs = a.sort((x, y) => String(y.created_at).localeCompare(String(x.created_at)));
  calls = b.sort((x, y) => String(y.started_at).localeCompare(String(x.started_at)));
  settings = c.find(x => x.key === 'main') || null;
}

/* ───────── 화면 ───────── */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['req', 'log', 'set'].forEach(t => $('p' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', t === b.dataset.t));
  $('fab').style.display = b.dataset.t === 'req' ? '' : 'none';
});
function drawAll() { drawReq(); drawLog(); drawSet(); }
function drawReq() {
  const p = $('pReq'); p.replaceChildren(el('div', { className: 'banner', textContent: '⚠ 전화 회선과 AI 음성이 아직 연결되지 않았습니다. 지금은 요청을 저장하고, "테스트 통화"로 화면 흐름만 확인할 수 있습니다. 실제 통화는 되지 않습니다.' }));
  if (!reqs.length) { p.append(el('div', { className: 'empty', textContent: '아직 요청이 없습니다.\n오른쪽 아래 + 버튼으로 추가하세요.' })); return; }
  reqs.forEach(r => {
    const c = el('div', { className: 'card' }, el('div', { className: 'top' }, el('b', { textContent: (r.target_name || '상대 미정') + ' · ' + KIND[r.kind] }), el('span', { className: 'pill ' + r.status, textContent: STATUS[r.status] })), el('small', { textContent: r.goal }));
    c.onclick = () => openDet(r.id); p.append(c);
  });
}
function drawLog() {
  const p = $('pLog'); p.replaceChildren();
  if (!calls.length) { p.append(el('div', { className: 'empty', textContent: '통화 기록이 없습니다.' })); return; }
  calls.forEach(c => {
    const card = el('div', { className: 'card' }, el('div', { className: 'top' }, el('b', { textContent: (c.direction === 'in' ? '📥 ' : '📤 ') + (c.peer_name || c.peer_number || '알 수 없음') }), el('small', { textContent: fmt(c.started_at) })),
      el('small', { textContent: c.summary || '(요약 없음)' }));
    if (c.simulated) card.firstChild.firstChild.append(el('span', { className: 'sim', textContent: '시뮬레이션' }));
    if (c.action_needed) card.append(el('small', { textContent: '⚠ 확인 필요', style: 'color:var(--warn)' }));
    card.onclick = () => openCall(c); p.append(card);
  });
}
function drawSet() {
  const s = Object.assign({ my_name: '', my_org: '', disclose_text: '', inbound_mode: 'off', inbound_greeting: '', limits: '' }, settings || {});
  const p = $('pSet'); p.replaceChildren();
  const f = (lab, tag, key, attrs) => { p.append(el('label', { textContent: lab })); const i = el(tag, Object.assign({ id: 's_' + key, value: s[key] }, attrs || {})); p.append(i); return i; };
  f('내 이름', 'input', 'my_name'); f('소속 (통화 시 소개)', 'input', 'my_org', { placeholder: '예) 에스원 북서울지사' });
  f('통화 시작 고지 문구 (AI임을 밝힘)', 'textarea', 'disclose_text');
  p.append(el('p', { className: 'note', textContent: 'AI가 대신 통화한다는 사실과 기록 여부를 상대에게 알리는 문구입니다. 비워 두지 않는 것을 권합니다.' }));
  p.append(el('label', { textContent: '받는 전화 처리 (2단계)' }));
  const sel = el('select', { id: 's_inbound_mode' }, el('option', { value: 'off', textContent: '사용 안 함' }), el('option', { value: 'take_message', textContent: '용건만 받아 요약 전달' }), el('option', { value: 'screen', textContent: '용건 확인 후 내게 연결 여부 문의' }));
  sel.value = s.inbound_mode; p.append(sel);
  f('받을 때 첫 인사', 'textarea', 'inbound_greeting');
  f('AI가 지켜야 할 한계', 'textarea', 'limits');
  const sv = el('button', { className: 'primary', textContent: '설정 저장', style: 'margin-top:16px;width:100%' });
  sv.onclick = async () => {
    const row = { key: 'main', my_name: $('s_my_name').value.trim(), my_org: $('s_my_org').value.trim(), disclose_text: $('s_disclose_text').value.trim(), inbound_mode: $('s_inbound_mode').value, inbound_greeting: $('s_inbound_greeting').value.trim(), limits: $('s_limits').value.trim(), updated_at: new Date().toISOString() };
    try { await dbPut('settings', row); } catch (e) { return toast('저장 실패: ' + errMsg(e), 4500); }
    settings = row; toast('저장했습니다.');
  };
  p.append(sv);
  p.append(el('p', { className: 'note', textContent: '요청·통화 기록·설정은 이 기기에만 저장됩니다. 서버로 전송되지 않으며, 브라우저 사이트 데이터를 지우면 함께 삭제됩니다.' }));
  p.append(el('p', { className: 'note', textContent: '받는 전화 처리는 통신사 착신 전환과 별도 번호가 연결된 뒤에 동작합니다. 지금은 설정만 저장됩니다.' }));
}

/* ───────── 새 요청 ───────── */
function drawKinds() { const k = $('kinds'); k.replaceChildren(); Object.keys(KIND).forEach(x => { const b = el('button', { textContent: KIND[x], className: x === kind ? 'on' : '' }); b.onclick = () => { kind = x; drawKinds(); }; k.append(b); }); }
$('fab').onclick = () => { kind = 'reserve'; drawKinds(); ['nName', 'nPhone', 'nGoal', 'nDetails', 'nFall'].forEach(i => $(i).value = ''); $('shNew').classList.add('on'); };
$('nCancel').onclick = () => $('shNew').classList.remove('on');
$('nSave').onclick = async () => {
  const goal = $('nGoal').value.trim(); if (!goal) return toast('원하는 것을 입력하세요.');
  const row = { id: uid(), kind, target_name: $('nName').value.trim(), target_phone: $('nPhone').value.trim(), goal, details: $('nDetails').value.trim(), fallback: $('nFall').value.trim(), status: 'draft', created_at: nowISO(), updated_at: nowISO() };
  try { await dbPut('requests', row); } catch (e) { return toast('저장 실패: ' + errMsg(e), 4500); }
  reqs.unshift(row); $('shNew').classList.remove('on'); drawReq(); toast('저장했습니다.');
};

/* ───────── 상세 / 시뮬레이션 ───────── */
function openCall(c) {
  const b = $('detBody'); b.replaceChildren(el('h2', { textContent: (c.direction === 'in' ? '받은 전화' : '건 전화') + ' · ' + (c.peer_name || c.peer_number || '') }),
    el('p', { className: 'note', textContent: fmt(c.started_at) + (c.simulated ? ' · 시뮬레이션(실제 통화 아님)' : '') }), el('div', { className: 'sum', textContent: c.summary || '(요약 없음)' }));
  const tr = el('div', { className: 'tr' }); (c.transcript || []).forEach(t => tr.append(el('p', { className: t.who === 'ai' ? 'ai' : 'peer', textContent: (t.who === 'ai' ? 'AI: ' : '상대: ') + t.text }))); b.append(tr);
  const x = el('button', { textContent: '닫기', style: 'width:100%;margin-top:14px' }); x.onclick = () => $('shDet').classList.remove('on'); b.append(x);
  $('shDet').classList.add('on');
}
function openDet(id) {
  const r = reqs.find(x => x.id === id); if (!r) return;
  const b = $('detBody'); b.replaceChildren(el('h2', { textContent: (r.target_name || '상대 미정') + ' · ' + KIND[r.kind] }),
    el('p', { className: 'note', textContent: [r.target_phone, STATUS[r.status]].filter(Boolean).join(' · ') }),
    el('div', { className: 'sum', textContent: '요청: ' + r.goal + (r.details ? '\n조건: ' + r.details : '') + (r.fallback ? '\n대안: ' + r.fallback : '') }));
  if (r.result_summary) b.append(el('div', { className: 'sum', textContent: '결과: ' + r.result_summary }));
  const mine = calls.filter(c => c.request_id === id);
  mine.forEach(c => { const k = el('div', { className: 'card' }, el('b', { textContent: '통화 ' + fmt(c.started_at) + (c.simulated ? ' (시뮬레이션)' : '') }), el('small', { textContent: c.summary })); k.onclick = () => openCall(c); b.append(k); });
  const q = el('button', { textContent: '대기열에 넣기', disabled: r.status !== 'draft' }), t = el('button', { className: 'primary', textContent: '테스트 통화(시뮬레이션)' }), d = el('button', { className: 'danger', textContent: '삭제' }), x = el('button', { textContent: '닫기' });
  q.onclick = async () => { await setStatus(r, 'queued'); toast('대기열에 저장했습니다. 전화 회선이 연결되면 발신됩니다.', 4000); openDet(id); };
  t.onclick = () => simulate(r);
  d.onclick = async () => { if (!confirm('이 요청을 삭제할까요?')) return; try { await dbDel('requests', id); } catch (e) { return toast('삭제 실패: ' + errMsg(e)); } reqs = reqs.filter(z => z.id !== id); $('shDet').classList.remove('on'); drawReq(); };
  x.onclick = () => $('shDet').classList.remove('on');
  b.append(el('div', { className: 'row2' }, q, t), el('div', { className: 'row2' }, d, x),
    el('p', { className: 'note', textContent: '테스트 통화는 미리 정해진 대본으로 화면 흐름만 보여 주며, 실제로 전화하지 않습니다.' }));
  $('shDet').classList.add('on');
}
async function setStatus(r, status, extra) {
  const next = Object.assign({}, r, { status, updated_at: nowISO() }, extra || {});
  try { await dbPut('requests', next); } catch (e) { toast('변경 실패: ' + errMsg(e), 4500); return false; }
  Object.assign(r, next); drawReq(); return true;
}
async function simulate(r) {
  const org = (settings && settings.my_org) || '', who = (settings && settings.my_name) || '고객',
    intro = (settings && settings.disclose_text) || '안녕하세요, AI 비서입니다.';
  const tr = [{ who: 'ai', text: intro }, { who: 'ai', text: who + (org ? '(' + org + ')' : '') + ' 님을 대신해 ' + KIND[r.kind] + ' 문의드립니다. ' + r.goal }, { who: 'peer', text: '(상대 응답 예시) 확인해 보겠습니다.' },
    { who: 'ai', text: r.details ? '참고로 ' + r.details + ' 입니다.' : '추가 조건은 없습니다.' }, { who: 'peer', text: '(상대 응답 예시) 가능합니다.' }, { who: 'ai', text: '감사합니다. 확정 내용은 ' + who + ' 님께 전달드리겠습니다.' }];
  const summary = '[시뮬레이션] ' + (r.target_name || '상대') + '에 ' + KIND[r.kind] + ' 요청: ' + r.goal + ' → 가능하다는 예시 응답. 실제 통화가 아니므로 확정된 내용이 아닙니다.';
  const c = { id: uid(), request_id: r.id, direction: 'out', peer_number: r.target_phone, peer_name: r.target_name, status: 'done', duration_sec: 0, summary, transcript: tr, simulated: true, action_needed: false, started_at: nowISO() };
  try { await dbPut('calls', c); } catch (e) { return toast('기록 실패: ' + errMsg(e), 4500); }
  calls.unshift(c); await setStatus(r, 'needs_input', { result_summary: '시뮬레이션 결과입니다. 실제 통화가 연결되면 여기에 실제 결과가 표시됩니다.' }); drawLog(); openDet(r.id);
}

/* ───────── 시작 ───────── */
(async () => {
  try { await loadAll(); } catch (e) { toast('기기 저장소를 열지 못했습니다: ' + errMsg(e), 5000); }
  drawAll();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
