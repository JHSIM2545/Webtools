<!DOCTYPE html>
<html lang="ko">
<head>
<script src="aiphone.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>SIM Assistant</title>
<link rel="icon" type="image/png" href="assistant-icon-192.png">
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1f2330;--line:#2a2f3f;--text:#e8eaf0;--sub:#8b92a8;--accent:#4cc9f0;--accent2:#0ea5e9;--ok:#34c38f;--warn:#7dd3fc;--danger:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#031a2b;font-weight:700}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:11px 16px;outline:none;width:100%}
input:focus{border-color:var(--accent)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;font-weight:700;flex:1}.bar h1 span{color:var(--accent)}
.back{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:20px}
.iconbtn{width:38px;height:38px;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center}
.iconbtn.off{opacity:.45}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:none;padding:12px 0;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;position:relative}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button i{font-style:normal;font-size:11px;font-weight:700;background:var(--panel2);color:var(--sub);border-radius:99px;padding:1px 6px;margin-left:4px}
.tabs button.on i{background:#10304a;color:var(--accent)}
.pane{display:none;flex:1;min-height:0;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
#pChat.on{display:flex;flex-direction:column;padding-bottom:84px}
#chat{flex:1;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:9px 12px;border-radius:16px;font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.bot{max-width:88%;background:#2a3145;color:#f1f4fa;border:0;border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:#fee500;color:#191919;border:0;border-top-right-radius:4px;align-self:flex-end;font-weight:500}
.msg.sys{align-self:center;background:none;color:var(--sub);font-size:12.5px;text-align:center;max-width:94%}
.msg .sub{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.msg .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.msg .btns button,.msg .btns a.btn{padding:7px 13px;border-radius:99px;font-size:13.5px}
.pin{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em;background:url(pin-icon.svg) center/contain no-repeat}   /* 모든 위치 아이콘은 pin-icon.svg로 통일 (버튼 라벨은 맨 앞 📍를 이 아이콘으로 바꿔 그림) */
a.btn{display:inline-block;font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);text-decoration:none}
a.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#031a2b;font-weight:700}
.kv{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:13.5px;line-height:1.7}
.kv div{display:flex;gap:10px}.kv b{flex:none;width:58px;color:var(--sub);font-weight:600;font-size:12.5px}
.kv span{flex:1;word-break:break-all}
.who{display:flex;align-items:center;gap:10px;margin-top:2px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.who b{font-size:15.5px}.who small{display:block;color:var(--sub);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:99px;font-size:13px;padding:6px 12px;color:var(--sub)}
.composer{display:flex;align-items:center;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.composer{padding-left:10px;padding-right:10px}
.inwrap{position:relative;flex:1;min-width:0}
.inwrap input{padding-right:56px}
.inwrap .send{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;font-size:16px;background:var(--accent2);border-color:var(--accent2);color:#031a2b}
.msg.me{white-space:pre-wrap;word-break:break-word}
.send{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;flex:none}
.mic{position:static;width:40px;height:40px;border-radius:50%;padding:0;flex:none;background:var(--accent);border-color:var(--accent);color:#031a2b;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:none}
.mic svg{width:100%;height:100%;display:block}
#camOv{position:fixed;inset:0;z-index:120;background:#000;display:none;flex-direction:column}
#camOv.on{display:flex}
#camVid{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
#camBar{display:flex;align-items:center;justify-content:space-around;padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:#000}
#camBar button{width:52px;height:52px;border-radius:50%;padding:0;font-size:22px;background:#1b2230;border:1px solid #2c3648;color:#fff}
#camBar #camShot{width:72px;height:72px;background:#fff;border:5px solid #9aa7bd}
#camOv.live #camShot{display:none}
#camGuide{position:absolute;left:50%;top:calc(50% - 52px);width:72vmin;height:72vmin;max-width:440px;max-height:440px;transform:translate(-50%,-50%);pointer-events:none}
#camGuide::before{content:'';position:absolute;inset:0;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.28)}
#camGuide i{position:absolute;width:16%;height:16%;border:0 solid #4cc9f0;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
#camGuide i:nth-child(1){top:0;left:0;border-top-width:4px;border-left-width:4px;border-top-left-radius:16px}
#camGuide i:nth-child(2){top:0;right:0;border-top-width:4px;border-right-width:4px;border-top-right-radius:16px}
#camGuide i:nth-child(3){bottom:0;left:0;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:16px}
#camGuide i:nth-child(4){bottom:0;right:0;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:16px}
#camLoad{position:absolute;left:0;right:0;top:calc(50% - 52px);text-align:center;color:#cfe9f5;font-size:14px;display:none;transform:translateY(-50%);pointer-events:none}
#camOv.load #camLoad{display:block}
#camOv.load #camGuide i{animation:guidepulse 1.1s ease-in-out infinite}
@keyframes guidepulse{0%,100%{opacity:.35;transform:scale(1.08)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#camOv.load #camGuide i{animation:none}}
#camClose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;padding:0;background:rgba(0,0,0,.55);border:1px solid #556;color:#fff;font-size:18px}
#camNote{position:absolute;top:calc(16px + env(safe-area-inset-top));left:14px;right:70px;color:#fff;font-size:14px;text-shadow:0 1px 4px #000}
#callPanel{position:fixed;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));width:min(84vw,300px);max-height:42vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:80;display:none;flex-direction:column;font-size:11.5px;overflow:hidden}
#callPanel.on{display:flex}
#callPanel .cph{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
#callPanel .cph span{flex:1;color:var(--sub)}
#callPanel .cph button{width:24px;height:24px;padding:0;border-radius:50%;font-size:12px;flex:none}
#callPanel .cpb{overflow:auto;padding:7px 10px;line-height:1.45}
#callPanel .cpl i{color:var(--sub);font-style:normal;margin-right:4px}
#callPanel .cpn{color:var(--sub);margin-top:5px;font-size:10.5px}
.cpt{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.cpm{max-width:88%;padding:4px 8px;border-radius:9px;font-size:11.5px;line-height:1.4;word-break:break-word}
.cpm.a{align-self:flex-start;background:#1b2a3a}
.cpm.c{align-self:flex-end;background:#27344a}
.cam{width:40px;height:40px;border-radius:50%;padding:0;flex:none;font-size:19px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);box-shadow:none}
#attach{display:none;align-items:center;gap:10px;padding:6px 12px;background:var(--bg);border-top:1px solid var(--line)}
#attach.on{display:flex}
#attach img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}
#attach span{flex:1;font-size:13px;color:var(--sub)}
#attach button{width:30px;height:30px;padding:0;border-radius:50%;flex:none}
.mic.on{animation:micwave 1.6s ease-out infinite}
@keyframes micwave{0%{box-shadow:0 0 0 0 rgba(76,201,240,.7),0 0 0 0 rgba(76,201,240,.45)}70%{box-shadow:0 0 0 22px rgba(76,201,240,0),0 0 0 40px rgba(76,201,240,0)}100%{box-shadow:0 0 0 0 rgba(76,201,240,0),0 0 0 0 rgba(76,201,240,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;box-shadow:0 0 0 6px rgba(76,201,240,.5)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,93,.55)}70%{box-shadow:0 0 0 16px rgba(255,93,93,0)}100%{box-shadow:0 0 0 0 rgba(255,93,93,0)}}
.listen{display:none;text-align:center;font-size:13px;color:var(--accent);padding:4px 12px 0}
.listen.on{display:block}
.listen em{color:var(--text);font-style:normal}
.note{font-size:12.5px;color:var(--sub);line-height:1.6}
.banner{background:#0f2a3f;border:1px solid #1d5a85;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.card .tx{flex:1;min-width:0}
.card .tx b{display:block;font-size:15px;word-break:break-word}
.card .tx small{display:block;color:var(--sub);font-size:12.5px;margin-top:3px;line-height:1.5}
.card .x{flex:none;padding:4px 9px;border-radius:8px;color:var(--sub)}
.card.off{opacity:.55}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--sub);margin-left:6px;vertical-align:1px}
.pill.on{background:#10304a;color:var(--accent)}
.empty{padding:50px 10px;text-align:center;color:var(--sub);line-height:1.7;font-size:14px}
.sw{position:relative;width:46px;height:26px;flex:none;margin-top:2px}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:99px;transition:.15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--sub);transition:.15s}
.sw input:checked+i{background:var(--accent2);border-color:var(--accent2)}
.sw input:checked+i::after{left:23px;background:#fff}
.row{display:flex;gap:8px;margin-bottom:12px}.row>*{flex:1}
#ring{position:fixed;inset:0;z-index:100;background:rgba(7,10,16,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#ring.on{display:flex}
#ring .big{font-size:64px;animation:shake .6s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#ring h2{font-size:26px}#ring p{color:var(--sub);font-size:15px;line-height:1.6}
#ring .btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
#ring .btns button{padding:14px 22px;font-size:16px;border-radius:14px}
#live{position:fixed;inset:0;z-index:95;background:#070a10;display:none;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));text-align:center}
#live.on{display:flex}
#liveTop:focus{outline:none}
#liveTop{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px}
#live h2{border:0;background:none;padding:2px 6px;margin:0;font-size:14px;font-weight:600;color:var(--sub);letter-spacing:.02em}
#liveMic{font-size:13px;color:#ffb36b;max-width:92%}#liveMic:not([data-warn="1"]){display:none}
#liveDev{max-width:92%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px;font:inherit;font-size:13px}
#liveMid{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-y:auto}
#liveWave{width:min(220px,60vw);height:auto;aspect-ratio:640/300;flex:none}
#liveConn{display:none;flex-direction:column;align-items:center;gap:18px;color:#9fd8ff;font-size:20px;font-weight:600}
#live.conn #liveConn{display:flex}#live.conn #liveWave{display:none}#live.conn #liveState{visibility:hidden}#live.conn #liveBar .ib:not(.end){opacity:.35;pointer-events:none}
#liveConn .sp{position:relative;width:110px;height:110px}
#liveConn .sp i{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(76,201,240,.65);animation:cnRing 1.8s ease-out infinite}
#liveConn .sp i:nth-child(2){animation-delay:.6s}#liveConn .sp i:nth-child(3){animation-delay:1.2s}
#liveConn .sp b{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#4cc9f0;box-shadow:0 0 22px #4cc9f0aa;animation:cnCore 1.2s ease-in-out infinite}
@keyframes cnRing{0%{transform:scale(.25);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes cnCore{0%,100%{transform:scale(.8)}50%{transform:scale(1.25)}}
#live.on:not(.conn) #liveWave{animation:cnPop .45s ease-out}
@keyframes cnPop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
#live .big{font-size:56px}#live.talk .big{animation:pulse2 1s infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#live p{font-size:26px;font-weight:600;line-height:1.5;max-width:94%;min-height:0;word-break:keep-all;overflow-wrap:anywhere}
#live p:empty{display:none}
#liveMe{color:var(--text)}#liveBot{color:var(--accent)}
#live p#liveMe,#live p#liveBot{display:none}
#liveChat{width:100%;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 4px;text-align:left;scroll-behavior:smooth}#liveChat:empty{display:none}
#live.on:not(.conn) #liveMid{justify-content:flex-start;align-items:stretch}
#live #liveWave,#live #liveActs,#live #liveIco{align-self:center}
#live #liveWave{width:min(120px,34vw)}
.kb{max-width:82%;padding:9px 12px;font-size:15.5px;line-height:1.5;font-weight:500;word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;border-radius:16px}
.kb.me{align-self:flex-end;background:#fee500;color:#191919;border-top-right-radius:4px}
.kb.bot{align-self:flex-start;background:#2a3145;color:#f1f4fa;border-top-left-radius:4px}
.kb small{display:block;font-size:10.5px;opacity:.55;margin-top:3px;font-weight:400}
.kb.me small{text-align:right}
#liveNum{width:100%;flex:none;box-sizing:border-box;max-height:38vh;overflow-y:auto;text-align:left;font-size:17px;line-height:1.55;background:#101626;border:1px solid #2a3145;border-radius:14px;padding:12px 14px}#liveNum:empty{display:none}#liveNum b{display:block;font-size:17px;margin-bottom:4px}#liveNum .sub{color:var(--sub);font-size:14px}
#btnDrw{background:none;border:0;color:var(--text);font-size:22px;line-height:1;padding:4px 8px;margin-left:2px}
#drwBk{position:fixed;inset:0;z-index:97;background:rgba(0,0,0,.55);display:none}#drwBk.on{display:block}
#drw{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);z-index:98;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column}#drw.on{transform:none}
#drw .dh{display:flex;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}#drw .dh b{flex:1;font-size:16px}#drw .dh button{background:none;border:0;color:var(--sub);font-size:18px}
#drwBody{flex:1;overflow-y:auto;padding:8px}
#drwBody .it{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;line-height:1.4}#drwBody .it:active{background:rgba(127,127,127,.2)}#drwBody .it small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}#drwBody .em{color:var(--sub);font-size:13px;padding:18px 12px}
#liveHistBtn{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));background:#161b28;border:1px solid #2a3145;color:var(--text);border-radius:99px;padding:6px 12px;font-size:13px}
#hist{position:fixed;inset:0;z-index:99;background:#070a10;display:none;flex-direction:column}#hist.on{display:flex}
#hist .hb{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #2a3145}#hist .hb b{flex:1;font-size:16px}#hist .hb button{background:#161b28;border:1px solid #2a3145;color:var(--text);border-radius:10px;padding:7px 12px;font-size:13px}
#histAct{display:none;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #2a3145}#hist.det #histAct{display:flex}#histAct button{flex:1;padding:12px;border-radius:12px;background:#161b28;border:1px solid #2a3145;color:var(--text);font-size:14px;font-weight:600}#histAct button.pr{background:var(--accent);border-color:var(--accent);color:#031a2b}
#histBody{flex:1;overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#histBody .ses{align-self:stretch;text-align:center;color:var(--sub);font-size:12px;margin:14px 0 4px}
#histBody .row{display:flex;flex-direction:column;gap:8px}
#histBody .lst{background:#101626;border:1px solid #2a3145;border-radius:12px;padding:12px;text-align:left;color:var(--text);font-size:14px;line-height:1.45}#histBody .lst small{display:block;color:var(--sub);font-size:12px;margin-top:3px}
#liveActs{display:flex;flex-direction:column;gap:8px;align-items:center}
#liveBar{display:flex;gap:14px;justify-content:center;align-items:center;flex:none;padding-top:8px}
#live .ib{width:54px;height:54px;border-radius:50%;padding:0;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;background:#161b28;border:1px solid #2a3145;color:var(--text)}
#live .ib.off{background:#3a1f26;border-color:#7a3340}
#live .ib.end{background:#c0392b;border-color:#c0392b;color:#fff;font-size:20px}
@media (max-height:560px){#liveWave{max-height:60px}#live p{font-size:20px}#live .ib{width:46px;height:46px}}
#aiBusy{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-14px);z-index:120;display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:99px;background:rgba(18,24,38,.96);border:1px solid #2b6cff66;color:#e8f0ff;font-size:15px;font-weight:600;box-shadow:0 8px 28px rgba(43,108,255,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#aiBusy.on{opacity:1;transform:translate(-50%,0)}
#aiBusy .ico{font-size:18px;display:inline-block;animation:abSpin 1.6s ease-in-out infinite}
#aiBusy .dots{display:inline-flex;gap:4px;margin-left:2px}

<script>
/* ───────── 한국어 음성 명령 해석(NLU) — 서버 없이 브라우저에서 동작 ───────── */
const NLU = (() => {
  const DW = { '공': 0, '영': 0, '일': 1, '이': 2, '삼': 3, '사': 4, '오': 5, '육': 6, '륙': 6, '칠': 7, '팔': 8, '구': 9 };
  const KNUM = { '한': 1, '하나': 1, '두': 2, '둘': 2, '세': 3, '셋': 3, '네': 4, '넷': 4, '다섯': 5, '여섯': 6, '일곱': 7, '여덟': 8, '아홉': 9, '열': 10, '열한': 11, '열두': 12 };
  const WD = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };
  const TITLES = '대표이사|대표|부사장|사장|전무|상무|이사|본부장|실장|부장|차장|과장|팀장|대리|주임|사원|소장|센터장|지점장|원장|교수|박사|변호사|선생';
  const STOP = new Set(['연락처', '저장', '추가', '등록', '전화번호', '전화', '번호', '회사', '에', '는', '은', '이', '가', '좀', '그리고', '새로운', '새', '신규', '사람', '분', '이름', '이름은', '핸드폰', '휴대폰', '휴대전화', '핸드폰번호', '직급', '직책', '이메일', '메일', '주소', '찾아', '찾아줘', '알려', '알려줘', '해줘', '해', '해주세요', '걸어', '걸어줘', '연결', '연결해줘', '검색', '보여', '보여줘', '불러', '불러줘', '뭐야', '뭐지', '뭐', '어떻게', '되지', '되나요', '이야', '입니다', '에요', '이에요', '번', '해줄래', '할래', '주세요', '줘', '를', '을', '의', '도', '로', '으로', '한테', '에게', '께', '랑', '와', '과', '그', '저', '내', '제', '우리', '있는', '있어', '있으면', '다시', '한번', '혹시', '하고', '고', '라고', '이라고', '라는', '이라는', '어디', '몇', '번이야']);

  /* 음성 → 텍스트 보정: "공일공 일이삼사" → 숫자, "골뱅이" → @ */
  function normalize(t) {
    let s = String(t || '').replace(/\s+/g, ' ').trim();
    s = s.replace(/공\s*일\s*공/g, '010');
    s = s.replace(/(?:공|영)[\s-]*[일이삼사오육륙칠팔구공영](?:[\s-]*[일이삼사오육륙칠팔구공영]){6,}/g, m => m.replace(/[\s-]/g, '').split('').map(c => DW[c]).join(''));
    s = s.replace(/(\d)[\s-]*[일이삼사오육륙칠팔구공영](?:[\s-]*[일이삼사오육륙칠팔구공영]){3,}/g, m => m.replace(/[\s-]/g, '').replace(/[일이삼사오육륙칠팔구공영]/g, c => DW[c]));
    s = s.replace(/\s*골뱅이\s*/g, '@').replace(/\s*닷\s*(컴|넷|케이알|코\s*케이알)/g, (m, x) => ({ '컴': '.com', '넷': '.net', '케이알': '.kr' })[x.replace(/\s/g, '')] || '.co.kr');
    return s;
  }

  const PH_RE = /(?:\+?82[\s-]?)?0\d{1,2}[\s-]?\d{3,4}[\s-]?\d{4}|1[568]\d{2}[\s-]?\d{4}/g;
  const EM_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
  const digits = s => String(s || '').replace(/\D/g, '');
  function fmtPhone(raw) {
    let d = digits(raw); if (d.startsWith('82') && d.length >= 11) d = '0' + d.slice(2);
    if (/^1[568]\d{6}$/.test(d)) return d.slice(0, 4) + '-' + d.slice(4);
    if (d.startsWith('02')) return d.length === 9 ? `02-${d.slice(2, 5)}-${d.slice(5)}` : `02-${d.slice(2, 6)}-${d.slice(6)}`;
    if (d.length === 11) return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
    if (d.length === 10) return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
    return d;
  }

  /* ───────── 날짜·시간 해석 ───────── */
  function kn(s) { s = String(s).trim(); return /^\d+$/.test(s) ? +s : (KNUM[s] != null ? KNUM[s] : null); }
  function parseWhen(text, now) {
    now = now || new Date();
    let s = String(text), out = { hasDate: false, hasTime: false, ambiguous: false, dur: null, y: null, mo: null, d: null, h: null, mi: 0, allDay: false, repeat: null, rest: '' };
    const cut = re => { const m = s.match(re); if (m) s = s.replace(m[0], ' '); return m; };
    let m;
    // 반복
    if (cut(/매일|every\s*day/i)) out.repeat = 'daily';
    else if (cut(/평일마다|평일에?|주중/)) out.repeat = 'weekdays';
    else if (cut(/주말마다|주말에?/)) out.repeat = 'weekend';
    else if ((m = cut(/매주\s*([일월화수목금토])요일?/))) out.repeat = 'weekly' + WD[m[1]];
    // N시간 N분 뒤 / 후
    if ((m = cut(/(\d+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|열한|열두)\s*시간\s*(반)?\s*(?:(\d+)\s*분)?\s*(?:뒤|후)에?/))) {
      const h = kn(m[1]); out.dur = (h * 60 + (m[2] ? 30 : 0) + (m[3] ? +m[3] : 0)) * 60000;
    } else if ((m = cut(/(\d+)\s*분\s*(?:뒤|후)에?/))) out.dur = +m[1] * 60000;
    else if ((m = cut(/(\d+)\s*초\s*(?:뒤|후)에?/))) out.dur = +m[1] * 1000;
    else if (cut(/삼십\s*분\s*(?:뒤|후)에?/)) out.dur = 30 * 60000;
    else if (cut(/십\s*분\s*(?:뒤|후)에?/)) out.dur = 10 * 60000;
    if (out.dur != null) { out.hasDate = out.hasTime = true; out.rest = s.replace(/\s+/g, ' ').trim(); return out; }

    // 날짜
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const setD = (dt) => { out.y = dt.getFullYear(); out.mo = dt.getMonth() + 1; out.d = dt.getDate(); out.hasDate = true; };
    if (cut(/글피/)) setD(new Date(base.getTime() + 3 * 864e5));
    else if (cut(/모레/)) setD(new Date(base.getTime() + 2 * 864e5));
    else if (cut(/내일모레/)) setD(new Date(base.getTime() + 2 * 864e5));
    else if (cut(/내일/)) setD(new Date(base.getTime() + 864e5));
    else if (cut(/오늘|금일/)) setD(base);
    else if ((m = cut(/(다음\s*주|담\s*주|이번\s*주|이\s*번\s*주|다다음\s*주)?\s*([일월화수목금토])요일/))) {
      const w = WD[m[2]], cur = base.getDay(); let diff = (w - cur + 7) % 7;
      const k = (m[1] || '').replace(/\s/g, '');
      if (k === '다음주' || k === '담주') diff = ((w - cur + 7) % 7) + (((w - cur + 7) % 7) === 0 || w <= cur ? 0 : 0); // 아래에서 재계산
      if (k === '다음주' || k === '담주') { const mon = new Date(base.getTime() - ((cur + 6) % 7) * 864e5 + 7 * 864e5); setD(new Date(mon.getTime() + ((w + 6) % 7) * 864e5)); }
      else if (k === '다다음주') { const mon = new Date(base.getTime() - ((cur + 6) % 7) * 864e5 + 14 * 864e5); setD(new Date(mon.getTime() + ((w + 6) % 7) * 864e5)); }
      else if (k === '이번주') { const mon = new Date(base.getTime() - ((cur + 6) % 7) * 864e5); setD(new Date(mon.getTime() + ((w + 6) % 7) * 864e5)); }
      else setD(new Date(base.getTime() + diff * 864e5));
    } else if ((m = cut(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) { out.y = +m[1]; out.mo = +m[2]; out.d = +m[3]; out.hasDate = true; }
    else if ((m = cut(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) {
      out.mo = +m[1]; out.d = +m[2]; out.y = now.getFullYear(); out.hasDate = true;
      if (new Date(out.y, out.mo - 1, out.d) < base) out.y++;
    } else if ((m = cut(/(\d{1,2})\s*일\s*(?:뒤|후)/))) setD(new Date(base.getTime() + +m[1] * 864e5));
    else if ((m = cut(/(\d{1,2})\s*일(?![가-힣])/))) {
      out.d = +m[1]; out.mo = now.getMonth() + 1; out.y = now.getFullYear(); out.hasDate = true;
      if (new Date(out.y, out.mo - 1, out.d) < base) { out.mo++; if (out.mo > 12) { out.mo = 1; out.y++; } }
    }
    // 시간
    let ap = null;
    if (cut(/종일|하루\s*종일/)) { out.allDay = true; out.hasTime = true; }
    else if (cut(/정오/)) { out.h = 12; out.mi = 0; out.hasTime = true; }
    else if (cut(/자정/)) { out.h = 0; out.mi = 0; out.hasTime = true; }
    else if ((m = cut(/(오전|오후|아침|새벽|낮|저녁|밤)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|(반))?/)) || (m = cut(/(오전|오후|아침|새벽|낮|저녁|밤)?\s*(\d{1,2}):(\d{2})/))) {
      let h = +m[2]; ap = m[1] || null; const mi = m[4] ? 30 : (m[3] ? +m[3] : 0);
      if (ap === '오후' || ap === '저녁') { if (h < 12) h += 12; }
      else if (ap === '밤') { if (h >= 6 && h < 12) h += 12; else if (h === 12) h = 0; }
      else if (ap === '낮') { if (h >= 1 && h <= 6) h += 12; }
      else if (ap === '오전' || ap === '아침' || ap === '새벽') { if (h === 12) h = 0; }
      else if (h >= 1 && h <= 12) out.ambiguous = true;   // 오전/오후 말이 없음 → 되물어야 함
      out.h = h; out.mi = mi; out.hasTime = true;
    } else if ((m = cut(/(오전|오후|아침|저녁|밤|새벽)\s*(?=$|[^가-힣\d])/)) && false) { /* 사용 안 함 */ }
    out.rest = s.replace(/\s+/g, ' ').trim();
    return out;
  }
  /* 오전/오후 답변("오후", "저녁에요") → 'am' | 'pm' | null */
  function parseAmPm(t) { t = String(t); if (/오후|저녁|밤|낮|pm/i.test(t)) return 'pm'; if (/오전|아침|새벽|am/i.test(t)) return 'am'; return null; }

  /* 해석 결과 → Date (없으면 null) */
  function whenToDate(w, now) {
    now = now || new Date();
    if (w.dur != null) return new Date(now.getTime() + w.dur);
    if (!w.hasTime && !w.hasDate) return null;
    let y = w.y, mo = w.mo, d = w.d, h = w.allDay ? 0 : (w.h == null ? 9 : w.h), mi = w.mi || 0;
    if (!w.hasDate) {  // 시각만 말함 → 가장 가까운 미래
      let dt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, mi);
      if (dt.getTime() <= now.getTime()) dt = new Date(dt.getTime() + 864e5);
      return dt;
    }
    return new Date(y, mo - 1, d, h, mi);
  }

  /* ───────── 의도 분류 ───────── */
  function detect(raw) {
    const t = normalize(raw);
    if (/알람|깨워|기상\s*시간|모닝콜/.test(t)) {
      if (/(보여|알려|뭐|확인|목록|몇\s*시|있어|리스트)/.test(t) && !/(맞춰|설정|등록|추가|해줘\s*$)/.test(t)) return 'list_alarm';
      if (/(꺼|삭제|지워|취소|해제)/.test(t)) return 'del_alarm';
      return 'alarm_add';
    }
    if (/(가자|가줘|가주세요|갈래|가고\s*싶|가볼래|가보자|길\s*안내|길안내|길\s*찾아|길\s*알려|내비게이션|네비게이션|내비|네비|데려다|안내\s*(해|시작)|네이버\s*(지도|맵))/.test(t) && !/(일정|스케줄|약속|캘린더|알람|전화|메모|저장|추가|등록|번호)/.test(t)) return 'navigate';
    const hasMemoWord = /메모|노트에|적어\s*(줘|둬|놔)|기록해/.test(t);

  const src = web && (j.sources || []).length ? '<div class="sub" style="margin-top:8px">출처: ' + j.sources.slice(0, 5).map(s => '<a href="' + esc(s.uri) + '" target="_blank" rel="noopener" style="color:var(--sub)">' + esc(s.title || '링크') + '</a>').join(' · ') + '</div>' : '';
  const warn = web ? '<span class="sub">웹 검색으로 찾은 값이라 <b>검색 시점 가격</b>이에요. 실제 가격은 쇼핑몰에서 확인하세요.' + (j.note ? ' ' + esc(j.note) : '') + '</span>' : '<span class="sub">검색 결과의 가격은 조회 시점 기준이에요.</span>';
  return '<b>🛒 "' + esc(q) + '" 검색 (' + (web ? '웹 검색' : j.site === 'danawa' ? '다나와' : '쿠팡') + ')</b>' + rows + src + warn;
}
async function shopShow(m) {
  sys('상품을 검색하는 중…'); Busy.start(); let r; try { r = await shopCall({ q: m.q, site: m.site }); } finally { Busy.stop(); }
  if (r.err) return bot(r.err);
  const j = r.j; if (!j.ok) return bot(j.text || '검색하지 못했어요.', { html: '<b>🛒 검색하지 못했어요</b><span class="sub">' + esc(j.text || '') + ' (' + esc(Object.entries(j.blocked || {}).map(([k, v]) => k + ': ' + v).join(', ')) + ')</span>' });
  return bot(j.text, { html: shopHtml(j, m.q), say: j.text });
}

/* ───────── 사진으로 질문(카메라·앨범) — 상품을 찍어 "최저가 알려줘" ───────── */
const ATT = { img: null };
function camShrink(file, max, q) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { try { const k = Math.min(1, max / Math.max(im.width, im.height)), w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k)), c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h); const url = c.toDataURL('image/jpeg', q); URL.revokeObjectURL(u); res({ mime: 'image/jpeg', data: url.split(',')[1], url }); } catch (e) { rej(e); } };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u;
  });
}
function attClear() { ATT.img = null; $('attach').classList.remove('on'); $('txt').placeholder = '메시지 입력'; }
function liveImage(img) {
  if (!LIVE.on || !LIVE.ready) return toast('음성 연결이 준비되면 다시 보내 주세요');
  liveSend({ realtimeInput: { video: { data: img.data, mimeType: img.mime } } });
  liveBubble('me', '📷 사진을 보냈어요. 이어서 말로 질문하세요'); LIVE.bub.me = null; toast('사진을 보냈어요. 말로 질문하세요');
}
const CAM = { st: null, facing: 'environment', t: 0, live: false };
function camStop() { clearInterval(CAM.t); CAM.t = 0; try { CAM.st && CAM.st.getTracks().forEach(t => t.stop()); } catch (e) {} CAM.st = null; CAM.live = false; try { $('camVid').srcObject = null; } catch (e) {} $('camOv').classList.remove('on', 'live', 'load'); }
async function camStart() {
  $('camOv').classList.add('load');
  try { if (CAM.st) CAM.st.getTracks().forEach(t => t.stop()); CAM.st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: CAM.facing }, width: { ideal: 1280 } }, audio: false }); $('camVid').srcObject = CAM.st; await $('camVid').play().catch(() => {}); $('camOv').classList.remove('load'); return true; } catch (e) { return false; }
}
function camFrame(max, q) { const v = $('camVid'); if (!v.videoWidth) return null; const k = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(v.videoWidth * k)); c.height = Math.max(1, Math.round(v.videoHeight * k)); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); const url = c.toDataURL('image/jpeg', q); return { mime: 'image/jpeg', data: url.split(',')[1], url }; }
function camPick() { $('camIn').value = ''; $('camIn').click(); }
async function camOpen(live) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('카메라 화면을 열 수 없어 사진 선택으로 열어요'); return camPick(); }
  CAM.live = !!live; $('camOv').classList.add('on', 'load'); $('camOv').classList.toggle('live', !!live);
  $('camNote').textContent = live ? '카메라를 비추고 말로 질문하세요 (예: 이거 최저가 알려줘)' : '상품이 화면에 가득 보이게 맞추고 촬영하세요. 상표·모델명 글자가 보이면 정확해요';
  if (!(await camStart())) { camStop(); toast('카메라를 열지 못해 사진 선택으로 열어요'); return camPick(); }
  if (live) { clearInterval(CAM.t); CAM.t = setInterval(() => { if (!LIVE.on || !LIVE.ready) return; const f = camFrame(640, 0.6); if (f) liveSend({ realtimeInput: { video: { data: f.data, mimeType: f.mime } } }); }, 1000); }
}
$('btnCam').onclick = () => { unlockAudio(); camOpen(false); };
$('liveCam').onclick = () => camOpen(true);
$('camClose').onclick = camStop;
$('camFlip').onclick = async () => { CAM.facing = CAM.facing === 'environment' ? 'user' : 'environment'; if (!(await camStart())) toast('카메라를 전환하지 못했어요'); };
$('camAlbum').onclick = camPick;
$('camShot').onclick = () => { const f = camFrame(1280, 0.85); if (!f) return toast('카메라가 아직 준비되지 않았어요'); camStop(); ATT.img = f; $('attImg').src = f.url; $('attach').classList.add('on'); $('txt').placeholder = '예: 이거 최저가 알려줘'; $('txt').focus(); };
window.addEventListener('pagehide', camStop);
$('attX').onclick = attClear;
$('camIn').onchange = async () => {
  const f = $('camIn').files && $('camIn').files[0]; if (!f) return;
  let img; try { img = await camShrink(f, 1280, 0.82); if (img.data.length > 2400000) img = await camShrink(f, 900, 0.7); } catch (e) { return toast('사진을 읽지 못했어요'); }
  if (LIVE.on) return liveImage(img);
  camStop(); ATT.img = img; $('attImg').src = img.url; $('attach').classList.add('on'); $('txt').placeholder = '예: 이거 최저가 알려줘'; $('txt').focus();
};
const CONF_KO = { high: '높음', mid: '보통', low: '낮음' };
async function imgHandle(raw, img) {
  const text = String(raw || '').trim() || '이거 최저가 알려줘';
  addMsg('me', '<img src="' + img.url + '" alt="" style="display:block;max-width:180px;max-height:180px;border-radius:10px;margin-bottom:6px">' + esc(text));
  hEnsure(); hLog('me', '[사진] ' + text); if (RES) RES.turns.push({ r: 'me', t: '[사진] ' + text, at: Date.now() }); pmNote('me', '[사진] ' + text);
  sys('사진을 분석하는 중…'); Busy.start(); let r; try { r = await shopCall({ q: text, image: { mime: img.mime, data: img.data } }, 60000); } finally { Busy.stop(); }
  if (r.err) return bot(r.err);
  const j = r.j || {}, id = j.identified;
  if (j.error) return bot('사진을 처리하지 못했어요. 잠시 뒤 다시 보내 주세요.');
  if (j.mode === 'ask') return bot(j.text, { html: '<b>🖼 사진 답변</b>' + esc(j.text).replace(/\n/g, '<br>'), say: j.text });
  const idHtml = id && id.name ? '<b>🔎 사진 속 상품</b> ' + esc(id.name) + '<span class="sub">알아본 확실도: ' + (CONF_KO[id.confidence] || '낮음') + (id.text_seen ? ' · 보인 글자: ' + esc(id.text_seen) : '') + (id.confidence === 'low' ? ' — 이름이 맞는지 확인해 주세요' : '') + '</span>' : '';
  if (j.ok && (j.items || []).length) return bot(j.text, { html: idHtml + shopHtml(j, id && id.name || '사진 속 상품'), say: j.text });
  return bot(j.text || '사진으로 가격을 찾지 못했어요.', { html: (idHtml || '<b>🖼 사진 분석</b>') + '<span class="sub">' + esc(j.text || '') + '</span>', say: j.text });
}

/* ───────── 입력창·시작 ───────── */
function sendTyped() { const v = $('txt').value.trim(); if (!v && !ATT.img) return; $('txt').value = ''; lastVoice = false; unlockAudio(); if (ATT.img) { const im = ATT.img; attClear(); return void imgHandle(v, im); } handleText(v); }
$('btnSend').onclick = sendTyped;
$('txt').addEventListener('paste', () => setTimeout(() => { if (looksLikeMessage($('txt').value)) sendTyped(); }, 30));
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendTyped(); } });
let autoSend = ls.get('SIMAS_AUTOSEND', '0') === '1', autoT = 0;
$('txt').addEventListener('input', () => { clearTimeout(autoT); if (autoSend && $('txt').value.trim()) autoT = setTimeout(sendTyped, 1600); });

  try { adb = await idbOpen('simassistant', ['memos', 'events', 'alarms']); for (const k of ['memos', 'events', 'alarms']) MEM[k] = await idbAll(adb, k); }

  if (!SR) sys('이 브라우저는 음성 인식을 지원하지 않아요. 키보드의 🎤(받아쓰기)를 쓰거나 Chrome·Safari에서 열어 주세요.');
  else if (ios && standalone) sys('iPhone 홈 화면 앱에서는 음성 인식이 막힐 수 있어요. 안 되면 키보드의 🎤(받아쓰기)를 쓰거나 Safari에서 열어 주세요.');
  if (memOnly) sys('이 브라우저는 저장소를 쓸 수 없어 임시로만 동작해요. 닫으면 사라져요.');
  try { pmWelcome(); } catch (e) {} setTimeout(() => { try { onbStart(); } catch (e) {} }, 2000);
  contacts.length || sys('연락처가 아직 없어요. "홍길동 저장해줘"라고 말씀하시면 SIM Phone과 같은 연락처에 저장돼요.');
})();
