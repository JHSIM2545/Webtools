<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#4f8cff; --accent2:#2f6fe8; --danger:#ff5d5d; --ok:#3ecf8e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.appicon{width:30px;height:30px;border-radius:8px;display:block}
header h1 span{color:var(--accent)}
.spacer{flex:1}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.danger{color:var(--danger)}
button.icon{padding:7px 10px}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#000}
.video-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
video{width:100%;height:100%;background:#000;object-fit:contain}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;pointer-events:none}
.overlay.hidden{display:none}
.overlay .big{font-size:40px}
.overlay .msg{color:var(--sub);font-size:14px;line-height:1.5;max-width:420px}
.overlay.error .msg{color:#ffb4b4}
.nowbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}
.nowbar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .grp{color:var(--sub);font-size:12px}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--sub)}
.badge.live{color:var(--ok);border-color:#1f5c44}
aside{width:340px;max-width:42vw;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line)}
.search{padding:10px}
.search input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 11px;border-radius:99px;font-size:13px;white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--sub);cursor:pointer}
.tab.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.list{flex:1;overflow-y:auto;padding:0 6px 12px}
.ch{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
.ch:hover{background:var(--panel2)}
.ch.active{background:#1b2a4a;outline:1px solid var(--accent)}
.logo{width:38px;height:38px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex:none;overflow:hidden;font-size:14px}
.logo img{width:100%;height:100%;object-fit:contain}
.ch .info{flex:1;min-width:0}
.ch .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{background:none;border:none;padding:4px 6px;font-size:18px;color:var(--sub);line-height:1}
.star.on{color:#ffc83d}
.empty{padding:30px 14px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.card{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:16px;margin-bottom:12px}
.card label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.card input,.card textarea,.card select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.card textarea{min-height:120px;resize:vertical;font-size:13px}
.card input:focus,.card textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222a3d;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1}
@media (max-width:760px){
  header{gap:6px;padding-left:10px;padding-right:10px}
  header button{padding:6px 9px;font-size:13px}
  main{flex-direction:column}
  .stage{flex:none;height:auto}
  .video-wrap{flex:none;aspect-ratio:16/9;width:100%}
  aside{width:100%;max-width:none;flex:1;border-left:none;border-top:1px solid var(--line)}
  header h1{font-size:16px}
}
</style>
</head>

<main>
  <section class="stage">
    <div class="video-wrap">
      <video id="video" controls playsinline autoplay></video>
      <div class="overlay" id="overlay">
        <div class="big">📡</div>
        <div class="msg" id="overlayMsg">오른쪽 목록에서 채널을 선택하세요.</div>
      </div>
    </div>
    <div class="nowbar">
      <div style="min-width:0;flex:1">
        <div class="title" id="nowTitle">선택된 채널 없음</div>
        <div class="grp" id="nowGrp"></div>
      </div>
      <span class="badge" id="badge">대기</span>
      <button class="icon" id="btnPrev" title="이전 채널 (↑)">◀</button>
      <button class="icon" id="btnNext" title="다음 채널 (↓)">▶</button>
    </div>
  </section>

  <aside>
    <div class="search"><input id="q" type="search" placeholder="채널 검색"></div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </aside>
</main>

<!-- 채널 추가/수정 -->
<div class="modal" id="mEdit">
  <div class="card">
    <h2 id="mEditTitle">채널 추가</h2>
    <label>채널명 *</label><input id="fName" placeholder="예: 샘플 채널">
    <label>스트림 URL (.m3u8 등) *</label><input id="fUrl" placeholder="https://.../playlist.m3u8" inputmode="url">
    <label>그룹</label><input id="fGroup" placeholder="예: 뉴스" list="groupList"><datalist id="groupList"></datalist>
    <label>로고 URL (선택)</label><input id="fLogo" placeholder="https://.../logo.png" inputmode="url">
    <div class="hint">직접 재생 가능한 HLS(.m3u8) 또는 mp4 주소만 지원합니다. 해당 서버가 브라우저 접근(CORS)을 허용하지 않으면 재생되지 않을 수 있습니다.</div>
    <div class="row">
      <button class="danger" id="fDelete" style="margin-right:auto;display:none">삭제</button>
      <button id="fCancel">취소</button>
      <button class="primary" id="fSave">저장</button>
    </div>
  </div>
</div>

<!-- 가져오기/내보내기 -->
<div class="modal" id="mImport">
  <div class="card">
    <h2>M3U 플레이리스트 가져오기</h2>
    <label>플레이리스트 URL</label>
    <input id="iUrl" placeholder="https://.../playlist.m3u" inputmode="url">
    <label>또는 M3U 내용 붙여넣기</label>
    <textarea id="iText" placeholder="#EXTM3U&#10;#EXTINF:-1 group-title=&quot;뉴스&quot;,채널명&#10;https://.../stream.m3u8"></textarea>
    <label>또는 파일 선택</label>
    <input type="file" id="iFile" accept=".m3u,.m3u8,.txt">
    <div class="hint">같은 URL의 채널은 중복 추가되지 않습니다. 플레이리스트는 본인이 사용 권한을 가진 것만 가져오세요.</div>
    <div class="row">
      <button id="iExport" style="margin-right:auto">내 목록 내보내기</button>
      <button id="iCancel">닫기</button>
      <button class="primary" id="iRun">가져오기</button>
    </div>
  </div>
</div>

<!-- 앱 설치 안내 -->
<div class="modal" id="mInstall">
  <div class="card">
    <h2>SIM TV 앱으로 설치</h2>
    <div class="hint" id="installBody" style="font-size:14px;color:var(--text);line-height:1.7"></div>
    <div class="hint" id="installWarn" style="color:#ffb86b"></div>
    <div class="row"><button class="primary" id="installClose">확인</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const LS = 'onlineTv.v1';
  const $ = id => document.getElementById(id);
  const video = $('video');

  // 기본 채널: 재생 테스트용 공개 스트림 1개만 포함 (실제 방송 채널은 직접 추가)
  const DEFAULTS = [
    { id: 'demo1', name: '테스트 스트림 (Mux)', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', group: '테스트', logo: '' }
  ];

  let state = load();
  let currentId = state.last || null;
  let filterGroup = '전체';
  let query = '';
  let hls = null;
  let editingId = null;

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(LS));
      if (s && Array.isArray(s.channels)) return s;
    } catch (e) {}
    return { channels: DEFAULTS.slice(), favs: [], last: null };
  }
  function save() {
    state.last = currentId;
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  }
  const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function groups() {
    const set = new Set(state.channels.map(c => c.group).filter(Boolean));
    return ['전체', '즐겨찾기', ...set];
  }

  function visible() {
    const q = query.trim().toLowerCase();
    return state.channels.filter(c => {
      if (filterGroup === '즐겨찾기' && !state.favs.includes(c.id)) return false;
      if (filterGroup !== '전체' && filterGroup !== '즐겨찾기' && c.group !== filterGroup) return false;
      if (q && !(c.name.toLowerCase().includes(q) || (c.group || '').toLowerCase().includes(q))) return false;
      return true;
    });
  }

  function renderTabs() {
    const gs = groups();
    if (!gs.includes(filterGroup)) filterGroup = '전체';
    $('tabs').innerHTML = gs.map(g => `<div class="tab ${g === filterGroup ? 'active' : ''}" data-g="${esc(g)}">${esc(g)}</div>`).join('');
    $('groupList').innerHTML = gs.filter(g => g !== '전체' && g !== '즐겨찾기').map(g => `<option value="${esc(g)}">`).join('');
  }

  function renderList() {
    const items = visible();
    if (!items.length) {
      $('list').innerHTML = `<div class="empty">${state.channels.length ? '조건에 맞는 채널이 없습니다.' : '등록된 채널이 없습니다.<br>우측 상단 <b>+ 채널</b> 또는 <b>가져오기</b>로 추가하세요.'}</div>`;
      return;
    }
    $('list').innerHTML = items.map(c => {
      const fav = state.favs.includes(c.id);
      const logo = c.logo ? `<img src="${esc(c.logo)}" alt="" onerror="this.remove()">` : '';
      return `<div class="ch ${c.id === currentId ? 'active' : ''}" data-id="${c.id}">
        <div class="logo">${logo}${esc(c.name.slice(0, 2))}</div>
        <div class="info"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.group || '미분류')}</div></div>
        <button class="star ${fav ? 'on' : ''}" data-star="${c.id}" title="즐겨찾기">${fav ? '★' : '☆'}</button>
        <button class="star" data-edit="${c.id}" title="편집">⋯</button>
      </div>`;
    }).join('');
  }

  function setOverlay(kind, msg) {
    const o = $('overlay');
    if (!kind) { o.classList.add('hidden'); return; }
    o.classList.remove('hidden');
    o.classList.toggle('error', kind === 'error');
    o.querySelector('.big').textContent = kind === 'error' ? '⚠️' : kind === 'loading' ? '⏳' : '📡';
    $('overlayMsg').textContent = msg;
  }
  function setBadge(text, live) {
    const b = $('badge'); b.textContent = text; b.classList.toggle('live', !!live);
  }

  function destroyHls() {
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src'); video.load();
  }

  function play(id) {
    const ch = state.channels.find(c => c.id === id);
    if (!ch) return;
    currentId = id; save();
    $('nowTitle').textContent = ch.name;
    $('nowGrp').textContent = ch.group || '';
    renderList();
    destroyHls();
    setOverlay('loading', '연결 중…');
    setBadge('연결 중', false);

    const url = ch.url;
    const isHls = /\.m3u8(\?|$)/i.test(url) || /m3u8/i.test(url);

    const onFail = (why) => {
      setOverlay('error', why + '\n주소가 유효한지, 해당 서버가 브라우저 접근(CORS)을 허용하는지 확인하세요.');
      setBadge('오류', false);
    };

    if (isHls && window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true, enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
          onFail('네트워크 오류로 재생할 수 없습니다.');
        } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
          try { hls.recoverMediaError(); } catch (e) { onFail('미디어 오류가 발생했습니다.'); }
        } else {
          onFail('재생 중 치명적 오류가 발생했습니다.');
        }
      });
    } else {
      // Safari 등 네이티브 HLS 또는 mp4
      video.src = url;
      video.play().catch(() => {});
      video.onerror = () => onFail('이 형식은 재생할 수 없습니다.');
    }
  }

  video.addEventListener('playing', () => {
    setOverlay(null);
    setBadge(isFinite(video.duration) ? 'VOD' : 'LIVE', !isFinite(video.duration));
  });
  video.addEventListener('waiting', () => { if (currentId) setBadge('버퍼링', false); });

  function step(dir) {
    const items = visible();
    if (!items.length) return;
    let i = items.findIndex(c => c.id === currentId);
    i = i < 0 ? 0 : (i + dir + items.length) % items.length;
    play(items[i].id);
    const el = document.querySelector(`.ch[data-id="${items[i].id}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  // ---- 이벤트 ----
  $('list').addEventListener('click', e => {
    const s = e.target.closest('[data-star]');
    if (s) {
      const id = s.dataset.star;
      const i = state.favs.indexOf(id);
      i >= 0 ? state.favs.splice(i, 1) : state.favs.push(id);
      save(); renderList(); return;
    }
    const ed = e.target.closest('[data-edit]');
    if (ed) { openEdit(ed.dataset.edit); return; }
    const ch = e.target.closest('.ch');
    if (ch) play(ch.dataset.id);
  });
  $('tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t) return;
    filterGroup = t.dataset.g; renderTabs(); renderList();
  });
  $('q').addEventListener('input', e => { query = e.target.value; renderList(); });
  $('btnPrev').onclick = () => step(-1);
  $('btnNext').onclick = () => step(1);
  $('btnPip').onclick = async () => {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await video.requestPictureInPicture();
    } catch (e) { toast('이 브라우저에서는 PIP를 지원하지 않습니다.'); }
  };

  document.addEventListener('keydown', e => {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
    if (document.querySelector('.modal.show')) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen?.(); }
    else if (e.key === 'm' || e.key === 'M') { video.muted = !video.muted; }
    else if (e.key === ' ') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  });

  // ---- 채널 편집 ----
  function openEdit(id) {
    editingId = id || null;
    const c = id ? state.channels.find(x => x.id === id) : null;
    $('mEditTitle').textContent = c ? '채널 수정' : '채널 추가';
    $('fName').value = c ? c.name : '';
    $('fUrl').value = c ? c.url : '';
    $('fGroup').value = c ? (c.group || '') : '';
    $('fLogo').value = c ? (c.logo || '') : '';
    $('fDelete').style.display = c ? '' : 'none';
    $('mEdit').classList.add('show');
    setTimeout(() => $('fName').focus(), 50);
  }
  const closeModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
  $('btnAdd').onclick = () => openEdit(null);
  $('fCancel').onclick = closeModals;
  $('iCancel').onclick = closeModals;
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModals(); }));

  $('fSave').onclick = () => {
    const name = $('fName').value.trim();
    const url = $('fUrl').value.trim();
    if (!name || !url) return toast('채널명과 URL은 필수입니다.');
    if (!/^https?:\/\//i.test(url)) return toast('URL은 http(s)://로 시작해야 합니다.');
    const data = { name, url, group: $('fGroup').value.trim(), logo: $('fLogo').value.trim() };
    if (editingId) Object.assign(state.channels.find(c => c.id === editingId), data);
    else { const id = uid(); state.channels.push({ id, ...data }); }
    save(); closeModals(); renderTabs(); renderList(); toast('저장되었습니다.');
  };
  $('fDelete').onclick = () => {
    if (!editingId || !confirm('이 채널을 삭제할까요?')) return;
    state.channels = state.channels.filter(c => c.id !== editingId);
    state.favs = state.favs.filter(f => f !== editingId);
    if (currentId === editingId) { currentId = null; destroyHls(); setOverlay('idle', '오른쪽 목록에서 채널을 선택하세요.'); $('nowTitle').textContent = '선택된 채널 없음'; $('nowGrp').textContent = ''; setBadge('대기', false); }
    save(); closeModals(); renderTabs(); renderList();
  };

  // ---- M3U 가져오기/내보내기 ----
  function parseM3U(text) {
    const lines = text.split(/\r?\n/);
    const out = []; let meta = null;
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith('#EXTINF')) {
        const name = line.includes(',') ? line.slice(line.lastIndexOf(',') + 1).trim() : '';
        const g = line.match(/group-title="([^"]*)"/i);
        const l = line.match(/tvg-logo="([^"]*)"/i);
        meta = { name, group: g ? g[1] : '', logo: l ? l[1] : '' };
      } else if (!line.startsWith('#') && /^https?:\/\//i.test(line)) {
        out.push({ name: (meta && meta.name) || line, url: line, group: meta ? meta.group : '', logo: meta ? meta.logo : '' });
        meta = null;
      }
    }
    return out;
  }
  function addParsed(list) {
    const have = new Set(state.channels.map(c => c.url));
    let n = 0;
    for (const c of list) {
      if (have.has(c.url)) continue;
      state.channels.push({ id: uid(), ...c }); have.add(c.url); n++;
    }
    save(); renderTabs(); renderList();
    return n;
  }
  $('btnImport').onclick = () => { $('iUrl').value = ''; $('iText').value = ''; $('iFile').value = ''; $('mImport').classList.add('show'); };
  $('iFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $('iText').value = r.result; }; r.readAsText(f);
  };
  $('iRun').onclick = async () => {
    let text = $('iText').value.trim();
    const url = $('iUrl').value.trim();
    try {
      if (!text && url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        text = await res.text();
      }
    } catch (err) {
      return toast('불러오기 실패 (CORS 차단 가능). 내용을 붙여넣거나 파일로 가져오세요.');
    }
    if (!text) return toast('URL, 내용, 파일 중 하나를 입력하세요.');
    const parsed = parseM3U(text);
    if (!parsed.length) return toast('유효한 채널을 찾지 못했습니다.');
    const n = addParsed(parsed);
    closeModals(); toast(`${n}개 채널 추가 (중복 ${parsed.length - n}개 제외)`);
  };
  $('iExport').onclick = () => {
    const body = '#EXTM3U\n' + state.channels.map(c =>
      `#EXTINF:-1 tvg-logo="${c.logo || ''}" group-title="${c.group || ''}",${c.name}\n${c.url}`).join('\n') + '\n';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([body], { type: 'audio/x-mpegurl' }));
    a.download = 'my_channels.m3u'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // ---- 앱 설치 (PWA) ----
  let deferredPrompt = null;
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  if (standalone()) $('btnInstall').style.display = 'none';

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
  window.addEventListener('appinstalled', () => {
    deferredPrompt = null; $('btnInstall').style.display = 'none'; toast('SIM TV가 설치되었습니다.');
  });

  function showInstallGuide() {
    let body;
    if (isIOS) body = '<b>iPhone / iPad (Safari)</b><br>① 하단의 공유 버튼(□↑)을 누릅니다.<br>② <b>홈 화면에 추가</b>를 선택합니다.<br>③ 이름을 확인하고 <b>추가</b>를 누릅니다.<br><small style="color:var(--sub)">※ 크롬 등 다른 브라우저가 아닌 Safari에서 열어야 합니다.</small>';
    else if (isAndroid) body = '<b>Android (Chrome)</b><br>① 오른쪽 위 메뉴(⋮)를 엽니다.<br>② <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 선택합니다.';
    else body = '<b>PC (Chrome / Edge)</b><br>주소창 오른쪽의 <b>설치 아이콘(⊕)</b>을 누르거나, 메뉴(⋮) → <b>SIM TV 설치</b>를 선택합니다.';
    $('installBody').innerHTML = body;
    $('installWarn').textContent = secure ? '' : '현재 주소(' + location.protocol + '//)에서는 설치가 지원되지 않습니다. HTTPS 주소(예: GitHub Pages)에 올려서 접속해야 설치할 수 있습니다.';
    $('mInstall').classList.add('show');
  }
  $('btnInstall').onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
    } else showInstallGuide();
  };
  $('installClose').onclick = closeModals;

  if ('serviceWorker' in navigator && secure) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // ---- 시작 ----
  renderTabs(); renderList();
  if (currentId && state.channels.some(c => c.id === currentId)) {
    $('nowTitle').textContent = state.channels.find(c => c.id === currentId).name;
    $('nowGrp').textContent = state.channels.find(c => c.id === currentId).group || '';
    setOverlay('idle', '채널을 눌러 재생을 시작하세요. (마지막 시청 채널이 선택되어 있습니다)');
  }
})();
</script>
</body>
</html>
