name: 홈봇 독립 APK

on:
  push:
    paths:
      - 'android/homebot/**'
      - 'android/settings.gradle'
      - 'android/build.gradle'
      - 'homebot.html'
      - '.github/workflows/homebot.yml'
  workflow_dispatch:

concurrency:
  group: homebot-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 오프라인용 화면 파일을 앱 안에 함께 넣기
        run: |
          mkdir -p android/homebot/src/main/assets
          cp homebot.html android/homebot/src/main/assets/
      - name: 홈봇 APK 빌드
        run: >
          gradle -p android :homebot:assembleDebug --no-daemon --stacktrace
          -PverCode=${{ github.run_number }} -PverName=1.0.${{ github.run_number }}
      - name: 파일 이름 정리
        run: cp "$(find android/homebot/build/outputs/apk -name '*.apk' | head -n1)" HomeBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBot-apk
          path: HomeBot.apk
      - name: 릴리스로 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view homebot-latest >/dev/null 2>&1 || gh release create homebot-latest --title "홈봇 (독립 앱)" --notes "홈봇 전용 APK" --latest=false
          gh release upload homebot-latest HomeBot.apk --clobber
          gh release edit homebot-latest --notes "홈봇 전용 APK · build ${{ github.run_number }}"
          gh release edit homebot-latest --notes "build=${{ github.run_number }}"
