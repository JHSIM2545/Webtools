<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIM Teams">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="teams-icon-192.png">
<title>SIM Teams</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3f;
  --text:#e8eaf0; --sub:#8b92a8; --accent:#c5e84a; --accent2:#8fb81f; --ink:#1a2300; --danger:#ff5d5d; --ok:#3ecf8e; --warn:#ffc46b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:5}
header h1{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent);margin-left:-5px}
.appicon{width:30px;height:30px;border-radius:8px;display:block}
.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:20px;line-height:1}
.spacer{flex:1}
.stat{font-size:12.5px;color:var(--sub);padding:5px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.stat b{color:var(--accent)}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 13px;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none}
.app{flex:1;min-height:0;display:flex;flex-direction:column}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 18px}
.view{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
nav#tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px;background:transparent;border-color:transparent;font-size:11.5px;color:var(--sub);font-weight:700}
nav#tabs button i{font-style:normal;font-size:22px;transition:transform .2s}
nav#tabs button.on{background:#232a10;color:var(--accent);border-color:#3a4a14}
nav#tabs button.on i{transform:scale(1.18) rotate(-6deg)}

/* 게임 느낌의 큰 버튼 */
.btn{white-space:nowrap;background:var(--accent);color:var(--ink);border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:15.5px;box-shadow:0 5px 0 var(--accent2);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
.btn.sec{background:var(--panel2);color:var(--text);box-shadow:0 5px 0 #11141b;border:1px solid var(--line)}
.btn.sec:active{box-shadow:0 1px 0 #11141b}
.btn.red{background:#ff6b6b;color:#fff;box-shadow:0 5px 0 #b23c3c}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:12px;box-shadow:0 3px 0 var(--accent2)}
.btn.sec.sm{box-shadow:0 3px 0 #11141b}
.btn.block{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px}
.card h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.card h2 small{font-weight:500;color:var(--sub);font-size:12px;margin-left:auto}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.sub{color:var(--sub);font-size:12.5px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px}
.pill.x{cursor:pointer}
.pill.x:active{opacity:.6}
.pill.v{background:#232a10;border-color:#3a4a14;color:var(--accent)}

/* 명단 */
.rost{display:flex;gap:8px;align-items:center}
.rost select{flex:1;font-weight:700}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin-bottom:7px;cursor:pointer}
.mrow.off{opacity:.45}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#262d3d;flex:none;border:2px solid var(--accent);transition:transform .15s}
.mrow:active .av{transform:scale(.9) rotate(-8deg)}
.mrow.off .av{border-color:var(--line);filter:grayscale(1)}
.mname{font-weight:800;font-size:15.5px}
.mtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mtags span{font-size:11px;color:var(--sub);background:#14171f;border-radius:8px;padding:2px 7px}
.chk{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;color:transparent}
.mrow:not(.off) .chk{background:var(--accent);border-color:var(--accent);color:var(--ink)}

/* 설정 패널 */
.set{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:14px;padding:4px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:11px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--accent);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:14px;font-size:22px;font-weight:800;padding:0}
.stepper .val{min-width:84px;text-align:center;font-size:24px;font-weight:900;color:var(--accent)}
.stepper .val small{font-size:13px;color:var(--sub);font-weight:600}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.sw .tgl{margin-left:auto;width:46px;height:27px;border-radius:99px;background:#303649;position:relative;flex:none;transition:background .15s}
.sw .tgl::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on .tgl{background:var(--accent2)}
.sw.on .tgl::after{transform:translateX(19px)}
.sw b{font-size:14px}
.sw small{display:block;color:var(--sub);font-size:11.5px;margin-top:1px}
.lbl{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px}
details.adv summary{cursor:pointer;font-size:12.5px;color:var(--sub);padding:2px 0}

/* 게임 선택 */
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{position:relative;text-align:left;padding:16px 14px;border-radius:22px;border:0;color:#fff;min-height:124px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s}
.game:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.game .em{position:absolute;right:8px;top:2px;font-size:52px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));animation:bob 2.4s ease-in-out infinite}
.game:nth-child(2) .em{animation-delay:.4s}.game:nth-child(3) .em{animation-delay:.8s}.game:nth-child(4) .em{animation-delay:1.2s}
.game b{font-size:18px;font-weight:900}
.game span{font-size:12px;opacity:.92;margin-top:2px;line-height:1.35}
.g1{background:linear-gradient(135deg,#ff8a5c,#ff5d73)}.g2{background:linear-gradient(135deg,#6c8bff,#a05cff)}.g3{background:linear-gradient(135deg,#20c997,#2aa9d6)}.g4{background:linear-gradient(135deg,#f6c445,#f08a24)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(6deg)}}

/* 조건 */
.mic{width:96px;height:96px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#e6ff7a,var(--accent2));color:var(--ink);font-size:42px;box-shadow:0 7px 0 #5f7a0c;margin:4px auto;display:flex;align-items:center;justify-content:center;padding:0}
.mic:active{transform:translateY(5px);box-shadow:0 2px 0 #5f7a0c}
.mic.live{animation:pulse 1s infinite;background:radial-gradient(circle at 35% 30%,#ff9a9a,#ff5d5d);box-shadow:0 7px 0 #a33}
@keyframes pulse{0%{box-shadow:0 7px 0 #a33,0 0 0 0 rgba(255,93,93,.6)}100%{box-shadow:0 7px 0 #a33,0 0 0 26px rgba(255,93,93,0)}}
.said{min-height:44px;text-align:center;font-size:14px;color:var(--text);padding:6px 8px;background:var(--panel2);border-radius:14px;border:1px dashed var(--line)}
.cl{display:flex;flex-wrap:wrap;gap:7px}
.addc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addc select:first-child{grid-column:1/3}

/* 기록 */
.hrow{display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.hrow .he{font-size:28px;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#262d3d;flex:none}
.hrow b{font-size:14.5px}
.hrow .sub{margin-top:2px}

/* 오버레이(스테이지) */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ov .top{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ov .top h3{font-size:16px;font-weight:800}
.ov .body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.ov .foot{flex:none;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap;justify-content:center}
.ov .foot .btn{flex:1;min-width:120px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:560px;background:var(--panel);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:11px;max-height:92dvh;overflow:auto;border:1px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:16px;font-weight:800}
.g3c{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gender{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gender button.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:800}

/* 사다리 */
.ladwrap{width:100%;overflow-x:auto;border-radius:18px;background:#12151d;border:1px solid var(--line);padding:6px}
canvas{display:block;touch-action:manipulation}
.ladchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
/* 제비뽑기 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;width:100%}
.flip{perspective:700px;height:112px;cursor:pointer}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:4px}
.flip .f{background:linear-gradient(145deg,#6c8bff,#a05cff);font-size:34px;font-weight:900;color:#fff;box-shadow:0 5px 0 #3a3f9c}
.flip .f small{font-size:12px;opacity:.85}
.flip .b{transform:rotateY(180deg);background:var(--panel2);border:3px solid var(--tc,#fff);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.flip .b .e{font-size:28px}.flip .b .n{font-weight:900;font-size:14px}.flip .b .t{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--tc);color:#101010}
.flip:not(.on):hover .fi{transform:translateY(-4px) rotate(-2deg)}
/* 룰렛 */
.pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(0);z-index:70;background:var(--panel);border:4px solid var(--tc,#fff);border-radius:28px;padding:20px 30px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pop.show{transform:translate(-50%,-50%) scale(1)}
.pop .e{font-size:56px}.pop .n{font-size:22px;font-weight:900}.pop .t{margin-top:6px;font-size:20px;font-weight:900;color:var(--tc)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;width:100%}
.tbox{border-radius:16px;border:2px solid var(--tc);background:var(--panel);padding:8px;min-height:70px}
.tbox h4{font-size:13.5px;font-weight:900;color:var(--tc);margin-bottom:5px}
.tbox .ch{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;background:var(--panel2);border-radius:99px;padding:3px 8px;margin:2px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
/* 결과 */
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.team{border-radius:22px;background:var(--panel);border:3px solid var(--tc);padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:drop .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.team h4{font-size:16px;font-weight:900;color:var(--tc);margin-bottom:8px;display:flex;justify-content:space-between}
.team h4 small{color:var(--sub);font-weight:600;font-size:12px}
.team .p{display:flex;align-items:center;gap:7px;padding:4px 0;font-weight:700;font-size:14px}
.team .p .e{font-size:20px}
.team .p .crown{margin-left:auto}
.big{font-size:26px;font-weight:900;text-align:center}
.shuf{font-size:60px;animation:bob .5s ease-in-out infinite}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#232a10;color:var(--accent);border:1px solid #3a4a14;padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98;width:100%;height:100%}

/* 가로로 길고 세로가 짧은 화면(차량 디스플레이 등): 좌우 배치 */
@media (orientation:landscape) and (max-height:520px){
  .app{flex-direction:row}
  nav#tabs{order:-1;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:8px 8px;width:76px;justify-content:center}
  main{padding:10px}
  .view{max-width:none}
  .games{grid-template-columns:repeat(4,1fr)}
  .game{min-height:104px}
  .ov .body{flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:center}
  header{padding-top:6px;padding-bottom:6px}
}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html" title="런처">‹</a>
  <h1><img class="appicon" src="teams-icon-192.png" alt="">SIM <span>Teams</span></h1>
  <div class="spacer"></div>
  <div class="stat" id="stat"></div>
</header>

<div class="app">
<main id="main">
  <section class="view" id="v-roster"></section>
  <section class="view" id="v-random" hidden></section>
  <section class="view" id="v-cond" hidden></section>
  <section class="view" id="v-hist" hidden></section>
</main>
<nav id="tabs">
  <button data-a="tab" data-v="roster" class="on"><i>👥</i>명단</button>
  <button data-a="tab" data-v="random"><i>🎲</i>랜덤 뽑기</button>
  <button data-a="tab" data-v="cond"><i>🎯</i>조건 편성</button>
  <button data-a="tab" data-v="hist"><i>📚</i>기록</button>
</nav>
</div>

<div class="ov" id="stage" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="pop" id="pop"></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>

<!-- ───────── 추첨 핵심 로직: 화면 없이 동작하는 순수 함수. '공개 검증 HTML' 에도 이 코드가 그대로 들어가서 같은 시드로 같은 결과가 나오는지 누구나 다시 확인할 수 있다 ───────── -->
<script id="core">
const Core=(()=>{
  const hs=s=>{let h=2166136261>>>0;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0};
  const rng=seed=>{let a=hs(seed);return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}};
  const shuffle=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
  const sizes=(n,T)=>{const b=Math.floor(n/T),x=n%T;return Array.from({length:T},(_,i)=>b+(i<x?1:0))};
  const range=n=>Array.from({length:n},(_,i)=>i);
  const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;

  function prep(cfg){
    const M=cfg.members,n=M.length,id2i={};M.forEach((m,i)=>{id2i[m.id]=i});
    const sep=[],tog=[],fix=[],spread=[],cluster=[];
    (cfg.conds||[]).forEach(c=>{
      if(c.t==='sep'||c.t==='tog'){const a=id2i[c.a],b=id2i[c.b];if(a==null||b==null||a===b)return;(c.t==='sep'?sep:tog).push([a,b])}
      else if(c.t==='fix'){const a=id2i[c.a];if(a!=null&&c.team>=0&&c.team<cfg.T)fix.push([a,c.team])}
      else if(c.t==='spread'){if(spread.indexOf(c.f)<0)spread.push(c.f)}
      else if(c.t==='cluster'){if(cluster.indexOf(c.f)<0)cluster.push(c.f)}
    });
    const hw=Array.from({length:n},()=>new Float64Array(n));let hasHist=false;
    for(const k in (cfg.hw||{})){const p=k.split('|'),a=id2i[p[0]],b=id2i[p[1]];if(a!=null&&b!=null&&a!==b){hw[a][b]=hw[b][a]=cfg.hw[k];hasHist=true}}
    return {n,M,sep,tog,fix,spread,cluster,hw,hasHist,T:cfg.T};
  }
  function cost(P,teamOf){
    let c=0;const T=P.T,n=P.n;
    const tm=Array.from({length:T},()=>[]);for(let i=0;i<n;i++)tm[teamOf[i]].push(i);
    for(const x of P.sep)if(teamOf[x[0]]===teamOf[x[1]])c+=500;
    for(const x of P.tog)if(teamOf[x[0]]!==teamOf[x[1]])c+=500;
    for(const x of P.fix)if(teamOf[x[0]]!==x[1])c+=800;
    if(P.hasHist)for(const t of tm)for(let x=0;x<t.length;x++)for(let y=x+1;y<t.length;y++)c+=P.hw[t[x]][t[y]]*40;
    for(const f of P.spread){
      const vals={};P.M.forEach(m=>{const v=m[f]||'';if(v)vals[v]=(vals[v]||0)+1});
      for(const v in vals)for(const t of tm){let k=0;for(const i of t)if((P.M[i][f]||'')===v)k++;const ideal=vals[v]*t.length/n;c+=(k-ideal)*(k-ideal)*30}
    }
    for(const f of P.cluster)for(const t of tm){const s=new Set();for(const i of t){const v=P.M[i][f]||'';if(v)s.add(v)}if(s.size>1)c+=(s.size-1)*25}
    return c;
  }
  function ladder(n,r){
    const R=Math.max(10,n*2+4),rungs=[];
    for(let k=0;k<R;k++){const row=[];let last=-9;for(let c=0;c<n-1;c++){if(c-1!==last&&r()<0.5){row.push(c);last=c}}rungs.push(row)}
    const perm=[];
    for(let i=0;i<n;i++){let p=i;for(const row of rungs){if(row.indexOf(p)>=0)p++;else if(row.indexOf(p-1)>=0)p--}perm.push(p)}
    return {rungs,perm};
  }
  function anneal(P,r,baseSlots,iters){
    const n=P.n;let teamOf=new Array(n);shuffle(range(n),r).forEach((m,k)=>{teamOf[m]=baseSlots[k]});
    for(const x of P.fix){const a=x[0],t=x[1];if(teamOf[a]===t)continue;let j=-1;for(let i=0;i<n;i++)if(teamOf[i]===t&&!P.fix.some(y=>y[0]===i&&y[1]===t)){j=i;break}if(j>=0){const s=teamOf[a];teamOf[a]=t;teamOf[j]=s}}
    let cur=cost(P,teamOf),bestC=cur,bestT=teamOf.slice(),temp=40;
    for(let it=0;it<iters&&bestC>0;it++){
      const a=Math.floor(r()*n),b=Math.floor(r()*n);if(teamOf[a]===teamOf[b])continue;
      const t=teamOf[a];teamOf[a]=teamOf[b];teamOf[b]=t;
      const nc=cost(P,teamOf);
      if(nc<=cur||r()<Math.exp((cur-nc)/temp)){cur=nc;if(cur<bestC){bestC=cur;bestT=teamOf.slice()}}
      else{const u=teamOf[a];teamOf[a]=teamOf[b];teamOf[b]=u}
      temp=Math.max(0.5,temp*0.9993);
    }
    return {c:bestC,teamOf:bestT};
  }
  function solve(cfg){
    const P=prep(cfg),n=P.n,T=cfg.T,sz=sizes(n,T),base=[];sz.forEach((s,t)=>{for(let k=0;k<s;k++)base.push(t)});
    const log=[];let best=null,slotTeam=null,lad=null;
    const tries=P.hasHist?1500:1;
    if(cfg.mode==='ladder'){
      for(let a=0;a<tries;a++){
        const r=rng(cfg.seed+':L'+a),st=shuffle(base,r),ld=ladder(n,r),teamOf=new Array(n);
        for(let i=0;i<n;i++)teamOf[i]=st[ld.perm[i]];
        const c=cost(P,teamOf);log.push(Math.round(c*100)/100);
        if(!best||c<best.c){best={a,c,teamOf};slotTeam=st;lad=ld}
        if(c<=0)break;
      }
    }else{
      const restarts=6,iters=Math.min(6000,Math.max(1500,n*220));
      for(let a=0;a<restarts;a++){
        const res=anneal(P,rng(cfg.seed+':C'+a),base,iters);log.push(Math.round(res.c*100)/100);
        if(!best||res.c<best.c)best={a,c:res.c,teamOf:res.teamOf};
        if(res.c<=0)break;
      }
    }
    const teams=Array.from({length:T},()=>[]);for(let i=0;i<n;i++)teams[best.teamOf[i]].push(i);
    const order=shuffle(range(n),rng(cfg.seed+':O')),cardOrder=shuffle(range(n),rng(cfg.seed+':K'));
    let leaders=null;
    if(cfg.leader){const r=rng(cfg.seed+':B');leaders=teams.map(t=>t.length?t[Math.floor(r()*t.length)]:-1)}
    return {teams,teamOf:best.teamOf,slotTeam,ladder:lad,order,cardOrder,leaders,attempt:best.a,cost:Math.round(best.c*100)/100,log};
  }

  /* 사다리 그리기: 화면·검증 HTML 공통 */
  function ladGeom(n,R,W,H){const top=70,bot=H-62,dx=(W-30)/n;return {top,bot,dx,x:c=>15+dx*(c+.5),y:r=>top+(bot-top)*(r+1)/(R+1)}}
  function ladPath(rungs,n,i,g){
    const pts=[[g.x(i),g.top]];let pos=i;
    rungs.forEach((row,r)=>{let np=pos;if(row.indexOf(pos)>=0)np=pos+1;else if(row.indexOf(pos-1)>=0)np=pos-1;pts.push([g.x(pos),g.y(r)]);if(np!==pos){pts.push([g.x(np),g.y(r)]);pos=np}});
    pts.push([g.x(pos),g.bot]);return pts;
  }
  function drawLadder(cv,o){
    const n=o.n,R=o.rungs.length,W=cv.width/o.dpr,H=cv.height/o.dpr,g=ladGeom(n,R,W,H),ctx=cv.getContext('2d');
    ctx.setTransform(o.dpr,0,0,o.dpr,0,0);ctx.clearRect(0,0,W,H);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle='#39405a';ctx.lineWidth=4;
    for(let c=0;c<n;c++){ctx.beginPath();ctx.moveTo(g.x(c),g.top);ctx.lineTo(g.x(c),g.bot);ctx.stroke()}
    o.rungs.forEach((row,r)=>row.forEach(c=>{ctx.beginPath();ctx.moveTo(g.x(c),g.y(r));ctx.lineTo(g.x(c+1),g.y(r));ctx.stroke()}));
    (o.traces||[]).forEach(t=>{
      const pts=ladPath(o.rungs,n,t.i,g);let tot=0;const seg=[];
      for(let k=1;k<pts.length;k++){const d=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);seg.push(d);tot+=d}
      let want=tot*t.p;ctx.strokeStyle=t.color;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      let lx=pts[0][0],ly=pts[0][1];
      for(let k=1;k<pts.length;k++){const d=seg[k-1];if(want>=d){ctx.lineTo(pts[k][0],pts[k][1]);want-=d;lx=pts[k][0];ly=pts[k][1]}else{const f=d?want/d:0;lx=pts[k-1][0]+(pts[k][0]-pts[k-1][0])*f;ly=pts[k-1][1]+(pts[k][1]-pts[k-1][1])*f;ctx.lineTo(lx,ly);break}}
      ctx.stroke();ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(lx,ly,9,0,7);ctx.fill();ctx.fillStyle='#111';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.e||'',lx,ly+1);
    });
    ctx.textAlign='center';
    o.heads.forEach((h,c)=>{
      ctx.font=(g.dx<40?'20px':'24px')+' sans-serif';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(h.e,g.x(c),g.top-38);
      ctx.font='bold '+(g.dx<40?10:12)+'px sans-serif';ctx.fillStyle=h.done?'#8b92a8':'#e8eaf0';const mx=g.dx<40?3:4;ctx.fillText(h.name.length>mx?h.name.slice(0,mx):h.name,g.x(c),g.top-14);
    });
    o.tails.forEach((b,c)=>{
      const x=g.x(c),w=Math.max(26,g.dx-6);
      ctx.fillStyle=b.color||'#2a2f3f';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x-w/2,g.bot+10,w,34,10);else ctx.rect(x-w/2,g.bot+10,w,34);ctx.fill();
      ctx.fillStyle=b.color?'#101010':'#8b92a8';ctx.font='bold 13px sans-serif';ctx.fillText(b.text,x,g.bot+28);
    });
  }
  return {hs,rng,shuffle,sizes,solve,prep,cost,ladder,ladGeom,ladPath,drawLadder,pk};
})();
</script>

}

let rec=null,listening=false;
function startListen(){
  if(!SR){toast('이 기기는 음성 인식을 지원하지 않아요. 글로 입력해 주세요');return}
  if(listening){try{rec.stop()}catch(e){}return}
  try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  rec=new SR();rec.lang='ko-KR';rec.interimResults=true;rec.maxAlternatives=1;rec.continuous=false;let fin='';
  rec.onstart=()=>{listening=true;said='';renderCond();const s=$('said');if(s)s.textContent='듣는 중… 말씀하세요'};
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=t}said=t;const s=$('said');if(s)s.textContent='“'+t+'”'};
  rec.onerror=e=>{const c=e.error;toast(c==='not-allowed'||c==='service-not-allowed'?'마이크 권한이 필요해요':c==='no-speech'?'말씀이 들리지 않았어요':'음성 인식 오류: '+c)};
  rec.onend=()=>{listening=false;const t=(fin||said||'').trim();renderCond();if(t)applyVoice(t)};
  try{rec.start()}catch(e){listening=false;toast('음성 인식을 시작하지 못했어요')}
}
const KN={한:1,하나:1,두:2,둘:2,세:3,셋:3,석:3,네:4,넷:4,넉:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10};
const SN={일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9,십:10};
const NUMRX='\\d+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열';
const toN=s=>/^\d+$/.test(s)?+s:(KN[s]||SN[s]||null);
function findNames(clause,ms){
  const found=[];let s=clause;
  const cands=[];ms.forEach(m=>{cands.push([m.n,m]);if(m.n.length>=3){const g=m.n.slice(1);if(ms.filter(x=>x.n.endsWith(g)).length===1)cands.push([g,m])}});
  cands.sort((a,b)=>b[0].length-a[0].length);
  for(const c of cands){const i=s.indexOf(c[0]);if(i>=0&&!found.some(f=>f.m===c[1])){found.push({m:c[1],i});s=s.slice(0,i)+'\u0001'.repeat(c[0].length)+s.slice(i+c[0].length)}}
  return found.sort((a,b)=>a.i-b.i).map(f=>f.m);
}
function parseVoice(text){
  const ms=PM(),out={conds:[],set:{},notes:[]};
  const clauses=text.replace(/\s+/g,' ').split(/[.,!?。]|\s그리고\s|그리고|\s그다음에?\s|\s또\s/).map(x=>x.trim()).filter(Boolean);
  const SEP=/(같은\s*조\s*(?:에|로)?\s*(?:는\s*)?(?:안|못|금지|빼|넣지|되지|하지|만들지|두지)|다른\s*조|따로|떨어|갈라|나누|겹치지|섞이지|같이\s*(?:안|못|두지|하지)|함께\s*(?:안|못)|붙이지|떼어|분리)/;
  const TOG=/(같은\s*조|한\s*조|같이|함께|붙여|묶어|한팀|같은\s*팀)/;
  clauses.forEach(c=>{
    const names=findNames(c,ms);
    let m=c.match(new RegExp('('+NUMRX+')\\s*(?:명|사람)\\s*씩'))||c.match(new RegExp('(?:조당|한\\s*조에|조별로|한조에)\\s*('+NUMRX+')\\s*명'));
    if(m&&toN(m[1])){out.set.mode='M';out.set.M=toN(m[1]);out.notes.push(toN(m[1])+'명씩')}
    if(!names.length){
      m=c.match(new RegExp('('+NUMRX+'|[일이삼사오육칠팔구십])\\s*(?:개\\s*)?(?:조|팀)(?!장)(?:으?로|를|만|\\s*(?:나눠|만들|편성|짜)|$)'));
      if(m&&toN(m[1])&&!out.set.M){out.set.mode='T';out.set.T=toN(m[1]);out.notes.push(toN(m[1])+'개 조')}
    }
    if(/(이전|지난|저번|전에|예전).*(겹치|중복|다르게|안\s*(?:만났|같은)|새롭게|새로)|처음\s*(?:만나|같이)|안\s*만난|중복\s*없이/.test(c)){out.set.useHist=true;out.notes.push('이전 편성과 겹침 피하기')}
    if(/조장/.test(c)){out.set.leader=true;out.notes.push('조장 뽑기')}
    const attr=/부서|소속|팀별/.test(c)?'d':/성별|남녀|남자|여자|남성|여성/.test(c)?'g':/직급|직책|연차|직위/.test(c)?'r':null;
    if(attr){
      if(/(골고루|섞|분산|균형|고르게|고루|퍼지|나눠)/.test(c))out.conds.push({t:'spread',f:attr});
      else if(/(끼리|묶|모아|별로)/.test(c))out.conds.push({t:'cluster',f:attr});
    }
    if(names.length>=2){
      const tp=SEP.test(c)?'sep':(TOG.test(c)?'tog':null);
      if(tp)for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++)out.conds.push({t:tp,a:names[i].id,b:names[j].id});
    }else if(names.length===1){
      const fx=c.match(/(\d+)\s*조/)||(/(첫|첫번째|첫 번째)\s*조/.test(c)?[0,1]:null);
      if(fx)out.conds.push({t:'fix',a:names[0].id,team:+fx[1]-1});
    }
  });
  return out;
}
function applyVoice(text){
  const p=parseVoice(text);let n=0;
  Object.assign(S.set,p.set);
  p.conds.forEach(c=>{if(!S.conds.some(x=>JSON.stringify(x)===JSON.stringify(c))){S.conds.push(c);n++}});
  save();renderCond();
  const parts=p.notes.concat(p.conds.map(condText));
  if(!parts.length){toast('조건을 알아듣지 못했어요. 이름을 정확히 말해 주세요');return}
  toast('✅ '+parts.slice(0,3).join(' · ')+(parts.length>3?' 외 '+(parts.length-3)+'개':''));
}

function pairTop(){
  const m={};S.hist.filter(h=>h.rid===S.cur).forEach(h=>{const nm={};h.members.forEach(x=>nm[x.id]=x.name);h.teams.forEach(t=>{for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const k=Core.pk(t[i],t[j]);m[k]=m[k]||{c:0,a:nm[t[i]],b:nm[t[j]]};m[k].c++}})});
  return Object.values(m).sort((a,b)=>b.c-a.c).slice(0,5).filter(x=>x.c>1);
}

  (hs.length?'<button class="btn sec sm" style="margin-top:6px" data-a="hclr">이 명단 기록 모두 삭제</button>':'')+'</div>';

/* ════════════ 추첨 실행 ════════════ */
const rseed=()=>Math.random().toString(36).slice(2,8).toUpperCase();
function histWeights(){
  const K=S.set.K,hs=S.hist.filter(h=>h.rid===S.cur).sort((a,b)=>b.ts-a.ts).slice(0,K),hw={};
  hs.forEach((h,age)=>{const w=K>=99?1:(K-age)/K+0.3;h.teams.forEach(t=>{for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const k=Core.pk(t[i],t[j]);hw[k]=Math.round(((hw[k]||0)+w)*1000)/1000}})});
  return hw;
}
function buildCfg(mode){
  const sd=($('seedIn')&&$('seedIn').value.trim())||rseed();
  return {mode,seed:sd,members:PM().map(m=>({id:m.id,name:m.n,g:m.g||'',d:m.d||'',r:m.r||''})),T:effT(),theme:S.set.theme,leader:S.set.leader,
    conds:mode==='cond'?S.conds.slice():[],hw:S.set.useHist?histWeights():{}};
}
let CUR=null;

/* 사다리 */
function stageLadder(){
  const cfg=CUR.cfg,res=CUR.res,n=cfg.members.length;
  const W=Math.max(Math.min(innerWidth-48,520),n*34+30),H=Math.min(Math.max(innerHeight-250,320),520);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  stageShell('🪜 사다리타기','<div class="sub" style="text-align:center">위쪽 동물을 눌러 한 명씩 타거나, ▶ 전체 타기를 눌러요</div><div class="ladwrap"><canvas id="lc"></canvas></div><div class="ladchips" id="lch"></div>',
    '<button class="btn" data-a="lauto">▶ 전체 타기</button>');
  const cv=$('lc');cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const done=new Array(n).fill(false),traces=[],g=Core.ladGeom(n,res.ladder.rungs.length,W,H);
  CUR.lad={done,traces,busy:false};
  const draw=()=>{
    const tails=Array.from({length:n},()=>({text:'?',color:null}));
    done.forEach((d,i)=>{if(d){const p=res.ladder.perm[i];tails[p]={text:tn(teamOfIdx(i)).replace(/^[^\s]+\s/,'').slice(0,3),color:tColor(teamOfIdx(i))}}});
    Core.drawLadder(cv,{dpr,n,rungs:res.ladder.rungs,traces,tails,heads:cfg.members.map((m,i)=>({e:avOf(m.name),name:m.name,done:done[i]}))});
  };
  CUR.lad.draw=draw;draw();
  cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);if(y>g.top+6)return;const c=Math.floor((x-15)/g.dx);if(c>=0&&c<n)ladTrace(c)});
}
function ladTrace(i,fast){
  const L=CUR.lad;if(!L||L.done[i]||L.busy)return Promise.resolve();
  L.busy=true;const col=tColor(CUR.res.teamOf[i]),t={i,p:0,color:col,e:avOf(CUR.cfg.members[i].name)};L.traces.push(t);
  const dur=fast?650:1500,t0=performance.now();
  return new Promise(ok=>{(function step(now){
    if(CUR.stop||$('stage').hidden){L.busy=false;return ok()}
    t.p=Math.min(1,(now-t0)/dur);L.draw();
    if(t.p<1)animId=requestAnimationFrame(step);
    else{L.done[i]=true;L.busy=false;L.traces=L.traces.filter(x=>x!==t);L.traces.push(Object.assign({},t,{p:1}));L.draw();
      const ch=$('lch');if(ch)ch.insertAdjacentHTML('beforeend','<span class="pill" style="border-color:'+col+'">'+avOf(CUR.cfg.members[i].name)+' '+esc(CUR.cfg.members[i].name)+' → <b style="color:'+col+'">'+esc(tn(CUR.res.teamOf[i]))+'</b></span>');
      if(L.done.every(Boolean)){setTimeout(()=>{if(CUR&&!CUR.stop&&!$('stage').hidden)finish()},900)}
      ok()}
  })(performance.now())});
}
async function ladAuto(){
  const L=CUR.lad;if(!L||L.auto)return;L.auto=true;const n=CUR.cfg.members.length,fast=n>10;
  for(const i of CUR.res.order){if(CUR.stop||$('stage').hidden)break;while(L.busy)await new Promise(r=>setTimeout(r,60));await ladTrace(i,fast)}
}

  const cfg=CUR.cfg,res=CUR.res,n=cfg.members.length;
  stageShell('🎴 제비뽑기','<div class="sub" style="text-align:center">카드를 아무거나 눌러 뒤집어 보세요!<br>뒷면에는 이름과 조가 숨어 있어요 (<b id="cn">0</b>/'+n+')</div><div class="cards" id="cds"></div>','<button class="btn sec" data-a="cflipall">전부 뒤집기</button>');
  CUR.flipped=new Set();
  $('cds').innerHTML=res.cardOrder.map((mi,k)=>{const m=cfg.members[mi],t=teamOfIdx(mi);return '<div class="flip" data-a="cflip" data-k="'+k+'" style="--tc:'+tColor(t)+'"><div class="fi"><div class="f">?<small>'+(k+1)+'번</small></div><div class="b"><div class="e">'+avOf(m.name)+'</div><div class="n">'+esc(m.name)+'</div><div class="t">'+esc(tn(t))+'</div></div></div></div>'}).join('');
}
function cflip(k){
  const el=document.querySelector('.flip[data-k="'+k+'"]');if(!el||el.classList.contains('on'))return;
  el.classList.add('on');CUR.flipped.add(k);$('cn').textContent=CUR.flipped.size;
  if(CUR.flipped.size===CUR.cfg.members.length)setTimeout(()=>{if(CUR&&!CUR.stop&&!$('stage').hidden)finish()},1100);
}

/* 룰렛 */
function stageRoulette(){
  const cfg=CUR.cfg,n=cfg.members.length,T=cfg.T;
  stageShell('🎡 룰렛','<canvas id="rw" style="max-width:100%"></canvas><div class="board" id="rb">'+Array.from({length:T},(_,i)=>'<div class="tbox" style="--tc:'+tColor(i)+'"><h4>'+esc(tn(i))+'</h4><div id="rt'+i+'"></div></div>').join('')+'</div>',
    '<button class="btn" id="rspin" data-a="rspin">🎡 돌려라! (남은 '+n+'명)</button><button class="btn sec" data-a="rauto">자동 진행</button>');
  const sz=Math.min(320,innerWidth-40),dpr=Math.min(2,window.devicePixelRatio||1),cv=$('rw');cv.width=sz*dpr;cv.height=sz*dpr;cv.style.width=cv.style.height=sz+'px';
  CUR.rl={k:0,rot:0,busy:false,left:CUR.res.order.slice(),sz,dpr};drawWheel();
}
function drawWheel(){
  const L=CUR.rl,cv=$('rw');if(!cv)return;const ctx=cv.getContext('2d'),s=L.sz,c=s/2,r=c-14,m=L.left.length;
  ctx.setTransform(L.dpr,0,0,L.dpr,0,0);ctx.clearRect(0,0,s,s);
  if(!m){ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('끝!',c,c);return}
  ctx.save();ctx.translate(c,c);ctx.rotate(L.rot);
  L.left.forEach((mi,i)=>{
    const a0=i*2*Math.PI/m,a1=(i+1)*2*Math.PI/m;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();ctx.fillStyle='hsl('+((i*360/m)+20)+',70%,'+(i%2?'52%':'60%')+')';ctx.fill();ctx.strokeStyle='#12151d';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.rotate((a0+a1)/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#101010';ctx.font='bold '+(m>14?11:m>8?13:15)+'px sans-serif';const nm=CUR.cfg.members[mi].name;ctx.fillText(avOf(nm)+' '+(nm.length>5?nm.slice(0,5):nm),r-10,0);ctx.restore();
  });
  ctx.restore();
  ctx.fillStyle='#12151d';ctx.beginPath();ctx.arc(c,c,22,0,7);ctx.fill();ctx.strokeStyle='var(--accent)';ctx.strokeStyle='#c5e84a';ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle='#c5e84a';ctx.beginPath();ctx.moveTo(c-14,2);ctx.lineTo(c+14,2);ctx.lineTo(c,32);ctx.closePath();ctx.fill();ctx.strokeStyle='#1a2300';ctx.lineWidth=2;ctx.stroke();
}
function rspin(){
  const L=CUR.rl;if(!L||L.busy||!L.left.length)return Promise.resolve();
  L.busy=true;const mi=CUR.res.order[L.k],idx=L.left.indexOf(mi),m=L.left.length;
  const mid=(idx+.5)*2*Math.PI/m,target=((-Math.PI/2-mid)%(2*Math.PI)+2*Math.PI)%(2*Math.PI),from=L.rot%(2*Math.PI),
    turns=4+Math.floor(Math.random()*3),end=from+(((target-from)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)+turns*2*Math.PI,t0=performance.now(),dur=2600;
  return new Promise(ok=>{(function step(now){
    if(CUR.stop||$('stage').hidden){L.busy=false;return ok()}
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3.2);L.rot=from+(end-from)*e;drawWheel();
    if(p<1)animId=requestAnimationFrame(step);
    else{
      const t=teamOfIdx(mi),mem=CUR.cfg.members[mi],pop=$('pop');
      pop.style.setProperty('--tc',tColor(t));pop.innerHTML='<div class="e">'+avOf(mem.name)+'</div><div class="n">'+esc(mem.name)+'</div><div class="t">→ '+esc(tn(t))+'</div>';pop.classList.add('show');
      setTimeout(()=>{pop.classList.remove('show');
        const box=$('rt'+t);if(box)box.insertAdjacentHTML('beforeend','<span class="ch">'+avOf(mem.name)+' '+esc(mem.name)+'</span>');
        L.left.splice(idx,1);L.k++;L.rot=0;drawWheel();L.busy=false;
        const b=$('rspin');if(b)b.textContent='🎡 돌려라! (남은 '+L.left.length+'명)';
        if(!L.left.length)setTimeout(()=>{if(CUR&&!CUR.stop&&!$('stage').hidden)finish()},700);
        ok()},CUR.rl.auto?650:1100);
    }
  })(performance.now())});
}
async function rauto(){const L=CUR.rl;if(!L||L.auto)return;L.auto=true;while(L.left.length&&!CUR.stop&&!$('stage').hidden){while(L.busy)await new Promise(r=>setTimeout(r,60));await rspin()}}

function finish(){
  if(CUR.done)return;CUR.done=true;
  const cfg=CUR.cfg,res=CUR.res;
  const rec={id:uid(),ts:Date.now(),rid:S.cur,rname:R().name,mode:CUR.mode,
    title:(()=>{const d=new Date();return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+MODES[CUR.mode][1]})(),
    cfg,members:cfg.members.map(m=>({id:m.id,name:m.name,g:m.g,d:m.d,r:m.r})),
    teams:res.teams.map(t=>t.map(i=>cfg.members[i].id)),leaders:res.leaders?res.leaders.map(i=>i>=0?cfg.members[i].id:null):null,
    attempt:res.attempt,cost:res.cost,tries:res.log.length,log:res.log.slice(0,60)};
  CUR.rec=rec;
  if(S.set.save){S.hist.push(rec);if(S.hist.length>200)S.hist.shift();save();rec.saved=true}

}

function speak(rec){
  if(!('speechSynthesis' in window)){toast('읽어주기를 지원하지 않는 기기예요');return}
  const nm={};rec.members.forEach(m=>nm[m.id]=m.name);

}

  sx:()=>closeSheet(),
  smode:b=>{S.set.mode=b.dataset.v;save();render()},
  step:b=>{const d=+b.dataset.d,n=PM().length,s=S.set;if(s.mode==='T')s.T=Math.max(2,Math.min(Math.max(2,n),s.T+d));else s.M=Math.max(1,Math.min(Math.max(1,n),s.M+d));save();render()},
  tog:b=>{S.set[b.dataset.k]=!S.set[b.dataset.k];save();render()},
  play:b=>play(b.dataset.v),
  mic:()=>startListen(),
  vparse:()=>{const v=$('vtxt').value.trim();if(!v)return;said=v;applyVoice(v)},
  cdel:b=>{S.conds.splice(+b.dataset.i,1);save();renderCond()},
  cclr:()=>{S.conds=[];save();renderCond()},
  cadd:()=>{
    const t=$('ctype').value,a=$('ca').value,b=$('cb').value;let c=null;
    if(t==='spread'||t==='cluster')c={t,f:a};
    else if(t==='fix'){if(!a){toast('사람을 골라 주세요');return}c={t,a,team:+b}}
    else{if(!a||!b||a===b){toast('서로 다른 두 사람을 골라 주세요');return}c={t,a,b}}
    if(S.conds.some(x=>JSON.stringify(x)===JSON.stringify(c))){toast('이미 있는 조건이에요');return}
    S.conds.push(c);save();renderCond();
  },
  hopen:b=>{const h=S.hist.find(x=>x.id===b.dataset.id);if(h){CUR={stop:true};showResult(h,true)}},
  hdel:b=>{S.hist=S.hist.filter(x=>x.id!==b.dataset.id);save();closeStage();render();toast('삭제했어요')},
  hclr:()=>sheet('<h3>기록 모두 삭제</h3><div class="sub">“'+esc(R().name)+'” 명단의 저장된 편성 기록이 모두 지워져요.</div><div class="row"><div class="spacer"></div><button class="btn sec sm" data-a="sx">취소</button><button class="btn red sm" data-a="hclrok">삭제</button></div>'),
  hclrok:()=>{S.hist=S.hist.filter(h=>h.rid!==S.cur);save();closeSheet();render()},
  sclose:()=>{closeStage();render()},
  sskip:()=>{if(CUR&&!CUR.done)finish()},
  lauto:b=>{b.disabled=true;ladAuto()},
  cflip:b=>cflip(+b.dataset.k),
  cflipall:()=>{CUR.res.cardOrder.forEach((_,k)=>cflip(k))},
  rspin:()=>rspin(),
  rauto:()=>rauto(),
  rspeak:()=>SHOWN&&speak(SHOWN),
  rcopy:()=>{const t=resultText(SHOWN);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사했어요'),()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요')}catch(e){}ta.remove()})},
  rexp:()=>SHOWN&&exportRec(SHOWN),
  rsave:()=>{if(!SHOWN||SHOWN.saved)return;SHOWN.saved=true;S.hist.push(SHOWN);save();showResult(SHOWN,false);toast('저장했어요')},
  again:()=>{const m=CUR&&CUR.mode;closeStage();if(m)play(m)}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const f=act[b.dataset.a];if(f)f(b,e);
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.ch;if(!k)return;
  if(k==='rsel'){S.cur=e.target.value;S.conds=[];save();render()}
  else if(k==='setK'){S.set.K=+e.target.value;save()}
  else if(k==='setTheme'){S.set.theme=e.target.value;save()}
  else if(k==='ctype')syncCondForm();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
showTab('roster');
</script>
<script src="ui-guard.js" defer></script>
<script src="sync.js?bg=1" defer></script>
</body>
</html>
